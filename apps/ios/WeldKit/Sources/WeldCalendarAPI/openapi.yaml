openapi: 3.0.3
info:
  title: WeldCalendar API (native apps)
  version: 1.0.0
  description: |
    What the native WeldCalendar apps call (`rust/modules/calendar`):
    the caller's calendars and the ones shared with them, and the events on
    them. Workspace calendars only; personal (consumer) calendars are not
    part of the native apps.

    Hand-written; the Rust server is the source of truth: change both
    together, and see "Changing the contract" in apps/mobile-shared/README.md
    for what apps already on phones can read.

    Checked against the server in rust/modules/calendar/tests/openapi_contract.rs.

    Every request carries `Authorization: Bearer <WeldID access token>` and
    names its workspace in `X-Weld-Workspace`.

    Times are ISO 8601 instants in UTC (`2026-11-27T09:30:00.000Z`); the
    apps show them in the phone's time zone. An all-day event runs from the
    phone's local midnight to 23:59:59.999 the same (or a later) day, as the
    web app writes it. `type`, `status`, `priority` and an attendee's
    `status` are plain strings here: rows imported from Google or written by
    other modules can carry values the event form doesn't offer.
servers:
  - url: https://app.weldsuite.eu
paths:
  /api/calendars:
    get:
      operationId: listCalendars
      summary: The caller's calendars (default first) and the ones shared with them, each with `isOwn` and `permission`.
      responses:
        '200':
          description: The calendars.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createCalendar
      summary: A new calendar owned by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarInput'
      responses:
        '201':
          description: The new calendar's id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/calendars/ensure-default:
    post:
      operationId: ensureDefaultCalendar
      summary: The caller's default calendar ("My Calendar"), created when they have none.
      responses:
        '200':
          description: The default calendar, which already existed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '201':
          description: The default calendar, created just now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/calendar-events/range:
    get:
      operationId: listEventsInRange
      summary: |
        Every event of the readable calendars that overlaps the window,
        earliest first. Not paged: the agenda and the month grid each need a
        whole window. A recurring event comes once, as stored; occurrences
        are not expanded.
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          required: true
          schema:
            type: string
        - name: calendarIds
          in: query
          required: false
          description: Comma-separated calendar ids; narrowed to the ones the caller may read. Absent means all of them.
          schema:
            type: string
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        default:
          $ref: '#/components/responses/Error'
  /api/calendar-events:
    post:
      operationId: createEvent
      summary: A new event on a calendar the caller may write to. Attendees are mailed an invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: The new event's id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWriteResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/calendar-events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      operationId: getEvent
      summary: One event on a calendar the caller can see; 404 otherwise.
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateEvent
      summary: |
        Change the fields sent; the others stay. An empty string clears a
        text field. With `sendNotification=true` the attendees are mailed
        about the change (invited, removed, rescheduled, cancelled).
      parameters:
        - $ref: '#/components/parameters/SendNotification'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '200':
          description: The event's id and the fields the request set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWriteResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteEvent
      summary: Delete the event. With `sendNotification=true` its attendees are mailed a cancellation.
      parameters:
        - $ref: '#/components/parameters/SendNotification'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
    SendNotification:
      name: sendNotification
      in: query
      required: false
      description: '`true` mails the attendees; `false`, or nothing, does not.'
      schema:
        type: boolean
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Pagination:
      type: object
      required: [totalCount, hasMore, cursor]
      properties:
        totalCount:
          type: integer
        hasMore:
          type: boolean
        cursor:
          type: string
          nullable: true
    Calendar:
      type: object
      required: [id, name, description, color, ownerId, isDefault, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: '`#RRGGBB`, or null for the brand colour.'
        ownerId:
          type: string
        isDefault:
          type: boolean
          nullable: true
        isActive:
          type: boolean
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        isOwn:
          type: boolean
          description: In `listCalendars` only. False for a calendar shared with the caller.
        permission:
          type: string
          description: |
            In `listCalendars` only: `view`, `edit` or `manage`; always
            `manage` for the caller's own calendars. `view` may not write events.
    CalendarList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Calendar'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CalendarResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Calendar'
    CalendarInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 500
        color:
          type: string
          maxLength: 20
    CreatedId:
      type: object
      required: [id]
      properties:
        id:
          type: string
    CreatedResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CreatedId'
    Attendee:
      type: object
      description: |
        One guest. `status` is their answer: `accepted`, `declined`,
        `tentative`, `pending` or `needsAction` (Google's word for "not yet"),
        or anything a calendar it came from used.
      properties:
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
    CalendarEvent:
      type: object
      required:
        [id, calendarId, title, description, type, startTime, endTime, allDay, timezone, location, isVirtual, meetingUrl, status, priority, color, recurrenceRule, recurrenceId, organizerId, attendees, sourceType, sourceId, autoScheduled, notes, createdAt, updatedAt]
      properties:
        id:
          type: string
        calendarId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          description: '`meeting`, `call`, `appointment`, `event`, `reminder` or `other`.'
        startTime:
          type: string
        endTime:
          type: string
          nullable: true
          description: Null for an open-ended event.
        allDay:
          type: boolean
          nullable: true
        timezone:
          type: string
          nullable: true
          description: The IANA zone the event was scheduled in; the instants don't depend on it.
        location:
          type: string
          nullable: true
        isVirtual:
          type: boolean
          nullable: true
        meetingUrl:
          type: string
          nullable: true
        status:
          type: string
          description: '`confirmed`, `tentative` or `cancelled`.'
        priority:
          type: string
          nullable: true
          description: '`low`, `normal`, `high` or `urgent`.'
        color:
          type: string
          nullable: true
        recurrenceRule:
          type: string
          nullable: true
          description: An iCalendar RRULE (`RRULE:FREQ=WEEKLY;BYDAY=MO`), with or without the `RRULE:` prefix.
        recurrenceId:
          type: string
          nullable: true
        organizerId:
          type: string
        attendees:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Attendee'
        sourceType:
          type: string
          nullable: true
          description: '`task` or `activity` when WeldSuite placed the event from one.'
        sourceId:
          type: string
          nullable: true
        autoScheduled:
          type: boolean
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
    EventList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEvent'
    EventResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CalendarEvent'
    AttendeeInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          minLength: 3
        name:
          type: string
        status:
          type: string
        role:
          type: string
    EventInput:
      type: object
      description: |
        An event as created (`calendarId`, `title` and `startTime` required)
        or changed (only the fields sent; `calendarId` moves it). An event
        has at most 100 attendees, one per address.
      properties:
        calendarId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        type:
          type: string
          enum: [meeting, call, appointment, event, reminder, other]
        startTime:
          type: string
          minLength: 1
        endTime:
          type: string
        allDay:
          type: boolean
        timezone:
          type: string
          maxLength: 50
          description: An IANA zone; the server refuses one it doesn't know.
        location:
          type: string
        isVirtual:
          type: boolean
        meetingUrl:
          type: string
          description: An http(s) URL, or an empty string to clear it.
        status:
          type: string
          enum: [confirmed, tentative, cancelled]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        recurrenceRule:
          type: string
          description: An RRULE, or an empty string to stop repeating.
        attendees:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AttendeeInput'
        notes:
          type: string
    EventWrite:
      type: object
      required: [id]
      properties:
        id:
          type: string
        weldMeetingLinked:
          type: boolean
    EventWriteResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/EventWrite'
security:
  - bearer: []
