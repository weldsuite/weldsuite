openapi: 3.0.3
info:
  title: WeldMail API (native apps)
  version: 1.0.0
  description: |
    What the native WeldMail apps call. Hand-written; the Rust server is the
    source of truth: change both together, and see "Changing the contract"
    in apps/mobile-shared/README.md for what apps already on phones can read.

    Checked against the server in rust/modules/mail/tests/openapi_contract.rs
    (the mail routes) and rust/modules/crm/tests/weldmail_openapi_contract.rs
    (the contacts the composer suggests and the contact screen shows).

    Every request carries `Authorization: Bearer <WeldID access token>` and
    names its workspace in `X-Weld-Workspace`.

    Not here: an attachment's bytes (`GET /api/mail-attachments/{id}/download`)
    and the upload of a new one (`POST /api/storage/generate-upload-url`, then
    a `PUT` of the bytes to the URL it hands out). They aren't JSON, which the
    contract checker reads only; the apps call them with the same headers.
servers:
  - url: https://app.weldsuite.eu
paths:
  /api/mail-accounts:
    get:
      operationId: listMailAccounts
      summary: The mailboxes the caller may open in this workspace, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The mailboxes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailAccountList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createMailAccount
      summary: A new mailbox on one of the workspace's mail domains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMailAccountInput'
      responses:
        '201':
          description: The new mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedMailAccountResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-accounts/{accountId}/send:
    post:
      operationId: sendMessage
      summary: Send a message from the mailbox. `idempotencyKey` makes a retried send safe.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageInput'
      responses:
        '200':
          description: Sent (or waiting for recipient verification).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResultResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mailboxes:
    get:
      operationId: listMailboxes
      summary: The caller's mailboxes in every workspace they belong to, per workspace.
      responses:
        '200':
          description: One group per workspace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxGroupList'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-messages:
    get:
      operationId: listMessages
      summary: One page of messages, newest first. Without `accountId`, every mailbox the caller may open.
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
        - name: label
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: isRead
          in: query
          required: false
          schema:
            type: string
        - name: hasAttachments
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageList'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-messages/stats:
    get:
      operationId: messageStats
      summary: Folder counters of one mailbox, or of every mailbox the caller may open.
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The counters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageStatsResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-messages/{messageId}:
    get:
      operationId: getMessage
      summary: One message with its bodies and attachments.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateMessage
      summary: Change a message's flags (read, starred, spam, …).
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMessageInput'
      responses:
        '200':
          description: The message id and what changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageRefResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMessage
      summary: Delete the message.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /api/mail-messages/{messageId}/thread:
    get:
      operationId: getThread
      summary: The conversation the message is in, oldest first, with bodies.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailThreadResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-messages/{messageId}/labels/add:
    post:
      operationId: addMessageLabels
      summary: Add labels (system ones like ARCHIVE, or the mailbox's own by name).
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelsInput'
      responses:
        '200':
          description: The message's labels now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageLabelsResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-messages/{messageId}/labels/remove:
    post:
      operationId: removeMessageLabels
      summary: Remove labels.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelsInput'
      responses:
        '200':
          description: The message's labels now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageLabelsResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-labels:
    get:
      operationId: listLabels
      summary: The labels of one mailbox, or of every mailbox the caller may open, with live message counts.
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The labels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailLabelList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createLabel
      summary: A label of the mailbox's own. 409 when the name is taken.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabelInput'
      responses:
        '201':
          description: The label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailLabelResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-drafts:
    post:
      operationId: createDraft
      summary: Keep what the composer held as a draft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftInput'
      responses:
        '201':
          description: The draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDraftResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-drafts/{draftId}:
    delete:
      operationId: deleteDraft
      summary: Discard a draft.
      parameters:
        - name: draftId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Discarded.
        default:
          $ref: '#/components/responses/Error'
  /api/mail-snooze/accounts/{accountId}/messages/{messageId}/snooze:
    post:
      operationId: snoozeMessage
      summary: Out of the inbox until `until`, then back, unread.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnoozeInput'
      responses:
        '200':
          description: Snoozed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnoozeResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-snooze/accounts/{accountId}/messages/{messageId}/unsnooze:
    post:
      operationId: unsnoozeMessage
      summary: Back in the inbox now.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: Back in the inbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnoozeResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-scheduled:
    post:
      operationId: scheduleMessage
      summary: Send at `scheduledFor` (in the future, at most 365 days ahead).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleMessageInput'
      responses:
        '201':
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-subscriptions:
    get:
      operationId: listSubscriptions
      summary: The mailing lists that write to the mailbox, most recent first.
      parameters:
        - name: accountId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailSubscriptionList'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-subscriptions/scan:
    post:
      operationId: scanSubscriptions
      summary: Look through recent mail for mailing lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanSubscriptionsInput'
      responses:
        '200':
          description: How much was looked at.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResultResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-subscriptions/{subscriptionId}/unsubscribe:
    post:
      operationId: unsubscribe
      summary: Unsubscribe the mailbox; `method` says how, `url` is the sender's page when that is still to be opened.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Done, or the page to finish on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribeResultResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-weldmail/domain:
    get:
      operationId: weldmailDomain
      summary: The workspace's free address domain (`acme.weldmail.eu`).
      responses:
        '200':
          description: The domain.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeldmailDomainResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-weldmail/check:
    post:
      operationId: checkWeldmailAddress
      summary: Whether a free address is still available.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeldmailAddressInput'
      responses:
        '200':
          description: Available, or why not (`reserved`, `taken`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeldmailAvailabilityResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-weldmail/reserve:
    post:
      operationId: reserveWeldmailAddress
      summary: Take a free address as a new mailbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveWeldmailInput'
      responses:
        '201':
          description: The new mailbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservedAddressResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/mail-domains:
    get:
      operationId: listMailDomains
      summary: The workspace's own mail domains.
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailDomainList'
        default:
          $ref: '#/components/responses/Error'
  /api/people:
    get:
      operationId: listPeople
      summary: Contacts, for recipient suggestions and the sender's contact card.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: The contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createPerson
      summary: Add a contact. 200 when an existing record by that address was taken up instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonInput'
      responses:
        '200':
          description: An existing contact, taken up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        '201':
          description: The new contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/people/{personId}:
    get:
      operationId: getPerson
      summary: One contact.
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updatePerson
      summary: Change some of a contact's fields.
      parameters:
        - $ref: '#/components/parameters/PersonId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePersonInput'
      responses:
        '200':
          description: The contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  # Enums are written inline: the Kotlin generator marks a property that
  # references an enum schema `@Contextual`. The server's value sets here
  # (statuses, providers, send methods) are open, so they are plain strings.
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      description: |
        What a refused send carries: which limit, when a retry can work, who
        got the message and who didn't, which recipients can't be used.
      properties:
        limit:
          type: integer
          nullable: true
        window:
          type: string
          nullable: true
        retryAfter:
          type: string
          nullable: true
        suggestWeldReach:
          type: boolean
          nullable: true
        reason:
          type: string
          nullable: true
        sent:
          type: array
          nullable: true
          items:
            type: string
        failed:
          type: array
          nullable: true
          items:
            type: string
        recipients:
          type: array
          nullable: true
          items:
            type: string
        invalidFormat:
          type: array
          nullable: true
          items:
            type: string
        unreachableDomains:
          type: array
          nullable: true
          items:
            type: string
    Pagination:
      type: object
      required: [totalCount, hasMore, cursor]
      properties:
        totalCount:
          type: integer
        hasMore:
          type: boolean
        cursor:
          type: string
          nullable: true
    MailAccount:
      type: object
      required: [id, name, email, status]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        displayName:
          type: string
          nullable: true
        provider:
          type: string
        status:
          type: string
        isDefault:
          type: boolean
          nullable: true
        isShared:
          type: boolean
          nullable: true
        signature:
          type: string
          nullable: true
    MailAccountList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MailAccount'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CreateMailAccountInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        displayName:
          type: string
        isShared:
          type: boolean
    CreatedMailAccount:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
    CreatedMailAccountResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CreatedMailAccount'
    MailboxAccount:
      type: object
      required: [id, email, displayName, status]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        provider:
          type: string
        isDefault:
          type: boolean
        status:
          type: string
    MailboxGroup:
      type: object
      required: [workspaceId, workspaceName, accounts]
      properties:
        clerkOrgId:
          type: string
        workspaceId:
          type: string
        workspaceName:
          type: string
        slug:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/MailboxAccount'
    MailboxGroupList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MailboxGroup'
    MailAddress:
      type: object
      description: A sender or recipient. The sender may carry the matching contact's picture.
      properties:
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
    MailAttachment:
      type: object
      required: [id, fileName, size]
      properties:
        id:
          type: string
        fileName:
          type: string
        contentType:
          type: string
          nullable: true
        size:
          type: integer
        isInline:
          type: boolean
          nullable: true
    MailMessage:
      type: object
      description: |
        A message. The list leaves out the bodies, the references and the
        attachments; one message (`getMessage`, `getThread`) has them.
      required: [id, accountId, sentDate, isRead, hasAttachments, createdAt]
      properties:
        id:
          type: string
        accountId:
          type: string
        messageId:
          type: string
          description: The SMTP Message-ID, for threading a reply.
        threadId:
          type: string
          nullable: true
        from:
          $ref: '#/components/schemas/MailAddress'
        to:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MailAddress'
        cc:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MailAddress'
        subject:
          type: string
          nullable: true
        preview:
          type: string
          nullable: true
        textBody:
          type: string
          nullable: true
        htmlBody:
          type: string
          nullable: true
        sentDate:
          type: string
        receivedDate:
          type: string
          nullable: true
        isRead:
          type: boolean
        isStarred:
          type: boolean
          nullable: true
        isImportant:
          type: boolean
          nullable: true
        isDraft:
          type: boolean
          nullable: true
        hasAttachments:
          type: boolean
        attachmentCount:
          type: integer
          nullable: true
        labels:
          type: array
          nullable: true
          items:
            type: string
        references:
          type: array
          nullable: true
          items:
            type: string
        scheduledFor:
          type: string
          nullable: true
        sendStatus:
          type: string
          nullable: true
        createdAt:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MailAttachment'
    MailMessageList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MailMessage'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MailMessageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MailMessage'
    MailThread:
      type: object
      required: [threadId, messages]
      properties:
        threadId:
          type: string
        messages:
          type: array
          items:
            $ref: '#/components/schemas/MailMessage'
    MailThreadResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MailThread'
    MessageStats:
      type: object
      required: [unread, inboxUnread, drafts]
      properties:
        total:
          type: integer
        unread:
          type: integer
        inboxUnread:
          type: integer
        starred:
          type: integer
        snoozed:
          type: integer
        scheduled:
          type: integer
        drafts:
          type: integer
    MessageStatsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MessageStats'
    UpdateMessageInput:
      type: object
      properties:
        isRead:
          type: boolean
        isStarred:
          type: boolean
        isSpam:
          type: boolean
        isImportant:
          type: boolean
        isFlagged:
          type: boolean
    MessageRef:
      type: object
      required: [id]
      properties:
        id:
          type: string
    MessageRefResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MessageRef'
    LabelsInput:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items:
            type: string
    MessageLabels:
      type: object
