# WeldSuite mail-api worker — the mail module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   mail-api.weldsuite.org        production
#   mail-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "mail-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY
#   CLOUDFLARE_API_TOKEN (mail domain provisioning through Cloudflare Email
#     Routing, @weldsuite/worker-email; also the AI token /api/mail-ai runs on
#     when AI_GATEWAY_API_TOKEN is unset — same value as app-api)
#   (DATABASE_URL_MASTER also backs the WeldMail address registry, the
#   catch-all registry, the mailbox directory and the mail-ai credit metering)
#
# Secrets (not in the manifest yet; same values as app-api):
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation)
#   AI_GATEWAY_API_TOKEN (+ optional CF_AI_GATEWAY, CF_AIG_TOKEN): /api/mail-ai
#     (@weldsuite/ai). When unset, @weldsuite/ai uses CLOUDFLARE_API_TOKEN.
#   MAIL_INBOUND_WORKER_NAME (optional; the worker the catch-all rule routes
#     inbound mail to — defaults to weldsuite-mail-inbound, unset on app-api)
#   OUTBOUND_ADMIN_SECRET (the outbound guard's staff API, /internal/outbound/*;
#     same value as the admin console's; at least 32 characters)
#
# Outbound guard (docs/plans/weldmail-outbound-abuse.md): this worker hosts the
# OutboundLedger (one per workspace) and OutboundPlatformBudget Durable Objects
# that every mail-sending worker binds by script_name, and consumes two queues:
#   mail-outbound-review-<env>  AI reviews of templates the ledgers queue
#   mail-sending-events-<env>   Cloudflare Email Sending events (bounces,
#                               complaints), one Queues event subscription per
#                               sending domain, created when a domain is
#                               provisioned (needs MAIL_SENDING_EVENTS_QUEUE_ID
#                               and a CLOUDFLARE_API_TOKEN with Queues Edit)
# Ops per env: wrangler queues create mail-outbound-review-<env>,
# mail-outbound-review-dlq-<env>, mail-sending-events-<env>,
# mail-sending-events-dlq-<env>; put the sending-events queue's id in
# MAIL_SENDING_EVENTS_QUEUE_ID; set CF_EMAIL_DAILY_QUOTA to the account's daily
# Email Sending quota to arm the platform budget.
#
# CF_ACCOUNT_ID and R2_PUBLIC_URL are [vars] (values copied from app-api).

name = "weldsuite-mail-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
# No "react" alias here (unlike most other API workers): the outbound guard's
# staff alerts render real system email through @weldsuite/emails, which needs
# the actual react package, not the empty bundle-size shim.

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"
ABUSE_NOTIFY_EMAIL = "gert@weldsuite.org"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# Schedule-index D1 (shared with workflow-worker / agent-api): its
# `workspace_due_index` rows tell the snooze sweep which workspaces have mail
# coming due, so it never opens idle tenant DBs. Migrations: workflow-worker.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# R2 bucket for mail attachments and generated contact avatars.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# Private uploads (TASK-620): no public domain; read only through
# @weldsuite/worker-kit/storage (app-api serves /api/storage/private/*).
[[r2_buckets]]
binding = "PRIVATE_STORAGE"
bucket_name = "weldsuite-private-test"

# Cloudflare Email Sending binding for WeldMail outbound delivery. The
# `destination_address` is the envelope MAIL FROM the binding will accept;
# Cloudflare requires this address to be verified in the dashboard once per
# environment. Locally there's no MTA, so `wrangler dev` will fail any
# actual send — that's expected; the route handlers gate on env.SEND_EMAIL
# and surface a 503 with `code: 'EMAIL_BINDING_UNAVAILABLE'` when missing.
[[send_email]]
name = "SEND_EMAIL"

# Scheduled email — Cloudflare Workflow hosted in THIS worker (class
# re-exported from src/index.ts, @weldsuite/mail-domain). New name (-v3):
# app-api keeps `send-scheduled-email-v2*` while its in-flight instances
# drain. Self-hosted (no script_name), so it also works under plain
# `wrangler dev`.
[[workflows]]
name = "send-scheduled-email-v3-dev"
binding = "SEND_SCHEDULED_EMAIL"
class_name = "SendScheduledEmailWorkflow"

# Snooze wake-up sweep (src/cron/snooze-sweep.ts, scheduled() in
# src/index.ts): snoozed mail whose time has come goes back to the inbox.
# Keep the expression in step with SNOOZE_SWEEP_CRONS. A quiet tick reads only
# the SCHEDULE_INDEX due index (D1) — no master or tenant DB — so every
# environment runs it every 5 minutes.
[triggers]
crons = ["*/5 * * * *"]

# ---- Outbound guard (docs/plans/weldmail-outbound-abuse.md) ----
[[durable_objects.bindings]]
name = "OUTBOUND_LEDGER"
class_name = "OutboundLedger"

[[durable_objects.bindings]]
name = "OUTBOUND_PLATFORM"
class_name = "OutboundPlatformBudget"

[[migrations]]
tag = "outbound-v1"
new_sqlite_classes = ["OutboundLedger", "OutboundPlatformBudget"]

# Per-sender backstop while the ledger is unreachable. Same namespace in every
# mail-sending worker, so they share the counters on purpose.
[[ratelimits]]
name = "OUTBOUND_BACKSTOP"
namespace_id = "1101"
  [ratelimits.simple]
  limit = 30
  period = 60

[[queues.producers]]
binding = "MAIL_OUTBOUND_REVIEW"
queue = "mail-outbound-review-dev"

[[queues.consumers]]
queue = "mail-outbound-review-dev"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "mail-outbound-review-dlq-dev"

[[queues.consumers]]
queue = "mail-sending-events-dev"
max_batch_size = 50
max_batch_timeout = 10
max_retries = 3
dead_letter_queue = "mail-sending-events-dlq-dev"

