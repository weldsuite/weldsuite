# WeldConnect workflow execution worker.
#
# Runtime home of the WeldConnect automation engine: the Cloudflare Workflow
# `ExecuteWorkflowWorkflow` plus the engine under src/engine/. app-api,
# helpdesk-workflow-worker, and entity-events start a run via the
# EXECUTE_WORKFLOW binding's `create({ params })` (script_name → this worker).
#
# Also hosts the workflow schedule sweep (src/cron/schedule-sweep.ts): a
# per-minute Cron Trigger (see [triggers] below, every env). Rather than fanning
# out to every tenant Neon DB each tick, it polls the always-on D1 schedule
# index (SCHEDULE_INDEX binding below) and opens a tenant DB only when a schedule
# actually fires, so idle workspaces' databases autosuspend. Due schedules are
# dispatched via this worker's OWN EXECUTE_WORKFLOW self-binding. app-api keeps
# the index in sync on schedule CRUD; POST /internal/schedule-index/rebuild
# (bearer INTERNAL_API_SECRET) backfills it once from existing tenant schedules.
#
# Required secrets (wrangler secret put, per env):
#   DATABASE_URL_MASTER      — master Neon connection string (workspace lookup +
#                              schedule sweep's workspace listing + ai_generate/
#                              ai_classify credit-wallet metering)
#   NEON_API_KEY             — resolves per-tenant Neon connection URLs
#   DATABASE_ENCRYPTION_KEY  — (optional) decrypts stored tenant URLs
#   INTERNAL_API_SECRET      — bearer for the FALLBACK HTTP path to /api/internal/send-email
#                              and /api/internal/workflow-actions/*, used only while the
#                              APP_API_INTERNAL / CONNECT_INTERNAL entrypoint bindings are
#                              unbound or not deployed yet (must MATCH the target's
#                              INTERNAL_API_SECRET per env). Also guards the operator
#                              /internal/schedule-index/rebuild endpoint.
#   TELNYX_API_KEY           — (optional) send_sms
#   GOOGLE_CLIENT_ID +       — the WeldConnect workflow-integrations Google OAuth
#   GOOGLE_CLIENT_SECRET       app (same app connect-api's /api/workflow-integrations
#                              connects with). Needed HERE too, not just on
#                              connect-api: Google access tokens expire after an
#                              hour, and every google_sheets/gmail/google_calendar
#                              step refreshes its token in-process via
#                              engine/actions/providers/token.ts before calling the
#                              API — without these, that refresh throws and every
#                              Google step fails once its token is stale. Slack
#                              never needed this here because bot tokens don't expire.
#   AI (ai_generate / ai_classify, via @weldsuite/ai) — the Cloudflare AI Gateway.
#                              Model ids and pricing are canonical. Set:
#   AI_GATEWAY_API_TOKEN     — CF API token with Workers AI + AI Gateway Run
#                              scopes, sent as Authorization. Covers both Workers AI
#                              (@cf/… — free allocation) and third-party models (unified
#                              billing). `wrangler secret put AI_GATEWAY_API_TOKEN`.
#                              CF_ACCOUNT_ID is already a [vars] value below (mirrors
#                              apps/workers/app-api/wrangler.toml). Optionally CF_AI_GATEWAY (a
#                              named gateway id; omit for the account default) +
#                              CF_AIG_TOKEN (authenticated gateways only).
#   AI_DEFAULT_MODEL         — ([vars], optional) overrides the default model.
#   GITHUB_APP_ID            — (github.create_issue / github.create_comment) numeric
#                              id of the GitHub App WeldFlow's project sync already
#                              installs per workspace (connect-api owns the install
#                              flow). The engine mints its own fresh ~1h installation
#                              token per call (providers/token.ts, @weldsuite/
#                              connect-domain/github/app-auth) — MUST be the SAME App
#                              as connect-api's GITHUB_APP_ID/GITHUB_APP_PRIVATE_KEY.
#   GITHUB_APP_PRIVATE_KEY   — PEM private key for that same GitHub App.
#
# Per-env KV ids + queue/service names mirror api-worker; fill the REPLACE_ME
# ids before deploying each environment.

name = "weldsuite-workflow"
main = "src/index.ts"
compatibility_date = "2025-01-10"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[vars]
ENVIRONMENT = "development"
# Origin of app-api for the FALLBACK HTTP path to /api/internal/* (bearer
# INTERNAL_API_SECRET), used only while the entrypoint bindings below are unbound
# or not deployed yet. Repointed from the legacy api-worker in phase W3 of the
# legacy-worker phase-out plan (.claude/open-source-plan.md). Local `wrangler dev`
# serves app-api on 8789.
APP_API_URL = "http://localhost:8789"
# @weldsuite/ai → Cloudflare AI Gateway (ai_generate / ai_classify actions).
# Mirrors apps/workers/app-api/wrangler.toml's CF_ACCOUNT_ID value.
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# D1 schedule index — local `wrangler dev` emulates this against a local SQLite
# copy; the id points at the test database so remote-mode dev shares it.
# Schema migrations live in ./migrations/d1 (applied by deploy.yml).
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"
migrations_dir = "migrations/d1"

[[services]]
binding = "REALTIME"
service = "weldsuite-realtime"

# Named-entrypoint bindings for internal worker-to-worker calls: reachable only over
# a service binding, so they need no INTERNAL_API_SECRET. `remote = true` lets plain
# `wrangler dev` reach the deployed test workers (mirrors WORKSPACE_WORKER in app-api).
# Deploy order: the callee must have the entrypoint first (connect-api is a module
# worker and deploys before this one; app-api deploys in the same job, so its
# AppApiInternal may land after this worker for one deploy: the fallback covers it).
# app-api AppApiInternal: POST /api/internal/send-email (send_email action).
[[services]]
binding = "APP_API_INTERNAL"
service = "weldsuite-app-api-test"
entrypoint = "AppApiInternal"
remote = true

# connect-api ConnectInternal: POST /api/internal/workflow-actions/create-customer.
[[services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api-test"
entrypoint = "ConnectInternal"
remote = true

[[workflows]]
name = "execute-workflow-dev"
binding = "EXECUTE_WORKFLOW"
class_name = "ExecuteWorkflowWorkflow"

# Phase 4: hub SUB_WELDCONNECT → entity-workflows* (entity_event matching)
#   wrangler queues create entity-workflows-dev
#   wrangler queues create entity-workflows-dlq-dev
[[queues.consumers]]
queue = "entity-workflows-dev"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "entity-workflows-dlq-dev"

[triggers]
# Workflow schedule sweep — matches enabled workflow_schedules against their
# cron expression + timezone and dispatches due ones every minute (see
# src/cron/schedule-sweep.ts and the `scheduled` handler in src/index.ts).
crons = ["* * * * *"]

# ============ TEST ============
[env.test]
name = "weldsuite-workflow-test"

[env.test.vars]
ENVIRONMENT = "test"
APP_API_URL = "https://app-api-test.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"
migrations_dir = "migrations/d1"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.services]]
binding = "APP_API_INTERNAL"
service = "weldsuite-app-api-test"
entrypoint = "AppApiInternal"

[[env.test.services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api-test"
entrypoint = "ConnectInternal"

[[env.test.workflows]]
name = "execute-workflow-test"
binding = "EXECUTE_WORKFLOW"
class_name = "ExecuteWorkflowWorkflow"

[[env.test.queues.consumers]]
queue = "entity-workflows-test"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "entity-workflows-dlq-test"

[env.test.triggers]
crons = ["* * * * *"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ============
[env.production]
name = "weldsuite-workflow"

[env.production.vars]
ENVIRONMENT = "production"
APP_API_URL = "https://app-api.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-production"
database_id = "d44f8243-eff7-4039-ab37-3ed51094ef39"
migrations_dir = "migrations/d1"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

# app-api and connect-api deploy as "weldsuite-app-api" / "weldsuite-connect-api"
# (no "-production" suffix).
[[env.production.services]]
binding = "APP_API_INTERNAL"
service = "weldsuite-app-api"
entrypoint = "AppApiInternal"

[[env.production.services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api"
entrypoint = "ConnectInternal"

[[env.production.workflows]]
name = "execute-workflow"
binding = "EXECUTE_WORKFLOW"
class_name = "ExecuteWorkflowWorkflow"

[[env.production.queues.consumers]]
queue = "entity-workflows"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "entity-workflows-dlq"

[env.production.triggers]
crons = ["* * * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
