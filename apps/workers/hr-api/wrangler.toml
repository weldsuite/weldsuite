# WeldSuite hr-api worker — the hr module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   hr-api.weldsuite.org        production
#   hr-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "hr-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY
#
# Secrets (not in the manifest yet):
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation; the
#     employee sensitive block is encrypted with the keyring)
#
# HR_PORTAL_URL and REALTIME_PUBLIC_URL are optional [vars]; both default per
# ENVIRONMENT (app-api sets neither).
#
# WeldHR payroll (docs/plans/weldhr-payroll.md), behind the `weldhr-payroll` flag:
#   STORAGE (R2)        payslip PDFs and filing files under workspaces/<id>/hr/payslips|filings/
#   BOOKS_INTERNAL      books-api's BooksInternal entrypoint; approving a pay run posts its journal
#                       through POST /internal/payroll/imports (no secret: only reachable over the binding)
#   DATABASE_URL_MASTER writes the per-payslip billing ledger (payroll_usage_events)
# Sending the loonaangifte over Digipoort is optional and off until the owner has the ODB subscription,
# the PKIoverheid certificate and the Logius connection (flag `weldhr-payroll-digipoort`): see the
# commented DIGIPOORT_* settings below.

name = "weldsuite-hr-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
# No "react" alias here (unlike most other API workers): this worker sends
# system email through @weldsuite/emails, which renders with the real react
# package, not the empty bundle-size shim.

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# R2 bucket for expense-declaration receipts (private; served through the API).
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# books-api's BooksInternal entrypoint: the journal of an approved WeldHR pay run is posted over it.
# A named entrypoint is reachable only over a service binding, so it needs no secret. `remote = true` lets
# plain `wrangler dev` reach the deployed test worker. Deploy order: books-api must have the
# /internal/payroll route first.
[[services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api-test"
entrypoint = "BooksInternal"
remote = true

# Digipoort (sending the Dutch loonaangifte), OPTIONAL and off by default. Needs, per environment:
#   - a PKIoverheid client certificate for mutual TLS, uploaded with
#       wrangler mtls-certificate upload --cert pkioverheid.pem --key pkioverheid.key --name digipoort-payroll
#     and bound here (uncomment and paste the returned certificate_id):
#       [[mtls_certificates]]
#       binding = "DIGIPOORT_CERT"
#       certificate_id = "<uuid>"
#   - [vars] DIGIPOORT_AANLEVER_URL and DIGIPOORT_STATUS_URL (the Logius WUS AanleverService and
#     StatusinformatieService URLs of the environment), and the secrets DIGIPOORT_SIGNING_KEY (RSA PKCS#8 PEM)
#     and DIGIPOORT_CERTIFICATE_DER (base64 DER of the signing certificate).
#   - NL_SOFTWARE_RELATION_NUMBER ([vars]): WeldSuite's ODB relatienummer as a software developer (SWO12345),
#     written into every loonaangifte; the builder refuses to produce one without it.
# Until all of that exists, POST /api/weldhr/payroll/filings/:id/submit answers DIGIPOORT_NOT_CONFIGURED and
# the employer files the generated XML itself ("mark as filed").

# Cloudflare Email Sending binding for the workforce portal invite and sign-in
# code emails. A missing binding is a no-op (the invite is still recorded).
[[send_email]]
name = "SEND_EMAIL"

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-hr-api-test"
routes = [
  { pattern = "hr-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api-test"
entrypoint = "BooksInternal"

[[env.test.send_email]]
name = "SEND_EMAIL"
# Only system mail goes through this binding, always from this address.
allowed_sender_addresses = ["notifications@mail.weldsuite.org"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-hr-api"
routes = [
  { pattern = "hr-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

# books-api's [env.production] name is "weldsuite-books-api" (no "-production" suffix).
[[env.production.services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api"
entrypoint = "BooksInternal"

[[env.production.send_email]]
name = "SEND_EMAIL"
# Only system mail goes through this binding, always from this address.
allowed_sender_addresses = ["notifications@mail.weldsuite.org"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
