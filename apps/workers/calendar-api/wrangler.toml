# WeldSuite calendar-api worker — the calendar module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   calendar-api.weldsuite.org        production
#   calendar-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "calendar-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY
#   (DATABASE_URL_MASTER also backs the daily calendar replan cron, which
#   walks every workspace)
#
# Secrets beyond the base set (same values as app-api, which still uses them
# too). The hand-set ones are in scripts/secrets/manifest.ts now; add them to
# Doppler if `secrets:sync` warns they are missing:
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation)
#   RESEND_API_KEY (calendar attendee mails, @weldsuite/emails: the
#     EMAIL_TRANSPORT="resend" fallback while mail.weldsuite.org is onboarded)
#   GOOGLE_CALENDAR_CLIENT_ID + GOOGLE_CALENDAR_CLIENT_SECRET (Google Calendar
#     outbound sync: token refresh before pushing an event to Google)
#
# Calendar attendee mail (services/calendar-mail.ts) goes through
# @weldsuite/emails. EMAIL_TRANSPORT="resend" below is temporary — flip to
# "cloudflare" (or unset) once mail.weldsuite.org is onboarded
# (docs/plans/system-email-cloudflare.md, Phase 0).

name = "weldsuite-calendar-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
# No "react" alias here (unlike most other API workers): calendar-mail.ts
# renders real system email through @weldsuite/emails, which needs the actual
# react package, not the empty bundle-size shim.

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
# Flip to "cloudflare" once mail.weldsuite.org is onboarded
# (docs/plans/system-email-cloudflare.md, Phase 0).
EMAIL_TRANSPORT = "resend"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

[[send_email]]
name = "SEND_EMAIL"

# Daily 04:00 UTC calendar replan sweep (scheduled() in src/index.ts), moved
# here from app-api.
[triggers]
crons = ["0 4 * * *"]

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-calendar-api-test"
routes = [
  { pattern = "calendar-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
# First worker on Cloudflare Email Service (mail.weldsuite.org is onboarded).
# Set back to "resend" to fall back without a code change
# (docs/plans/system-email-cloudflare.md).
EMAIL_TRANSPORT = "cloudflare"

[[env.test.send_email]]
name = "SEND_EMAIL"
# calendar-api only sends system mail, always from this address.
allowed_sender_addresses = ["notifications@mail.weldsuite.org"]

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

# Daily 04:00 UTC calendar replan sweep (scheduled() in src/index.ts), moved
# here from app-api.
[env.test.triggers]
crons = ["0 4 * * *"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-calendar-api"
routes = [
  { pattern = "calendar-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
# Flip to "cloudflare" once mail.weldsuite.org is onboarded
# (docs/plans/system-email-cloudflare.md, Phase 0).
EMAIL_TRANSPORT = "resend"

[[env.production.send_email]]
name = "SEND_EMAIL"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

# Daily 04:00 UTC calendar replan sweep (scheduled() in src/index.ts), moved
# here from app-api.
[env.production.triggers]
crons = ["0 4 * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
