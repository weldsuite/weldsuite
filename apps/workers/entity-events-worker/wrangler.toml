# WeldSuite Entity Events Hub Worker
# Orchestrator-only: consumes ENTITY_EVENTS and enqueues to matching subscriber queues.
# No business logic (no DB writes, no HTTP, no Workflow.create).

name = "weldsuite-entity-events"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============
# Create queues before local/dev use:
#   wrangler queues create entity-events-dev
#   wrangler queues create entity-events-dlq-dev

[vars]
ENVIRONMENT = "development"

# Hub consumer
[[queues.consumers]]
queue = "entity-events-dev"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "entity-events-dlq-dev"

# Phase 1 subscriber producers → existing per-concern queues
[[queues.producers]]
binding = "SUB_AUDIT"
queue = "audit-events-dev"

[[queues.producers]]
binding = "SUB_ANALYTICS"
queue = "analytics-events-dev"

[[queues.producers]]
binding = "SUB_SEARCH"
queue = "search-index-dev"

# Phase 3: outbound customer webhooks → integration-webhook-worker
#   wrangler queues create entity-webhooks-dev
#   wrangler queues create entity-webhooks-dlq-dev
[[queues.producers]]
binding = "SUB_WEBHOOKS"
queue = "entity-webhooks-dev"

# Phase 4: WeldConnect entity_event triggers → workflow-worker
#   wrangler queues create entity-workflows-dev
#   wrangler queues create entity-workflows-dlq-dev
[[queues.producers]]
binding = "SUB_WELDCONNECT"
queue = "entity-workflows-dev"

# Phase 5: WeldAgent eventSubscriptions → app-api
#   wrangler queues create entity-agents-dev
#   wrangler queues create entity-agents-dlq-dev
[[queues.producers]]
binding = "SUB_WELDAGENT"
queue = "entity-agents-dev"

# Phase 6: realtime WorkspaceHub bridge → realtime-worker
#   wrangler queues create entity-realtime-dev
#   wrangler queues create entity-realtime-dlq-dev
[[queues.producers]]
binding = "SUB_REALTIME"
queue = "entity-realtime-dev"

