# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-entity-events"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.queues.consumers]]
queue = "entity-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "entity-events-dlq"

[[env.production.queues.producers]]
binding = "SUB_AUDIT"
queue = "audit-events"

[[env.production.queues.producers]]
binding = "SUB_ANALYTICS"
queue = "analytics-events"

[[env.production.queues.producers]]
binding = "SUB_SEARCH"
queue = "search-index"

[[env.production.queues.producers]]
binding = "SUB_WEBHOOKS"
queue = "entity-webhooks"

[[env.production.queues.producers]]
binding = "SUB_WELDCONNECT"
queue = "entity-workflows"

[[env.production.queues.producers]]
