# MCP Server - Customer-facing MCP protocol endpoint
# Allows WeldSuite customers to access their data through AI assistants.
#
# Authentication is Clerk OAuth (see src/middleware/auth.ts). There are no API
# keys. The worker is self-contained: it serves tool calls from its own copy of
# the v1 resource routes (src/api/) against the tenant DB, so no request path
# depends on another worker and no service bindings are configured here.
# Social publishing goes through the shared `@weldsuite/social-publishing`
# package, which talks to PostPeer directly — shared code, not a shared runtime.
#
# Secrets (set via `wrangler secret put`, never hardcoded here):
# - POSTPEER_API_KEY (WeldSocial: single WeldSuite-level PostPeer key, sent as
#   the `x-access-key` header. Same value as app-api's. Unset leaves
#   publish_social_post / schedule_social_post answering 503 and changes
#   nothing else.)
# - POSTPEER_APP_IDS (WeldSocial BYOK: JSON object of platform → PostPeer app id.
#   Only read on the connect flow, which this worker does not expose; set for
#   parity if that changes.)
#   (POSTPEER_BASE_URL defaults to https://api.postpeer.dev/v1; override via [vars].)
name = "weldsuite-mcp-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Default (used by `wrangler dev`).
[vars]
MCP_SERVER_URL = "http://localhost:8789"
# Clerk publishable keys are public by design — they ship in browser bundles and
# are already committed in the mobile apps' eas.json. The OAuth discovery
# documents base64-decode this to derive the Clerk issuer, so a missing value
# makes /.well-known/* fail. Not a secret; deliberately not in the Doppler
# manifest. The overlay repo overrides this per environment.
CLERK_PUBLISHABLE_KEY = "pk_test_ZGVmaW5pdGUtZWFnbGUtMy5jbGVyay5hY2NvdW50cy5kZXYk"

# Shims to prevent bundling Node.js-only packages from @weldsuite/db
[alias]
"@clerk/nextjs/server" = "./src/lib/clerk-shim.ts"
"@clerk/nextjs" = "./src/lib/clerk-shim.ts"
"next/server" = "./src/lib/next-shim.ts"
"react" = "./src/lib/react-shim.ts"

# Durable Objects for distributed rate limiting
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Entity-event sinks (dev). These mirror the production block below — without
# them `wrangler dev` leaves every binding undefined and publishEntityEvent
# silently skips all its queue sinks, so MCP-originated mutations look like they
# publish while producing nothing.
[[queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events-dev"

[[queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events-dev"

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
name = "weldsuite-mcp-server"
routes = [{ pattern = "mcp.weldsuite.org/*", zone_name = "weldsuite.org" }]
vars = { ENVIRONMENT = "production", MCP_SERVER_URL = "https://mcp.weldsuite.org", CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsud2VsZHN1aXRlLm9yZyQ" }

[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Share KV namespace with external-api/app-api for cache coherence
[[env.production.kv_namespaces]]
binding = "API_CACHE"
id = "REPLACE_WITH_KV_OR_HYPERDRIVE_ID"

# Master Postgres over Hyperdrive — same binding external-api uses. Read by the
# ported WeldApps routes (user-apps, app-storage) for the cross-workspace tables.
[[env.production.hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "REPLACE_WITH_KV_OR_HYPERDRIVE_ID"

# Entity-event sinks. Mutations made through MCP publish to the same queues as
# every other surface so audit/analytics stay complete. Each binding is optional
# at runtime — a missing one logs a warning and the others still fire.
[[env.production.queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events"

[[env.production.queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events"

# R2 bucket for user-app bundles (shared with app-api's STORAGE binding).
[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# Inheritable key — applies to all named environments unless overridden.
[observability]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 1
