# WeldSuite panel-ingest worker — WeldPanel's public collector.
#
# Tracked sites send events and recording chunks here (docs/plans/weldpanel.md):
#   pnl.weldsuite.org        production
#   pnl-test.weldsuite.org   test
# The host name is still an open item in the plan; it avoids words ad-block
# lists match (analytics, track, collect).
#
# Never binds a tenant database (ADR DATA-008). No secrets: project records come
# from the WORKSPACE_CACHE KV namespace panel-api writes, events go to a Basin
# stream, and the Durable Objects keep the daily visitor-hash salt and the
# per-workspace event counts.
#
# PANEL_EVENTS is the stream behind the Basin table panel.events_v1, one per
# environment (a stream cannot be changed after creation; schema:
# packages/domains/panel/src/events-v1-schema.json). The __PANEL_EVENTS_STREAM_*__
# values below are placeholders until the streams are created: replace them
# with the stream ids. Local dev uses the test stream, so it can never write to
# the production table.

# PANEL_PROJECT is the PanelProject Durable Object (people, identities, erased ids, live view;
# EU jurisdiction through projectObjectStub). panel-api binds the same class with script_name.
# PANEL_IDENTITIES / PANEL_PEOPLE / PANEL_REPLAY_CHUNKS are the streams behind the other Basin
# tables (packages/domains/panel/src/*-v1-schema.json) and PANEL_REPLAYS the EU recordings bucket.
# The code treats a missing one as "feature off" (one log warning), so [env.production] leaves
# these four out until the production resources exist.
# The *_RATE_LIMIT bindings are Workers rate limiters, per client IP.

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "weldsuite-panel-ingest-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# GET /s.js serves the browser SDK bundle (`pnpm --filter @weldsuite/panel-sdk
# build`, which the dev/build/deploy scripts run first) imported as a string.
[[rules]]
type = "Text"
globs = ["**/*.global.js"]
fallthrough = false

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[pipelines]]
binding = "PANEL_EVENTS"
stream = "d94fcbaac8204f8a8f1e3af430e65b57"

# PanelSalt: one global instance, the daily salt of the cookieless visitor hash.
# PanelUsage: one instance per workspace, events counted per UTC day.
# Durable Object bindings and migrations are NOT inherited by [env.*].
[[durable_objects.bindings]]
name = "PANEL_SALT"
class_name = "PanelSalt"

[[durable_objects.bindings]]
name = "PANEL_USAGE"
class_name = "PanelUsage"

[[migrations]]
tag = "panel-v1"
new_sqlite_classes = ["PanelSalt", "PanelUsage"]

[[pipelines]]
binding = "PANEL_IDENTITIES"
stream = "d434e13caced469396eb843c635575f3"

[[pipelines]]
binding = "PANEL_PEOPLE"
stream = "7b6f347299184392a79e29e6c7d9459f"

[[pipelines]]
binding = "PANEL_REPLAY_CHUNKS"
stream = "8a018cf93e9049b1b35be0c9e49716d8"

# Recording chunks and heatmap snapshots: private bucket, EU jurisdiction (ADR PANEL-005).
[[r2_buckets]]
binding = "PANEL_REPLAYS"
bucket_name = "weldsuite-panel-replays-test"
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "PANEL_PROJECT"
class_name = "PanelProject"

[[migrations]]
tag = "panel-v2"
new_sqlite_classes = ["PanelProject"]

# Per-IP limits on the public browser routes (lib/rate-limit.ts).
[[ratelimits]]
name = "EVENTS_RATE_LIMIT"
namespace_id = "7101"
simple = { limit = 1200, period = 60 }

[[ratelimits]]
name = "REPLAYS_RATE_LIMIT"
namespace_id = "7102"
simple = { limit = 600, period = 60 }

[[ratelimits]]
name = "SNAPSHOTS_RATE_LIMIT"
namespace_id = "7103"
simple = { limit = 60, period = 60 }

# panel-api's PanelApiInternal entrypoint: PanelUsage settles counts there (usage, wallet, quota state).
# Reachable only over a service binding, so no secret. Deploy panel-api first (it exports the entrypoint).
[[services]]
binding = "PANEL_API"
service = "weldsuite-panel-api-dev"
entrypoint = "PanelApiInternal"

