# WeldSuite merge-api worker — the merge module's API.
#
# Split out of app-api (weldsuite-documentation/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   merge-api.weldsuite.org        production
#   merge-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "merge-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY(+_V2),
#   CLERK_SECRET_KEY, CLERK_JWT_KEY
#   GITHUB_APP_ID + GITHUB_APP_PRIVATE_KEY + GITHUB_APP_SLUG (the same GitHub App
#     as connect-api and workflow-worker: installation tokens are minted per
#     call; nothing long-lived is stored)
#   GITHUB_APP_CLIENT_ID + GITHUB_APP_CLIENT_SECRET (the App's user authorization:
#     members link their own GitHub account to review and merge as themselves)
#   GITLAB_OAUTH_CLIENT_ID/_SECRET, BITBUCKET_OAUTH_CLIENT_ID/_SECRET,
#     AZURE_DEVOPS_CLIENT_ID/_SECRET (the OAuth apps; redirect URI
#     {APP_URL}/weldmerge/oauth/callback on each)
#   AI_GATEWAY_API_TOKEN (release notes, @weldsuite/ai; CF_ACCOUNT_ID is a [vars] value)
# Vars: APP_URL (the SPA: install and OAuth redirects), WEBHOOK_BASE_URL
#   (integration-webhook-worker: where GitLab/Bitbucket/Azure DevOps webhooks point).
#
# Entrypoint: `MergeInternal` (src/index.ts), bound as MERGE_INTERNAL by
# integration-webhook-worker (GitHub App events via `githubEvent()`, GitLab /
# Bitbucket / Azure DevOps events via `providerEvent()`), by workflow-worker
# (WeldConnect merge.* actions via `workflowAction()`) and by agent-api (the
# WeldAgent merge tools via `agentTool()`). A named entrypoint is only reachable
# over a service binding.
#
# Cron (hourly, src/cron/digest-sweep.ts): the WeldChat daily digest. It reads
# only the SCHEDULE_INDEX D1 workspace_due_index (kind merge_digest) and opens
# just the workspaces whose digest hour came due (ADR DATA-008).
# app-api forwards /api/merge here over MERGE_API (API_FORWARD_MODULES).
# Deploy order: this worker before integration-webhook-worker and app-api.

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "weldsuite-merge-api-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
# No "react" alias here (unlike most other API workers): release notes are
# emailed through @weldsuite/mail-domain → @weldsuite/emails, which renders with
# the real react package, not the empty bundle-size shim.

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:3000"
WEBHOOK_BASE_URL = "https://integration-webhooks-test.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# D1 schedule index, shared with workflow-worker: the daily digest due rows
# (kind merge_digest). Dev uses the test database.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

# Daily digest sweep, hourly (src/cron/digest-sweep.ts, scheduled() in src/index.ts).
[triggers]
crons = ["0 * * * *"]

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# Cloudflare Email Sending, for publishing release notes by email
# (@weldsuite/mail-domain/outbound). Locally there's no MTA, so a send fails.
[[send_email]]
name = "SEND_EMAIL"

# Outbound mail guard (weldsuite-documentation/plans/weldmail-outbound-abuse.md): mail-api's Durable
# Objects, bound by name. OUTBOUND_BACKSTOP is the per-sender burst limit the
# guard falls back on when the ledger can't be reached; its namespace is shared
# with the other sending workers on purpose.
[[durable_objects.bindings]]
name = "OUTBOUND_LEDGER"
class_name = "OutboundLedger"
script_name = "weldsuite-mail-api-dev"

[[durable_objects.bindings]]
name = "OUTBOUND_PLATFORM"
class_name = "OutboundPlatformBudget"
script_name = "weldsuite-mail-api-dev"

[[ratelimits]]
name = "OUTBOUND_BACKSTOP"
namespace_id = "1101"
  [ratelimits.simple]
  limit = 30
  period = 60

