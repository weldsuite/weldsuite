name = "weldsuite-agent-api-test"
routes = [
  { pattern = "agent-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
AGENT_RUNTIME_URL = "https://agent-runtime-test.weldsuite.org"
AGENT_COMPUTER_ENABLED = "true"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

# WeldAgent eventSubscriptions (hub SUB_WELDAGENT)
#   wrangler queues create entity-agents-test
#   wrangler queues create entity-agents-dlq-test
[[env.test.queues.consumers]]
queue = "entity-agents-test"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "entity-agents-dlq-test"

[[env.test.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[env.test.workflows]]
name = "weldagent-job-v2"
binding = "WELDAGENT_JOB"
class_name = "WeldAgentJobWorkflow"

# Notification email defer window — class hosted in app-api.
[[env.test.workflows]]
name = "deferred-notification-email"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"
script_name = "weldsuite-app-api-test"

[env.test.triggers]
crons = ["0 * * * *"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-agent-api"
routes = [
  { pattern = "agent-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
AGENT_RUNTIME_URL = "https://agent-runtime.weldsuite.org"
AGENT_COMPUTER_ENABLED = "true"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

# WeldAgent eventSubscriptions (hub SUB_WELDAGENT)
#   wrangler queues create entity-agents
#   wrangler queues create entity-agents-dlq
[[env.production.queues.consumers]]
queue = "entity-agents"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "entity-agents-dlq"

[[env.production.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-production"
database_id = "d44f8243-eff7-4039-ab37-3ed51094ef39"

# WeldAgent background runs — hosted in this worker, no script_name. New name
# (-v2): app-api's `weldagent-job` keeps draining.
[[env.production.workflows]]
name = "weldagent-job-v2"
binding = "WELDAGENT_JOB"
class_name = "WeldAgentJobWorkflow"

# Notification email defer window — class hosted in app-api.
[[env.production.workflows]]
name = "deferred-notification-email"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"
script_name = "weldsuite-app-api"

# Hourly WeldAgent routine sweep (moved from app-api).
[env.production.triggers]
crons = ["0 * * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
