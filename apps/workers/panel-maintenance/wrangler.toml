# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-panel-maintenance"
workers_dev = false

[env.production.vars]
ENVIRONMENT = "production"
PANEL_BASIN_BUCKET = "weldsuite-panel"

[env.production.triggers]
