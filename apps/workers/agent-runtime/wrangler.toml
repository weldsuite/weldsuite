# WeldAgent cloud computer — Cloudflare Sandbox (Linux) + Browser Run.
# Called only by agent-api and chat-api (WeldAgent computer/browser tools). One
# sandbox per workspace. Primary path: the `AgentRuntimeInternal` entrypoint
# (src/index.ts), bound as AGENT_RUNTIME in those workers: reachable only over a
# service binding, so no secret. Fallback: public URL + INTERNAL_API_SECRET bearer,
# until every env has the binding (docs/plans/app-api-module-split.md, item 7).
#
# Secrets (wrangler secret put):
# - INTERNAL_API_SECRET (fallback bearer; must match agent-api / chat-api)
#
# Local: Docker must be running for Sandbox. Browser binding uses remote = true.

name = "weldsuite-agent-runtime"
main = "src/index.ts"
compatibility_date = "2025-09-07"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
AGENT_COMPUTER_ENABLED = "true"

[[containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 50

[[durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[browser]
binding = "BROWSER"
remote = true

[[kv_namespaces]]
binding = "BROWSER_SESSIONS"
id = "94e80a27c70c48919b3429ce7d813c49"

[observability]
enabled = true
head_sampling_rate = 1

# ============ TEST ============
[env.test]
name = "weldsuite-agent-runtime-test"
routes = [{ pattern = "agent-runtime-test.weldsuite.org/*", zone_name = "weldsuite.org" }]
vars = { ENVIRONMENT = "test", AGENT_COMPUTER_ENABLED = "true" }

[[env.test.containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "lite"
max_instances = 100

[[env.test.durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[env.test.browser]
binding = "BROWSER"
remote = true

[[env.test.kv_namespaces]]
binding = "BROWSER_SESSIONS"
id = "c6f7f0099872485b8d3b21c334e907c2"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ============
[env.production]
name = "weldsuite-agent-runtime"
routes = [{ pattern = "agent-runtime.weldsuite.org/*", zone_name = "weldsuite.org" }]
vars = { ENVIRONMENT = "production", AGENT_COMPUTER_ENABLED = "true" }

[[env.production.containers]]
class_name = "Sandbox"
image = "./Dockerfile"
instance_type = "standard-1"
max_instances = 500

[[env.production.durable_objects.bindings]]
name = "Sandbox"
class_name = "Sandbox"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Sandbox"]

[env.production.browser]
binding = "BROWSER"

[[env.production.kv_namespaces]]
binding = "BROWSER_SESSIONS"
id = "38742dfafce84dd680e11c1d56c8245f"

[env.production.observability]
enabled = true
head_sampling_rate = 1
