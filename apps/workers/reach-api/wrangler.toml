# WeldSuite reach-api worker — WeldReach (cold email outreach on Mailpool).
#
# docs/plans/weldreach.md. Owns /api/reach/* (behind apiAuth + the
# weldreach app-access gate) and /public/reach/* (Mailpool webhook, HMAC):
#   reach-api.weldsuite.org        production
#   reach-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Besides HTTP it runs:
#   - a cron sweep every minute: due workspaces (D1 workspace_due_index, kind
#     reach_send) → one `reach-send` queue message per workspace → the queue
#     consumer sends over SMTP (cloudflare:sockets, ports 465/587);
#   - an hourly cron: warmup progress (kind reach_warmup), plus the Mailpool slot
#     reconciliation (master DB only) once a day at 03:15 UTC;
#   - an `email()` handler: Cloudflare Email Routing catch-all on
#     REACH_INBOUND_DOMAIN delivers the replies Mailpool mailboxes forward.
#
# Secrets (scripts/secrets/manifest.ts → "reach-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY, MAILPOOL_API_KEY, MAILPOOL_WEBHOOK_SECRET,
#   AI_GATEWAY_API_TOKEN, CLOUDFLARE_API_TOKEN
#
# Ops before first deploy (per env): create the queues reach-send-<env> and
# reach-send-dlq-<env>; enable Email Routing on REACH_INBOUND_DOMAIN with a
# catch-all rule → this worker; set the Mailpool webhook URL to
# https://reach-api[-test].weldsuite.org/public/reach/webhooks/mailpool.

name = "weldsuite-reach-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"react" = "../../../packages/core/worker-kit/shims/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
REACH_INBOUND_DOMAIN = "reply-test.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

[[queues.producers]]
binding = "REACH_SEND_QUEUE"
queue = "reach-send-dev"

[[queues.consumers]]
queue = "reach-send-dev"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "reach-send-dlq-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# Every minute: send sweep (reads only D1 on a quiet tick).
# Hourly at :15: warmup progress (+ Mailpool slot reconciliation at 03:15 UTC).
[triggers]
crons = ["* * * * *", "15 * * * *"]

