# External API - Cloudflare Workers Configuration
#
# Secrets (set via `wrangler secret put`, never hardcoded here):
# - NEON_API_KEY (resolves tenant DB URLs from master workspace rows during auth)
# - DATABASE_ENCRYPTION_KEY (optional; decrypts stored databaseUrl on master workspaces)
# - DATABASE_URL_MASTER (Neon URL of the master DB; read only by the outbound mail
#   guard for its sender-ownership check, auth uses the Hyperdrive binding. Unset
#   skips that one check. docs/plans/weldmail-outbound-abuse.md)
# - POSTPEER_API_KEY (WeldSocial: single WeldSuite-level PostPeer key, sent as
#   the `x-access-key` header. Required by POST /v1/social-posts/:id/publish and
#   /schedule, which publish through @weldsuite/social-publishing directly —
#   this worker does not depend on app-api. Same value as app-api's. Unset
#   leaves those two routes answering 503 and changes nothing else.)
# - POSTPEER_APP_IDS (WeldSocial BYOK: JSON object of platform → PostPeer app id.
#   Only read on the connect flow, which this worker does not expose; set for
#   parity if that changes.)
#   (POSTPEER_BASE_URL defaults to https://api.postpeer.dev/v1; override via [vars].)
#
# WeldReach (/v1/reach/*, docs/plans/weldreach-external-api.md) adds no secrets:
# it runs reach-api's domain code with this worker's DATABASE_ENCRYPTION_KEY (it
# opens the mailbox logins reach-api sealed with the same key). Its bindings:
# SCHEDULE_INDEX (reach-api's D1 schedule index: launch / resume / enrol wake the
# send sweep), FLAGSHIP (the `weldreach-sending` kill switch, same Flagship apps as
# reach-api), and the existing WORKSPACE_CACHE (reach-api's KV: the shared 60 s
# app-access cache), STORAGE (raw inbound replies) and HYPERDRIVE_MASTER.
name = "weldsuite-external-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Use custom esbuild aliases to avoid incompatible imports
# These shims prevent bundling of packages that use Node.js APIs
[alias]
"@clerk/nextjs/server" = "./src/lib/clerk-shim.ts"
"@clerk/nextjs" = "./src/lib/clerk-shim.ts"
"next/server" = "./src/lib/next-shim.ts"
"react" = "./src/lib/react-shim.ts"

# Durable Object lifecycle migrations.
# v1 created the RateLimiter SQLite DO; rate limiting has since moved to the
# native [[ratelimits]] bindings below, so the class is no longer exported.
# The live workers were deployed at v1, so a v2 delete-class migration is
# required — otherwise deploys fail with "does not export class 'RateLimiter'
# which is depended on by existing Durable Objects" [code: 10064].
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateLimiter"]

# Native rate limiting — one namespace per plan tier (req per 60s).
# Keyed per workspace in `rateLimitMiddleware`; keep limits in sync with
# RATE_LIMITS in src/middleware/rate-limit.ts. namespace_id is account-scoped;
# each env below uses a distinct range so counters don't bleed across envs.
[[ratelimits]]
name = "RL_FREE"
namespace_id = "10"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_BUSINESS"
namespace_id = "11"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "RL_SCALE"
namespace_id = "12"
  [ratelimits.simple]
  limit = 1000
  period = 60

[[ratelimits]]
name = "RL_ENTERPRISE"
namespace_id = "13"
  [ratelimits.simple]
  limit = 5000
  period = 60

# Outbound mail guard (docs/plans/weldmail-outbound-abuse.md). The send routes
# check every send against the workspace's OutboundLedger, a Durable Object
# hosted by mail-api and bound here by name. OUTBOUND_BACKSTOP is the per-sender
# burst limit the guard falls back on when the ledger can't be reached; its
# namespace is shared with the other sending workers on purpose.
[[durable_objects.bindings]]
name = "OUTBOUND_LEDGER"
class_name = "OutboundLedger"
script_name = "weldsuite-mail-api"

[[durable_objects.bindings]]
name = "OUTBOUND_PLATFORM"
class_name = "OutboundPlatformBudget"
script_name = "weldsuite-mail-api"

[[ratelimits]]
name = "OUTBOUND_BACKSTOP"
namespace_id = "1101"
  [ratelimits.simple]
  limit = 30
  period = 60

# Entity-event hub (Phase 2). Fed by publishEntityEvent; hub fans out to
# audit / analytics / search. Realtime stays a direct service binding.
[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

[[services]]
binding = "REALTIME"
service = "weldsuite-realtime"

# R2 bucket for user-app bundles (dev) — same buckets as app-api's STORAGE
# binding; bundles are written here at `user-apps/{appId}/{versionId}/...`.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# WeldMail sending (POST /v1/mail-accounts/:id/send, reply, forward, draft
# send). Same Cloudflare Email Sending binding as mail-api: the sending domain
# must be verified on the account once per environment. Locally there is no
# MTA, so `wrangler dev` fails any actual send; the routes answer 503 when the
# binding is missing.
[[send_email]]
name = "SEND_EMAIL"

# MX lookup cache for recipient validation — mail-api's WORKSPACE_CACHE
# namespace, so both workers share one cache.
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# WeldReach: reach-api's D1 schedule index (`workspace_due_index`, kind reach_send).
# The dev default points at the test database, like reach-api's.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[vars]
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"

# Master Postgres over Hyperdrive (local dev). Test/production override below.
[[hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "f1b2e092e6b64ade8ea7e7e17a1a0d39"
localConnectionString = "postgresql://postgres:__LOCAL_DEV_PASSWORD__@localhost:5432/weldsuite_master?sslmode=require"

