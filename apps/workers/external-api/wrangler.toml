# External API - Cloudflare Workers Configuration
#
# Secrets (set via `wrangler secret put`, never hardcoded here):
# - POSTPEER_API_KEY (WeldSocial: single WeldSuite-level PostPeer key, sent as
#   the `x-access-key` header. Required by POST /v1/social-posts/:id/publish and
#   /schedule, which publish through @weldsuite/social-publishing directly —
#   this worker does not depend on app-api. Same value as app-api's. Unset
#   leaves those two routes answering 503 and changes nothing else.)
# - POSTPEER_APP_IDS (WeldSocial BYOK: JSON object of platform → PostPeer app id.
#   Only read on the connect flow, which this worker does not expose; set for
#   parity if that changes.)
#   (POSTPEER_BASE_URL defaults to https://api.postpeer.dev/v1; override via [vars].)
name = "weldsuite-external-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Use custom esbuild aliases to avoid incompatible imports
# These shims prevent bundling of packages that use Node.js APIs
[alias]
"@clerk/nextjs/server" = "./src/lib/clerk-shim.ts"
"@clerk/nextjs" = "./src/lib/clerk-shim.ts"
"next/server" = "./src/lib/next-shim.ts"
"react" = "./src/lib/react-shim.ts"

# Durable Object lifecycle migrations.
# v1 created the RateLimiter SQLite DO; rate limiting has since moved to the
# native [[ratelimits]] bindings below, so the class is no longer exported.
# The live workers were deployed at v1, so a v2 delete-class migration is
# required — otherwise deploys fail with "does not export class 'RateLimiter'
# which is depended on by existing Durable Objects" [code: 10064].
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateLimiter"]

# Native rate limiting — one namespace per plan tier (req per 60s).
# Keyed per workspace in `rateLimitMiddleware`; keep limits in sync with
# RATE_LIMITS in src/middleware/rate-limit.ts. namespace_id is account-scoped;
# each env below uses a distinct range so counters don't bleed across envs.
[[ratelimits]]
name = "RL_FREE"
namespace_id = "10"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "RL_BUSINESS"
namespace_id = "11"
  [ratelimits.simple]
  limit = 300
  period = 60

[[ratelimits]]
name = "RL_SCALE"
namespace_id = "12"
  [ratelimits.simple]
  limit = 1000
  period = 60

[[ratelimits]]
name = "RL_ENTERPRISE"
namespace_id = "13"
  [ratelimits.simple]
  limit = 5000
  period = 60

# Entity-event sinks (dev). Fed by publishEntityEvent so public-API mutations
# reach the same audit / workflow / analytics / realtime systems as app-api.
[[queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events-dev"

[[queues.producers]]
binding = "WORKFLOW_EVENTS"
queue = "workflow-events-dev"

[[queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events-dev"

[[services]]
binding = "REALTIME"
service = "weldsuite-realtime"

# R2 bucket for user-app bundles (dev) — same buckets as app-api's STORAGE
# binding; bundles are written here at `user-apps/{appId}/{versionId}/...`.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# ============ TEST ENVIRONMENT ============
[env.test]
name = "weldsuite-external-api-test"
routes = [{ pattern = "api-test.weldsuite.org/*", zone_name = "weldsuite.org" }]
vars = { ENVIRONMENT = "test" }

[[env.test.kv_namespaces]]
binding = "API_CACHE"
id = "6ffe3c8ea4e041398d84f9f670e93f88"

[[env.test.queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events-test"

[[env.test.queues.producers]]
binding = "WORKFLOW_EVENTS"
queue = "workflow-events-test"

[[env.test.queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
name = "weldsuite-external-api"
routes = [{ pattern = "api.weldsuite.org/*", zone_name = "weldsuite.org" }]
vars = { ENVIRONMENT = "production" }

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[env.production.migrations]]
tag = "v2"
deleted_classes = ["RateLimiter"]

# Native rate limiting (production) — distinct namespace_id range.
[[env.production.ratelimits]]
name = "RL_FREE"
namespace_id = "3001"
  [env.production.ratelimits.simple]
  limit = 60
  period = 60

[[env.production.ratelimits]]
name = "RL_BUSINESS"
namespace_id = "3002"
  [env.production.ratelimits.simple]
  limit = 300
  period = 60

[[env.production.ratelimits]]
name = "RL_SCALE"
namespace_id = "3003"
  [env.production.ratelimits.simple]
  limit = 1000
  period = 60

[[env.production.ratelimits]]
name = "RL_ENTERPRISE"
namespace_id = "3004"
  [env.production.ratelimits.simple]
  limit = 5000
  period = 60

[[env.production.hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "2cdec4bef19746d1a2c2e9726ddaacc3"

# KV namespace for API key registry + workspace caching
# Create via: wrangler kv namespace create API_CACHE --env production
[[env.production.kv_namespaces]]
binding = "API_CACHE"
id = "f27cfb0a77a24936911ebd762adf3410"

# Entity-event sinks (production)
[[env.production.queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events"

[[env.production.queues.producers]]
binding = "WORKFLOW_EVENTS"
queue = "workflow-events"

[[env.production.queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

# R2 bucket for user-app bundles (production)
[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

[observability]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 1
