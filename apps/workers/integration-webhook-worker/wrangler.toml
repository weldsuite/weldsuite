# WeldSuite Integration Webhook Worker
# Handles inbound webhooks from external CRM/integration providers (Attio, HubSpot, etc.)
# POST /webhook/:connectionId endpoint — verifies signatures, fetches full records, upserts into tenant DB.

name = "weldsuite-integration-webhooks"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# Required secrets (add via wrangler secret put):
# - NEON_API_KEY: Neon API key for tenant database resolution
# - DATABASE_ENCRYPTION_KEY: Encryption key for stored database connection strings
# - BETTERSTACK_TOKEN: Better Stack source token (optional)
# WeldConnect integration triggers:
# - SLACK_SIGNING_SECRET: verifies inbound Slack webhooks (POST /integration-webhook/slack)
# - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET: refresh Google tokens during the Sheets poll
# WeldBooks bank feed webhooks (POST /webhooks/bank-feeds/:provider, scripts/secrets/manifest.ts):
# - PLAID_CLIENT_ID / PLAID_SECRET: fetch Plaid's webhook verification key (PLAID_ENV var below)
# - STRIPE_FC_WEBHOOK_SECRET: signing secret of the Stripe Financial Connections webhook endpoint

[vars]
ENVIRONMENT = "development"
PLAID_ENV = "sandbox"

# KV namespace for workspace URL + connection caching
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# connect-api's ConnectInternal entrypoint: connector-event ingest, Meta ad events,
# Google Calendar incremental-sync trigger + renew-watch (connect-api
# routes/integrations/internal.ts). A named entrypoint is reachable only through a
# service binding, so it needs no secret. `remote = true` lets plain `wrangler dev`
# reach the deployed test worker (mirrors WORKSPACE_WORKER in app-api).
# Deploy order: connect-api must have the entrypoint first (module workers do).
[[services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api-test"
entrypoint = "ConnectInternal"
remote = true

# books-api's BooksInternal entrypoint: verified bank feed events from
# POST /webhooks/bank-feeds/:provider go to /internal/bank-connections/events (the
# workspace is looked up in the master bank_feed_connection_index first). Named
# entrypoint = reachable only over the binding, so no secret. `remote = true` lets
# plain `wrangler dev` reach the deployed test worker.
[[services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api-test"
entrypoint = "BooksInternal"
remote = true

# app-api service binding: the public /webhooks/woocommerce/auth compat forward, and
# the FALLBACK to the internal integration routes (through app-api's forwarder,
# authenticated on X-Internal-Secret) while CONNECT_INTERNAL is unbound or the
# entrypoint is not deployed yet. This worker's INTERNAL_API_SECRET must match the
# target env's secret for that path; it can go once every env has the entrypoint
# binding (docs/plans/app-api-module-split.md, rollout item 7).
[[services]]
binding = "APP_API"
service = "weldsuite-app-api"

# Realtime fan-out (Durable Objects) — entity-event realtime sink
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime"

# Entity-event hub producer (mutations from inbound CRM sync → hub)
[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Phase 3: outbound customer webhooks (hub SUB_WEBHOOKS → this worker)
#   wrangler queues create entity-webhooks-dev
#   wrangler queues create entity-webhooks-dlq-dev
[[queues.consumers]]
queue = "entity-webhooks-dev"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "entity-webhooks-dlq-dev"

# CRM sync engine — Cloudflare Workflow owned by this worker.
# Distinct name from api-worker's "crm-sync-dev" during the transition.
[[workflows]]
name = "crm-sync-int-dev"
binding = "CRM_SYNC"
class_name = "CrmSyncWorkflow"

[[workflows]]
name = "github-project-sync-int-dev"
binding = "GITHUB_PROJECT_SYNC"
class_name = "GithubProjectSyncWorkflow"

[[workflows]]
name = "github-project-outbound-int-dev"
binding = "GITHUB_PROJECT_OUTBOUND"
class_name = "GithubProjectOutboundSyncWorkflow"

# Cron: */10 polls Sheets/Gmail/Calendar/Airtable + outbound webhook retries
# via D1 tenant_work_index (due workspaces only). Idle tenants are dropped from
# the index after a no-op tick so Neon can autosuspend; write paths re-upsert
# when a poll trigger is activated or a delivery fails.
# CRM auto-sync lives on integration-sync-worker. Inbound webhooks unaffected.
[triggers]
crons = ["*/10 * * * *"]

# Shared D1 with app-api + integration-sync-worker (connector catch-up, CRM due,
# tenant work queue).
[[d1_databases]]
binding = "CONNECTOR_SYNC_INDEX"
database_name = "weldsuite-connector-sync-index-test"
database_id = "5d4f220f-a1cc-4ec0-9e4c-dbaca5647370"

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-integration-webhooks-test"
routes = [
  { pattern = "integration-webhooks-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
PLAID_ENV = "sandbox"

[[env.test.services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api-test"
entrypoint = "ConnectInternal"

[[env.test.services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api-test"
entrypoint = "BooksInternal"

[[env.test.services]]
binding = "APP_API"
service = "weldsuite-app-api-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.queues.consumers]]
queue = "entity-webhooks-test"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "entity-webhooks-dlq-test"

# Workflow names are unique per Cloudflare account: test gets its own (-test).
[[env.test.workflows]]
name = "crm-sync-int-test"
binding = "CRM_SYNC"
class_name = "CrmSyncWorkflow"

[[env.test.workflows]]
name = "github-project-sync-int-test"
binding = "GITHUB_PROJECT_SYNC"
class_name = "GithubProjectSyncWorkflow"

[[env.test.workflows]]
name = "github-project-outbound-int-test"
binding = "GITHUB_PROJECT_OUTBOUND"
class_name = "GithubProjectOutboundSyncWorkflow"

[[env.test.workflows]]
name = "execute-workflow-test"
binding = "EXECUTE_WORKFLOW"
class_name = "ExecuteWorkflowWorkflow"
script_name = "weldsuite-workflow-test"

[env.test.triggers]
crons = ["*/10 * * * *"]

[[env.test.d1_databases]]
binding = "CONNECTOR_SYNC_INDEX"
database_name = "weldsuite-connector-sync-index-test"
database_id = "5d4f220f-a1cc-4ec0-9e4c-dbaca5647370"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-integration-webhooks"
routes = [
  { pattern = "integration-webhooks.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
PLAID_ENV = "production"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "2cdec4bef19746d1a2c2e9726ddaacc3"

# connect-api's [env.production] name is "weldsuite-connect-api" (no "-production" suffix).
[[env.production.services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api"
entrypoint = "ConnectInternal"

# books-api's [env.production] name is "weldsuite-books-api" (no "-production" suffix).
[[env.production.services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api"
entrypoint = "BooksInternal"

# app-api's [env.production] name is "weldsuite-app-api" (no "-production" suffix).
[[env.production.services]]
binding = "APP_API"
service = "weldsuite-app-api"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.queues.consumers]]
queue = "entity-webhooks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
max_concurrency = 4
dead_letter_queue = "entity-webhooks-dlq"

[[env.production.workflows]]
name = "crm-sync-int"
binding = "CRM_SYNC"
class_name = "CrmSyncWorkflow"

[[env.production.workflows]]
name = "github-project-sync-int"
binding = "GITHUB_PROJECT_SYNC"
class_name = "GithubProjectSyncWorkflow"

[[env.production.workflows]]
name = "github-project-outbound-int"
binding = "GITHUB_PROJECT_OUTBOUND"
class_name = "GithubProjectOutboundSyncWorkflow"

[[env.production.workflows]]
name = "execute-workflow"
binding = "EXECUTE_WORKFLOW"
class_name = "ExecuteWorkflowWorkflow"
script_name = "weldsuite-workflow"

[env.production.triggers]
crons = ["*/10 * * * *"]

[[env.production.d1_databases]]
binding = "CONNECTOR_SYNC_INDEX"
database_name = "weldsuite-connector-sync-index-production"
database_id = "bcf01cc5-c2a0-4a29-9881-ecb380e94832"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[env.production.observability]
enabled = true
head_sampling_rate = 1
