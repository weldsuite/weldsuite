# WeldSuite Workspace Worker
# Handles workspace lifecycle: onboarding, Clerk webhooks, database provisioning

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "weldsuite-workspace-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ============ LOCAL DEVELOPMENT ============
# Required secrets (add via wrangler secret put):
# - DATABASE_URL_MASTER: Neon serverless connection string for the master DB (replaces Hyperdrive)
# - CLERK_SECRET_KEY: Clerk secret key (sk_...)
# - CLERK_WEBHOOK_SECRET: Clerk webhook signing secret
# - NEON_API_KEY: Neon database API key
# - CLERK_MACHINE_SECRET_KEY: Clerk M2M machine secret key (ak_...)
# - DATABASE_ENCRYPTION_KEY: 64-char hex key for AES-256-GCM encryption
# - STRIPE_SECRET_KEY: Stripe secret key (optional)
# - BETTERSTACK_TOKEN: Better Stack source token (from Better Stack > Sources)
# - RESEND_API_KEY: migration-window fallback for the workspace invitation email

[vars]
ENVIRONMENT = "development"
# Shared WeldMail workspace domains: {slug}.WELDMAIL_DOMAIN. Each environment
# has its own apex zone, because a zone has ONE Email Routing catch-all and it
# must point at this environment's inbound worker
# (docs/plans/weldmail-test-mail-zone.md).
WELDMAIL_DOMAIN = "weldmail.org"
MAIL_INBOUND_WORKER_NAME = "weldsuite-mail-inbound-test"
NEON_DEFAULT_REGION = "aws-eu-central-1"
APP_URL = "http://localhost:3000"
# Warm database pool watermarks (instant provisioning). Shared slots = free
# workspaces (database inside a shared Neon project shard); dedicated = paid
# (whole pre-created Neon project — costs a project each, keep low).
POOL_TARGET_SHARED = "2"
POOL_TARGET_DEDICATED = "0"
# Days the OLD database of a finished database move stays (read-only) before
# the retention sweep drops it.
DATABASE_MOVE_RETENTION_DAYS = "7"
# Local-dev master DB connection (Neon serverless HTTP driver). In test/preview/
# production this is provided as the DATABASE_URL_MASTER secret instead.
# Set your real local master DB URL in `.dev.vars` (gitignored) — do NOT hardcode here.
DATABASE_URL_MASTER = "postgresql://postgres:__LOCAL_DEV_PASSWORD__@localhost:5432/weldsuite_master?sslmode=require"
# Cloudflare Email Service. Under `wrangler dev` the SEND_EMAIL binding is
# simulated and writes mail to disk instead of sending it.
EMAIL_TRANSPORT = "cloudflare"

# Cloudflare Email Sending binding — the workspace invitation email
# (@weldsuite/emails workerTransport).
[[send_email]]
name = "SEND_EMAIL"

[[workflows]]
name = "provision-workspace-dev"
binding = "PROVISION_WORKSPACE"
class_name = "ProvisionWorkspaceWorkflow"

[[workflows]]
name = "refill-pool-dev"
binding = "REFILL_POOL"
class_name = "RefillPoolWorkflow"

# Moves a workspace tenant database between a shard and a dedicated project.
[[workflows]]
name = "move-database-dev"
binding = "MOVE_DATABASE"
class_name = "MoveDatabaseWorkflow"

# Keep the warm database pool topped up (test locally with
# `wrangler dev --test-scheduled` + GET /__scheduled). The daily entry runs
# the scheduled-deletion sweep (services/deletion-sweep.ts) instead, and the
# hourly one repairs unrouted WeldMail domains (services/mail-repair-sweep.ts) —
# branched on event.cron in the `scheduled` handler (src/index.ts).
[triggers]
crons = ["*/5 * * * *", "0 3 * * *", "17 * * * *"]

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# Mailbox store (docs/plans/weldmail-mailbox-store-design.md, task D8): both
# Durable Objects are owned and hosted by mail-api, reached here only by
# `script_name` to destroy a deleted workspace's mail held outside Postgres
# (services/workspace-mail-destroy.ts). No `[[migrations]]` block here — that
# belongs to the owning worker (mail-api's wrangler.toml).
[[durable_objects.bindings]]
name = "MAILBOX_STORE"
class_name = "MailboxStoreObject"
script_name = "weldsuite-mail-api-dev"

[[durable_objects.bindings]]
name = "MAIL_INDEX"
class_name = "MailIndex"
script_name = "weldsuite-mail-api-dev"

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-workspace-test"
routes = [
  { pattern = "workspace-worker-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
# Shared WeldMail workspace domains: {slug}.WELDMAIL_DOMAIN. Each environment
# has its own apex zone, because a zone has ONE Email Routing catch-all and it
# must point at this environment's inbound worker
# (docs/plans/weldmail-test-mail-zone.md).
WELDMAIL_DOMAIN = "weldmail.org"
MAIL_INBOUND_WORKER_NAME = "weldsuite-mail-inbound-test"
NEON_DEFAULT_REGION = "aws-eu-central-1"
APP_URL = "https://app-test.weldsuite.org"
POOL_TARGET_SHARED = "2"
POOL_TARGET_DEDICATED = "0"
DATABASE_MOVE_RETENTION_DAYS = "7"
# On Cloudflare Email Service (mail.weldsuite.org). Set back to "resend" to
# fall back without a code change (docs/plans/system-email-cloudflare.md).
EMAIL_TRANSPORT = "cloudflare"

[[env.test.send_email]]
name = "SEND_EMAIL"
# Only system mail goes through this binding, always from this address.
allowed_sender_addresses = ["notifications@mail.weldsuite.org"]

[[env.test.workflows]]
name = "provision-workspace-test"
binding = "PROVISION_WORKSPACE"
class_name = "ProvisionWorkspaceWorkflow"

[[env.test.workflows]]
name = "refill-pool-test"
binding = "REFILL_POOL"
class_name = "RefillPoolWorkflow"

[[env.test.workflows]]
name = "move-database-test"
binding = "MOVE_DATABASE"
class_name = "MoveDatabaseWorkflow"

[env.test.triggers]
crons = ["*/5 * * * *", "0 3 * * *", "17 * * * *"]

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

# external-api / mcp-server cache (the namespace app-api binds as API_CACHE too):
# a database move purges `ws:<workspaceId>` and `mcp:org:<clerkOrgId>` here.
[[env.test.kv_namespaces]]
binding = "API_CACHE"
id = "6ffe3c8ea4e041398d84f9f670e93f88"

# Mailbox store (see the top-level block above for the full comment).
[[env.test.durable_objects.bindings]]
name = "MAILBOX_STORE"
class_name = "MailboxStoreObject"
script_name = "weldsuite-mail-api-test"

[[env.test.durable_objects.bindings]]
name = "MAIL_INDEX"
class_name = "MailIndex"
script_name = "weldsuite-mail-api-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

