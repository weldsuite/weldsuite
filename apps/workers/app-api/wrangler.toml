# WeldSuite App API Worker
#
# Unified first-party API for the platform SPA and all WeldSuite mobile apps.
# Successor to core-api, api-worker, and mobile-api-worker. Routes are
# organised by object (customers, contacts, tickets, ...) to mirror the
# object-based permission model.
#
# Hostname pair:
#   app-api.weldsuite.org   — this worker (first-party clients)
#   api.weldsuite.org       — external-api worker (third-party integrations)

name = "weldsuite-app-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports @clerk/nextjs (Next.js auth +
# admin helpers). Those packages use Node `__dirname` and crash the Workers
# runtime. Alias them out the same way mcp-server and external-api do.
[alias]
"@clerk/nextjs/server" = "./src/lib/clerk-shim.ts"
"@clerk/nextjs" = "./src/lib/clerk-shim.ts"
"next/server" = "./src/lib/next-shim.ts"
"next/navigation" = "./src/lib/next-shim.ts"
"react" = "./src/lib/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============
# Required secrets (add via wrangler secret put):
# - CLERK_SECRET_KEY
# - CLERK_JWT_KEY
# - CLERK_MACHINE_SECRET_KEY (ak_…) — mints M2M tokens to call workspace-worker
#   /api/onboard for the "create additional workspace" flow (test/preview/prod)
# - NEON_API_KEY
# - DATABASE_ENCRYPTION_KEY (optional)
# - WELDPASS_ROOT_KEY (required for WeldPass) — 64 hex chars. Wraps every
#   WeldPass vault key; vault contents are unreadable without it and it is
#   never stored in the database. Distinct from DATABASE_ENCRYPTION_KEY,
#   which only protects stored tenant DB URLs. Generate with:
#     node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
# - WELDPASS_ROOT_KEY_V2 (only during a WeldPass root-key rotation)
# - CLOUDFLARE_API_TOKEN (the @weldsuite/ai token fallback; WeldMail's Email
#   Routing moved to mail-api, the help center custom domains to desk-api)
# - CLOUDFLARE_ACCOUNT_ID (optional alias of the CF_ACCOUNT_ID [vars] value)
#   (WeldHost /api/domains and its Realtime Register secrets moved to host-api.)
#   (WeldData's LEMLIST_API_KEY / FINDYMAIL_API_KEY / PROSPEO_API_KEY moved to data-api.)
# - TEST_FIXTURES_TOKEN (test + preview envs ONLY; gates /test-fixtures/*.
#   Never set this in the production env — the worker's middleware also
#   blocks the route when ENVIRONMENT === 'production' as a second layer.)
# - TEST_WORKSPACE_ID (test + preview envs ONLY; Clerk org id of the shared
#   E2E workspace. /test-fixtures/teardown-workspace refuses to destroy this
#   org. Set via `wrangler secret put TEST_WORKSPACE_ID --env test|preview`.
#   Never set in production.)
# - (R2_SQL_API_TOKEN / R2_ANALYTICS_BUCKET — project and CRM analytics — moved
#   to flow-api and crm-api.)
# - (CF_REALTIME_APP_ID + CF_REALTIME_APP_SECRET — WeldChat voice/video calls —
#   moved to chat-api with WeldChat.)
# - POSTPEER_* (WeldSocial) moved to social-api.
#
# Legacy api-worker phase-out (W3/W4) — secrets to provision per env, values
# copied from api-worker (wrangler secret put / Doppler sync-secrets):
# - INTERNAL_API_SECRET (internal service-to-service auth: the PUBLIC /api/internal
#   bearer from workflow-worker's send_email action. workflow-worker now calls the
#   `AppApiInternal` entrypoint (src/index.ts, bound as APP_API_INTERNAL; reachable
#   only over a service binding, so no secret) and keeps the bearer as a fallback
#   until every env has the binding. Values MUST match across those workers while
#   the fallback exists. The internal /api/integrations router and
#   /api/internal/workflow-actions moved to connect-api, which needs the SAME
#   value for its public mounts.
#   NOTE: app-api has no preview custom domain, so workflow-worker PREVIEW
#   targets app-api TEST — workflow-worker's preview secret must equal
#   app-api's TEST secret.)
# - (TELNYX_* — telephony, porting, the desk phone channel and the Telnyx
#   webhook — moved to call-api with the call module.)
# - (DISCORD_CLIENT_ID + DISCORD_CLIENT_SECRET + DISCORD_BOT_TOKEN — the WeldDesk
#   helpdesk Discord channel — moved to desk-api with WeldDesk.)
# - (ATTIO_*, HUBSPOT_*, MONEYBIRD_*, GOOGLE_CALENDAR_* — the integration and
#   connector OAuth apps — and the GITHUB_APP_* secrets moved to connect-api
#   with WeldConnect.)
# - RESEND_API_KEY (notifications + internal email. The task digest moved to
#   flow-api and the calendar attendee mails to calendar-api, together with
#   their RESEND_MEETING_*_TEMPLATE_ID vars.)
# - STRIPE_SECRET_KEY (required by /api/billing — must be the SAME Stripe
#   account billing-worker's webhooks use, since /api/billing/seats relies on
#   the invoice.paid webhook)
# - (SLACK_CLIENT_* / GOOGLE_CLIENT_* — the WeldConnect workflow-integrations
#   OAuth apps — moved to connect-api. CAUTION: the helpdesk Slack OAuth
#   callback ( /api/integrations/helpdesk/slack/callback, in desk-api ) reuses
#   the same SLACK_CLIENT_* fields, so desk-api needs the same values. If the
#   WeldDesk helpdesk Slack app is a DIFFERENT OAuth app, introduce
#   HELPDESK_SLACK_CLIENT_ID/_SECRET + a 2-line route change (W6).)
# - AI (@weldsuite/ai) — the Cloudflare AI Gateway. Model ids and pricing are
#   canonical. Set:
#   - AI_GATEWAY_API_TOKEN — CF API token with Workers AI + AI Gateway Run scopes,
#     sent as Authorization. Covers Workers AI (@cf/… — free allocation) and
#     third-party models (unified billing). `wrangler secret put AI_GATEWAY_API_TOKEN`.
#     CF_ACCOUNT_ID is already a [vars] value. Optionally CF_AI_GATEWAY (named
#     gateway id — omit for the account default) + CF_AIG_TOKEN (authenticated
#     gateways only).
#   AI_DEFAULT_MODEL ([vars], optional) overrides the default model.

[vars]
ENVIRONMENT = "development"
# Modules that moved to their own worker; app-api forwards their paths over
# the matching <MODULE>_API service binding (@weldsuite/worker-kit/forward).
API_FORWARD_MODULES = "pass,know,host,social,ads,hr,stash,commerce,crm,data,books,calendar,meet,call,desk,mail,flow,chat,agent,connect"
NEON_DEFAULT_REGION = "aws-eu-central-1"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"
# (HELPDESK_WORKFLOW_WORKER_URL moved to desk-api with /api/helpdesk-workflows.)
# (AGENT_RUNTIME_URL / AGENT_COMPUTER_ENABLED moved to agent-api with WeldAgent.)
# Comma-separated workspace ids that publish first-party hosted WeldApps
# (Official store badge, skip public review). Leave empty until ops fills it.
WELDSUITE_APP_PUBLISHER_WORKSPACE_IDS = ""
# (WeldBooks' DIGIPOORT_MODE and the commented-out DIGIPOORT_CERT mTLS binding
# moved to books-api.)

# Cloudflare Flagship (feature flags). Flag config lives on Cloudflare's
# network — there is no local simulation — so for local `wrangler dev` this has
# to be a REMOTE BINDING (`remote = true`): the Worker still runs locally but
# the binding is proxied to the DEPLOYED Flagship app.
#
# DISABLED BY DEFAULT for local `wrangler dev`. A remote Flagship binding
# without `wrangler login` (or with a missing app) fails startup with:
#   A request to the Cloudflare API (…/edge-preview) failed.
#   Flagship app '<id>' not found. [code: 10364]
# With the block commented out the FLAGSHIP binding is simply absent, and
# `@weldsuite/feature-flags/server` resolves every flag to its catalog default
# (see getFlags() — `if (!flagship) return fallback`). That is the intended
# offline behaviour: the platform UI stays in its safe default state.
#
# To evaluate real flags locally: `wrangler login`, uncomment the three lines
# below, and put your Flagship app id from the Cloudflare dashboard in app_id.
# See https://developers.cloudflare.com/workers/development-testing/#remote-bindings
# [[flagship]]
# binding = "FLAGSHIP"
# app_id = "<your Flagship app id>"
# remote = true

# KV namespace for workspace URL caching (shared with core-api + api-worker)
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# D1 schedule index — shared with workflow-worker and connect-api. app-api keeps
# the WeldAgent routine index here (lib/weldagent-routine-index.ts) so the
# hourly routine sweep can poll D1 instead of fanning out to every tenant DB.
# Dev uses the test database.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

# (The D1 connector catch-up index, CONNECTOR_SYNC_INDEX, moved to connect-api
# with the connectors.)

# R2 bucket for avatars / customer logos (shared with api-worker).
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# Cloudflare Queues: ENTITY_EVENTS hub (Phase 2). Hub fans out to audit/analytics/search.
[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Semantic search indexing. Unlike the three queues above, app-api is BOTH the
# producer and the consumer — the indexer needs a tenant DB handle plus the AI
# gateway, which this worker already has. Create the queue before deploying:
#   wrangler queues create search-index-dev

# max_batch_size is deliberately modest: each message can cost an embedding
# call, and the consumer coalesces per record, so a large batch mostly buys
# a longer worst-case invocation rather than more throughput.
#
# dead_letter_queue matters here: without one, Cloudflare DELETES a message once
# max_retries is exhausted. A record that persistently fails to embed would fall
# out of the index silently, with only a console log to notice it.
#   wrangler queues create search-index-dlq-dev
[[queues.consumers]]
queue = "search-index-dev"
max_batch_size = 25
max_batch_timeout = 10
max_retries = 3
max_concurrency = 2
dead_letter_queue = "search-index-dlq-dev"

# (The entity-agents-dev consumer — WeldAgent eventSubscriptions, hub
# SUB_WELDAGENT — moved to agent-api with WeldAgent.)

# Service binding to realtime-worker (Durable Objects event system) — used by
# publishEntityEvent for live WorkspaceHub fan-out AND WeldChat fan-out to the
# ChatRoom DO (chat membership events from invitations/roles; chat messages are
# published by chat-api now).
#
# Must target the SAME realtime deployment the browser's WebSocket connects to
# (platform .env: VITE_REALTIME_URL = wss://realtime-test.weldsuite.org). The
# dev block previously bound the *production* worker (weldsuite-realtime), so a
# locally-run app-api published chat messages into the production ChatRoom DO
# where no local browser is connected — typing (client↔DO over WS) worked, but
# sent messages never reached the other person live. Like FLAGSHIP above, this
# uses a REMOTE binding so the locally-running Worker proxies to the deployed
# test realtime worker (plain `wrangler dev` mocks service bindings locally,
# where no ChatRoom DO exists).
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# RPC binding to workspace-worker's WorkspaceOnboardEntrypoint — server-side
# org+workspace+DB provisioning for /api/onboarding/create-workspace. Binding-only
# (no public exposure) so no Clerk M2M token is needed. `remote = true` lets plain
# `wrangler dev` reach the deployed test worker (mirrors the REALTIME binding).
[[services]]
binding = "WORKSPACE_WORKER"
service = "weldsuite-workspace-test"
entrypoint = "WorkspaceOnboardEntrypoint"
remote = true

# external-api — the WeldApps data gateway (/api/user-apps/code/:code/gateway)
# forwards app requests here with a server-held wsat_ session token. A Worker
# cannot fetch a same-zone route directly, hence the binding.
[[services]]
binding = "EXTERNAL_API"
service = "weldsuite-external-api-test"
remote = true

# pass-api (WeldPass). Local: the pass-api worker in the same `pnpm dev:api`
# session (plain `wrangler dev` here cannot reach it, so /api/weldpass fails).
[[services]]
binding = "PASS_API"
service = "weldsuite-pass-api"

[[services]]
binding = "AGENT_API"
service = "weldsuite-agent-api"

[[services]]
binding = "CHAT_API"
service = "weldsuite-chat-api"

