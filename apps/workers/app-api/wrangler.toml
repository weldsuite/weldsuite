[[env.production.services]]
binding = "COMMERCE_API"
service = "weldsuite-commerce-api"

[[env.production.services]]
binding = "STASH_API"
service = "weldsuite-stash-api"

[[env.production.services]]
binding = "HR_API"
service = "weldsuite-hr-api"

[[env.production.services]]
binding = "ADS_API"
service = "weldsuite-ads-api"

[[env.production.services]]
binding = "SOCIAL_API"
service = "weldsuite-social-api"

[[env.production.services]]
binding = "HOST_API"
service = "weldsuite-host-api"

[[env.production.services]]
binding = "KNOW_API"
service = "weldsuite-know-api"

[[env.production.send_email]]
name = "SEND_EMAIL"

# (EXECUTE_WORKFLOW, CRM_SYNC and GITHUB_PROJECT_SYNC moved to connect-api with
# WeldConnect.)

# Trash purge — hosted in this worker (app-api), no script_name.
[[env.production.workflows]]
name = "trash-cleanup-v2"
binding = "TRASH_CLEANUP"
class_name = "TrashCleanupWorkflow"

# Notification email defer window — hosted in this worker. Holds mail back
# until the recipient has been away for the defer window, so an online user
# never gets emailed about something already on their screen.
[[env.production.workflows]]
name = "deferred-notification-email"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"

# (No cron triggers left: the hourly WeldAgent routine sweep moved to
# agent-api, the digest to flow-api, the 04:00 calendar replan to calendar-api.)

# (GITHUB_PROJECT_OUTBOUND moved to flow-api with the WeldFlow task routes.)

[env.production.observability]
enabled = true
head_sampling_rate = 1
