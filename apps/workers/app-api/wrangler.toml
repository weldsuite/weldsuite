service = "weldsuite-host-api"

[[services]]
binding = "KNOW_API"
service = "weldsuite-know-api"

# Cloudflare Email Sending binding for WeldMail outbound delivery. The
# `destination_address` is the envelope MAIL FROM the binding will accept;
# Cloudflare requires this address to be verified in the dashboard once per
# environment. Locally there's no MTA, so `wrangler dev` will fail any
# actual send — that's expected; the route handlers gate on env.SEND_EMAIL
# and surface a 503 with `code: 'EMAIL_BINDING_UNAVAILABLE'` when missing.
[[send_email]]
name = "SEND_EMAIL"

# Workflows hosted by this worker (src/workflows/, exported from src/index.ts).
# Self-hosted (no script_name), so they also work under plain `wrangler dev`.
# Names are unique per Cloudflare account: -dev here, -test / plain per env.

[[workflows]]
name = "trash-cleanup-v2-dev"
binding = "TRASH_CLEANUP"
class_name = "TrashCleanupWorkflow"

[[workflows]]
name = "deferred-notification-email-dev"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"

# No cron triggers: the hourly WeldAgent routine sweep moved to agent-api, the
# hourly task digest sweep to flow-api, the daily 04:00 calendar replan to
# calendar-api and the WeldHost domain auto-renew on the same schedule to
# host-api.

