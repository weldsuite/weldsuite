# Integration Sync Scheduler Worker
#
# Every 15 minutes: D1 connector catch-up + D1 CRM due-index + master WeldBooks
# bank feed due rows + master WeldAds due rows. Quiet ticks never open tenant
# Neon for due-ness checks.
# Manual sync via app-api is unaffected.

name = "integration-sync-scheduler"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "development"

[[hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "f1b2e092e6b64ade8ea7e7e17a1a0d39"
localConnectionString = "postgresql://postgres:__LOCAL_DEV_PASSWORD__@localhost:5432/weldsuite_master?sslmode=require"

# connect-api's ConnectInternal entrypoint. Calls the internal integration routes
# (/api/integrations/connections/:id/sync, /renew-watch, /catch-up,
# /ad-connections/:id/sync) over the binding: a named entrypoint is reachable only
# through a service binding, so it needs no secret. `remote = true` lets plain
# `wrangler dev` reach the deployed test worker (mirrors WORKSPACE_WORKER in app-api).
# Deploy order: connect-api must have the entrypoint first (module workers do).
[[services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api-test"
entrypoint = "ConnectInternal"
remote = true

# books-api's BooksInternal entrypoint: the bank feed due sweep (master
# bank_feed_connection_index) calls /internal/bank-connections/:id/sync over it. Named
# entrypoint = reachable only over the binding, so no secret. Deploy order: books-api
# must have the entrypoint first.
[[services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api-test"
entrypoint = "BooksInternal"
remote = true

# app-api service binding — FALLBACK to the same routes through app-api's forwarder,
# authenticated on X-Internal-Secret, used while CONNECT_INTERNAL is unbound or the
# entrypoint is not deployed yet. This worker's INTERNAL_API_SECRET must match the
# target env's secret for that path. Remove with the secret once every env has the
# entrypoint binding (docs/plans/app-api-module-split.md, rollout item 7).
[[services]]
binding = "APP_API"
service = "weldsuite-app-api"

# D1 connector catch-up index — shared with app-api + integration-webhook-worker.
# The sweep probes store APIs from rows here and only calls app-api when the
# remote has new data. DATABASE_ENCRYPTION_KEY / DATABASE_ENCRYPTION_KEY_V2 must
# match app-api (wrangler secret put) so probes can decrypt the D1 credential copy.
# Schema migrations live in ./migrations/d1 and are applied by deploy.yml via
# `wrangler d1 migrations apply`.
[[d1_databases]]
binding = "CONNECTOR_SYNC_INDEX"
database_name = "weldsuite-connector-sync-index-test"
database_id = "5d4f220f-a1cc-4ec0-9e4c-dbaca5647370"
migrations_dir = "migrations/d1"

# ============ TEST ENVIRONMENT ============
[env.test]
name = "integration-sync-scheduler-test"

[env.test.vars]
ENVIRONMENT = "test"

[[env.test.services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api-test"
entrypoint = "ConnectInternal"

[[env.test.services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api-test"
entrypoint = "BooksInternal"

[[env.test.services]]
binding = "APP_API"
service = "weldsuite-app-api-test"

[[env.test.d1_databases]]
binding = "CONNECTOR_SYNC_INDEX"
database_name = "weldsuite-connector-sync-index-test"
database_id = "5d4f220f-a1cc-4ec0-9e4c-dbaca5647370"
migrations_dir = "migrations/d1"

[env.test.triggers]
# Hourly on test to keep master Neon quieter; production stays at */15.
crons = ["0 * * * *"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
name = "integration-sync-scheduler-production"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "2cdec4bef19746d1a2c2e9726ddaacc3"

# connect-api's [env.production] name is "weldsuite-connect-api" (no "-production" suffix).
[[env.production.services]]
binding = "CONNECT_INTERNAL"
service = "weldsuite-connect-api"
entrypoint = "ConnectInternal"

# books-api's [env.production] name is "weldsuite-books-api" (no "-production" suffix).
[[env.production.services]]
binding = "BOOKS_INTERNAL"
service = "weldsuite-books-api"
entrypoint = "BooksInternal"

# app-api's [env.production] name is "weldsuite-app-api" (no "-production" suffix).
[[env.production.services]]
binding = "APP_API"
service = "weldsuite-app-api"

[[env.production.d1_databases]]
binding = "CONNECTOR_SYNC_INDEX"
database_name = "weldsuite-connector-sync-index-production"
database_id = "bcf01cc5-c2a0-4a29-9881-ecb380e94832"
migrations_dir = "migrations/d1"

[env.production.triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[env.production.observability]
enabled = true
head_sampling_rate = 1
