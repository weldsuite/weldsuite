# WeldSuite call-api worker — the call module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   call-api.weldsuite.org        production
#   call-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "call-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY,
#   INTERNAL_API_SECRET (verifier side of /api/internal/telephony, billing-worker's
#     phone-number fulfilment bearer; the SAME value as app-api and billing-worker)
#
# Secrets (not in the manifest yet; same values as app-api):
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation)
#   TELNYX_API_KEY + TELNYX_CONNECTION_ID + TELNYX_SIP_CONNECTION_ID
#     (telephony: /api/telephony, /api/porting, /api/desk/phone,
#     /public/webhooks/telnyx; TELNYX_API_KEY also signs the desk-phone
#     lookup_crm tool tokens)
#   TELNYX_PUBLIC_KEY (optional, recommended: base64 Ed25519 account public key;
#     when set the Telnyx webhook receiver enforces signatures)
#   TELNYX_WEBHOOK_SECRET (optional, legacy parity only — declared-but-unused)
#   APP_API_PUBLIC_URL (optional, only if app-api has it: override of the
#     app-api host in the Telnyx assistant's lookup_crm tool URL)

name = "weldsuite-call-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"react" = "../../../packages/core/worker-kit/shims/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# R2 bucket for files and documents (number-porting documents, r2-port-docs.ts).
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-call-api-test"
routes = [
  { pattern = "call-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-call-api"
routes = [
  { pattern = "call-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

[env.production.observability]
enabled = true
head_sampling_rate = 1
