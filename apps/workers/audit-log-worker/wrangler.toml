# WeldSuite Audit Log Worker — RETIRED, pending removal.
#
# Audit logging is now the `audit` consumer in entity-events-worker, which is
# idempotent on audit_logs.event_id and batches its inserts. Nothing produces to
# `audit-events` anymore, so this worker sits idle.
#
# It is kept deployable only because the deploy matrix lives in the private
# overlay repo and removing a worker from this side alone would break it. Delete
# the directory (and the Cloudflare worker + the audit-events queues) once the
# overlay's worker list drops it.

name = "weldsuite-audit-log"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============
# Required secrets (add via wrangler secret put):
# - DATABASE_URL_MASTER: Neon master database connection string
# - NEON_API_KEY: Neon database API key
# - DATABASE_ENCRYPTION_KEY: 64-char hex key for AES-256-GCM encryption (optional)

[vars]
ENVIRONMENT = "development"

# KV namespace for workspace URL caching (shared with api-worker)
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "REPLACE_WITH_KV_OR_HYPERDRIVE_ID"

# Queue: this worker consumes audit events.
#
# dead_letter_queue is not optional: without one, Cloudflare DELETES a message
# once max_retries is exhausted. A mutation that persistently fails to write
# would vanish from the audit trail with only a console log to notice it.
#   wrangler queues create audit-events-dlq-dev
[[queues.consumers]]
queue = "audit-events-dev"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "audit-events-dlq-dev"

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-audit-log"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "REPLACE_WITH_KV_OR_HYPERDRIVE_ID"

#   wrangler queues create audit-events-dlq
[[env.production.queues.consumers]]
queue = "audit-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "audit-events-dlq"

[env.production.observability]
enabled = true
head_sampling_rate = 1
