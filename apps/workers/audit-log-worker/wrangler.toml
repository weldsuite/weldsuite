# WeldSuite Audit Log Worker
# Dedicated queue consumer for AUDIT_EVENTS — writes audit logs to tenant databases.

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "weldsuite-audit-log-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============
# Required secrets (add via wrangler secret put):
# - DATABASE_URL_MASTER: Neon master database connection string
# - NEON_API_KEY: Neon database API key
# - DATABASE_ENCRYPTION_KEY: 64-char hex key for AES-256-GCM encryption (optional)

[vars]
ENVIRONMENT = "development"

# KV namespace for workspace URL caching (shared with api-worker)
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# Queue: this worker consumes audit events, and produces onto the same queue.
# An event whose tenant database is locked by a database move is sent back with a growing
# delay (services/batch-processor.ts, ~4 hours in all), so a lock wait never uses up
# max_retries. Every other failure is retried 3 times, then moved to the dead-letter queue
# instead of being deleted. Create the DLQ once per environment before deploying:
#   wrangler queues create audit-events-dlq-dev   (and -test, and audit-events-dlq)
[[queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events-dev"

[[queues.consumers]]
queue = "audit-events-dev"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "audit-events-dlq-dev"

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-audit-log-test"

[env.test.vars]
ENVIRONMENT = "test"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events-test"

[[env.test.queues.consumers]]
queue = "audit-events-test"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "audit-events-dlq-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-audit-log"

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "AUDIT_EVENTS"
queue = "audit-events"

[[env.production.queues.consumers]]
queue = "audit-events"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
dead_letter_queue = "audit-events-dlq"

[env.production.observability]
enabled = true
head_sampling_rate = 1
