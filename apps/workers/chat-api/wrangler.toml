# WeldSuite chat-api worker — the chat module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   chat-api.weldsuite.org        production
#   chat-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "chat-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY
#   CLOUDFLARE_API_TOKEN (the AI token the WeldAgent runtime uses when a room
#     reply runs inline here — no WELDAGENT_JOB binding — and
#     AI_GATEWAY_API_TOKEN is unset; same value as app-api)
#   INTERNAL_API_SECRET (the WeldAgent computer/browser tools' bearer to the
#     agent-runtime worker, same inline case; same value as app-api)
#   (DATABASE_URL_MASTER also backs the agent runtime's credit metering)
#
# Secrets beyond the base set (same values as app-api). The hand-set ones are in
# scripts/secrets/manifest.ts now; add them to Doppler if `secrets:sync` warns
# they are missing:
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation)
#   CF_REALTIME_APP_ID + CF_REALTIME_APP_SECRET (Cloudflare RealtimeKit:
#     WeldChat voice/video calls, @weldsuite/cloudflare-realtime)
#   RESEND_API_KEY (+ optional RESEND_TEMPLATE_TASK_ASSIGNED, PUBLIC_APP_URL):
#     chat message / DM / missed-call notification emails (@weldsuite/notifications)
#   AI_GATEWAY_API_TOKEN (+ optional CF_AI_GATEWAY, CF_AIG_TOKEN): the WeldAgent
#     runtime when a room reply runs inline (@weldsuite/ai). When unset,
#     @weldsuite/ai uses CLOUDFLARE_API_TOKEN.
#
# CF_ACCOUNT_ID, R2_PUBLIC_URL, AGENT_RUNTIME_URL and AGENT_COMPUTER_ENABLED
# are [vars] (values copied from app-api).

name = "weldsuite-chat-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"react" = "../../../packages/core/worker-kit/shims/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"
# WeldAgent cloud computer (agent-runtime worker), for room replies that run
# inline. Requires matching INTERNAL_API_SECRET on both workers.
AGENT_RUNTIME_URL = "http://localhost:8795"
AGENT_COMPUTER_ENABLED = "true"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# R2 bucket for chat uploads and clips.
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# D1 schedule index — shared with workflow-worker. The WeldAgent routine index
# lives here (@weldsuite/agent-domain/routine-index). Dev uses the test database.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

# Chat pin auto-expiry — Cloudflare Workflow hosted in THIS worker (class
# re-exported from src/index.ts, @weldsuite/chat-domain). New name (-v3):
# app-api keeps `unpin-expired-message-v2*` while its in-flight instances
# drain. Self-hosted (no script_name), so it also works under plain
# `wrangler dev`.
[[workflows]]
name = "unpin-expired-message-v3-dev"
binding = "UNPIN_EXPIRED_MESSAGE"
class_name = "UnpinExpiredMessageWorkflow"

# WELDAGENT_JOB (agent-api's workflow, WeldChat room replies) and
# DEFERRED_NOTIFICATION_EMAIL (app-api's workflow, notification emails) are
# bound cross-script in test/production only, like app-api's other cross-script
# workflow bindings. Locally they are absent: room replies run inline (the
# WeldAgent runtime's waitUntil fallback) and @weldsuite/notifications sends
# the email without the defer window.

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-chat-api-test"
routes = [
  { pattern = "chat-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"
AGENT_RUNTIME_URL = "https://agent-runtime-test.weldsuite.org"
AGENT_COMPUTER_ENABLED = "true"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

[[env.test.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[env.test.workflows]]
name = "unpin-expired-message-v3-test"
binding = "UNPIN_EXPIRED_MESSAGE"
class_name = "UnpinExpiredMessageWorkflow"

# WeldAgent background runs (WeldChat room replies) — class hosted in agent-api.
[[env.test.workflows]]
name = "weldagent-job-v2-test"
binding = "WELDAGENT_JOB"
class_name = "WeldAgentJobWorkflow"
script_name = "weldsuite-agent-api-test"

# Notification email defer window — class hosted in app-api.
[[env.test.workflows]]
name = "deferred-notification-email-test"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"
script_name = "weldsuite-app-api-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-chat-api"
routes = [
  { pattern = "chat-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage.weldsuite.org"
AGENT_RUNTIME_URL = "https://agent-runtime.weldsuite.org"
AGENT_COMPUTER_ENABLED = "true"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

[[env.production.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-production"
database_id = "d44f8243-eff7-4039-ab37-3ed51094ef39"

# Chat pin auto-expiry — hosted in this worker, no script_name. New name (-v3):
# app-api's `unpin-expired-message-v2` keeps draining.
[[env.production.workflows]]
name = "unpin-expired-message-v3"
binding = "UNPIN_EXPIRED_MESSAGE"
class_name = "UnpinExpiredMessageWorkflow"

# WeldAgent background runs (WeldChat room replies) — class hosted in agent-api.
[[env.production.workflows]]
name = "weldagent-job-v2"
binding = "WELDAGENT_JOB"
class_name = "WeldAgentJobWorkflow"
script_name = "weldsuite-agent-api"

# Notification email defer window — class hosted in app-api.
[[env.production.workflows]]
name = "deferred-notification-email"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"
script_name = "weldsuite-app-api"

[env.production.observability]
enabled = true
head_sampling_rate = 1
