# WeldSuite host-api worker — the host module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   host-api.weldsuite.org        production
#   host-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "host-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY,
#   CLOUDFLARE_API_TOKEN (Zones + legacy CF registrar domains),
#   CLOUDFLARE_ACCOUNT_ID (account that owns zones),
#   REALTIME_REGISTER_API_KEY / REALTIME_REGISTER_CUSTOMER (registrar REST),
#   REALTIME_REGISTER_ADAC_API_KEY (domain search/check — ADAC panel key, NOT the registrar key),
#   REALTIME_REGISTER_ADAC_TLD_SET_TOKEN (optional TLD set; omit for account default),
#   REALTIME_REGISTER_OTE / REALTIME_REGISTER_CONTACT_* / REALTIME_REGISTER_WEBHOOK_SECRET,
#   STRIPE_SECRET_KEY (/api/domains/checkout + the auto-renew invoices)

name = "weldsuite-host-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"react" = "../../../packages/core/worker-kit/shims/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# Schedule-index D1 (shared with workflow-worker / agent-api): the daily
# auto-renew sweep reads workspace_due_index (kind domain_renew) and opens
# only workspaces with a domain near renewal. Migrations: workflow-worker.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# Daily 04:00 UTC WeldHost domain auto-renew (Stripe invoice, then registrar
# renew). Moved from app-api; handled by scheduled() in src/index.ts.
[triggers]
crons = ["0 4 * * *"]

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-host-api-test"
routes = [
  { pattern = "host-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[env.test.triggers]
crons = ["0 4 * * *"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-host-api"
routes = [
  { pattern = "host-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-production"
database_id = "d44f8243-eff7-4039-ab37-3ed51094ef39"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

[env.production.triggers]
crons = ["0 4 * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
