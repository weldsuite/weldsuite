# WeldSuite Billing Worker
# Handles Stripe billing: webhooks, checkout, seat management, invoices

name = "weldsuite-billing"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============
# Required secrets (add via wrangler secret put):
# - STRIPE_SECRET_KEY: Stripe secret key (sk_...)
# - STRIPE_BILLING_WEBHOOK_SECRET: Stripe billing webhook signing secret (whsec_...)
# - CLERK_JWT_KEY: Clerk JWT public key (PEM format)
# - CLERK_SECRET_KEY: Clerk secret key
# - CLERK_MACHINE_SECRET_KEY: Clerk M2M machine secret key (ak_...)
# - NEON_API_KEY: Neon database API key
# - DATABASE_ENCRYPTION_KEY: 64-char hex key for AES-256-GCM encryption
# - INTERNAL_API_SECRET: same value as app-api and call-api; FALLBACK bearer for
#   ordering Telnyx numbers after phone checkout is paid (POST
#   /api/internal/telephony/fulfill-number, served by call-api; app-api forwards
#   it there). The primary path is the CALL_INTERNAL entrypoint binding below
#   (no secret); the bearer is used only while it is unbound or not deployed.
# - BILLING_ADMIN_SECRET: shared with the admin console (apps/web/admin), which
#   calls /api/internal/admin/* with it. 32+ random characters.
# - BETTERSTACK_TOKEN: Better Stack source token (from Better Stack > Sources)

[vars]
ENVIRONMENT = "development"
APP_API_URL = "http://localhost:8789"

# Hourly comp sweep: ends expired comp plans and renews comped workspaces'
# monthly credits (services/comp-sweep.ts). Test locally with
# `wrangler dev --test-scheduled` + GET /__scheduled.
[triggers]
crons = ["17 * * * *"]

[[hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "f1b2e092e6b64ade8ea7e7e17a1a0d39"
localConnectionString = "postgresql://postgres:__LOCAL_DEV_PASSWORD__@localhost:5432/weldsuite_master?sslmode=require"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# call-api's CallInternal entrypoint: paid phone-number fulfilment. Reachable only
# over a service binding, so no secret. `remote = true` lets plain `wrangler dev`
# reach the deployed test worker (mirrors WORKSPACE_WORKER in app-api).
# Deploy order: call-api must have the entrypoint first (module workers do).
[[services]]
binding = "CALL_INTERNAL"
service = "weldsuite-call-api-test"
entrypoint = "CallInternal"
remote = true

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-billing-test"
routes = [
  { pattern = "billing-worker-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
APP_API_URL = "https://app-api-test.weldsuite.org"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.services]]
binding = "CALL_INTERNAL"
service = "weldsuite-call-api-test"
entrypoint = "CallInternal"

[env.test.triggers]
crons = ["17 * * * *"]

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-billing"
routes = [
  { pattern = "billing-worker.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
APP_API_URL = "https://app-api.weldsuite.org"

[[env.production.hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "2cdec4bef19746d1a2c2e9726ddaacc3"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

# call-api's [env.production] name is "weldsuite-call-api" (no "-production" suffix).
[[env.production.services]]
binding = "CALL_INTERNAL"
service = "weldsuite-call-api"
entrypoint = "CallInternal"

[env.production.triggers]
crons = ["17 * * * *"]

[env.production.observability]
enabled = true
head_sampling_rate = 1
