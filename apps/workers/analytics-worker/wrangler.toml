# WeldSuite Analytics Worker — RETIRED, pending removal.
#
# The analytics sink is now the `analytics` consumer in entity-events-worker,
# which writes to the same pipeline. Nothing produces to `analytics-events`
# anymore, so this worker sits idle.
#
# It is kept deployable only because the deploy matrix lives in the private
# overlay repo and removing a worker from this side alone would break it. Delete
# the directory (and the Cloudflare worker + the analytics-events queues) once
# the overlay's worker list drops it.

name = "weldsuite-analytics"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============

[vars]
ENVIRONMENT = "development"

# dead_letter_queue is not optional: without one, Cloudflare DELETES a message
# once max_retries is exhausted, so an event that persistently fails to
# transform would drop out of analytics with only a console log to notice it.
#   wrangler queues create analytics-events-dlq-dev
[[queues.consumers]]
queue = "analytics-events-dev"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "analytics-events-dlq-dev"

[[pipelines]]
pipeline = "REPLACE_WITH_PIPELINE_ID"
binding = "ANALYTICS_STREAM"

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-analytics"

[env.production.vars]
ENVIRONMENT = "production"

#   wrangler queues create analytics-events-dlq
[[env.production.queues.consumers]]
queue = "analytics-events"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "analytics-events-dlq"

[[env.production.pipelines]]
pipeline = "REPLACE_WITH_PIPELINE_ID"
binding = "ANALYTICS_STREAM"

[env.production.observability]
enabled = true
head_sampling_rate = 1
