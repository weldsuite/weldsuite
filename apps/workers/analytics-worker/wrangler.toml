# WeldSuite Analytics Worker
# Queue consumer for ANALYTICS_EVENTS — writes records to Cloudflare Pipeline (→ R2 Iceberg).

name = "weldsuite-analytics"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============

[vars]
ENVIRONMENT = "development"

# dead_letter_queue is not optional: without one, Cloudflare DELETES a message
# once max_retries is exhausted, so an event that persistently fails to
# transform would drop out of analytics with only a console log to notice it.
#   wrangler queues create analytics-events-dlq-dev
[[queues.consumers]]
queue = "analytics-events-dev"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "analytics-events-dlq-dev"

[[pipelines]]
pipeline = "REPLACE_WITH_PIPELINE_ID"
binding = "ANALYTICS_STREAM"

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-analytics"

[env.production.vars]
ENVIRONMENT = "production"

#   wrangler queues create analytics-events-dlq
[[env.production.queues.consumers]]
queue = "analytics-events"
max_batch_size = 25
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "analytics-events-dlq"

[[env.production.pipelines]]
pipeline = "REPLACE_WITH_PIPELINE_ID"
binding = "ANALYTICS_STREAM"

[env.production.observability]
enabled = true
head_sampling_rate = 1
