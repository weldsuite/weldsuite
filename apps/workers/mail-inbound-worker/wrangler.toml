# WeldSuite Mail Inbound Worker
# Handles inbound emails via Cloudflare Email Routing (the `email` handler).
# All domains (weldmail.com + custom domains) route through Cloudflare.

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "weldsuite-mail-inbound-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

# Required secrets (add via wrangler secret put):
# - BETTERSTACK_TOKEN: Better Stack source token (from Better Stack > Sources)
# TypeSafe Jev inbound auto-labeling runs through the Workers AI binding below
# (routed via AI Gateway `default`, or CF_AI_GATEWAY if set). No AI token needed.

[ai]
binding = "AI"

[vars]
ENVIRONMENT = "development"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"

# KV namespace for workspace URL caching (create via: wrangler kv namespace create WORKSPACE_CACHE)
[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# Schedule-index D1 (shared with workflow-worker and the API workers). Visitor
# messages mark when the conversation's SLA clock next comes due
# (workspace_due_index, kind desk_sla), read by desk-api's SLA sweep.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

# R2 storage for mail attachments
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# EU-jurisdiction bucket for mail bodies + raw MIME
# (docs/plans/weldmail-mailbox-store-design.md decision 7). Created with
# `wrangler r2 bucket create weldsuite-mail-dev --jurisdiction eu` (ops step).
[[r2_buckets]]
binding = "MAIL_STORAGE"
bucket_name = "weldsuite-mail-dev"
jurisdiction = "eu"

# The mailbox Durable Object, owned by mail-api (design §8). Bound by
# `script_name` to mail-api's own local dev name — never `idFromName`d here
# directly; `@weldsuite/mail-domain/store`'s `getWorkspaceMail` is the only
# call site (design §2's `mailboxStub`).
[[durable_objects.bindings]]
name = "MAILBOX_STORE"
class_name = "MailboxStoreObject"
script_name = "weldsuite-mail-api-dev"

[[services]]
binding = "REALTIME"
service = "weldsuite-realtime"

# WeldDesk auto-assignment: the per-workspace AssignmentRouter picks who owns
# a new email conversation (ADR DESK-005). Without it the pick runs locally.
[[services]]
binding = "HELPDESK_WORKFLOW"
service = "helpdesk-workflow-worker-dev"

# Entity-events hub — inbound workspace mail also publishes email:created
# (personal mail:new toast path stays on REALTIME).
[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

