# WeldSuite desk-api worker — the desk module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   desk-api.weldsuite.org        production
#   desk-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "desk-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY,
#   CLOUDFLARE_API_TOKEN (help center custom domains: DNS records in zones),
#   DISCORD_CLIENT_ID + DISCORD_CLIENT_SECRET + DISCORD_BOT_TOKEN (helpdesk
#     Discord channel OAuth callback + outbound REST: ticket panel, agent replies),
#   INTERNAL_API_SECRET (bearer on the helpdesk-workflows resume forward to
#     helpdesk-workflow-worker; the SAME value as app-api)
#
# Secrets beyond the base set (same values as app-api). The hand-set ones are in
# scripts/secrets/manifest.ts now; add them to Doppler if `secrets:sync` warns
# they are missing:
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation)
#   SLACK_CLIENT_ID + SLACK_CLIENT_SECRET (helpdesk Slack OAuth callback; the
#     same Slack app app-api's WeldConnect slack.* integration uses)
#   VERCEL_API_TOKEN + VERCEL_HELPCENTER_PROJECT_ID (+ optional VERCEL_TEAM_ID)
#     (help center custom domains on the apps/web/helpcenter Vercel project)
#   R2_SQL_API_TOKEN + R2_ANALYTICS_BUCKET (helpdesk analytics charts, R2 SQL)
#   PUBLIC_APP_URL (optional: platform SPA base URL for the OAuth redirects;
#     defaults per ENVIRONMENT)
#   APP_API_PUBLIC_URL (optional, only if app-api has it: override of the
#     app-api host in the Discord/Slack OAuth redirect_uri — keep it pointing at
#     app-api, whose forwarder hands /api/integrations/helpdesk/* to desk-api)
#
# CF_ACCOUNT_ID and HELPDESK_WORKFLOW_WORKER_URL are [vars] (values copied
# from app-api).

name = "weldsuite-desk-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"react" = "../../../packages/core/worker-kit/shims/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
# helpdesk-workflow-worker /respond target for /api/helpdesk-workflows resume.
HELPDESK_WORKFLOW_WORKER_URL = "http://localhost:8790"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# Cloudflare Email Sending binding for desk email replies and email-channel
# dispatch (@weldsuite/worker-email). Locally there's no MTA, so a send fails.
[[send_email]]
name = "SEND_EMAIL"

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-desk-api-test"
routes = [
  { pattern = "desk-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
HELPDESK_WORKFLOW_WORKER_URL = "https://helpdesk-workflow-worker-test.weldsuite.org"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.send_email]]
name = "SEND_EMAIL"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-desk-api"
routes = [
  { pattern = "desk-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
HELPDESK_WORKFLOW_WORKER_URL = "https://helpdesk-workflow-worker.weldsuite.org"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

[[env.production.send_email]]
name = "SEND_EMAIL"

[env.production.observability]
enabled = true
head_sampling_rate = 1
