# Personal API Worker
# Serves personal Weld accounts (consumer WeldMail) — distinct from workspace app-api.
#
# Required secrets (wrangler secret put / .dev.vars for local):
#   DATABASE_URL_MASTER   — Neon URL for master DB
#   DATABASE_URL_PERSONAL — Neon URL for shared personal DB
#   CLERK_SECRET_KEY
#   CLERK_JWT_KEY (optional)
#
# Bindings:
#   SEND_EMAIL — Cloudflare Email Sending ([[send_email]])
#   OUTBOUND_LEDGER / OUTBOUND_PLATFORM / OUTBOUND_BACKSTOP — the outbound mail
#     guard (docs/plans/weldmail-outbound-abuse.md): mail-api's Durable Objects
#     bound by name, plus a per-sender burst limit for when the ledger is down
#
# Infra (one-time): apex weldmail.com Email Routing catch-all → mail-inbound-worker
# and Email Sending authorization for *@weldmail.com MAIL FROM.
#
# No Hyperdrive — Neon HTTP via @neondatabase/serverless, same as app-api.

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "weldsuite-personal-api-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"

[[send_email]]
name = "SEND_EMAIL"

# Outbound mail guard (docs/plans/weldmail-outbound-abuse.md): every send is
# checked against the account's OutboundLedger (ledger key personal:<accountId>),
# a Durable Object hosted by mail-api and bound here by name. OUTBOUND_BACKSTOP
# is the per-sender burst limit the guard falls back on when the ledger can't be
# reached; its namespace is shared with the other sending workers on purpose.
[[durable_objects.bindings]]
name = "OUTBOUND_LEDGER"
class_name = "OutboundLedger"
script_name = "weldsuite-mail-api-dev"

[[durable_objects.bindings]]
name = "OUTBOUND_PLATFORM"
class_name = "OutboundPlatformBudget"
script_name = "weldsuite-mail-api-dev"

[[ratelimits]]
name = "OUTBOUND_BACKSTOP"
namespace_id = "1101"
  [ratelimits.simple]
  limit = 30
  period = 60

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-personal-api-test"
routes = [
  { pattern = "personal-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"

[[env.test.send_email]]
name = "SEND_EMAIL"

# Outbound mail guard (test): mail-api's Durable Objects and the shared
# per-sender backstop (docs/plans/weldmail-outbound-abuse.md).
[[env.test.durable_objects.bindings]]
name = "OUTBOUND_LEDGER"
class_name = "OutboundLedger"
script_name = "weldsuite-mail-api-test"

[[env.test.durable_objects.bindings]]
name = "OUTBOUND_PLATFORM"
class_name = "OutboundPlatformBudget"
script_name = "weldsuite-mail-api-test"

[[env.test.ratelimits]]
name = "OUTBOUND_BACKSTOP"
namespace_id = "2101"
  [env.test.ratelimits.simple]
  limit = 30
  period = 60

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-personal-api"
routes = [
  { pattern = "personal-api.weldsuite.org", custom_domain = true },
  { pattern = "api.weldmail.com", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"

[[env.production.send_email]]
name = "SEND_EMAIL"

# Outbound mail guard (production): mail-api's Durable Objects and the shared
# per-sender backstop (docs/plans/weldmail-outbound-abuse.md).
[[env.production.durable_objects.bindings]]
name = "OUTBOUND_LEDGER"
class_name = "OutboundLedger"
script_name = "weldsuite-mail-api"

[[env.production.durable_objects.bindings]]
name = "OUTBOUND_PLATFORM"
class_name = "OutboundPlatformBudget"
script_name = "weldsuite-mail-api"

[[env.production.ratelimits]]
name = "OUTBOUND_BACKSTOP"
namespace_id = "3101"
  [env.production.ratelimits.simple]
  limit = 30
  period = 60

[env.production.observability]
enabled = true
head_sampling_rate = 1
