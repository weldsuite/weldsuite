# Helpdesk Widget API Worker
# Serves the embeddable helpdesk chat widget with public-facing endpoints
# authenticated via widget API keys (widgetId)

# Local `wrangler dev` only. Deployed names are set per [env.*]; never reuse one here.
name = "helpdesk-widget-api-dev"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports @clerk/nextjs (Next.js auth +
# admin helpers). Those packages use Node `__dirname` and crash the Workers
# runtime. Alias them out the same way app-api and external-api do.
[alias]
"@clerk/nextjs/server" = "./src/lib/clerk-shim.ts"
"@clerk/nextjs" = "./src/lib/clerk-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

# ============ LOCAL DEVELOPMENT ============
# For local development, Hyperdrive bindings are simulated
# Set DATABASE_URL_MASTER in .dev.vars for local database connections
# Tenant databases are looked up per-workspace from master DB (each workspace has its own Neon DB)
#
# Required secrets (add via wrangler secret put or .dev.vars for local):
# - WIDGET_TOKEN_SECRET: JWT signing secret for realtime-worker auth
# - DISCORD_BOT_SECRET: same value as discord-bot-worker DISCORD_PUBLIC_KEY (X-Bot-Secret)
# - BETTERSTACK_TOKEN: Better Stack source token (from Better Stack > Sources)
# - NEON_API_KEY + DATABASE_ENCRYPTION_KEY(+_V2): tenant DB resolution

[vars]
ENVIRONMENT = "development"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
REALTIME_PUBLIC_URL = "ws://localhost:8790"
PUBLIC_APP_URL = "http://localhost:3000"

[[hyperdrive]]
binding = "HYPERDRIVE_MASTER"
id = "f1b2e092e6b64ade8ea7e7e17a1a0d39"
localConnectionString = "postgresql://postgres:__LOCAL_DEV_PASSWORD__@localhost:5432/weldsuite_master?sslmode=require"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

# Schedule-index D1 (shared with workflow-worker and the API workers). Visitor
# messages mark when the conversation's SLA clock next comes due
# (workspace_due_index, kind desk_sla), read by desk-api's SLA sweep.
[[d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# Cloudflare Queues — analytics, plus the entity-events hub (consumed by
# entity-events-worker) for the desk_conversation events this worker publishes.

[[queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events-dev"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Service binding to centralized workflow worker (direct DO calls, no queue delay)
[[services]]
binding = "WORKFLOW_WORKER"
service = "helpdesk-workflow-worker-dev"

[[services]]
binding = "REALTIME"
service = "weldsuite-realtime"

# Cloudflare Email Sending: the help-center sign-in code emails. Without the
# binding no code is sent (in development the code is logged instead).
[[send_email]]
name = "SEND_EMAIL"

# Atomic counters for the help-center sign-in limits (/api/portal/auth/*):
# one PortalRateLimiter Durable Object per limiter key; KV has no atomic
# increment. Sign-in is refused when the binding is missing, so it must exist
# in every environment. Durable Object bindings and migrations are NOT
# inherited by [env.*].
[[durable_objects.bindings]]
name = "PORTAL_RATE_LIMITER"
class_name = "PortalRateLimiter"

[[migrations]]
tag = "portal-rate-limiter-v1"
new_sqlite_classes = ["PortalRateLimiter"]

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "helpdesk-widget-api-test"
routes = [
  { pattern = "helpdesk-widget-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
AI_BYOK_PROVIDERS = "anthropic"
REALTIME_PUBLIC_URL = "wss://realtime-test.weldsuite.org"
PUBLIC_APP_URL = "https://app-test.weldsuite.org"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.d1_databases]]
binding = "SCHEDULE_INDEX"
database_name = "weldsuite-schedule-index-test"
database_id = "2dd2eb7f-77cf-4865-ba25-8c4061f3ccdb"


[[env.test.queues.producers]]
binding = "ANALYTICS_EVENTS"
queue = "analytics-events-test"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "WORKFLOW_WORKER"
service = "helpdesk-workflow-worker-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.send_email]]
name = "SEND_EMAIL"
# Only system mail goes through this binding, always from this address.
allowed_sender_addresses = ["notifications@mail.weldsuite.org"]

# Sign-in rate-limit counters (see the top-level block).
[[env.test.durable_objects.bindings]]
name = "PORTAL_RATE_LIMITER"
class_name = "PortalRateLimiter"

[[env.test.migrations]]
tag = "portal-rate-limiter-v1"
new_sqlite_classes = ["PortalRateLimiter"]

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

