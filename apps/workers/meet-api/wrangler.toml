# WeldSuite meet-api worker — the meet module's API.
#
# Split out of app-api (docs/plans/app-api-module-split.md). Serves the same
# /api/<object> paths app-api served for this module; only the host differs:
#   meet-api.weldsuite.org        production
#   meet-api-test.weldsuite.org   test
# The path prefixes it owns live in packages/core/api-modules.
#
# Secrets (scripts/secrets/manifest.ts → "meet-api"):
#   DATABASE_URL_MASTER, NEON_API_KEY, DATABASE_ENCRYPTION_KEY,
#   CLERK_SECRET_KEY, CLERK_JWT_KEY
#   (DATABASE_URL_MASTER also backs the credit wallet + the WeldMeet AI price list,
#   master system_settings key `weldmeet.ai_pricing`)
#
# Recordings (RealtimeKit's own recorder; no third-party bot):
#   MEETING_RECORDINGS is a PRIVATE R2 bucket (no public domain, never STORAGE).
#   Create it BEFORE the first deploy of each env:
#     weldsuite-meeting-recordings        (dev + production)
#     weldsuite-meeting-recordings-test   (test)
#   Objects are served only by GET /public/meeting-recordings/:token (KV token,
#   Range support). RealtimeKit keeps its own copy about 7 days; the
#   `meeting-recording-copy-v1*` workflow moves it into this bucket on
#   recording.statusUpdate UPLOADED, `meeting-ai-v1*` ingests RealtimeKit's
#   transcript/summary and runs Whisper afterwards.
#   Legacy recordings (pre-recorder rows with an expiring Cloudflare URL): right
#   after the first deploy of each env run POST
#   /api/webhooks/cloudflare-realtime/backfill-recordings (operator bearer, same as
#   /setup; body {"dryRun":true} first). RealtimeKit only keeps recordings ~7 days.
#   After deploying, re-run POST /api/webhooks/cloudflare-realtime/setup once per
#   env: it now registers recording.statusUpdate, meeting.transcript and
#   meeting.summary too (idempotent, replaces the event list).
#
# Secrets beyond the base set (same values as app-api). The hand-set ones are in
# scripts/secrets/manifest.ts now; add them to Doppler if `secrets:sync` warns
# they are missing:
#   DATABASE_ENCRYPTION_KEY_V2 (only during an encryption-key rotation)
#   CF_REALTIME_APP_ID + CF_REALTIME_APP_SECRET (Cloudflare RealtimeKit:
#     meeting sessions, recordings, ending chat calls from the RTK webhook)
#   CF_REALTIME_WEBHOOK_TOKEN (bearer token for the operator-only
#     /api/webhooks/cloudflare-realtime/setup; unset = /setup refuses. The
#     receiver itself verifies RealtimeKit's rtk-signature instead)
#   CLOUDFLARE_API_TOKEN (Workers AI Whisper for "transcribe afterwards" and the
#     summary model, both through @weldsuite/ai / AI Gateway; same value as
#     app-api and mail-api. Needs Workers AI + AI Gateway Run permissions.
#     Optional overrides: AI_GATEWAY_API_TOKEN, CF_AI_GATEWAY)
#   RESEND_API_KEY (+ optional RESEND_TEMPLATE_TASK_ASSIGNED, PUBLIC_APP_URL):
#     the missed-call notification endChatCall sends (@weldsuite/notifications)
#
# CF_ACCOUNT_ID and R2_PUBLIC_URL are [vars] (values copied from app-api).

name = "weldsuite-meet-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# @weldsuite/db's lib barrel optionally imports Next.js / React helpers that
# crash the Workers runtime; alias them to the kit's empty shims.
[alias]
"@clerk/nextjs/server" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"@clerk/nextjs" = "../../../packages/core/worker-kit/shims/clerk-shim.ts"
"next/server" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"next/navigation" = "../../../packages/core/worker-kit/shims/next-shim.ts"
"react" = "../../../packages/core/worker-kit/shims/react-shim.ts"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "development"
# Meeting portal behind the join links in invitation emails (default https://meet.weldsuite.org).
MEETING_PORTAL_URL = "http://localhost:3020"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"

[[kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "748b8f38937f4807b3978cacb17e1880"

[[queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-dev"

# Remote binding so local dev reaches the deployed test realtime worker.
[[services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"
remote = true

# R2 bucket for files, documents and generated avatars (participant-resolver.ts).
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# PRIVATE bucket for meeting recordings, raw transcripts (see header). The same
# bucket serves dev and production; test has its own.
[[r2_buckets]]
binding = "MEETING_RECORDINGS"
bucket_name = "weldsuite-meeting-recordings"

# Recording + AI workflows — Cloudflare Workflows hosted in THIS worker
# (classes re-exported from src/index.ts, @weldsuite/meet-domain). Self-hosted
# (no script_name), so they also work under plain `wrangler dev`.
[[workflows]]
name = "meeting-recording-copy-v1-dev"
binding = "MEETING_RECORDING_COPY"
class_name = "CopyMeetingRecordingWorkflow"

[[workflows]]
name = "meeting-ai-v1-dev"
binding = "MEETING_AI"
class_name = "MeetingAiWorkflow"

# One-off legacy recording backfill (operator route, see header).
[[workflows]]
name = "meeting-recording-backfill-v1-dev"
binding = "MEETING_RECORDING_BACKFILL"
class_name = "BackfillLegacyRecordingsWorkflow"

# RETIRED: the AssemblyAI transcription workflow. The registered workflow
# `transcribe-recording-v3*` still points at the (now stub) class exported from
# src/index.ts, so its binding is gone but the class stays for one release.
# Next release: drop the export and `wrangler workflows delete` the registration.

# DEFERRED_NOTIFICATION_EMAIL (app-api's workflow, used by the missed-call
# notification of endChatCall) is bound cross-script in test/production only,
# like app-api's other cross-script workflow bindings. Locally it is absent and
# @weldsuite/notifications sends the email without the defer window.

# ============ TEST ENVIRONMENT ============
[env.test]
logpush = true
name = "weldsuite-meet-api-test"
routes = [
  { pattern = "meet-api-test.weldsuite.org", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage-test.weldsuite.org"

[[env.test.flagship]]
binding = "FLAGSHIP"
app_id = "d8c58a91-9e17-432b-b4e8-0f2c9959490e"

[[env.test.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "54dd4f453a5e4021a31695ada36cc708"

[[env.test.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events-test"

[[env.test.services]]
binding = "REALTIME"
service = "weldsuite-realtime-test"

[[env.test.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage-test"

# PRIVATE recordings bucket (no public domain). Create it before the first deploy.
[[env.test.r2_buckets]]
binding = "MEETING_RECORDINGS"
bucket_name = "weldsuite-meeting-recordings-test"

[[env.test.workflows]]
name = "meeting-recording-copy-v1-test"
binding = "MEETING_RECORDING_COPY"
class_name = "CopyMeetingRecordingWorkflow"

[[env.test.workflows]]
name = "meeting-ai-v1-test"
binding = "MEETING_AI"
class_name = "MeetingAiWorkflow"

[[env.test.workflows]]
name = "meeting-recording-backfill-v1-test"
binding = "MEETING_RECORDING_BACKFILL"
class_name = "BackfillLegacyRecordingsWorkflow"

# Notification email defer window — class hosted in app-api.
[[env.test.workflows]]
name = "deferred-notification-email-test"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"
script_name = "weldsuite-app-api-test"

[env.test.observability]
enabled = true
head_sampling_rate = 1

# ============ PRODUCTION ENVIRONMENT ============
[env.production]
logpush = true
name = "weldsuite-meet-api"
routes = [
  { pattern = "meet-api.weldsuite.org", custom_domain = true }
]

[env.production.vars]
ENVIRONMENT = "production"
MEETING_PORTAL_URL = "https://meet.weldsuite.org"
CF_ACCOUNT_ID = "cfcf560df8dc675d15337abcfbf6d9bd"
R2_PUBLIC_URL = "https://weldsuite-storage.weldsuite.org"

[[env.production.flagship]]
binding = "FLAGSHIP"
app_id = "895f413b-8b8d-4e6f-bb14-399721deb17e"

[[env.production.kv_namespaces]]
binding = "WORKSPACE_CACHE"
id = "99689831a815455ba7f836175e5e17c9"

[[env.production.queues.producers]]
binding = "ENTITY_EVENTS"
queue = "entity-events"

[[env.production.services]]
binding = "REALTIME"
service = "weldsuite-realtime-production"

[[env.production.r2_buckets]]
binding = "STORAGE"
bucket_name = "weldsuite-storage"

# PRIVATE recordings bucket (no public domain). Create it before the first deploy.
[[env.production.r2_buckets]]
binding = "MEETING_RECORDINGS"
bucket_name = "weldsuite-meeting-recordings"

# Recording + AI workflows — hosted in this worker, no script_name.
[[env.production.workflows]]
name = "meeting-recording-copy-v1"
binding = "MEETING_RECORDING_COPY"
class_name = "CopyMeetingRecordingWorkflow"

[[env.production.workflows]]
name = "meeting-ai-v1"
binding = "MEETING_AI"
class_name = "MeetingAiWorkflow"

[[env.production.workflows]]
name = "meeting-recording-backfill-v1"
binding = "MEETING_RECORDING_BACKFILL"
class_name = "BackfillLegacyRecordingsWorkflow"

# Notification email defer window — class hosted in app-api.
[[env.production.workflows]]
name = "deferred-notification-email"
binding = "DEFERRED_NOTIFICATION_EMAIL"
class_name = "DeferredNotificationEmailWorkflow"
script_name = "weldsuite-app-api"

[env.production.observability]
enabled = true
head_sampling_rate = 1
