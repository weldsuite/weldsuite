<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.565 1.565 20.87 20.87">
  <mask id="asterisk" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
    <rect width="24" height="24" fill="#fff"/>
    <path d="M12 8v8m-3.5-2 7-4m-7 0 7 4" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  </mask>
  <path fill="#818cf8" mask="url(#asterisk)" d="M5 2h14a3 3 0 0 1 3 3v14a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3Z"/>
</svg>
