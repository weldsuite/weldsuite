appId: com.weldsuite.desktop
productName: WeldSuite
copyright: Copyright © 2026 Weld Corporation
asar: true

# URL-safe, versioned filenames. The electron-builder default for NSIS is
# "WeldSuite Setup 0.1.0.exe" — the space makes for an ugly download link and
# has to be percent-encoded everywhere. Renders e.g.
#   WeldSuite-0.1.0-win-x64.exe
#   WeldSuite-0.1.0-mac-universal.dmg
# The release workflow also publishes stable `download/` aliases so the
# marketing site can link to a URL that never changes.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - resources/**/*
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: assets/icon.ico
  signtoolOptions:
    publisherName: Weld Corporation

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WeldSuite

# The Microsoft Store package (ADR FE-023): `pnpm package:store`, not part of
# `package:win`. Microsoft signs it when it's submitted and the Store updates
# it; the app skips electron-updater there (process.windowsStore). Its
# identity comes from Partner Center (the app's Product identity page) and is
# passed in as -c.appx.identityName, -c.appx.publisher and
# -c.appx.publisherDisplayName: the release workflow takes them from the
# repository variables WINDOWS_STORE_IDENTITY_NAME, WINDOWS_STORE_PUBLISHER and
# WINDOWS_STORE_PUBLISHER_DISPLAY_NAME. The tiles in assets/appx come from
# scripts/generate-store-assets.mjs.
appx:
  applicationId: WeldSuite
  displayName: WeldSuite
  backgroundColor: transparent
  # Partner Center asks for a Store listing in each of these.
  languages: [en-US, nl-NL]
  # Camera and microphone for WeldMeet (runFullTrust is always added).
  capabilities: [internetClient, webcam, microphone]
  # Windows 10 1809, as far back as Electron goes; tested on 11 24H2.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0

mac:
  target:
    # dmg = what a human downloads. zip = what electron-updater consumes:
    # MacUpdater hard-requires a zip and throws ERR_UPDATER_ZIP_FILE_NOT_FOUND
    # without one, so a DMG-only mac build can never auto-update.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: assets/icon.icns
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: WeldSuite needs camera access for video meetings in WeldMeet.
    NSMicrophoneUsageDescription: WeldSuite needs microphone access for video meetings in WeldMeet.
    NSScreenCaptureUsageDescription: WeldSuite needs screen recording access to share your screen in WeldMeet.

dmg:
  sign: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  icon: assets/icon.png

protocols:
  - name: WeldSuite Deep Link
    schemes: [weldsuite]

# READ-ONLY update feed. electron-builder has no `generic` *publisher* — the
# only upload-capable providers in v26 are github/s3/spaces/bitbucket/keygen/
# snapStore — so `--publish always` uploads nothing here by design. The release
# workflow in .github/workflows/release-desktop.yml uploads the artifacts to the
# Hetzner Object Storage bucket `weldsuite-desktop-downloads` (its own Hetzner
# project), which the EU cluster serves as https://downloads.weldsuite.eu, and
# electron-updater reads <url>/latest.yml and <url>/latest-mac.yml back out of
# it. Every install keeps this URL (app-update.yml), whichever server it uses.
#
# Until 0.3.0 the feed was Cloudflare R2 at https://downloads.weldsuite.org
# (Global); installs from then keep reading it, and get the EU builds once
# that host serves this bucket (plan retire-global-edition.md, appendix).
publish:
  provider: generic
  url: https://downloads.weldsuite.eu
  channel: latest
