appId: com.weldsuite.desktop
productName: WeldSuite
copyright: Copyright © 2026 Weld Corporation
asar: true

# URL-safe, versioned filenames. The electron-builder default for NSIS is
# "WeldSuite Setup 0.1.0.exe" — the space makes for an ugly download link and
# has to be percent-encoded everywhere. Renders e.g.
#   WeldSuite-0.1.0-win-x64.exe
#   WeldSuite-0.1.0-mac-universal.dmg
# The release workflow also publishes stable `download/` aliases so the
# marketing site can link to a URL that never changes.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - resources/**/*
  - package.json

extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: assets/icon.ico
  publisherName: Weld Corporation

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: WeldSuite

mac:
  target:
    # dmg = what a human downloads. zip = what electron-updater consumes:
    # MacUpdater hard-requires a zip and throws ERR_UPDATER_ZIP_FILE_NOT_FOUND
    # without one, so a DMG-only mac build can never auto-update.
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: assets/icon.icns
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: WeldSuite needs camera access for video meetings in WeldMeet.
    NSMicrophoneUsageDescription: WeldSuite needs microphone access for video meetings in WeldMeet.
    NSScreenCaptureUsageDescription: WeldSuite needs screen recording access to share your screen in WeldMeet.

dmg:
  sign: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  icon: assets/icon.png

protocols:
  - name: WeldSuite Deep Link
    schemes: [weldsuite]

# READ-ONLY update feed. electron-builder has no `generic` *publisher* — the
# only upload-capable providers in v25 are github/s3/spaces/bitbucket/keygen/
# snapStore — so `--publish always` uploads nothing here by design. The release
# workflow in .github/workflows/release-desktop.yml pushes artifacts to the R2 bucket
# `weldsuite-desktop-downloads` with wrangler, and electron-updater reads
# <url>/latest.yml and <url>/latest-mac.yml back out of it.
publish:
  provider: generic
  url: https://downloads.weldsuite.org
  channel: latest
