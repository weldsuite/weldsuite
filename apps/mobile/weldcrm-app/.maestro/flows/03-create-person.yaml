appId: com.weldsuite.weldcrm
name: Create a person and a company
tags: [writes]
---
# Creates "E2E Person <timestamp>" and "E2E Company <timestamp>", then deletes both.
- runFlow: ../subflows/login.yaml
- evalScript: ${output.stamp = Date.now()}
- tapOn: "People"
- tapOn: "Add person"
- assertVisible: "New person"
# First name is required.
- tapOn: "Create"
- assertVisible: "First name is required"
- tapOn: "First name"
- inputText: "E2E Person ${output.stamp}"
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "E2E Person ${output.stamp}"
    timeout: 15000
- tapOn: "Actions"
- tapOn: "Delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Search people..."
    timeout: 15000
- tapOn: "Companies"
- tapOn: "Add company"
- assertVisible: "New company"
- tapOn: "Create"
- assertVisible: "Name is required"
- tapOn: "Name"
- inputText: "E2E Company ${output.stamp}"
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "E2E Company ${output.stamp}"
    timeout: 15000
- tapOn: "Actions"
- tapOn: "Delete"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Search companies..."
    timeout: 15000
