appId: com.weldsuite.weldchat
name: Home and tabs load
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
- assertVisible: "Saved"
- assertVisible: "Drafts"
- tapOn: "Direct messages"
- assertVisible: "Direct messages"
- tapOn: "Activity"
- assertVisible: "Activity"
- tapOn: "Calls"
# The calls list renders whether the account has calls or not (rows are
# calls-row-<id>, ongoing calls calls-ongoing-<id>, the empty state calls-empty).
- extendedWaitUntil:
    visible:
      id: calls-list
    timeout: 15000
- tapOn: "Home"
- assertVisible: "Saved"
