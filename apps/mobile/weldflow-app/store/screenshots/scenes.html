<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeldFlow store screens</title>
  <style>
    :root {
      --bg: #fff;
      --text: #000;
      --muted: #6b7280;
      --subtle: #8e8e93;
      --secondary: #f2f2f7;
      --border: #e5e5ea;
      --brand: #e84c3d;
      --brand-tint: rgba(232, 76, 61, 0.12);
      --destructive: #dc2626;
      --warning: #f59e0b;
      --success: #10b981;
      --info: #3b82f6;
      --tab-muted: #999;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      width: 100%;
      height: 100%;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .status {
      height: 54px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: -0.2px;
    }
    .status-right { display: flex; gap: 7px; align-items: center; font-size: 13px; }
    .header { padding: 8px 20px 4px; flex-shrink: 0; }
    .header.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header.compact {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 8px 8px 10px;
    }
    .title-lg { font-size: 34px; font-weight: 700; letter-spacing: -0.7px; }
    .title-md { font-size: 26px; font-weight: 600; letter-spacing: -0.4px; }
    .title-sm { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
    .subtitle { font-size: 13px; color: var(--muted); font-weight: 400; margin-top: 2px; text-align: center; }
    .chev { color: var(--muted); font-size: 28px; width: 44px; text-align: center; line-height: 1; font-weight: 300; }
    .header-actions { display: flex; gap: 4px; width: 88px; justify-content: flex-end; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; color: var(--text);
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .kpis {
      display: flex;
      gap: 8px;
      padding: 8px 16px 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .kpi {
      background: var(--secondary);
      border-radius: 16px;
      padding: 12px 14px;
      width: 132px;
      min-height: 78px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kpi .l { font-size: 12px; font-weight: 500; color: var(--muted); }
    .kpi .v { font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: -0.4px; }
    .kpi .v.warn { color: var(--destructive); }
    .kpi .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .actions {
      display: flex;
      padding: 20px 8px 12px;
      flex-shrink: 0;
    }
    .action { flex: 1; text-align: center; }
    .action-icon {
      width: 52px; height: 52px; border-radius: 16px;
      background: var(--brand-tint); color: var(--brand);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .action-icon svg { width: 22px; height: 22px; }
    .action span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 8px; }
    .scroll { flex: 1; overflow: hidden; padding-bottom: 88px; }
    .sec {
      padding: 14px 16px 6px;
      font-size: 13px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border);
    }
    .swatch {
      width: 38px; height: 38px; border-radius: 12px;
      flex-shrink: 0;
    }
    .tile {
      width: 38px; height: 38px; border-radius: 12px;
      background: rgba(59, 130, 246, 0.12); color: var(--info);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .tile svg { width: 19px; height: 19px; }
    .main { flex: 1; min-width: 0; }
    .main .t { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main .u { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .main .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .main .m.overdue { color: var(--destructive); font-weight: 600; }
    .side { text-align: right; flex-shrink: 0; }
    .side .pct { font-size: 14px; font-weight: 600; letter-spacing: -0.2px; }
    .badge {
      display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 999px; color: #fff;
    }
    .badge.active, .badge.done { background: var(--success); }
    .badge.progress, .badge.review { background: var(--warning); }
    .badge.todo, .badge.planning { background: #000; }
    .badge.hold { background: var(--secondary); color: #000; }
    .badge.high { background: #f97316; }
    .tabwrap {
      position: absolute; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center;
      padding: 0 20px 28px;
      pointer-events: none;
    }
    .tabbar {
      width: 100%; max-width: 420px; height: 56px; border-radius: 28px;
      background: rgba(255,255,255,0.94);
      border: 0.5px solid rgba(0,0,0,0.06);
      box-shadow: 0 8px 16px rgba(0,0,0,0.18);
      display: flex; align-items: center;
      padding: 0 6px;
    }
    .tab {
      flex: 1; height: 44px; margin: 6px 2px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      color: var(--tab-muted);
    }
    .tab.active { color: var(--text); background: rgba(0,0,0,0.06); }
    .tab svg { width: 22px; height: 22px; }
    .home-bar {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; background: #000; border-radius: 3px;
    }
    .chips { display: flex; gap: 8px; padding: 8px 16px 4px; overflow: hidden; }
    .chip {
      padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
      background: var(--secondary); color: var(--muted); white-space: nowrap;
    }
    .chip.on { background: #000; color: #fff; }
    .search {
      margin: 8px 16px 0; background: var(--secondary); border-radius: 12px;
      padding: 10px 14px; color: #9ca3af; font-size: 16px;
    }
    .card {
      margin: 8px 12px 0; background: #fff; border: 0.5px solid var(--border);
      border-radius: 16px; padding: 16px;
    }
    .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
    .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; font-size: 15px; gap: 16px;
    }
    .meta-row span { color: var(--muted); }
    .stats {
      display: flex; gap: 8px; padding: 8px 12px 0; flex-shrink: 0;
    }
    .stat {
      flex: 1; background: var(--secondary); border-radius: 14px; padding: 12px 10px; text-align: center;
    }
    .stat .v { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .proj-hero { padding: 4px 16px 8px; }
    .proj-hero .name { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .proj-hero .code { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .proj-hero .desc { font-size: 14px; color: var(--muted); margin-top: 10px; line-height: 20px; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 999px; background: var(--secondary);
      font-size: 14px; font-weight: 600; margin-top: 12px;
    }
    .status-pill .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--warning); }
    .prio {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; color: #f97316; margin-top: 10px;
    }
    .login {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px 28px 48px;
    }
    .login-inner { width: 100%; max-width: 440px; }
    .login-mark {
      width: 72px; height: 72px; border-radius: 20px;
      background: var(--brand-tint);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 30px;
    }
    .login-mark .mark { width: 36px; height: 48px; }
    .welcome { text-align: center; margin-bottom: 40px; }
    .welcome h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .welcome p { font-size: 15px; color: var(--subtle); line-height: 22px; }
    .field {
      width: 100%; height: 44px; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 0 16px; color: #9ca3af; font-size: 16px;
      display: flex; align-items: center; margin-bottom: 14px; background: #fff;
    }
    .field.pw { justify-content: space-between; }
    .forgot { text-align: right; font-size: 13px; color: var(--subtle); margin: -6px 0 28px; }
    .signin {
      width: 100%; height: 48px; background: var(--brand); color: #fff; border-radius: 12px;
      font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center;
      letter-spacing: 0.3px; box-shadow: 0 2px 8px rgba(232,76,61,0.25);
    }
    .or {
      display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--subtle); font-size: 14px; font-weight: 500;
    }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
    .oauth {
      width: 100%; height: 48px; border: 1px solid #e5e7eb; border-radius: 12px;
      font-weight: 600; font-size: 16px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 10px; background: #fff;
    }
    .oauth.apple { background: #000; color: #fff; border: 0; }
    .g { width: 20px; height: 20px; }
    .mark { width: 40px; height: 52px; }
    .mark.lg { width: 90px; height: 118px; }
    .feature {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #fff1f0 0%, #fff 48%, #ffe4e1 100%);
      display: flex; align-items: center; padding: 40px 48px; gap: 32px;
    }
    .feature h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.2px; }
    .feature p { font-size: 20px; color: var(--muted); margin-top: 8px; max-width: 520px; line-height: 1.35; }
    .feature-icon {
      width: 120px; height: 120px; border-radius: 28px;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(232,76,61,0.25);
      flex-shrink: 0;
    }
    .feature-icon .mark { width: 56px; height: 74px; }
    .picker {
      position: absolute; left: 16px; right: 16px; bottom: 40px;
      background: #fff; border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .picker .opt {
      padding: 16px 20px; font-size: 16px; font-weight: 500;
      border-bottom: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .picker .opt.on { font-weight: 700; }
    .picker .opt .check { color: var(--brand); font-weight: 700; }
    .dim {
      position: absolute; inset: 0; background: rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>
  <div class="phone" id="app"></div>
  <script>
    // Official WeldFlow mark (platform public/assets/images/weldflow/icon.svg), recolored to coral.
    const MARK = `<svg class="mark" viewBox="0 0 621.7 821.31" xmlns="http://www.w3.org/2000/svg"><path fill="#E84C3D" d="M621.7,438.39v102.04c0,32.93-26.7,59.63-59.63,59.63h-180.03c-44.08,0-79.81,35.73-79.81,79.81v81.83c0,32.93-26.7,59.63-59.63,59.63H59.63c-32.93,0-59.63-26.7-59.63-59.63v-102.23c0-32.93,26.7-59.63,59.63-59.63h162.56c44.08,0,79.81-35.73,79.81-79.81v-81.64c0-32.93,26.7-59.63,59.63-59.63h200.45c32.93,0,59.63,26.7,59.63,59.63Z"/><path fill="#E84C3D" d="M621.7,59.63v102.04c0,32.93-26.7,59.63-59.63,59.63h-249.35c-44.08,0-79.81,35.73-79.81,79.81v81.83c0,32.93-26.7,59.63-59.63,59.63H59.63c-32.93,0-59.63-26.7-59.63-59.63v-102.23c0-32.93,26.7-59.63,59.63-59.63h93.25c44.08,0,79.81-35.73,79.81-79.81V59.63C232.69,26.7,259.38,0,292.31,0h269.77c32.93,0,59.63,26.7,59.63,59.63Z"/></svg>`;
    const MARK_WHITE = MARK.replaceAll('#E84C3D', '#fff');
    const params = new URLSearchParams(location.search);
    const scene = params.get('scene') || 'home';
    const isIos = params.get('platform') !== 'android';
    const svg = (d, w = 24) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const I = {
      home: svg('<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>'),
      folder: svg('<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>'),
      check: svg('<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'),
      more: svg('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'),
      plus: svg('<path d="M12 5v14M5 12h14"/>'),
      flag: svg('<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>'),
      eye: svg('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'),
      user: svg('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'),
      list: svg('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'),
      g: `<svg class="g" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.8-2.1-6.8-5H1.2v3.1C3.2 21.4 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.3A7.2 7.2 0 0 1 4.8 12c0-.8.1-1.6.4-2.3V6.6H1.2A12 12 0 0 0 0 12c0 1.9.5 3.8 1.2 5.4l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.3 0 3.2 2.6 1.2 6.6l4 3.1c1-2.9 3.6-4.9 6.8-4.9z"/></svg>`,
      apple: `<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.2c1.1-1.5 1.5-2.9 1.5-3 0-.1-2.8-1.1-2.8-4.5zM14.6 5.8c.6-.8 1.1-1.8.9-2.8-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.8-.9 2.8 1 .1 2-.5 2.6-1.3z"/></svg>`,
    };

    const status = () => `<div class="status"><span>9:41</span><span class="status-right">●●●● ▲ 100%</span></div>`;
    const tabbar = (active) => `
      <div class="tabwrap">
        <div class="tabbar">
          <div class="tab ${active===0?'active':''}">${I.home}</div>
          <div class="tab ${active===1?'active':''}">${I.folder}</div>
          <div class="tab ${active===2?'active':''}">${I.check}</div>
          <div class="tab ${active===3?'active':''}">${I.more}</div>
        </div>
      </div>
      <div class="home-bar"></div>`;

    function projRow(name, code, meta, pct, color, st) {
      const label = st === 'active' ? 'Active' : st === 'planning' ? 'Planning' : st === 'hold' ? 'On hold' : 'Completed';
      return `<div class="row">
        <div class="swatch" style="background:${color}"></div>
        <div class="main"><div class="t">${name}</div><div class="u">${code}</div><div class="m">${meta}</div></div>
        <div class="side"><div class="pct">${pct}</div><div class="badge ${st}">${label}</div></div>
      </div>`;
    }

    function taskRow(title, project, due, st, overdue) {
      const label = st === 'progress' ? 'In progress' : st === 'review' ? 'In review' : st === 'todo' ? 'To do' : 'Done';
      return `<div class="row">
        <div class="tile">${I.check}</div>
        <div class="main"><div class="t">${title}</div><div class="u">${project}</div><div class="m${overdue?' overdue':''}">${due}</div></div>
        <div class="side"><div class="badge ${st}">${label}</div></div>
      </div>`;
    }

    const scenes = {
      login: () => `
        ${status()}
        <div class="login">
          <div class="login-inner">
            <div class="login-mark">${MARK}</div>
            <div class="welcome">
              <h1>Sign in to your account</h1>
              <p>Projects &amp; tasks on the go</p>
            </div>
            <div class="field">Email address</div>
            <div class="field pw"><span>Password</span>${I.eye}</div>
            <div class="forgot">Forgot password?</div>
            <div class="signin">Sign In</div>
            <div class="or">or</div>
            <div class="oauth">${I.g} Continue with Google</div>
            ${isIos ? `<div class="oauth apple">${I.apple} Continue with Apple</div>` : ''}
          </div>
        </div>
        <div class="home-bar"></div>`,
      home: () => `
        ${status()}
        <div class="header"><div class="title-lg">Acme Studio</div></div>
        <div class="kpis">
          <div class="kpi"><div class="l">Active</div><div class="v">6</div><div class="s">Projects</div></div>
          <div class="kpi"><div class="l">Open tasks</div><div class="v">18</div><div class="s">Assigned to you</div></div>
          <div class="kpi"><div class="l">Overdue</div><div class="v warn">3</div><div class="s">Need attention</div></div>
          <div class="kpi"><div class="l">Done</div><div class="v">42</div><div class="s">This month</div></div>
        </div>
        <div class="actions">
          <div class="action"><div class="action-icon">${I.folder}</div><span>Projects</span></div>
          <div class="action"><div class="action-icon">${I.check}</div><span>My tasks</span></div>
          <div class="action"><div class="action-icon">${I.plus}</div><span>New task</span></div>
          <div class="action"><div class="action-icon">${I.list}</div><span>Workload</span></div>
        </div>
        <div class="scroll">
          <div class="sec">Recent projects</div>
          ${projRow('Website Redesign','WR-24','12 open · Due 30 Sep','62%','#3B82F6','active')}
          ${projRow('Q4 Launch','Q4L','8 open · Due 15 Oct','28%','#8B5CF6','active')}
          <div class="sec">My open tasks</div>
          ${taskRow('Finalize homepage hero','Website Redesign','Due tomorrow','progress')}
          ${taskRow('Review vendor contracts','Office Move','Overdue · 2 days','todo', true)}
          ${taskRow('Ship App Store assets','Q4 Launch','Due Fri','review')}
        </div>
        ${tabbar(0)}`,
      projects: () => `
        ${status()}
        <div class="header row">
          <div class="title-lg">Projects</div>
          <div class="icon-btn">${I.plus}</div>
        </div>
        <div class="search">Search projects</div>
        <div class="chips">
          <div class="chip on">All</div>
          <div class="chip">Planning</div>
          <div class="chip">Active</div>
          <div class="chip">On hold</div>
          <div class="chip">Completed</div>
        </div>
        <div class="scroll">
