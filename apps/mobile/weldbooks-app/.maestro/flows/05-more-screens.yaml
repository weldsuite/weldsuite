appId: com.weldsuite.weldbooks
name: Reports, banking, VAT and settings open
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
- tapOn: "More"
- tapOn: "Contacts"
- assertVisible: "Search contacts"
- back
- tapOn: "Profit & loss"
- assertVisible: "Net profit|Net loss"
- back
- tapOn: "Balance sheet"
- waitForAnimationToEnd
- back
- tapOn: "Bank accounts"
- waitForAnimationToEnd
- back
- tapOn: "VAT returns"
- assertVisible: "All years"
- back
- tapOn: "Reconciliation"
# Without a bank account the screen says so instead of showing the unmatched list.
- extendedWaitUntil:
    visible: "Unmatched|No bank accounts"
    timeout: 10000
- back
- scrollUntilVisible:
    element: "Settings"
- tapOn: "Settings"
- assertVisible: "Base currency"
