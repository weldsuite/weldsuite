appId: com.weldsuite.weldmail
name: Search mail
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
- tapOn: "Search mail"
- extendedWaitUntil:
    visible:
      id: search-input
    timeout: 10000
- tapOn:
    id: search-input
- inputText: "test"
- pressKey: Enter
- waitForAnimationToEnd
- assertVisible:
    id: search-input
# Enter closes the keyboard, so one Back leaves search. (Don't use
# hideKeyboard here: on Android it presses Back too.)
- back
- extendedWaitUntil:
    visible:
      id: inbox-list
    timeout: 10000
