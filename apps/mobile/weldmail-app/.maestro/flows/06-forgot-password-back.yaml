# Android Back on the "Forgot password" step returns to sign-in instead of
# closing the app (the step is local state of the shared LoginScreen, not a route).
appId: com.weldsuite.weldmail
name: Back from forgot password returns to sign-in
tags: [smoke]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- tapOn: "Forgot password?"
- assertVisible: "Forgot your password?"
- hideKeyboard
- back
- assertVisible:
    id: login-email
- assertVisible: "Sign in to your account"
