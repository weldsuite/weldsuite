# Signs in with the e2e test user, starting from a fresh install.
# Credentials come from MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD
# (see .maestro/README.md), never from this file.
appId: com.weldsuite.weldmail
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 30000
- tapOn:
    id: login-email
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn:
    id: login-password
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: inbox-list
    timeout: 45000
