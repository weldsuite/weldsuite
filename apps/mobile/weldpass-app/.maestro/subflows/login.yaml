# Signs in with the e2e test user, starting from a fresh install.
# Credentials come from MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD
# (see .maestro/README.md), never from this file.
#
# WeldPass signs in on the server's own page (WeldID on WeldSuite EU), in a
# Chrome tab: `f-email` and `f-password` are the ids of WeldID's fields
# (weldsuite/weldid, crates/weldid-ui/templates/macros.html), which Chrome
# hands to Maestro as resource ids.
appId: com.weldsuite.weldpass
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: hosted-sign-in
    timeout: 30000
- tapOn:
    id: hosted-sign-in
# Chrome's first-run screens, on an emulator that hasn't opened it yet.
- tapOn:
    text: "Use without an account"
    optional: true
- tapOn:
    text: "No thanks"
    optional: true
- extendedWaitUntil:
    visible:
      id: f-email
    timeout: 30000
- tapOn:
    id: f-email
- inputText: ${MAESTRO_TEST_EMAIL}
- tapOn: "Continue"
- extendedWaitUntil:
    visible:
      id: f-password
    timeout: 30000
- tapOn:
    id: f-password
- inputText: ${MAESTRO_TEST_PASSWORD}
- tapOn: "Sign in"
# Signing in unlocks the app: the lock only asks again later.
- extendedWaitUntil:
    visible: "All items"
    timeout: 45000
