<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WeldCalendar store screens</title>
  <style>
    :root {
      --bg: #fff;
      --text: #0b0b12;
      --muted: #6b7280;
      --subtle: #8e8e93;
      --secondary: #f2f2f7;
      --border: #e5e5ea;
      --brand: #fe466c;
      --brand-tint: rgba(254, 70, 108, 0.12);
      --tab-muted: #999;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #111; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    .phone {
      width: 100%; height: 100%; background: var(--bg);
      display: flex; flex-direction: column; overflow: hidden; position: relative;
    }
    .status {
      height: 54px; padding: 14px 28px 0;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 15px; font-weight: 600; flex-shrink: 0; letter-spacing: -0.2px;
    }
    .status-right { display: flex; gap: 7px; align-items: center; font-size: 13px; }
    .header { padding: 8px 20px 4px; flex-shrink: 0; }
    .header.row { display: flex; align-items: center; justify-content: space-between; }
    .header.compact {
      display: flex; align-items: center; gap: 4px; padding: 8px 8px 10px;
    }
    .title-lg { font-size: 34px; font-weight: 700; letter-spacing: -0.7px; }
    .title-sm { font-size: 17px; font-weight: 600; flex: 1; text-align: center; }
    .subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; text-align: center; }
    .chev { color: var(--muted); font-size: 28px; width: 44px; text-align: center; line-height: 1; font-weight: 300; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center; color: var(--text);
    }
    .scroll { flex: 1; overflow: hidden; padding: 0 16px 12px; }
    .sec { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.4px; margin: 16px 4px 8px; }
    .row {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 12px 4px; border-bottom: 0.5px solid var(--border);
    }
    .dot {
      width: 10px; height: 10px; border-radius: 5px; margin-top: 6px; flex-shrink: 0;
    }
    .main { flex: 1; min-width: 0; }
    .t { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .u { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .m { font-size: 13px; color: var(--subtle); margin-top: 2px; }
    .side { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; padding-top: 2px; }
    .tabwrap { padding: 8px 24px 4px; flex-shrink: 0; }
    .tabbar {
      height: 56px; border-radius: 28px; background: rgba(242,242,247,0.95);
      display: flex; align-items: center; justify-content: space-around;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .tab { width: 44px; height: 44px; border-radius: 22px; color: var(--tab-muted);
      display: flex; align-items: center; justify-content: center; }
    .tab.active { color: var(--brand); background: var(--brand-tint); }
    .home-bar { height: 20px; flex-shrink: 0; }
    .login {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 24px 28px 48px;
    }
    .login-inner { width: 100%; max-width: 440px; }
    .login-mark {
      width: 72px; height: 72px; border-radius: 20px; background: var(--brand-tint);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 30px;
    }
    .welcome { text-align: center; margin-bottom: 40px; }
    .welcome h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .welcome p { font-size: 15px; color: var(--subtle); line-height: 22px; }
    .field {
      width: 100%; height: 44px; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 0 16px; color: #9ca3af; font-size: 16px;
      display: flex; align-items: center; margin-bottom: 14px; background: #fff;
    }
    .signin {
      width: 100%; height: 48px; background: var(--brand); color: #fff; border-radius: 12px;
      font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(254,70,108,0.25);
    }
    .or {
      display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--subtle); font-size: 14px; font-weight: 500;
    }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
    .oauth {
      width: 100%; height: 48px; border: 1px solid #e5e7eb; border-radius: 12px;
      font-weight: 600; font-size: 16px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      margin-bottom: 10px; background: #fff;
    }
    .oauth.apple { background: #000; color: #fff; border: 0; }
    .month-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      padding: 8px 12px 4px; flex-shrink: 0;
    }
    .dow { text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 0; }
    .day {
      aspect-ratio: 1; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 500; position: relative;
    }
    .day.muted { color: #c7c7cc; }
    .day.today { background: var(--brand); color: #fff; font-weight: 700; }
    .day .pip {
      width: 5px; height: 5px; border-radius: 3px; background: var(--brand);
      position: absolute; bottom: 6px;
    }
    .day.today .pip { background: #fff; }
    .cal-card {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 12px; border-radius: 14px; background: var(--secondary); margin-bottom: 10px;
    }
    .cal-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; }
    .cal-card .t { font-size: 16px; font-weight: 600; }
    .cal-card .u { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .detail {
      padding: 8px 20px 16px; flex: 1;
    }
    .detail h2 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin: 8px 0 16px; }
    .meta { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
    .meta .label { width: 72px; font-size: 13px; color: var(--muted); padding-top: 2px; flex-shrink: 0; }
    .meta .val { font-size: 15px; font-weight: 500; }
    .settings-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 4px; border-bottom: 0.5px solid var(--border); font-size: 16px;
    }
    .settings-row .val { color: var(--muted); font-size: 15px; }
    .feature {
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #fff0f3 0%, #fff 48%, #ffe4ec 100%);
      display: flex; align-items: center; padding: 40px 48px; gap: 32px;
    }
    .feature h1 { font-size: 48px; font-weight: 800; letter-spacing: -1.2px; }
    .feature p { font-size: 20px; color: var(--muted); margin-top: 8px; max-width: 520px; line-height: 1.35; }
    .feature-icon {
      width: 120px; height: 120px; border-radius: 28px; background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(254,70,108,0.25); flex-shrink: 0; color: #fff; font-size: 56px;
    }
  </style>
</head>
<body>
  <div class="phone" id="app"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const scene = params.get('scene') || 'agenda';
    const isIos = params.get('platform') !== 'android';
    const svg = (d, w = 24) =>
      `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const I = {
      list: svg('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>'),
      month: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'),
      cals: svg('<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>'),
      more: svg('<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'),
      plus: svg('<path d="M12 5v14M5 12h14"/>'),
      eye: svg('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>'),
      g: `<svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.8-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.8-2.1-6.8-5H1.2v3.1C3.2 21.4 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.3A7.2 7.2 0 0 1 4.8 12c0-.8.1-1.6.4-2.3V6.6H1.2A12 12 0 0 0 0 12c0 1.9.5 3.8 1.2 5.4l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C18 1.2 15.2 0 12 0 7.3 0 3.2 2.6 1.2 6.6l4 3.1c1-2.9 3.6-4.9 6.8-4.9z"/></svg>`,
      apple: `<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.2c1.1-1.5 1.5-2.9 1.5-3 0-.1-2.8-1.1-2.8-4.5zM14.6 5.8c.6-.8 1.1-1.8.9-2.8-.9 0-2 .6-2.6 1.3-.6.7-1.1 1.8-.9 2.8 1 .1 2-.5 2.6-1.3z"/></svg>`,
    };

    const status = () => `<div class="status"><span>9:41</span><span class="status-right">●●●● ▲ 100%</span></div>`;
    const tabbar = (active) => `
      <div class="tabwrap">
        <div class="tabbar">
          <div class="tab ${active===0?'active':''}">${I.list}</div>
          <div class="tab ${active===1?'active':''}">${I.month}</div>
          <div class="tab ${active===2?'active':''}">${I.cals}</div>
          <div class="tab ${active===3?'active':''}">${I.more}</div>
        </div>
      </div>
      <div class="home-bar"></div>`;

    function eventRow(title, cal, time, color) {
      return `<div class="row">
        <div class="dot" style="background:${color}"></div>
        <div class="main"><div class="t">${title}</div><div class="u">${cal}</div></div>
        <div class="side">${time}</div>
      </div>`;
    }

    const scenes = {
      login: () => `
        ${status()}
        <div class="login">
          <div class="login-inner">
            <div class="login-mark" style="font-size:32px;color:var(--brand)">📅</div>
            <div class="welcome">
              <h1>Sign in to WeldCalendar</h1>
              <p>Your schedule on the go</p>
            </div>
            <div class="field">Email address</div>
            <div class="field" style="justify-content:space-between"><span>Password</span>${I.eye}</div>
            <div class="signin">Sign In</div>
            <div class="or">or</div>
            <div class="oauth">${I.g} Continue with Google</div>
            ${isIos ? `<div class="oauth apple">${I.apple} Continue with Apple</div>` : ''}
          </div>
        </div>
        <div class="home-bar"></div>`,
      agenda: () => `
        ${status()}
        <div class="header row">
          <div class="title-lg">Agenda</div>
          <div class="icon-btn">${I.plus}</div>
        </div>
        <div class="scroll">
          <div class="sec">Today · Sat 12 Sep</div>
          ${eventRow('Team standup','Acme · Team','09:00','#3B82F6')}
          ${eventRow('Design review','Product','11:30','#FE466C')}
          ${eventRow('Lunch with Sam','Personal','12:30','#10B981')}
          <div class="sec">Tomorrow</div>
          ${eventRow('Sprint planning','Acme · Team','10:00','#3B82F6')}
          ${eventRow('Dentist','Personal','15:00','#10B981')}
          <div class="sec">Mon 14 Sep</div>
          ${eventRow('All-hands','Company','16:00','#8B5CF6')}
        </div>
        ${tabbar(0)}`,
      month: () => `
        ${status()}
        <div class="header row">
          <div class="title-lg">September</div>
          <div class="icon-btn">${I.plus}</div>
        </div>
        <div class="month-grid">
          ${['S','M','T','W','T','F','S'].map(d => `<div class="dow">${d}</div>`).join('')}
          ${[
            ['31','muted',false],['1','',true],['2','',false],['3','',true],['4','',false],['5','',true],['6','',false],
            ['7','',false],['8','',true],['9','',false],['10','',true],['11','',false],['12','today',true],['13','',true],
            ['14','',true],['15','',false],['16','',true],['17','',false],['18','',false],['19','',true],['20','',false],
            ['21','',false],['22','',true],['23','',false],['24','',false],['25','',true],['26','',false],['27','',false],
            ['28','',false],['29','',true],['30','',false],['1','muted',false],['2','muted',false],['3','muted',true],['4','muted',false],
          ].map(([n, cls, pip]) => `<div class="day ${cls}">${n}${pip?'<div class="pip"></div>':''}</div>`).join('')}
        </div>
        <div class="scroll">
          <div class="sec">12 Sep</div>
          ${eventRow('Team standup','Acme · Team','09:00','#3B82F6')}
          ${eventRow('Design review','Product','11:30','#FE466C')}
          ${eventRow('Lunch with Sam','Personal','12:30','#10B981')}
        </div>
        ${tabbar(1)}`,
      calendars: () => `
        ${status()}
        <div class="header row">
          <div class="title-lg">Calendars</div>
          <div class="icon-btn">${I.plus}</div>
        </div>
        <div class="scroll">
          <div class="sec">Workspace</div>
          <div class="cal-card"><div class="cal-swatch" style="background:#3B82F6"></div><div><div class="t">Acme · Team</div><div class="u">12 upcoming</div></div></div>
          <div class="cal-card"><div class="cal-swatch" style="background:#FE466C"></div><div><div class="t">Product</div><div class="u">5 upcoming</div></div></div>
          <div class="cal-card"><div class="cal-swatch" style="background:#8B5CF6"></div><div><div class="t">Company</div><div class="u">2 upcoming</div></div></div>
          <div class="sec">Personal</div>
          <div class="cal-card"><div class="cal-swatch" style="background:#10B981"></div><div><div class="t">Personal</div><div class="u">4 upcoming</div></div></div>
        </div>
        ${tabbar(2)}`,
      event: () => `
        ${status()}
        <div class="header compact">
          <div class="chev">‹</div>
          <div class="title-sm">Event</div>
          <div class="icon-btn" style="color:var(--brand);font-weight:600;font-size:15px;width:auto;padding:0 8px">Edit</div>
        </div>
        <div class="detail">
          <h2>Design review</h2>
          <div class="meta"><div class="label">When</div><div class="val">Sat 12 Sep · 11:30 – 12:15</div></div>
          <div class="meta"><div class="label">Calendar</div><div class="val"><span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:#FE466C;margin-right:6px"></span>Product</div></div>
          <div class="meta"><div class="label">Where</div><div class="val">Studio · Room B</div></div>
          <div class="meta"><div class="label">Notes</div><div class="val">Walk through homepage hero variants and ship the chosen set.</div></div>
        </div>
        <div class="home-bar"></div>`,
      more: () => `
        ${status()}
        <div class="header"><div class="title-lg">More</div></div>
        <div class="scroll">
          <div class="settings-row"><span>Account</span><span class="val">you@acme.com</span></div>
          <div class="settings-row"><span>Workspace</span><span class="val">Acme Studio</span></div>
          <div class="settings-row"><span>Appearance</span><span class="val">System</span></div>
          <div class="settings-row"><span>Notifications</span><span class="val">On</span></div>
          <div class="settings-row"><span>Privacy</span><span class="val">›</span></div>
          <div class="settings-row"><span>Product</span><span class="val">WeldCalendar</span></div>
        </div>
        ${tabbar(3)}`,
      feature: () => `
        <div class="feature">
          <div class="feature-icon">📅</div>
          <div>
            <h1>WeldCalendar</h1>
            <p>Your schedule on the go — agenda, month view, and team calendars.</p>
          </div>
        </div>`,
    };

    document.getElementById('app').innerHTML = (scenes[scene] || scenes.agenda)();
  </script>
</body>
</html>
