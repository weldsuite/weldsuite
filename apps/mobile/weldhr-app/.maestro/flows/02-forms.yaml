appId: com.weldsuite.weldhr
name: Shift, leave and expense forms open, validate and close without saving
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
# Each tab's round + adds what that tab is about; Home has none. On Schedule it
# opens a shift request straight away.
- tapOn:
    id: tab-schedule
- tapOn:
    id: tab-add
- assertVisible: "Request a shift"
- assertVisible: "8h 0m"
- tapOn:
    id: screen-close
# On Absence: time off (only when leave requests are switched on for the
# workspace) and reporting sick.
- tapOn:
    id: tab-absence
- tapOn:
    id: tab-add
- runFlow:
    when:
      visible:
        id: add-leave
    commands:
      - tapOn:
          id: add-leave
      - assertVisible: "Request time off"
      - assertVisible: "About .* working day.*"
      - tapOn:
          id: screen-close
# Without leave requests the card stays open on reporting sick: close it.
- runFlow:
    when:
      visible:
        id: add-sick
    commands:
      - tapOn:
          id: add-menu-close
- tapOn:
    id: tab-expenses
- tapOn:
    id: tab-add
# With expenses switched on, the + is about the receipt, and both its buttons
# open the camera or the photos first; the form is opened by its link instead.
- runFlow:
    when:
      visible:
        id: add-receipt-upload
    commands:
      - tapOn:
          id: add-menu-close
      - openLink: weldhr://expense/new
      - assertVisible: "New expense"
      # Submitting empty is caught in the app; nothing is sent.
      - hideKeyboard
      - tapOn:
          id: expense-submit
      - assertVisible: "Enter an amount above zero."
      - tapOn:
          id: expense-amount
      - inputText: "12,50"
      - hideKeyboard
      - tapOn:
          id: expense-submit
      - assertVisible: "Say what the expense was for."
      - tapOn:
          id: screen-close
# Without expenses the + has the usual card: close it.
- runFlow:
    when:
      visible:
        id: add-sick
    commands:
      - tapOn:
          id: add-menu-close
- assertVisible:
    id: tab-expenses
