appId: com.weldsuite.weldhr
name: Shift, leave and expense forms open, validate and close without saving
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
# Every form starts from the round + above the tab bar.
- tapOn:
    id: tab-add
- tapOn:
    id: add-shift
- assertVisible: "Request a shift"
- assertVisible: "8h 0m"
- tapOn:
    id: screen-close
# "Request time off" is only in the menu when leave requests are switched on for the workspace.
- tapOn:
    id: tab-add
- runFlow:
    when:
      visible:
        id: add-leave
    commands:
      - tapOn:
          id: add-leave
      - assertVisible: "Request time off"
      - assertVisible: "About .* working day.*"
      - tapOn:
          id: screen-close
- runFlow:
    when:
      visible:
        id: add-shift
    commands:
      - tapOn: "Close"
- tapOn:
    id: tab-expenses
- tapOn:
    id: tab-add
- runFlow:
    when:
      visible:
        id: add-expense
    commands:
      - tapOn:
          id: add-expense
      - assertVisible: "New expense"
      # Submitting empty is caught in the app; nothing is sent.
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: expense-submit
      - tapOn:
          id: expense-submit
      - assertVisible: "Enter an amount above zero."
      - tapOn:
          id: expense-amount
      - inputText: "12,50"
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: expense-submit
      - tapOn:
          id: expense-submit
      - assertVisible: "Say what the expense was for."
      - scrollUntilVisible:
          element:
            id: screen-close
          direction: UP
      - tapOn:
          id: screen-close
- runFlow:
    when:
      visible:
        id: add-shift
    commands:
      - tapOn: "Close"
- assertVisible:
    id: tab-expenses
