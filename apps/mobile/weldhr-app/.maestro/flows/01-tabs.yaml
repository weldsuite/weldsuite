appId: com.weldsuite.weldhr
name: Every tab loads for the test user
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
# Home shows My HR, or says why there is none (no employee record / no access).
- extendedWaitUntil:
    visible: "My schedule|No employee record yet|My HR is not available"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: tab-schedule
    commands:
      - tapOn:
          id: tab-schedule
      - assertVisible: "Week .*"
- runFlow:
    when:
      visible:
        id: tab-absence
    commands:
      - tapOn:
          id: tab-absence
      # Either the overview, or why My HR is empty for this account.
      - assertVisible: "Requests|No employee record yet|My HR is not available"
- runFlow:
    when:
      visible:
        id: tab-expenses
    commands:
      - tapOn:
          id: tab-expenses
      - assertVisible: "Expenses"
- runFlow:
    when:
      visible:
        id: tab-announcements
    commands:
      - tapOn:
          id: tab-announcements
      # Either the list, or the empty state.
      - assertVisible: "Announcements|No announcements|No employee record yet|My HR is not available"
# The profile and settings open from the workspace menu at the top of Home.
- tapOn:
    id: tab-home
- tapOn:
    id: home-workspace
- tapOn: "Profile and settings"
- scrollUntilVisible:
    element:
      id: me-sign-out
- assertVisible:
    id: me-sign-out
- tapOn:
    id: screen-back
