appId: com.weldsuite.weldhr
name: Switching to Dutch translates the app, and back
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
# The settings are on the profile page, opened from the workspace menu on Home.
- tapOn:
    id: home-workspace
- tapOn: "Profile and settings"
- scrollUntilVisible:
    element: "Nederlands"
- tapOn: "Nederlands"
- assertVisible: "Instellingen"
- tapOn:
    id: screen-back
- assertVisible: "Mijn rooster|Nog geen medewerkersdossier|Mijn HR is niet beschikbaar"
- tapOn:
    id: home-workspace
- tapOn: "Profiel en instellingen"
- scrollUntilVisible:
    element: "English"
- tapOn: "English"
- assertVisible: "Settings"
