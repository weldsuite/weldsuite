appId: com.weldsuite.weldhr
name: Switching to Dutch translates the app, and back
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
# The settings are on the profile page, opened from the workspace at the top of Home.
- tapOn:
    id: home-workspace
- scrollUntilVisible:
    element: "Nederlands"
- tapOn: "Nederlands"
- assertVisible: "Taal"
- tapOn:
    id: screen-back
- assertVisible: "Mijn rooster|Nog geen medewerkersdossier|Mijn HR is niet beschikbaar"
- tapOn:
    id: home-workspace
- scrollUntilVisible:
    element: "English"
- tapOn: "English"
- assertVisible: "Language"
