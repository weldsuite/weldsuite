appId: ${APP_ID || "com.weldsuite.welddesk.dev"}
name: Open a conversation, leave a note, assign it to me and unassign it
# Writes to the workspace: a note (internal, never sent to the customer) and
# assignment events on the first open conversation. The workspace needs at
# least one open conversation (the helpdesk widget's test page makes one).
tags: [writes]
---
- runFlow: ../subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: conversation-list
    timeout: 30000
- tapOn: "Open"
# The first conversation in the list (rows are `conversation-<number>`).
- tapOn:
    id: "conversation-[0-9]+"
    index: 0
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- assertVisible:
    id: thread
# A note: internal, so the customer gets nothing.
- tapOn: "Note"
- tapOn:
    id: composer-input
- inputText: "Maestro note"
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: "Maestro note"
    timeout: 15000
# Assigning happens in the sheet behind the assignee button in the top bar,
# as on the platform: it lists the team, searchable, with "Assign to me"
# first (unless it is yours already) and "Unassign" last.
- tapOn:
    id: change-assignee
- extendedWaitUntil:
    visible:
      id: assignee-search
    timeout: 15000
- assertVisible: "Search team members"
# Picking someone closes the sheet. If it was assigned to me already, there
# is nothing to pick: close the sheet instead.
- tapOn:
    id: assign-to-me
    optional: true
- runFlow:
    when:
      visible:
        id: assignee-search
      platform: Android
    commands:
      - back
- runFlow:
    when:
      visible:
        id: assignee-search
      platform: iOS
    commands:
      - tapOn: "Close"
# Now it is mine: unassign it.
- tapOn:
    id: change-assignee
- extendedWaitUntil:
    visible:
      id: assignee-unassign
    timeout: 15000
- tapOn:
    id: assignee-unassign
# Unassigned, the sheet offers "Assign to me" again and no "Unassign".
- tapOn:
    id: change-assignee
- extendedWaitUntil:
    visible:
      id: assign-to-me
    timeout: 15000
- assertNotVisible:
    id: assignee-unassign
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Close"
