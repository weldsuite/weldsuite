appId: ${APP_ID || "com.weldsuite.welddesk.dev"}
name: Open a conversation, leave a note, assign it to me and unassign it
# Writes to the workspace: a note (internal, never sent to the customer) and
# assignment events on the first open conversation. The workspace needs at
# least one open conversation (the helpdesk widget's test page makes one).
tags: [writes]
---
- runFlow: ../subflows/login.yaml
- extendedWaitUntil:
    visible:
      id: conversation-list
    timeout: 30000
- tapOn: "Open"
# The first conversation in the list (rows are `conversation-<number>`).
- tapOn:
    id: "conversation-[0-9]+"
    index: 0
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 30000
- assertVisible:
    id: thread
# A note: internal, so the customer gets nothing.
- tapOn: "Note"
- tapOn:
    id: composer-input
- inputText: "Maestro note"
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: "Maestro note"
    timeout: 15000
# Assign to me (unless it is already), then unassign.
- tapOn:
    id: assign-to-me
    optional: true
- extendedWaitUntil:
    visible:
      id: unassign
    timeout: 15000
- tapOn:
    id: unassign
- extendedWaitUntil:
    visible:
      id: assign-to-me
    timeout: 15000
# The picker lists the team, searchable.
- tapOn:
    id: change-assignee
- assertVisible: "Assign conversation"
- assertVisible: "Search team members"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Close"
