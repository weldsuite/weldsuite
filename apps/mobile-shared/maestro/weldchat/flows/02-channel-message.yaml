appId: ${APP_ID || "com.weldsuite.weldchat.dev"}
name: Post and delete a channel message
tags: [smoke, writes]
---
# Uses one public channel, #e2e-maestro, created on the first run and kept
# (delete it from its channel details screen to start clean). Each run posts
# a uniquely stamped message and deletes it.
- runFlow: ../subflows/login.yaml
- evalScript: ${output.msg = 'E2E message ' + Date.now()}

# Home lists the channel sections below Direct Messages and the record chats,
# as the platform's sidebar does: scroll to the channel when it is there, so
# "not visible" below means it doesn't exist yet.
- scrollUntilVisible:
    element: "e2e-maestro"
    direction: DOWN
    timeout: 15000
    optional: true

# First run: Home's compose menu, a public channel. Creating it opens it.
- runFlow:
    when:
      notVisible: "e2e-maestro"
    commands:
      - tapOn:
          id: home-compose
      - tapOn:
          id: compose-channel
      - extendedWaitUntil:
          visible:
            id: new-channel-name
          timeout: 10000
      - tapOn:
          id: new-channel-name
      - inputText: "e2e-maestro"
      - tapOn:
          id: new-channel-next
      - tapOn:
          id: new-channel-public
      - tapOn:
          id: new-channel-next

# Later runs: open it from Home.
- runFlow:
    when:
      notVisible:
        id: composer-input
    commands:
      - tapOn: "e2e-maestro"

- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 15000
- tapOn:
    id: composer-input
- inputText: ${output.msg}
- tapOn:
    id: composer-send
- extendedWaitUntil:
    visible: ${output.msg}
    timeout: 15000

# Clean up. The keyboard is still open after sending: long-pressing closes it
# so the actions sheet shows in full. Delete asks first (Android tags the
# dialog's button `confirm`; on iOS it is the alert's Delete).
- longPressOn: ${output.msg}
- tapOn:
    id: action-delete
- tapOn:
    id: confirm
    optional: true
- tapOn:
    text: "^Delete$"
    optional: true
- extendedWaitUntil:
    notVisible: ${output.msg}
    timeout: 15000
