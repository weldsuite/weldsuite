appId: ${APP_ID || "com.weldsuite.weldcalendar.dev"}
name: Agenda and tabs load
tags: [smoke]
---
- runFlow: ../subflows/login.yaml
- assertVisible:
    id: agenda-list
# Month: the grid, a step forward and back, and today again.
- tapOn:
    id: tab-month
- assertVisible:
    id: month-grid
- tapOn:
    id: month-next
- tapOn:
    id: month-previous
- tapOn:
    id: month-today
# Calendars: the person's own calendars.
- tapOn:
    id: tab-calendars
- extendedWaitUntil:
    visible: "My Calendars"
    timeout: 15000
# More: the privacy links and the shared settings with sign-out.
- tapOn:
    id: tab-more
- assertVisible:
    id: privacy-policy
- scrollUntilVisible:
    element:
      id: sign-out
- tapOn:
    id: tab-agenda
- assertVisible:
    id: agenda-list
