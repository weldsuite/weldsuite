openapi: 3.0.3
info:
  title: WeldHR API (native apps)
  version: 1.0.0
  description: |
    What the native WeldHR apps call (`rust/modules/hr`, `/api/weldhr`):
    My HR, the signed-in member's own employee record (`/me`), and the team
    views a manager gets with the matching permission.

    Hand-written; the Rust server is the source of truth: change both
    together, and see "Changing the contract" in apps/mobile-shared/README.md
    for what apps already on phones can read.

    Checked against the server in rust/modules/hr/tests/openapi_contract.rs.

    Every request carries `Authorization: Bearer <WeldID access token>` and
    names its workspace in `X-Weld-Workspace`.

    Not in this file, because the checker reads JSON only: the receipt upload
    (`POST /api/weldhr/me/declarations/{id}/receipt`, multipart `file`) and
    the files the app opens (`GET …/receipt`, `GET /me/payslips/{id}/pdf`,
    `GET /me/annual-statements/{year}?employerId=`). Nor
    `GET /api/me/permissions`, which the server's own binary serves.

    Statuses, categories and kinds are plain strings: the apps map the
    values they know and show the rest as they come.
servers:
  - url: https://app.weldsuite.eu
paths:
  /api/weldhr/me:
    get:
      operationId: getMe
      summary: The caller's employee record (null when none is linked) and what My HR lets them do.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/overview:
    get:
      operationId: getMyOverview
      summary: Home's figures. 404 without a linked employee record.
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverviewResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/attendance:
    get:
      operationId: getMyAttendance
      summary: The caller's shifts, clocked hours and shift requests between two days (at most 92 apart).
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: The range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAttendanceResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/clock:
    post:
      operationId: clockMe
      summary: Clock in, out, or over to another shift. Sends the phone's position where the workspace requires being at a work location.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClockInput'
      responses:
        '200':
          description: The record opened or closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClockResultResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/leave:
    get:
      operationId: getMyLeave
      summary: The leave types, this year's balances and the caller's requests.
      responses:
        '200':
          description: Leave.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyLeaveResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: requestLeave
      summary: Ask for time off. A type that needs no approval is approved at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequestInput'
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestRowResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/leave/{id}/cancel:
    post:
      operationId: cancelMyLeave
      summary: Cancel a pending request, or approved leave that has not started.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The cancelled request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestRowResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/shift-requests:
    post:
      operationId: requestShift
      summary: Ask to work a shift; a manager approves or declines it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftRequestInput'
      responses:
        '201':
          description: The request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyShiftRequestResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/shift-requests/{id}/cancel:
    post:
      operationId: cancelMyShiftRequest
      summary: Withdraw a request or an open-shift sign-up that is still waiting.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The withdrawn request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyShiftRequestResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/open-shifts:
    get:
      operationId: listMyOpenShifts
      summary: Open shifts the caller can sign up for, and the ones they did.
      responses:
        '200':
          description: The open shifts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyOpenShiftList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/open-shifts/{id}/sign-up:
    post:
      operationId: signUpForOpenShift
      summary: Sign up for an open shift; a manager picks who gets it.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: The sign-up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyShiftRequestResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/announcements:
    get:
      operationId: listMyAnnouncements
      summary: Announcements meant for the caller, pinned first, then the newest.
      responses:
        '200':
          description: The announcements and how many are unread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAnnouncementsResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/announcements/{id}/read:
    post:
      operationId: markAnnouncementRead
      summary: Mark an announcement read (once; reading it again keeps the first time).
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: When it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementReadResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/absences:
    get:
      operationId: getMyAbsences
      summary: The caller's open sick report and the earlier ones.
      responses:
        '200':
          description: Sick reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAbsencesResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: reportSick
      summary: Report sick, from today or a few days back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SickReportInput'
      responses:
        '201':
          description: The report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRowResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/absences/{id}/recover:
    post:
      operationId: reportRecovered
      summary: Close the open sick report on its last sick day.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverInput'
      responses:
        '200':
          description: The closed report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceRowResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/declarations:
    get:
      operationId: getMyDeclarations
      summary: The caller's expense claims, and what is still open per currency.
      responses:
        '200':
          description: The claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyDeclarationsResponse'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createDeclaration
      summary: File an expense claim. The receipt goes up afterwards, as multipart (not in this file).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclarationInput'
      responses:
        '201':
          description: The claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/declarations/{id}/cancel:
    post:
      operationId: cancelMyDeclaration
      summary: Withdraw a claim that is still waiting for a decision.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The withdrawn claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/tasks:
    get:
      operationId: listMyTasks
      summary: Onboarding and offboarding tasks shown to the caller.
      responses:
        '200':
          description: The tasks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyTaskList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/tasks/{id}/complete:
    post:
      operationId: completeMyTask
      summary: Tick a task off, or with `undo=true` on again.
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: undo
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Whether that completed the checklist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompletionResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/coaching:
    get:
      operationId: listMyCoaching
      summary: Coaching notes shared with the caller.
      responses:
        '200':
          description: The notes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyCoachingList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/coaching/{id}/acknowledge:
    post:
      operationId: acknowledgeCoaching
      summary: Mark a coaching note read, with an optional comment.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeInput'
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/evaluations:
    get:
      operationId: listMyEvaluations
      summary: Evaluations submitted for the caller.
      responses:
        '200':
          description: The evaluations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEvaluationList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/evaluations/{id}/acknowledge:
    post:
      operationId: acknowledgeEvaluation
      summary: Mark an evaluation read, with an optional comment.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeInput'
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/payslips:
    get:
      operationId: listMyPayslips
      summary: The caller's final payslips, newest first. 404 while payroll is off for the workspace.
      responses:
        '200':
          description: The payslips.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayslipList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/me/annual-statements:
    get:
      operationId: listMyAnnualStatements
      summary: The years and employers the caller has an annual statement for. 404 while payroll is off.
      responses:
        '200':
          description: The statements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnualStatementList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/leave-requests:
    get:
      operationId: listLeaveRequests
      summary: Everyone's leave requests (`leave:read`), by status and overlapping a range of days.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: The requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/leave-requests/{id}/review:
    post:
      operationId: reviewLeaveRequest
      summary: Approve or decline a pending request (`leave:approve`).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '200':
          description: The reviewed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaveRequestRowResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/declarations:
    get:
      operationId: listDeclarations
      summary: Everyone's expense claims (`declarations:read`), by status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: The claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/declarations/{id}/review:
    post:
      operationId: reviewDeclaration
      summary: Approve or decline a pending claim (`declarations:approve`).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '200':
          description: The reviewed claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeclarationResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/absences:
    get:
      operationId: listAbsences
      summary: Everyone's sick reports (`absences:read`), newest first.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A page of reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/shifts:
    get:
      operationId: listShifts
      summary: Everyone's shifts between two days (`attendance:read`).
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        '200':
          description: The shifts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/attendance:
    get:
      operationId: listAttendance
      summary: Everyone's clocked hours between two days (`attendance:read`).
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: to
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A page of records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/employees:
    get:
      operationId: listEmployees
      summary: The employee directory (`employees:read`), public fields only.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: A page of employees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/employees/{id}:
    get:
      operationId: getEmployee
      summary: One colleague's public card, with their direct reports.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The employee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDetailResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldhr/announcements:
    post:
      operationId: createAnnouncement
      summary: Post an announcement to every employee (`announcements:create`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementInput'
      responses:
        '201':
          description: The announcement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Pagination:
      type: object
      required: [totalCount, hasMore, cursor]
      properties:
        totalCount:
          type: integer
        hasMore:
          type: boolean
        cursor:
          type: string
          nullable: true

    # My HR -------------------------------------------------------------------
    Features:
      type: object
      description: What My HR lets employees do (WeldHR settings, Self-service).
      required: [selfClockIn, clockInRequiresLocation, leaveRequests, declarations]
      properties:
        selfClockIn:
          type: boolean
        clockInRequiresLocation:
          type: boolean
          description: Clocking needs the phone at a work location; send `location` with the clock call.
        leaveRequests:
          type: boolean
        declarations:
          type: boolean
    ManagerRef:
      type: object
      required: [displayName, email]
      properties:
        displayName:
          type: string
        email:
          type: string
          nullable: true
    Profile:
      type: object
      required: [id, displayName, email, status, employmentType]
      properties:
        id:
          type: string
        displayName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        jobTitle:
          type: string
          nullable: true
        employeeNumber:
          type: string
          nullable: true
        status:
          type: string
          description: onboarding, active, on_leave, offboarding or terminated.
        employmentType:
          type: string
        startDate:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        departmentName:
          type: string
          nullable: true
        manager:
          allOf:
            - $ref: '#/components/schemas/ManagerRef'
          nullable: true
    Me:
      type: object
      required: [employee, features]
      properties:
        employee:
          allOf:
            - $ref: '#/components/schemas/Profile'
          nullable: true
          description: Null when the member is not linked to an (active) employee record.
        features:
          $ref: '#/components/schemas/Features'
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Me'
    ClockState:
      type: object
      required: [clockedIn, since, shiftId]
      properties:
        clockedIn:
          type: boolean
        since:
          type: string
          nullable: true
        shiftId:
          type: string
          nullable: true
          description: The shift the open record is on.
    UpcomingShift:
      type: object
      required: [id, startsAt, endsAt, companyName]
      properties:
        id:
          type: string
        startsAt:
          type: string
        endsAt:
          type: string
        companyName:
          type: string
          nullable: true
    Acknowledgements:
      type: object
      required: [coaching, evaluations]
      properties:
        coaching:
          type: integer
        evaluations:
          type: integer
    Overview:
      type: object
      required: [clock, upcomingShifts, openTasks, toAcknowledge, unreadAnnouncements, openShifts]
      properties:
        clock:
          $ref: '#/components/schemas/ClockState'
        upcomingShifts:
          type: array
          description: The caller's shifts today and the next 13 days.
          items:
            $ref: '#/components/schemas/UpcomingShift'
        openTasks:
          type: integer
        toAcknowledge:
          $ref: '#/components/schemas/Acknowledgements'
        unreadAnnouncements:
          type: integer
        openShifts:
          type: integer
          description: Open shifts with a spot left that the caller has not signed up for.
        latestEvaluation:
          allOf:
            - $ref: '#/components/schemas/LatestEvaluation'
          nullable: true
          description: The newest evaluation shared with the caller (submitted or acknowledged); null without one.
        milestones:
          $ref: '#/components/schemas/Milestones'
    LatestEvaluation:
      type: object
      required: [id]
      properties:
        id:
          type: string
        overallScore:
          type: number
          format: double
          nullable: true
          description: 0 to 100.
        formName:
          type: string
          nullable: true
        submittedAt:
          type: string
          nullable: true
    Milestones:
      type: object
      required: [achieved, open]
      properties:
        achieved:
          type: integer
        open:
          type: integer
          description: Planned or in progress.
    OverviewResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Overview'
    MyAttendanceRecord:
      type: object
      required: [id, date, clockIn, clockOut, breakMinutes, workedMinutes, lateMinutes, status, source, approved, companyName, shiftId, notes, hourlyRate, currency]
      properties:
        id:
          type: string
        date:
          type: string
