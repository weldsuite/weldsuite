openapi: 3.0.3
info:
  title: WeldBooks API (native apps)
  version: 1.0.0
  description: |
    What the native WeldBooks apps call. Hand-written; the Rust server is the
    source of truth: change both together, and see "Changing the contract"
    in apps/mobile-shared/README.md for what apps already on phones can read.

    Checked against the server, one test file per crate that serves the
    routes (rust/modules/books, books-banking, books-purchases,
    books-reports, books-sales, books-sales-tax and books-tax, each in
    tests/openapi_contract.rs).

    Every request carries `Authorization: Bearer <WeldID access token>`,
    names its workspace in `X-Weld-Workspace` and its company in
    `X-Accounting-Entity-Id` (the workspace default without it).

    Not here, called directly by the apps: the storage upload broker
    (`/api/storage/generate-upload-url`, the upload itself,
    `/api/storage/confirm-upload`, `/api/storage/private/<key>`) and the
    printable invoice (`GET /api/invoices/{id}/pdf`, HTML).
servers:
  - url: https://app.weldsuite.eu
paths:
  /api/accounting-entities:
    get:
      operationId: listAccountingEntities
      summary: The companies with WeldBooks on that the caller can see.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEntityList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAccountingEntity
      summary: Create a company and seed its chart of accounts, tax rates and number sequences.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEntityResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-entities/jurisdictions:
    get:
      operationId: listJurisdictions
      summary: The supported countries with their features and words.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JurisdictionList'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-entities/{id}:
    get:
      operationId: getAccountingEntity
      summary: One company.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEntityResponse'
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateAccountingEntity
      summary: Change the name, tax ids, bank details or address of a company.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntityUpdate'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingEntityResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/gl-accounts:
    get:
      operationId: listGlAccounts
      summary: The chart of accounts of the current company.
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlAccountList'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-dashboard:
    get:
      operationId: getAccountingDashboard
      summary: The key figures of the current company.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-reports/profit-loss:
    get:
      operationId: getProfitLoss
      summary: Revenue, expenses and profit over a period.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitLossResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-reports/balance-sheet:
    get:
      operationId: getBalanceSheet
      summary: Assets, liabilities and equity today.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceSheetResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/vat-returns:
    get:
      operationId: listVatReturns
      summary: The Dutch VAT returns of the current company, newest first.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatReturnList'
        default:
          $ref: '#/components/responses/Error'
  /api/vat-returns/{id}:
    get:
      operationId: getVatReturn
      summary: One VAT return.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatReturnResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/vat-returns/{id}/file:
    post:
      operationId: fileVatReturn
      summary: File the return with the tax authority.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatFilingResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices:
    get:
      operationId: listInvoices
      summary: Invoices and credit notes, newest first.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: contactId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createInvoice
      summary: 'Create a draft invoice; it gets its number now.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRecordResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}:
    get:
      operationId: getInvoice
      summary: One invoice with its lines.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteInvoice
      summary: Delete a draft.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedMessageResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}/finalize:
    post:
      operationId: finalizeInvoice
      summary: Book a draft. Refused while the company lacks invoice fields.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizedInvoiceResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}/send:
    patch:
      operationId: sendInvoice
      summary: Mark as sent, booking a draft first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}/status:
    patch:
      operationId: setInvoiceStatus
      summary: Cancel a draft or write a booked invoice off.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceStatusInput'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}/record-payment:
    post:
      operationId: recordInvoicePayment
      summary: Record money received against a booked invoice.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedPaymentResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}/duplicate:
    post:
      operationId: duplicateInvoice
      summary: Copy an invoice to a new draft.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRecordResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/invoices/{id}/credit-note:
    post:
      operationId: createCreditNote
      summary: A draft credit note reversing a booked invoice.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRecordResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/payments:
    post:
      operationId: createPayment
      summary: Record a payment, here money paid on a bill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRecordResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/sales-tax/calculate:
    post:
      operationId: calculateSalesTax
      summary: 'The tax of a document as it would be booked; nothing is saved.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesTaxInput'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesTaxPreviewResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/bills:
    get:
      operationId: listBills
      summary: Bills, newest first.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBill
      summary: Create a draft bill.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRecordResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/bills/{id}:
    get:
      operationId: getBill
      summary: One bill with its lines.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBill
      summary: Delete a draft bill.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Error'
  /api/bills/{id}/approve:
    patch:
      operationId: approveBill
      summary: Approve and book a bill.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/bills/{id}/reject:
    patch:
      operationId: rejectBill
      summary: 'Reject a bill; it is cancelled.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillRejectInput'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/bills/from-document/{id}:
    post:
      operationId: billFromDocument
      summary: A bill form filled in from a read document.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillPrefillResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-documents:
    post:
      operationId: createAccountingDocument
      summary: Register an uploaded file (a receipt) as a document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRecordResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-documents/{id}:
    get:
      operationId: getAccountingDocument
      summary: One document, with the key of its file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingDocumentResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-documents/{id}/process:
    post:
      operationId: processAccountingDocument
      summary: Read the document with OCR. Costs AI credits.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessedDocumentResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-contacts:
    get:
      operationId: listAccountingContacts
      summary: Customers and suppliers, newest first.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactList'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAccountingContact
      summary: Create a customer or supplier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-contacts/{id}:
    get:
      operationId: getAccountingContact
      summary: One contact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccountingContact
      summary: Delete a contact nothing refers to.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Done.
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-contacts/{id}/balance:
    get:
      operationId: getContactBalance
      summary: What the contact owes and is owed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactBalanceResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-contacts/{id}/invoices:
    get:
      operationId: listContactInvoices
      summary: The contact’s invoices, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceArray'
        default:
          $ref: '#/components/responses/Error'
  /api/accounting-contacts/{id}/bills:
    get:
      operationId: listContactBills
      summary: The contact’s bills, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillArray'
        default:
          $ref: '#/components/responses/Error'
  /api/bank-accounts:
    get:
      operationId: listBankAccounts
      summary: The bank accounts of the current company.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountList'
        default:
          $ref: '#/components/responses/Error'
  /api/bank-accounts/{id}:
    get:
      operationId: getBankAccount
      summary: One bank account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankAccountResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/bank-transactions:
    get:
      operationId: listBankTransactions
      summary: Bank statement lines, newest first.
      parameters:
        - name: bankAccountId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionList'
        default:
          $ref: '#/components/responses/Error'
  /api/bank-transactions/{id}/suggestions:
    get:
      operationId: listMatchSuggestions
      summary: What a bank line may pay, best first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchSuggestionList'
        default:
          $ref: '#/components/responses/Error'
  /api/bank-transactions/{id}/reconcile:
    post:
      operationId: reconcileTransaction
      summary: Match a bank line to an invoice or bill.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileInput'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResultResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      description: 'The standard `{ code, message, details? }`; a validation failure sends `issues` and `name` instead, so neither code nor message is required.'
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetails'
    ErrorDetails:
      type: object
      description: 'What some refusals add: `ENTITY_INVOICE_FIELDS_MISSING` (finalise) names the company fields that are missing.'
      properties:
        code:
          type: string
        missingFields:
          type: array
          items:
            type: string
    Pagination:
      type: object
      required: [totalCount, hasMore]
      properties:
        totalCount:
          type: integer
        hasMore:
          type: boolean
        cursor:
          type: string
          nullable: true
    PostalAddress:
      type: object
      description: An address as books stores it, every part optional.
      properties:
        line1:
          type: string
        line2:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
        county:
          type: string
    CreatedRecord:
      type: object
      description: The id of what was created.
      required: [id]
      properties:
        id:
          type: string
    CreatedRecordResponse:
      type: object
      required: [data]
      properties:
