openapi: 3.0.3
info:
  title: WeldPass API (native apps)
  version: 1.0.0
  description: |
    The WeldPass endpoints the native WeldPass app uses
    (`rust/modules/pass`). It grows with the app.

    Hand-written. The Rust server is the source of truth: change both
    together, and see "Changing the contract" in apps/mobile-shared/README.md
    for what apps already on phones can read.

    Lists carry no secrets: a password only travels on `revealItem`.
servers:
  - url: https://app.weldsuite.eu
paths:
  /api/weldpass/vaults:
    get:
      operationId: listVaults
      summary: The vaults the caller can see, with item and member counts.
      responses:
        '200':
          description: The vaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/items:
    get:
      operationId: listItems
      summary: Every item the caller can open, across vaults. No secrets.
      parameters:
        - name: vaultId
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [login, note, card]
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/vaults/{vaultId}/items:
    post:
      operationId: createItem
      summary: Add an item to a vault. Needs the editor or manager role.
      parameters:
        - $ref: '#/components/parameters/VaultId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: The new item, without its secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/vaults/{vaultId}/items/{itemId}:
    put:
      operationId: updateItem
      summary: Replace the whole item. Send every field of its type, not only the changed ones.
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200':
          description: The changed item, without its secrets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteItem
      summary: Delete the item for everyone in the vault.
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/password-health:
    get:
      operationId: passwordHealth
      summary: Weak, reused and old passwords in the vaults the caller can open. No password is sent.
      responses:
        '200':
          description: The report, worst first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReportResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/devices:
    post:
      operationId: registerDevice
      summary: Register this phone for an offline copy (PASS-010). Its id names it in every sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDevice'
      responses:
        '201':
          description: The device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listDevices
      summary: The caller's devices, newest first.
      responses:
        '200':
          description: The devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      summary: Revoke a device. Its copy is wiped at its next sync.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/devices/{deviceId}/sync:
    post:
      operationId: syncDevice
      summary: Items changed since each vault's cursor, deletions, and the vaults to drop.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: The changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/devices/{deviceId}/events:
    post:
      operationId: uploadDeviceEvents
      summary: What the device did with its copy (reveals, copies, autofills), into the vaults' trails.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEvents'
      responses:
        '200':
          description: How many were recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordedResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/vaults/{vaultId}/items/{itemId}/reveal:
    get:
      operationId: revealItem
      summary: One item with its secret fields. Audited.
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The item and its fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevealedItemResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/weldpass/vaults/{vaultId}/items/{itemId}/totp:
    post:
      operationId: generateTotp
      summary: The login's current two-factor code, minted by the server (PASS-007).
      parameters:
        - $ref: '#/components/parameters/VaultId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The code and when it runs out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpCodeResponse'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    VaultId:
      name: vaultId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: An error. `CRYPTO_ERROR` (500) means the server has no usable WeldPass key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  # Enums are written inline: the Kotlin generator marks a property that
  # references an enum schema `@Contextual`, which kotlinx.serialization
  # can't decode without a serializer registered by hand.
  schemas:
    Vault:
      type: object
      required: [id, kind, ownerId, name, description, createdBy, createdAt, updatedAt, role]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [personal, shared]
        ownerId:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        role:
          description: |
            The caller's role. Null for a workspace admin looking at a shared
            vault they are not in: they can manage it, not read its items.
          type: string
          enum: [viewer, editor, manager]
          nullable: true
        itemCount:
          type: integer
        memberCount:
          type: integer
    VaultList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vault'
    Item:
      type: object
      required:
        [id, vaultId, type, title, subtitle, url, host, hasTotp, passwordChangedAt, version, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        vaultId:
          type: string
        type:
          type: string
          enum: [login, note, card]
        title:
          type: string
        subtitle:
          type: string
          nullable: true
          description: The login's username, or "•••• 4242" for a card.
        url:
          type: string
          nullable: true
        host:
          type: string
          nullable: true
        hasTotp:
          type: boolean
        passwordChangedAt:
          type: string
          nullable: true
        version:
          type: integer
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
    ItemList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    ItemFields:
      type: object
      description: |
        The sealed fields. Which ones are present depends on the item's
        `type`: a login has username, password, totp, notes and maybe apps;
        a note has content; a card has cardholder, number, expiry, cvc and
        notes. One object rather than a oneOf, so both generators read it the
        same way. Not `additionalProperties: false`: the Swift client would
        throw on a field the server adds later.
      properties:
        username:
          type: string
        password:
          type: string
        totp:
          type: string
        notes:
          type: string
        apps:
          type: array
          items:
            type: string
          description: Android package names this login signs in to.
        content:
          type: string
        cardholder:
          type: string
        number:
          type: string
        expiry:
          type: string
        cvc:
          type: string
    ItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Item'
    ItemInput:
      type: object
      description: |
        A whole item, as created or replaced. Send only the fields of its
        `type` (see `ItemFields`); `url` is a login's only. The server's
        `itemInputSchema` is the authority on lengths and formats.
      required: [type, title, fields]
      properties:
        type:
          type: string
          enum: [login, note, card]
        title:
          type: string
          minLength: 1
          maxLength: 200
        url:
          type: string
          nullable: true
          maxLength: 2048
        fields:
          $ref: '#/components/schemas/ItemFields'
    HealthEntry:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [issues, reuseCount]
          properties:
            issues:
              type: array
              items:
                type: string
                enum: [weak, reused, old]
            reuseCount:
              type: integer
              description: How many of the caller's logins share this password, itself included.
    HealthReport:
      type: object
      required: [checked, healthy, weak, reused, old, items]
      properties:
        checked:
          type: integer
          description: Logins that have a password at all.
        healthy:
          type: integer
        weak:
          type: integer
        reused:
          type: integer
        old:
          type: integer
        items:
          type: array
          description: Only the logins with something to fix, worst first.
          items:
            $ref: '#/components/schemas/HealthEntry'
    HealthReportResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HealthReport'
    RevealedItem:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [fields]
          properties:
            fields:
              $ref: '#/components/schemas/ItemFields'
    RevealedItemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/RevealedItem'
    TotpCode:
      type: object
      required: [code, period, expiresAt]
      properties:
        code:
          type: string
          pattern: '^\d{6,8}$'
        period:
          type: integer
        expiresAt:
          type: string
    TotpCodeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/TotpCode'
    RegisterDevice:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: What the person calls the phone.
        platform:
          type: string
          enum: [ios, android, other]
        appVersion:
          type: string
          nullable: true
          maxLength: 40
    Device:
      type: object
      required: [id, userId, name, platform, appVersion, createdAt, lastSyncAt, revokedAt, revokedBy]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        platform:
          type: string
          enum: [ios, android, other]
        appVersion:
          type: string
          nullable: true
        createdAt:
          type: string
        lastSyncAt:
          type: string
          nullable: true
        revokedAt:
          type: string
          nullable: true
        revokedBy:
          type: string
          nullable: true
    DeviceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Device'
    DeviceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    SyncRequest:
      type: object
      required: [cursors]
      properties:
        cursors:
          type: object
          description: The cursor the device got for each vault it holds, by vault id. A vault left out comes in full.
          additionalProperties:
            type: string
    SyncedItem:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [fields]
          properties:
            fields:
              $ref: '#/components/schemas/ItemFields'
      description: An item in the copy. A shared vault's login comes with `totp` emptied (PASS-007); `hasTotp` still says it has one.
    SyncedVault:
      type: object
      required: [vault, cursor, full, items, deletedIds]
      properties:
        vault:
          $ref: '#/components/schemas/Vault'
        cursor:
          type: string
          description: Send this back next time.
        full:
          type: boolean
          description: Every item of the vault came; replace, don't merge.
        items:
          type: array
          items:
            $ref: '#/components/schemas/SyncedItem'
        deletedIds:
          type: array
          items:
            type: string
    SyncResult:
      type: object
      required: [wipe, reason, syncedAt, vaults, removedVaultIds]
      properties:
        wipe:
          type: boolean
          description: Delete the whole copy (and the key).
        reason:
          type: string
          enum: [revoked, disabled]
          nullable: true
        syncedAt:
          type: string
          description: The server's clock at the sync.
        vaults:
          type: array
          description: Every vault the person can read now.
          items:
            $ref: '#/components/schemas/SyncedVault'
        removedVaultIds:
          type: array
          items:
            type: string
    SyncResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SyncResult'
    DeviceEvents:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/DeviceEvent'
    DeviceEvent:
      type: object
      required: [vaultId, itemId, action, at]
      properties:
        vaultId:
          type: string
        itemId:
          type: string
        action:
          type: string
          enum: [revealed, copied, autofilled]
        at:
          type: string
          description: When it happened on the device (ISO 8601).
    RecordedResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [recorded]
          properties:
            recorded:
              type: integer
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
    ErrorBody:
      type: object
      description: |
        Most errors carry `code` and `message`. A request body that fails
        validation gets Zod's shape instead (`{ name, issues }`), so neither
        is required.
      properties:
        code:
          type: string
        message:
          type: string
security:
  - bearer: []
