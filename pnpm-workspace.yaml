packages:
  - "apps/web/*"
  - "apps/workers/*"
  - "apps/tools/*"
  - "apps/mobile/*"
  - "!apps/mobile/_template"
  - "apps/hosted-apps/*"
  - "!apps/hosted-apps/_template"
  - "apps/desktop"
  - "packages/*/*"

# pnpm settings. These used to live in the "pnpm" field of package.json, which
# pnpm no longer reads: https://pnpm.io/settings
overrides:
  "@types/react": 19.2.7
  "@types/react-dom": 19.2.3
  react: 19.2.3
  react-dom: 19.2.3
  use-sync-external-store: ^1.4.0
  "@react-native-menu/menu": 2.0.0

  # Security fixes for transitive deps whose parent pins a vulnerable version,
  # which Dependabot can't update (security_update_not_possible). Each selector
  # only matches ranges inside one major line, so none of these crosses a major.
  # Drop an entry once its parent (in the comment) ships the fix.
  "@grpc/grpc-js@^1.0.0": ^1.13.6 # @firebase/firestore
  "builder-util-runtime@^9.0.0": ^9.7.0 # electron-updater 6
  "fast-xml-parser@^5.0.0": ^5.7.0 # @aws-sdk/xml-builder
  "http-cache-semantics@^4.0.0": ^4.3.0 # make-fetch-happen 9/10 (node-gyp 8/9)
  "postcss@^8.0.0": ^8.5.23 # next 15
  "undici@^6.0.0": ^6.28.1 # discord.js
  "undici@^7.0.0": ^7.29.1 # miniflare
  "ws@^8.0.0": ^8.21.0 # miniflare, viem

  # These do cross a major: the fix only shipped in the next major and the
  # parent's own fixed release is a major upgrade of its own (or doesn't exist
  # yet). Checked safe:
  # - every tar 6 parent only calls tar.x / tar.extract / tar.create, which
  #   tar 7 keeps.
  # - miniflare's newest release already ships sharp 0.35 (0.35.2, still short
  #   of the libvips/libheif/librsvg fixes in 0.35.5).
  # - @cloudflare/puppeteer only imports @puppeteer/browsers from its Node
  #   launchers (ChromeLauncher / FirefoxLauncher), which a Worker never loads.
  #   Browsers 3 drops extract-zip and proxy-agent (-> basic-ftp), neither of
  #   which has a fixed release in the 2.x line.
  # - esbuild 0.25's breaking changes since 0.18-0.21 are dev-server and
  #   tsconfig edge cases; drizzle-kit (via @esbuild-kit) and electron-vite 2
  #   only call build / transform. esbuild 0.28.0's only breaking change is
  #   an integrity check on the fallback binary download.
  # - uuid 11 keeps the v1-v7 named exports every parent imports (no deep
  #   `uuid/v4` imports anywhere), CJS included.
  # - jayson 5 drops stream-json and uuid; @solana/web3.js only loads its
  #   browser client, whose constructor and request API are unchanged.
  # - postcss-selector-parser 7.0's only breaking change makes insertions
  #   during iteration safe (tailwindcss 3, @tailwindcss/typography).
  # - @tootallnate/once 2 resolves with the event's args instead of the first
  #   one; http-proxy-agent 4 only awaits it.
  # - decode-uri-component 0.5 is ESM-only, so query-string 7 is patched to
  #   take its default export (patchedDependencies below).
  "tar@^6.0.0": ^7.5.19 # @electron/rebuild 3, node-gyp 8/9, cacache 15/16, sqlite3 5 (drizzle-orm peer)
  "sharp@<0.35.5": ^0.35.5 # miniflare
  "@cloudflare/puppeteer>@puppeteer/browsers": ^3.2.5 # @cloudflare/puppeteer 1.4 (agent-runtime)
  "esbuild@<0.25.0": ^0.25.12 # drizzle-kit 0.30 (+ @esbuild-kit), electron-vite 2
  "esbuild@>=0.27.3 <0.28.1": ^0.28.2 # wrangler 4.95, tsx 4.21, tsup 8.5
  "uuid@<11.1.1": ^11.1.1 # @telnyx/webrtc, xcode, svix, jest-junit, @blocknote/core, realtimekit, mixpanel-react-native, storybook 8
  "jayson@^4.0.0": ^5.0.0 # @solana/web3.js 1.98 (-> stream-json 1)
  "postcss-selector-parser@<7.1.6": ^7.1.7 # tailwindcss 3, @tailwindcss/typography
  "@tootallnate/once@<2.0.1": ^2.0.1 # http-proxy-agent 4 (node-gyp 8 via sqlite3)
  "decode-uri-component@<0.5.0": ^0.5.0 # query-string 7 (expo-router 57)

# pnpm patch rewrites this file when it adds an entry (sorting the overrides
# above and dropping their grouping); add entries by hand instead.
patchedDependencies:
  # decode-uri-component 0.5 is ESM-only; take its default export.
  query-string@7.1.3: patches/query-string@7.1.3.patch
  # Security backports for alerts with no fixed release yet. Drop each once
  # upstream ships one and the lockfile moves past the patched version.
  # GHSA-86w9-cpqp-85rv: PKCS#1 v1.5 verify accepted extra elements inside
  # DigestAlgorithm (digitalbazaar/forge#1161). @expo/code-signing-certificates.
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
  # GHSA-hp3w-g68c-fv3c: clamp %e/%f/%g precision instead of throwing a
  # RangeError. argparse 1 (js-yaml 3, mammoth), roarr 2 (global-agent 3).
  sprintf-js@1.0.3: patches/sprintf-js@1.0.3.patch
  sprintf-js@1.1.3: patches/sprintf-js@1.1.3.patch

onlyBuiltDependencies:
  - electron
  - electron-builder
  - "@parcel/watcher"

ignoredBuiltDependencies:
  - sharp
