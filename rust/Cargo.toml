[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's style more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Restriction lints we do want.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# The binary links every module. With full debug info its test binary
# outgrows what MSVC's linker writes into one PDB (LNK1318 on Windows), so it
# keeps line tables only: backtraces still name files and lines. The crates
# it links keep full debug info.
[profile.dev.package.weldsuite]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The image `Rust · image and chart` builds on a pull request (ci.yml, the
# CARGO_PROFILE build argument of rust/Dockerfile). Thin LTO with one codegen
# unit made that build 20 to 40 minutes whenever the Rust layer missed the
# cache; a pull request's image only has to deploy and pass the kind smoke
# test. Pushes to main still build `release`, the profile that ships.
[profile.ci-image]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
