# The WeldSuite Rust backend (ADR API-014): one service, shipped as one image,
# that the TypeScript workers are ported to module by module.
#
# Layout and phase plan: rust/README.md and the "Editions and self-hosting"
# design doc in weldsuite/weldsuite-documentation.

[workspace]
resolver = "3"
members = ["bins/*", "crates/*", "modules/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/weldsuite/weldsuite"
publish = false

# Shared dependency versions go here; crates use `dep = { workspace = true }`.
[workspace.dependencies]
weldsuite-adapters-oss = { path = "crates/adapters-oss" }
weldsuite-ads = { path = "modules/ads" }
weldsuite-ads-domain = { path = "crates/ads-domain" }
weldsuite-auth = { path = "crates/auth" }
weldsuite-calendar = { path = "modules/calendar" }
weldsuite-calendar-domain = { path = "crates/calendar-domain" }
weldsuite-books = { path = "modules/books" }
weldsuite-books-domain = { path = "crates/books-domain" }
weldsuite-catalogs = { path = "crates/catalogs" }
weldsuite-chat = { path = "modules/chat" }
weldsuite-chat-domain = { path = "crates/chat-domain" }
weldsuite-core-apps = { path = "modules/core-apps" }
weldsuite-core-domain = { path = "crates/core-domain" }
weldsuite-core-objects = { path = "modules/core-objects" }
weldsuite-core-onboarding = { path = "modules/core-onboarding" }
weldsuite-core-files = { path = "modules/core-files" }
weldsuite-core-platform = { path = "modules/core-platform" }
weldsuite-core-team = { path = "modules/core-team" }
weldsuite-crm = { path = "modules/crm" }
weldsuite-crm-domain = { path = "crates/crm-domain" }
weldsuite-data = { path = "modules/data" }
weldsuite-db = { path = "crates/db" }
weldsuite-desk = { path = "modules/desk" }
weldsuite-desk-domain = { path = "crates/desk-domain" }
weldsuite-desk-widget = { path = "modules/desk-widget" }
weldsuite-emails = { path = "crates/emails" }
weldsuite-events = { path = "crates/events" }
weldsuite-flow = { path = "modules/flow" }
weldsuite-flow-domain = { path = "crates/flow-domain" }
weldsuite-kit = { path = "crates/kit" }
weldsuite-know = { path = "modules/know" }
weldsuite-mail = { path = "modules/mail" }
weldsuite-mail-domain = { path = "crates/mail-domain" }
weldsuite-mail-inbound = { path = "crates/mail-inbound" }
weldsuite-pass = { path = "modules/pass" }
weldsuite-migrations = { path = "crates/migrations" }
weldsuite-sign = { path = "modules/sign" }
weldsuite-social = { path = "modules/social" }
weldsuite-social-domain = { path = "crates/social-domain" }
weldsuite-stash = { path = "modules/stash" }
weldsuite-notifications = { path = "crates/notifications" }
weldsuite-subscribers = { path = "crates/subscribers" }
weldsuite-permissions = { path = "crates/permissions" }
weldsuite-pipeline = { path = "crates/pipeline" }
weldsuite-ports = { path = "crates/ports" }
weldsuite-video-rooms = { path = "crates/video-rooms" }
weldsuite-realtime = { path = "crates/realtime" }

aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
async-nats = { version = "0.51.0", default-features = false }
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false }
base64 = "0.22.1"
bytes = "1.12.1"
encoding_rs = "0.8.42"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.31", default-features = false }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
http = "1.5.0"
icu_collator = { version = "2.4.0", default-features = false, features = ["compiled_data"] }
http-body-util = "0.1.5"
minijinja = { version = "3.0.4", default-features = false, features = ["builtins", "multi_template", "std_collections"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
lopdf = { version = "0.46.0", default-features = false }
png = "0.18.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
redis = { version = "1.8.0", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf"] }
restate-sdk = { version = "0.13.0", default-features = false, features = ["http_server", "aws_lc_rs"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusty-s3 = { version = "0.11.0", default-features = false, features = ["aws-lc-rs", "full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls-aws-lc-rs", "json", "derive"] }
time = "0.3.55"
tokio = "1.54.1"
tokio-tungstenite = { version = "0.29.0", default-features = false }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = "1.29.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's style more than they help.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Restriction lints we do want.
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
