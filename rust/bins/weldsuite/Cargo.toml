[package]
name = "weldsuite"
description = "The WeldSuite backend: API server, event consumers, cron jobs and admin commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "original-uri", "tokio"] }
http = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
http-body-util = { workspace = true }
sqlx = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
