[package]
name = "weldsuite"
description = "The WeldSuite backend: API server, event consumers, cron jobs and admin commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only: /api takes the test's context from a header instead of a session
# token (src/conformance.rs). Never in a release image.
conformance = ["dep:base64", "dep:form_urlencoded", "dep:serde"]

[dependencies]
weldsuite-adapters-oss = { workspace = true }
weldsuite-auth = { workspace = true }
weldsuite-calendar = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-chat = { workspace = true }
weldsuite-core-apps = { workspace = true }
weldsuite-core-objects = { workspace = true }
weldsuite-core-onboarding = { workspace = true }
weldsuite-core-files = { workspace = true }
weldsuite-core-platform = { workspace = true }
weldsuite-core-team = { workspace = true }
weldsuite-crm = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-desk = { workspace = true }
weldsuite-desk-domain = { workspace = true }
weldsuite-desk-widget = { workspace = true }
weldsuite-emails = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-flow = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-know = { workspace = true }
weldsuite-pass = { workspace = true }
weldsuite-mail = { workspace = true }
weldsuite-mail-domain = { workspace = true }
weldsuite-migrations = { workspace = true }
weldsuite-sign = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-pipeline = { workspace = true }
weldsuite-realtime = { workspace = true }
weldsuite-ports = { workspace = true }
weldsuite-subscribers = { workspace = true }
axum ={ workspace = true, features = ["http1", "json", "matched-path", "original-uri", "tokio"] }
base64 = { workspace = true, optional = true }
form_urlencoded = { workspace = true, optional = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json", "registry"] }

[dev-dependencies]
http-body-util = { workspace = true }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
