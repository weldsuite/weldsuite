# A stand-in OIDC issuer for the kind smoke test (smoke-test.sh): nginx
# serving a discovery document and a JWKS that mint-token.mjs --oidc wrote
# into the oidc-issuer ConfigMap. Its issuer is http://oidc-issuer, the
# Service's name. Zitadel itself is checked by the env-gated tests in
# crates/auth and crates/adapters-oss (rust/deploy/hetzner/README.md, step 7).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-issuer
spec:
  replicas: 1
  selector:
    matchLabels: { app: oidc-issuer }
  template:
    metadata:
      labels: { app: oidc-issuer }
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: documents
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet: { path: /.well-known/openid-configuration, port: 80 }
            periodSeconds: 2
      volumes:
        - name: documents
          configMap:
            name: oidc-issuer
            items:
              - key: openid-configuration
                path: .well-known/openid-configuration
              - key: keys
                path: oauth/v2/keys
---
apiVersion: v1
kind: Service
metadata:
  name: oidc-issuer
spec:
  selector: { app: oidc-issuer }
  ports:
    - port: 80
