# Valkey, NATS JetStream and RustFS (S3) for the kind smoke test, so the
# server connects its real adapters (cache, realtime publish, entity events,
# files). Throwaway: no
# volumes, no auth. Real clusters run them from the full chart (phase P5).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: { app: valkey }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2-alpine
          args: ["-js", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector: { app: nats }
  ports:
    - name: client
      port: 4222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  replicas: 1
  selector:
    matchLabels: { app: s3 }
  template:
    metadata:
      labels: { app: s3 }
    spec:
      containers:
        # RustFS: an S3-compatible store (Apache-2.0). MinIO no longer
        # publishes community images.
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          env:
            - { name: RUSTFS_ACCESS_KEY, value: weldsuite }
            - { name: RUSTFS_SECRET_KEY, value: weldsuite-kind }
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: { app: s3 }
  ports:
    - port: 9000
---
# Restate, the durable-execution server behind the Jobs port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restate
spec:
  replicas: 1
  selector:
    matchLabels: { app: restate }
  template:
    metadata:
      labels: { app: restate }
    spec:
      containers:
        - name: restate
          image: docker.io/restatedev/restate:1.7.14
          ports:
            - { name: ingress, containerPort: 8080 }
            - { name: admin, containerPort: 9070 }
          readinessProbe:
            httpGet: { path: /health, port: admin }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: restate
spec:
  selector: { app: restate }
  ports:
    - { name: ingress, port: 8080 }
    - { name: admin, port: 9070 }
