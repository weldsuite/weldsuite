# Chart values for the kind smoke test (smoke-test.sh). The Clerk key is set
# by the script from a throwaway key it generates (mint-token.mjs).
image:
  repository: weldsuite
  tag: dev
  pullPolicy: Never
replicaCount: 1
config:
  environment: kind
  logFormat: text
  shutdownDelaySeconds: 1
  nats:
    ensureStreams: true
  jobs:
    restate:
      ingressUrl: http://restate:8080
      adminUrl: http://restate:9070
  files:
    endpoint: http://s3:9000
    privateBucket: weldsuite-private
    forcePathStyle: true
secret:
  values:
    DATABASE_URL_MASTER: postgres://weldsuite:weldsuite@postgres:5432/master
    VALKEY_URL: redis://valkey:6379
    NATS_URL: nats://nats:4222
    S3_ACCESS_KEY_ID: weldsuite
    S3_SECRET_ACCESS_KEY: weldsuite-kind
    SMTP_URL: smtp://mailpit:1025
    CLERK_JWT_KEY: set by smoke-test.sh
    SIGN_PORTAL_SECRET: kind-portal-secret
    # Keys signer sessions: without it the portal endpoints answer 503.
    SIGN_SESSION_SECRET: kind-session-secret
    # Haraka's RCPT TO check (MAIL-010).
    MAIL_INBOUND_SECRET: kind-mail-inbound-secret
podDisruptionBudget:
  enabled: false
# The entity-event subscribers and the inbound mail one (MAIL-010).
consume:
  enabled: true
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
# Haraka (the image built from rust/deploy/haraka), reached through a
# port-forward: no load balancer, no PROXY protocol, no cert-manager.
mailInbound:
  enabled: true
  haraka:
    image:
      repository: weldsuite-haraka
      tag: dev
      pullPolicy: Never
    replicaCount: 1
    hostname: mx.kind.test
    service:
      type: ClusterIP
    tls:
      enabled: false
# The SPA is on by default (the image's /srv/spa); the sign portal is the
# image's `sign-portal` target.
signPortal:
  enabled: true
  image:
    repository: weldsuite-sign-portal
    tag: dev
    pullPolicy: Never
  replicaCount: 1
