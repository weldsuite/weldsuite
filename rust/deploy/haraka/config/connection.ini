; Haraka's connection settings (a full copy: this file replaces Haraka's own).
; The chart renders it from its values, with the load balancer's addresses
; under [haproxy].

[main]

[haproxy]
; The PROXY protocol, from these addresses only: the load balancer passes
; TCP 25 through and tells Haraka the client's address, which SPF needs.
enabled=true
hosts[] =

[headers]
add_received=true
; Incoming Authentication-Results become Original-Authentication-Results;
; weldsuite_auth_results writes the one the pipeline reads.
clean_auth_results=true
show_version=false
max_lines=1000
max_received=100

[max]
; Cloudflare Email Routing's limit, so both editions take the same mail.
bytes=26214400
mime_parts=1000
line_length=512
data_line_length=992

[message]
helo=WeldMail
close=closing connection

[uuid]
banner_chars=6
deny_chars=0
