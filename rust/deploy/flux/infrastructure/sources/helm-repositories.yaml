# Where the charts come from. Versions are pinned in each HelmRelease.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 12h
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jetstack
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.jetstack.io
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 12h
  url: https://traefik.github.io/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openebs-localpv
  namespace: flux-system
spec:
  interval: 12h
  url: https://openebs.github.io/dynamic-localpv-provisioner
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: flux-system
spec:
  interval: 12h
  url: https://nats-io.github.io/k8s/helm/charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 12h
  url: https://valkey.io/valkey-helm
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zitadel
  namespace: flux-system
spec:
  interval: 12h
  url: https://charts.zitadel.com
---
# Restate publishes its chart as an OCI artifact only. A Helm repository of
# type oci, not an OCIRepository: through an OCIRepository, helm-controller
# gives the chart the version 1.7.13+<digest>, and Restate's chart writes that
# into labels, which may not contain "+" (the install fails). The version is
# pinned in the HelmRelease (services/releases.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: restate
  namespace: flux-system
spec:
  type: oci
  interval: 12h
  url: oci://ghcr.io/restatedev
