# A small Prometheus for Lens's CPU, memory and disk charts. Only the test
# cluster applies this layer so far (clusters/test/layers.yaml); its values
# are sized for that one node. The metrics API (metrics-server) is in
# ../controllers, since the server's autoscaler needs it everywhere.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - sources.yaml
  - releases.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: kube-prometheus-stack-values
    namespace: monitoring
    files: [values.yaml=values/kube-prometheus-stack.yaml]
