# Metrics, alerting and Grafana (docs/plans/eu-observability.md, ADR
# OPS-021): kube-prometheus-stack and the blackbox exporter. What they
# scrape, probe and alert on is the next layer, ../monitoring-config, which
# needs this layer's CRDs. The namespace is in ../controllers, because the
# secrets layer puts alerting-receivers and Grafana's Secrets in it first.
# The metrics API (metrics-server) is in ../controllers too, since the
# server's autoscaler needs it everywhere.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sources.yaml
  - releases.yaml
generatorOptions:
  disableNameSuffixHash: true
  # helm-controller upgrades a release as soon as its values ConfigMap
  # changes, not at the release's next interval (an hour for most).
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: kube-prometheus-stack-values
    namespace: monitoring
    files: [values.yaml=values/kube-prometheus-stack.yaml]
  - name: blackbox-exporter-values
    namespace: monitoring
    files: [values.yaml=values/blackbox-exporter.yaml]
