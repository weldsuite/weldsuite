apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - releases.yaml
generatorOptions:
  disableNameSuffixHash: true
  # helm-controller upgrades a release as soon as its values ConfigMap
  # changes, not at the release's next interval (an hour for most).
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: nats-values
    namespace: weldsuite
    files: [values.yaml=values/nats.yaml]
  - name: valkey-values
    namespace: weldsuite
    files: [values.yaml=values/valkey.yaml]
  - name: restate-values
    namespace: weldsuite
    files: [values.yaml=values/restate.yaml]
  - name: zitadel-values
    namespace: zitadel
    files: [values.yaml=values/zitadel.yaml]
