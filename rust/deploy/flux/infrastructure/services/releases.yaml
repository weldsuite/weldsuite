# The services the weldsuite server talks to, in the cluster. Values in
# values/<name>.yaml (generated ConfigMaps).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: weldsuite
spec:
  interval: 1h
  chart:
    spec:
      chart: nats
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: nats-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: weldsuite
spec:
  interval: 1h
  chart:
    spec:
      chart: valkey
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: valkey-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: restate
  namespace: weldsuite
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: restate
    namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: restate-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
  namespace: zitadel
spec:
  interval: 1h
  chart:
    spec:
      chart: zitadel
      version: 10.4.0
      sourceRef:
        kind: HelmRepository
        name: zitadel
        namespace: flux-system
  # First start creates its schema; give it time.
  timeout: 15m
  valuesFrom:
    - kind: ConfigMap
      name: zitadel-values
