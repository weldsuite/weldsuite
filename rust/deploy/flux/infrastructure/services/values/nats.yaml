# NATS JetStream, three nodes spread over the locations: the entity-event hub
# (weldsuite's NATS_URL). Clients authenticate with the token in nats-auth.
config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 20Gi
        storageClassName: openebs-hostpath
  merge:
    authorization:
      token: << $NATS_TOKEN >>
container:
  env:
    NATS_TOKEN:
      valueFrom:
        secretKeyRef:
          name: nats-auth
          key: token
  # The weldsuite namespace enforces the "restricted" Pod Security Standard,
  # which the chart's defaults don't meet: non-root, no privilege escalation,
  # no capabilities, the runtime's seccomp profile.
  merge:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
reloader:
  merge:
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
# A debugging client; `kubectl run` one when it's needed.
natsBox:
  enabled: false
podTemplate:
  # The chart uses each key as the constraint's topologyKey.
  topologySpreadConstraints:
    topology.kubernetes.io/zone:
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
  merge:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
