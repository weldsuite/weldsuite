# Zitadel: sign-in for the Kubernetes editions (ADR SEC-012), on its own
# CloudNativePG cluster (zitadel/zitadel-db). TLS ends at Traefik.
replicaCount: 2
# The zitadel namespace enforces the "restricted" Pod Security Standard. The
# chart-wide contexts below apply to every Zitadel pod (server, login, init,
# setup and cleanup jobs); its defaults miss the escalation, capability and
# seccomp settings.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
zitadel:
  masterkeySecretName: zitadel-masterkey
  configmapConfig:
    ExternalDomain: auth.${DOMAIN}
    ExternalSecure: true
    ExternalPort: 443
    TLS:
      Enabled: false
    Database:
      Postgres:
        Host: zitadel-db-rw.zitadel.svc
        Port: 5432
        Database: zitadel
        MaxOpenConns: 20
        User:
          Username: zitadel
          SSL:
            Mode: require
        Admin:
          Username: postgres
          SSL:
            Mode: require
env:
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-db-user
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-db-superuser
        key: password
  # The first instance's admin; its password comes from the secret and must
  # be changed at first login (README.md, step 7).
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
    value: admin
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-first-admin
        key: password
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: auth.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zitadel-tls
      hosts:
        - auth.${DOMAIN}
