# Zitadel: sign-in for the Kubernetes editions (ADR SEC-012), on its own
# CloudNativePG cluster (zitadel/zitadel-db). TLS ends at Traefik.
replicaCount: 2
# The zitadel namespace enforces the "restricted" Pod Security Standard. The
# chart-wide contexts below apply to every Zitadel pod (server, login, init,
# setup and cleanup jobs); its defaults miss the escalation, capability and
# seccomp settings.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  privileged: false
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
zitadel:
  masterkeySecretName: zitadel-masterkey
  configmapConfig:
    ExternalDomain: auth.${DOMAIN}
    ExternalSecure: true
    ExternalPort: 443
    TLS:
      Enabled: false
    Database:
      Postgres:
        Host: zitadel-db-rw.zitadel.svc
        Port: 5432
        Database: zitadel
        MaxOpenConns: 20
        User:
          Username: zitadel
          SSL:
            Mode: require
        Admin:
          Username: postgres
          SSL:
            Mode: require
env:
  - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-db-user
        key: password
  - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-db-superuser
        key: password
  # The first instance's admin; its password comes from the secret and must
  # be changed at first login (README.md, step 7).
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
    value: admin
  - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: zitadel-first-admin
        key: password
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # The sign-in host's own rate limit, on top of every request's
    # (controllers/values/traefik.yaml).
    traefik.ingress.kubernetes.io/router.middlewares: traefik-auth-ratelimit@kubernetescrd
  hosts:
    - host: auth.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: zitadel-tls
      hosts:
        - auth.${DOMAIN}
# Zitadel v4's sign-in pages are their own app (zitadel-login) under
# /ui/v2/login, where the console and every OIDC client send people to sign in.
# The chart leaves its ingress off; without it those paths hit the core and
# answer {"code":5,"message":"Not Found"}. Same host and certificate as above
# (cert-manager issues it once, from the core ingress's annotation).
login:
  ingress:
    enabled: true
    className: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: traefik-auth-ratelimit@kubernetescrd
    hosts:
      - host: auth.${DOMAIN}
        paths:
          - path: /ui/v2/login
            pathType: Prefix
    tls:
      - secretName: zitadel-tls
        hosts:
          - auth.${DOMAIN}
# Egress anywhere but the metadata service for every pod in Zitadel's
# namespace (zitadel-db's included), as in the base layers' namespaces
# (../../network-policy/metadata-service.yaml, which says why). Part of this
# release so that it exists only where Zitadel does: a cluster that removes
# Zitadel removes it with the release. A no-op until the cluster enforces
# NetworkPolicy (the opt-in network-policy layer).
extraManifests:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: block-metadata-service
    spec:
      podSelector: {}
      policyTypes: [Egress]
      egress:
        - to:
            - ipBlock:
                cidr: 0.0.0.0/0
                except: [169.254.169.254/32]
            - ipBlock:
                cidr: "::/0"
