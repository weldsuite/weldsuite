# Kubernetes events to Loki, from one pod: why a pod restarted, was evicted
# or couldn't be scheduled, after the event itself has expired (an hour).
#
# Flux does not substitute this file (see fluent-bit.yaml); CLUSTER comes
# from the HelmRelease.
kind: Deployment
replicaCount: 1

rbac:
  create: true
  eventsAccess: true

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

serviceMonitor:
  enabled: true

# No node paths: it reads the API, not the disk.
daemonSetVolumes: []
daemonSetVolumeMounts: []
volumeMounts:
  - name: config
    mountPath: /fluent-bit/etc/conf

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On

  inputs: |
    [INPUT]
        Name kubernetes_events
        Tag k8s_events
        kube_url https://kubernetes.default.svc:443

  filters: ""

  outputs: |
    [OUTPUT]
        Name loki
        Match k8s_events
        Host loki.logging.svc
        Port 3100
        Labels job=kubernetes-events, cluster=${CLUSTER}, namespace=$involvedObject['namespace'], level=$type
        Line_Format json
        Retry_Limit 10
