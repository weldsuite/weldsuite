# Loki as one pod (single binary), chunks and index in the cluster's logs
# bucket (Hetzner Object Storage, LOGS_* in the cluster's settings), a small
# local volume for its write-ahead log. Kept 30 days (the GDPR retention for
# production, weldsuite-documentation/plans/eu-observability.md); the test cluster patches
# retention_period down. The bucket's lifecycle rule deletes a day later as
# a backstop.
#
# The S3 keys come from the Secret loki-s3 (HelmRelease valuesFrom), which is
# why the config is kept in a Secret rather than a ConfigMap.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  configStorageType: Secret
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-11-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: ${LOGS_BUCKET}
      ruler: ${LOGS_BUCKET}
      admin: ${LOGS_BUCKET}
    s3:
      endpoint: ${LOGS_S3_ENDPOINT}
      region: ${LOGS_S3_REGION}
      s3ForcePathStyle: true
      insecure: false
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: s3
    compaction_interval: 10m
    retention_delete_delay: 2h
  limits_config:
    retention_period: 720h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 5MB
    max_label_names_per_series: 12
    allow_structured_metadata: true
    volume_enabled: true
    query_timeout: 300s
  # No ruler: alerts come from Prometheus. Log-based alerts are a later round.
  rulerConfig: {}
  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: openebs-hostpath
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

# Single binary: none of the scalable targets, no gateway, no caches (each
# memcached would ask for gigabytes), no canary or test pod.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false

monitoring:
  serviceMonitor:
    enabled: true
  # Loki's own dashboards in Grafana (the sidecar's label); its alert rules
  # stay off, ../monitoring-config and ./rules.yaml decide what pages.
  dashboards:
    enabled: true
    namespace: logging
  rules:
    enabled: false
