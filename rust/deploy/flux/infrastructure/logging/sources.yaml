# This layer's charts. Here rather than in ../sources, so a cluster without
# the layer doesn't fetch them. The versions are pinned in releases.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 12h
  url: https://grafana.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fluent
  namespace: flux-system
spec:
  interval: 12h
  url: https://fluent.github.io/helm-charts
