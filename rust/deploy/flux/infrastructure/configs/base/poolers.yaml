# PgBouncer in transaction mode in front of master and the tenant shard, as
# spikes S3 and S4 settled (rust/docs/spikes.md):
#   - max_prepared_statements keeps PgBouncer's default (never 0): sqlx's
#     named statements need it;
#   - max_client_conn must cover pods x tenant pools (CloudNativePG leaves
#     PgBouncer's default of 100, which one pod alone exceeds);
#   - max_user_connections caps server connections under max_connections,
#     so an idle database's connection can be closed to serve another.
#     S4 measured this with all tenant databases on one role. The
#     provisioner now gives every workspace a role of its own (a leaked
#     tenant URL opens one database, not all), which makes this cap per
#     workspace: the total is bounded by default_pool_size per busy
#     workspace instead. Re-run S4 with per-workspace roles before sizing a
#     production shard.
# The weldsuite server connects to the master through master-pooler and gets
# tenant URLs (pointing at tenants-1-pooler) from workspaces.database_url.
# (Not <cluster>-rw: CloudNativePG names the cluster's own Services that.)
# A new workspace database needs no change here: CloudNativePG configures
# PgBouncer with a wildcard database and auth_query logins (the
# cnpg_pooler_pgbouncer role and user_search in the postgres database), so a
# role and database the provisioner creates are reachable at once.
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: master-pooler
  namespace: postgres
spec:
  cluster:
    name: master
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "2000"
      default_pool_size: "20"
      max_user_connections: "200"
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: tenants-1-pooler
  namespace: postgres
spec:
  cluster:
    name: tenants-1
  instances: 2
  type: rw
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "10000"
      default_pool_size: "4"
      max_user_connections: "400"
