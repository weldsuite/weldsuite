# Flux's own failures (a layer, a HelmRelease or a source that doesn't
# reconcile) go straight to Alertmanager, which routes severity "error" like
# a warning. Every namespace that holds a HelmRelease is listed: an event
# source without a namespace means the Alert's own.
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: alertmanager
  namespace: flux-system
spec:
  type: alertmanager
  address: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093/api/v2/alerts/
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: reconcile-failures
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventMetadata:
    cluster: ${DOMAIN}
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: GitRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: HelmChart
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: openebs
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: traefik
    - kind: HelmRelease
      name: "*"
      namespace: cnpg-system
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: HelmRelease
      name: "*"
      namespace: weldsuite
    - kind: HelmRelease
      name: "*"
      namespace: zitadel
    - kind: HelmRelease
      name: "*"
      namespace: livekit
    - kind: HelmRelease
      name: "*"
      namespace: marketing
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: HelmRelease
      name: "*"
      namespace: logging
