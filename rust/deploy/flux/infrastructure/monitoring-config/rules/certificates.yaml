# cert-manager renews 30 days before expiry. 21 days left means renewals
# have failed for over a week; 7 days left is close to an outage.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weldsuite-certificates
  namespace: monitoring
spec:
  groups:
    - name: weldsuite-certificates
      rules:
        - alert: CertificateExpiring
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 86400
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
            runbook_url: https://github.com/weldsuite/weldsuite/blob/main/rust/deploy/flux/infrastructure/monitoring-config/ALERTS.md#certificateexpiring
        - alert: CertificateRenewalLate
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 21 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }} and hasn't renewed"
            runbook_url: https://github.com/weldsuite/weldsuite/blob/main/rust/deploy/flux/infrastructure/monitoring-config/ALERTS.md#certificaterenewallate
        - alert: CertificateNotReady
          expr: certmanager_certificate_ready_status{condition="False"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 30 minutes"
            runbook_url: https://github.com/weldsuite/weldsuite/blob/main/rust/deploy/flux/infrastructure/monitoring-config/ALERTS.md#certificatenotready
