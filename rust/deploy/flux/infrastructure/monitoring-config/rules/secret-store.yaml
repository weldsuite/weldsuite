# The cluster's secret store (rust/deploy/hetzner/secret-store, ADR OPS-023),
# probed by ../probes.yaml once the cluster's SECRET_STORE_URL is set. While
# it is sealed or unreachable the cluster keeps every Secret it has and only
# stops refreshing them, so this waits for the morning (warning). What to do:
# ALERTS.md. The certificate it serves is ProbeCertificateExpiring's
# (platform.yaml), like every probed host's.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weldsuite-secret-store
  namespace: monitoring
spec:
  groups:
    - name: weldsuite-secret-store
      rules:
        - alert: SecretStoreDown
          expr: probe_success{group="secret-store"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'The secret store has failed its health check for 10 minutes{{ with printf "probe_http_status_code{instance=%q}" $labels.instance | query }} (HTTP {{ . | first | value }}){{ end }}'
            description: >-
              {{ $labels.instance }} answered no 200. 503: sealed, unseal it.
              0: no answer (the server, Caddy, DNS or the network). 501: not
              initialised. 429: standby. External Secrets can't refresh
              anything meanwhile; the cluster keeps the Secrets it has.
            runbook_url: https://github.com/weldsuite/weldsuite/blob/main/rust/deploy/flux/infrastructure/monitoring-config/ALERTS.md#secretstoredown
