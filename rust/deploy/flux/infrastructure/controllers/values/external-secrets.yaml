# External Secrets Operator. The secrets layer (../../secrets) only reads:
# ExternalSecrets through ClusterSecretStore weldsuite. The controllers for
# the kinds that write to a store (PushSecret, ClusterPushSecret), fan out
# over namespaces (ClusterExternalSecret, which also patches namespaces) or
# generate values (generators) are off. Their CRDs stay installed and unused.
installCRDs: true
processPushSecret: false
processClusterPushSecret: false
processClusterExternalSecret: false
processClusterGenerator: false
# One of each: while the controller is down, the Secrets it wrote stay as
# they are and only the hourly refresh from the store waits. The webhook
# checks ExternalSecrets as Flux applies them, so the secrets layer waits for
# it after a restart.
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi
webhook:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
certController:
  replicaCount: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
