# Volumes on the node's own disk (local NVMe on the Postgres pool), under
# /var/mnt/local-storage: the user volume every Talos node has
# (hetzner/talos/common.yaml.tftpl), which the kubelet can reach.
# No Cloud Volumes: failover never waits on the Hetzner Cloud API, and the
# same setup runs on bare metal.
localpv:
  basePath: /var/mnt/local-storage
hostpathClass:
  name: openebs-hostpath
  enabled: true
  reclaimPolicy: Retain
  isDefaultClass: true
  basePath: /var/mnt/local-storage
