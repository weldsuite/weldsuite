apiVersion: v1
kind: Namespace
metadata:
  name: weldsuite
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: postgres
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: zitadel
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# The marketing site (apps/marketing, test only so far). Here rather than in
# its layer because the secrets layer, which runs first, puts its registry
# Secret in it. It shares nothing with the platform.
apiVersion: v1
kind: Namespace
metadata:
  name: marketing
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Metrics, alerting and Grafana (../monitoring) and the logs (../logging).
# Here rather than in their layers because the secrets layer, which runs
# first, puts their Secrets in them. Privileged: the node exporter and Fluent
# Bit read the host's /proc, /sys and /var/log.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
# The hostpath provisioner's helper pods mount node paths.
apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# The MTA (chart value mta.namespace) sends from each mail node's own public
# IP and listens on its port 25, so it runs on the host network, which the
# baseline and restricted levels forbid. Its container is locked down
# instead (non-root, read-only, every capability dropped but
# NET_BIND_SERVICE), and only mail nodes, tainted for it, run it.
apiVersion: v1
kind: Namespace
metadata:
  name: weldsuite-mail
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
# LiveKit runs on the host network with host ports (media goes straight to
# the node), which the baseline and restricted levels forbid. Its container
# is locked down instead (infrastructure/video/values/livekit.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: livekit
  labels:
    pod-security.kubernetes.io/enforce: privileged
