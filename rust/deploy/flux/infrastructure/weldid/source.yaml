# WeldID's chart releases, published by the weldid repository's release
# workflow (.github/workflows/release.yml there) as
# oci://ghcr.io/weldsuite/charts/weldid:<X.Y.Z>, each installing the image
# of the same version (ghcr.io/weldsuite/weldid:X.Y.Z). The HelmRelease pins
# one: WELDID_VERSION in the cluster's settings.
#
# Both packages stay private until WeldID 1.0, so this reads them with the
# registry Secret in this namespace (secrets/examples/weldid.example.yaml),
# which the pods pull the image with too. Its own source in its own
# namespace, as the marketing site's: the platform's public charts never
# depend on that login. Once the packages are public, the Secret and this
# secretRef can go.
#
# A Helm repository of type oci, not an OCIRepository, as everywhere here
# (sources/helm-repositories.yaml, Restate).
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: weldid
  namespace: weldid
spec:
  type: oci
  interval: 10m
  url: oci://ghcr.io/weldsuite/charts
  secretRef:
    name: registry
