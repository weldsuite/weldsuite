# --- postgres: the database owners CloudNativePG creates at initdb, and the
# logins it keeps in step with their Secrets (managed roles).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: master-db-owner
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: master-db-owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: weldsuite
        password: '{{ .PASSWORD }}'
  data:
    - secretKey: PASSWORD
      remoteRef: { key: weldsuite/postgres, property: MASTER_OWNER_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tenants-1-owner
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: tenants-1-owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: tenant
        password: '{{ .PASSWORD }}'
  data:
    - secretKey: PASSWORD
      remoteRef: { key: weldsuite/postgres, property: TENANT_PASSWORD }
---
# The marketing site's login on master (a managed role in configs/base), the
# same password as marketing/marketing-env (the marketing component).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: master-db-marketing
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: master-db-marketing
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: marketing
        password: '{{ .PASSWORD }}'
  data:
    - secretKey: PASSWORD
      remoteRef: { key: weldsuite/postgres, property: MARKETING_PASSWORD }
---
# The backup bucket at the second EU provider; the same keys in zitadel.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-s3
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: postgres-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: weldsuite/backup-s3, property: ACCESS_KEY_ID }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: weldsuite/backup-s3, property: ACCESS_SECRET_KEY }
