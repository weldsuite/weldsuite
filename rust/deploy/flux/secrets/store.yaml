# The cluster's secret store: a KV version 2 store behind the HashiCorp Vault
# API, mount `secret`. WeldSuite's clusters each have an OpenBao server of
# their own (rust/deploy/hetzner/secret-store, ADR OPS-023); Vault works the
# same way. Every value in it is listed in store.example.yaml, and
# ../scripts/seed-secrets.mjs fills it.
#
# The token is the one Secret put in by hand, before Flux starts
# (rust/deploy/hetzner/README.md, step 6): the store's read-only cluster
# token (`kubectl -n external-secrets create secret generic
# secret-store-token --from-literal=token=…`). A store of another kind
# (Scaleway, a cloud's secret manager): replace spec.provider in the secrets
# layer's patches.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: weldsuite
spec:
  # Only the namespaces the secrets layer writes to may read from it.
  conditions:
    - namespaces:
        - weldsuite
        - weldsuite-mail
        - postgres
        - zitadel
        - livekit
        - marketing
        - monitoring
        - logging
        - weldid
  provider:
    vault:
      server: ${SECRET_STORE_URL}
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: secret-store-token
          namespace: external-secrets
          key: token
