# Every Secret the layers expect, with placeholders. Not applied by Flux.
# Copy to ../eu/secrets.sops.yaml, replace each CHANGE_ME (e.g.
# `openssl rand -base64 32`), encrypt with SOPS and list it in
# ../eu/kustomization.yaml (README.md, step 4).

# --- weldsuite: the server's environment (rust/bins/weldsuite/src/config.rs).
apiVersion: v1
kind: Secret
metadata:
  name: weldsuite-env
  namespace: weldsuite
type: Opaque
stringData:
  # Through the PgBouncer Pooler, transaction mode (spikes S3/S4).
  DATABASE_URL_MASTER: postgres://weldsuite:CHANGE_ME_MASTER_OWNER@master-pooler.postgres.svc:5432/weldsuite_master?sslmode=require
  # Decrypts workspaces.database_url (same format as the workers').
  DATABASE_ENCRYPTION_KEY: CHANGE_ME
  # Session tokens: today the Clerk-compatible verifier, pointed at a JWKS.
  # Zitadel's OIDC sign-in replaces it (SEC-012, P5); see README.md, "Not yet".
  CLERK_JWKS_URL: https://auth.eu.example.org/oauth/v2/keys
  VALKEY_URL: redis://default:CHANGE_ME_VALKEY@valkey.weldsuite.svc:6379
  NATS_URL: nats://nats.weldsuite.svc:4222
  NATS_TOKEN: CHANGE_ME_NATS
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  SIGN_SESSION_SECRET: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-auth
  namespace: weldsuite
type: Opaque
stringData:
  token: CHANGE_ME_NATS
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-users
  namespace: weldsuite
type: Opaque
stringData:
  default: CHANGE_ME_VALKEY
---
# Pulls the weldsuite image (ghcr.io until the EU registry exists, P5 5.4).
apiVersion: v1
kind: Secret
metadata:
  name: registry
  namespace: weldsuite
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_USER_COLON_TOKEN"}}}'
---
# --- postgres: the database owners CloudNativePG creates at initdb.
apiVersion: v1
kind: Secret
metadata:
  name: master-db-owner
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: weldsuite
  password: CHANGE_ME_MASTER_OWNER
---
apiVersion: v1
kind: Secret
metadata:
  name: tenants-1-owner
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: tenant
  password: CHANGE_ME_TENANT
---
# Backup bucket at the second EU provider; the same keys in both namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-s3
  namespace: postgres
type: Opaque
stringData:
  ACCESS_KEY_ID: CHANGE_ME
  ACCESS_SECRET_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-s3
  namespace: zitadel
type: Opaque
stringData:
  ACCESS_KEY_ID: CHANGE_ME
  ACCESS_SECRET_KEY: CHANGE_ME
---
# --- zitadel
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
type: Opaque
stringData:
  # Exactly 32 characters. Losing it makes Zitadel's encrypted data unreadable.
  masterkey: CHANGE_ME_EXACTLY_32_CHARACTERS_
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-db-user
  namespace: zitadel
type: Opaque
stringData:
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-first-admin
  namespace: zitadel
type: Opaque
stringData:
  # Changed at first login (README.md, step 7).
  password: CHANGE_ME_Aa1!
