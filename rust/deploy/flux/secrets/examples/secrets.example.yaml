# Every Secret the layers expect, with placeholders. Not applied by Flux.
# Copy to ../eu/secrets.sops.yaml, replace each CHANGE_ME (e.g.
# `openssl rand -base64 32`), encrypt with SOPS and list it in
# ../eu/kustomization.yaml (README.md, step 4). ../../scripts/fill-secrets.mjs
# does the copy and fills in every value that isn't a provider's key.

# --- weldsuite: the server's environment (rust/bins/weldsuite/src/config.rs).
apiVersion: v1
kind: Secret
metadata:
  name: weldsuite-env
  namespace: weldsuite
type: Opaque
stringData:
  # Through the PgBouncer Pooler, transaction mode (spikes S3/S4).
  DATABASE_URL_MASTER: postgres://weldsuite:CHANGE_ME_MASTER_OWNER@master-pooler.postgres.svc:5432/weldsuite_master?sslmode=require
  # Decrypts workspaces.database_url (same format as the workers').
  DATABASE_ENCRYPTION_KEY: CHANGE_ME
  # Seals new workspaces' database URLs (v2; FIELD_ENCRYPTION_AAD_WRITES binds
  # them to the workspace). 64 hex characters: `openssl rand -hex 32`.
  DATABASE_ENCRYPTION_KEY_V2: CHANGE_ME
  # The tenant shards the database provisioner places new workspaces on, as
  # the tenant role on each cluster's primary (crates/adapters-oss/src/cnpg.rs).
  TENANT_SHARDS: '[{"name":"tenants-1","adminUrl":"postgres://tenant:CHANGE_ME_TENANT@tenants-1-rw.postgres.svc:5432/tenants?sslmode=require","poolerHost":"tenants-1-pooler.postgres.svc"}]'
  # The weldsuite service user's personal access token in Zitadel (IAM_OWNER):
  # onboarding, team changes and the identity sync (README.md, step 7).
  ZITADEL_SERVICE_TOKEN: CHANGE_ME
  # Sign-in is OIDC against the in-cluster Zitadel (config.auth in the app's
  # values): its keys are public, so no secret is needed for it.
  VALKEY_URL: redis://default:CHANGE_ME_VALKEY@valkey.weldsuite.svc:6379
  NATS_URL: nats://nats.weldsuite.svc:4222
  NATS_TOKEN: CHANGE_ME_NATS
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  SIGN_SESSION_SECRET: CHANGE_ME
  # Shared by the server and the sign portal (ADR FE-017): the portal sends it
  # to /public/sign-portal, and the server trusts the signer IP the portal
  # reports only next to it. The same value in the portal's Secret.
  SIGN_PORTAL_SECRET: CHANGE_ME
  # WeldForms (ADR FORMS-002): respondent sessions, the key the forms portal
  # sends to /public/forms (the same value in the portal's Secret), and the
  # HMAC key of the ALTCHA proof-of-work bot check (FORMS-005).
  FORMS_SESSION_SECRET: CHANGE_ME
  FORMS_PORTAL_SECRET: CHANGE_ME
  ALTCHA_HMAC_KEY: CHANGE_ME
  # The staff admin console (admin.<domain>, ADR FE-018). Its confidential app
  # in Zitadel's `WeldSuite Staff` project (Hetzner runbook, "Staff work"),
  # and the key that seals its session cookies (64 hex characters). Without
  # them the console lets nobody in.
  ADMIN_OIDC_CLIENT_ID: CHANGE_ME
  ADMIN_OIDC_CLIENT_SECRET: CHANGE_ME
  ADMIN_SESSION_SECRET: CHANGE_ME
  # Shared by the server and the admin console: what the console sends to
  # the server's /internal/outbound (outbound mail review).
  OUTBOUND_ADMIN_SECRET: CHANGE_ME
  # Signs the files cookie and the signed URLs that open private objects.
  STORAGE_SIGNING_KEY: CHANGE_ME
  # What callers of the realtime gateway's /publish/* and /internal/* send in
  # x-internal-secret; unset refuses them all.
  REALTIME_INTERNAL_SECRET: CHANGE_ME
  # WeldDesk's helpdesk widget: the widget API signs its visitors' realtime
  # tokens with it, and the gateway in the same server verifies them.
  WIDGET_TOKEN_SECRET: CHANGE_ME
  # WeldDocs' and WeldSheets' rooms (collabRooms): the server and the
  # collab-rooms pods send it as x-internal-secret on every call between them.
  COLLAB_ROOMS_SECRET: CHANGE_ME
  # Internal calls between the server's own parts: WeldConnect's internal
  # routes (workflow polls, crm-due, ad-sync, connector-catchup), WeldCall's
  # internal API and WooCommerce's app-auth state.
  INTERNAL_API_SECRET: CHANGE_ME
  # Seals the WeldReach warmup pool's mailbox logins (a v2 key, 64 hex
  # characters: `openssl rand -hex 32`). Without it, creating a WeldReach
  # mailbox answers 503 and the warmup crons and subscribers do nothing.
  WELDREACH_WARMUP_KEY: CHANGE_ME
  # WeldMeet on LiveKit: the key pair the server mints join tokens, manages
  # rooms and checks LiveKit's webhooks with. The same pair is in livekit-env
  # below. The secret is at least 32 characters (`openssl rand -base64 32`).
  LIVEKIT_API_KEY: weldsuite
  LIVEKIT_API_SECRET: CHANGE_ME_LIVEKIT
  # WeldMail's MX (mailInbound): Haraka sends it with its RCPT TO check, the
  # server compares. Haraka reads it from here too.
  MAIL_INBOUND_SECRET: CHANGE_ME
  # Optional, WeldBooks' bank feeds on Ponto Connect (Isabel) for EU banks:
  # the app's OAuth client from developer.isabel.eu and its mTLS client
  # certificate and key as PEM, the key without its passphrase
  # (`openssl pkey -in private_key.pem -out key.pem`). Register
  # https://app.<domain>/weldbooks/banking/feeds/callback as a redirect URI.
  # Unset: Ponto is not offered.
  # A live application also signs every request: add the signature
  # certificate's id from the developer portal and that certificate's private
  # key (PEM, unencrypted the same way). The sandbox takes requests unsigned,
  # so leave those two out there.
  # PONTO_CLIENT_ID: CHANGE_ME
  # PONTO_CLIENT_SECRET: CHANGE_ME
  # PONTO_MTLS_CERT: |
  #   -----BEGIN CERTIFICATE-----
  # PONTO_MTLS_KEY: |
  #   -----BEGIN PRIVATE KEY-----
  # PONTO_SIGNATURE_CERT_ID: <the signature certificate's id>
  # PONTO_SIGNATURE_KEY: |
  #   -----BEGIN PRIVATE KEY-----
---
# --- mta: the MTA runs in its own namespace, weldsuite-mail (host network,
# which `weldsuite`'s restricted Pod Security level forbids). Its keys
# (mta.existingSecret in apps/eu/values) live there, so the server never
# holds the MTA's database login or key; the server reads the API secret and
# the submission passwords from weldsuite-mta-client below (the same named
# placeholders, so the values match).
apiVersion: v1
kind: Secret
metadata:
  name: weldsuite-mta
  namespace: weldsuite-mail
type: Opaque
stringData:
  # Straight to the master cluster's primary (not the PgBouncer pooler: the
  # MTA migrates under an advisory lock), as the mta role, the same password
  # as postgres/master-db-mta (infrastructure/configs/eu/mta-database.yaml).
  MTA_DATABASE_URL: postgres://mta:CHANGE_ME_MASTER_MTA@master-rw.postgres.svc:5432/weldsuite_mta?sslmode=require
  # base64 of 32 random bytes (`openssl rand -base64 32`): seals the DKIM
  # private keys in the database and keys the VERP tags. Losing it loses every
  # sending domain's DKIM key: keep it in the password manager too.
  MTA_KEY: CHANGE_ME_BASE64_32_BYTES
  # The MTA's HTTP API bearer token (the server's mail domain routes).
  MTA_API_SECRET: CHANGE_ME_MTA_API_SECRET
  # Submission passwords per pool (usernames system, customer). Hex: they go
  # into smtp:// URLs (`openssl rand -hex 32`).
  MTA_SUBMISSION_PASSWORD_SYSTEM: CHANGE_ME_MTA_SUBMISSION_SYSTEM
  MTA_SUBMISSION_PASSWORD_CUSTOMER: CHANGE_ME_MTA_SUBMISSION_CUSTOMER
---
# What the server, consume and the cron jobs need to reach the MTA
# (mta.clientSecret): the same three values as weldsuite-mail/weldsuite-mta.
apiVersion: v1
kind: Secret
metadata:
  name: weldsuite-mta-client
  namespace: weldsuite
type: Opaque
stringData:
  MTA_API_SECRET: CHANGE_ME_MTA_API_SECRET
  MTA_SUBMISSION_PASSWORD_SYSTEM: CHANGE_ME_MTA_SUBMISSION_SYSTEM
  MTA_SUBMISSION_PASSWORD_CUSTOMER: CHANGE_ME_MTA_SUBMISSION_CUSTOMER
---
# Pulls the weldsuite image into weldsuite-mail (the same as weldsuite/registry).
apiVersion: v1
kind: Secret
metadata:
  name: registry
  namespace: weldsuite-mail
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_USER_COLON_TOKEN"}}}'
---
# --- livekit: the media server (infrastructure/video). The same key pair as
# weldsuite-env above ("<key>: <secret>"; the key name is also the webhook's
# api_key in values/livekit.yaml), and Valkey's password from valkey-users.
apiVersion: v1
kind: Secret
metadata:
  name: livekit-env
  namespace: livekit
type: Opaque
stringData:
  LIVEKIT_KEYS: "weldsuite: CHANGE_ME_LIVEKIT"
  REDIS_PASSWORD: CHANGE_ME_VALKEY
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-auth
  namespace: weldsuite
type: Opaque
stringData:
  token: CHANGE_ME_NATS
---
apiVersion: v1
kind: Secret
metadata:
  name: valkey-users
  namespace: weldsuite
type: Opaque
stringData:
  default: CHANGE_ME_VALKEY
---
# Pulls the weldsuite image (ghcr.io until the EU registry exists, P5 5.4).
apiVersion: v1
kind: Secret
metadata:
  name: registry
  namespace: weldsuite
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_USER_COLON_TOKEN"}}}'
---
# --- marketing: pulls the marketing site's chart and image, which stay private
# like weldsuite-eu-marketing (apps/marketing). A classic GitHub token with only
# read:packages, of an account that can read that repository; base64 of
# <user>:<token>. Its own login, so the platform's images never depend on it.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: marketing
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_MARKETING_USER_COLON_TOKEN"}}}'
---
# The site's environment (existingSecret in apps/marketing/values): the
# cluster's own master database, as the marketing role, which reads the plan
# prices and nothing else. The same password as postgres/master-db-marketing.
apiVersion: v1
kind: Secret
metadata:
  name: marketing-env
  namespace: marketing
type: Opaque
stringData:
  MASTER_DATABASE_URL: postgres://marketing:CHANGE_ME_MASTER_MARKETING@master-r.postgres.svc:5432/weldsuite_master?sslmode=require
---
# --- postgres: the database owners CloudNativePG creates at initdb.
apiVersion: v1
kind: Secret
metadata:
  name: master-db-owner
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: weldsuite
  password: CHANGE_ME_MASTER_OWNER
---
apiVersion: v1
kind: Secret
metadata:
  name: tenants-1-owner
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: tenant
  password: CHANGE_ME_TENANT
---
# The marketing site's login on master (its managed.roles), the same password
# as marketing/marketing-env.
apiVersion: v1
kind: Secret
metadata:
  name: master-db-marketing
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: marketing
  password: CHANGE_ME_MASTER_MARKETING
---
# The MTA's login on master (configs/eu: a managed role owning weldsuite_mta),
# the same password as weldsuite/weldsuite-mta's MTA_DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: master-db-mta
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: mta
  password: CHANGE_ME_MASTER_MTA
---
# Backup bucket at the second EU provider; the same keys in both namespaces.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-s3
  namespace: postgres
type: Opaque
stringData:
  ACCESS_KEY_ID: CHANGE_ME
  ACCESS_SECRET_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-s3
  namespace: zitadel
type: Opaque
stringData:
  ACCESS_KEY_ID: CHANGE_ME
  ACCESS_SECRET_KEY: CHANGE_ME
---
# --- zitadel
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
type: Opaque
stringData:
  # Exactly 32 characters. Losing it makes Zitadel's encrypted data unreadable.
  masterkey: CHANGE_ME_EXACTLY_32_CHARACTERS_
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-db-user
  namespace: zitadel
type: Opaque
stringData:
  password: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: zitadel-first-admin
  namespace: zitadel
type: Opaque
stringData:
  # Changed at first login (README.md, step 7).
  password: CHANGE_ME_Aa1!
