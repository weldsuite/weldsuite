# Every Secret WeldID's layers expect (infrastructure/weldid, opt-in), with
# placeholders. Not applied by Flux. Apart from secrets.example.yaml because
# they go to their own folder, ../<cluster>/weldid/weldid.sops.yaml, which
# the weldid-secrets layer applies once the weldid namespace exists
# (clusters/example/weldid.yaml); a cluster without WeldID never has them.
#
# ../../scripts/fill-secrets.mjs --weldid --main <the cluster's secrets file>
# writes the file: it generates what is WeldID's own (the database password,
# the master key, the server's admin API key) and takes what WeldID shares
# with the platform from the cluster's main secrets file (the MTA's system
# pool, Valkey, the admin console's and Grafana's client secrets, the backup
# bucket's keys, the registry login), so each value is the same on both
# sides. It prints the admin API key's public half for the cluster's
# settings (WELDID_BACKEND_KEY_X and _Y). Then encrypt it with SOPS and list
# it in ../<cluster>/weldid/kustomization.yaml.
#
# External Secrets (ADR OPS-023): the migration off SOPS must carry these
# five Secrets too (infrastructure/weldid/README.md, "Secrets").

# --- weldid: the server's environment (the chart's secrets.existingSecret).
apiVersion: v1
kind: Secret
metadata:
  name: weldid-env
  namespace: weldid
type: Opaque
stringData:
  # weldid-db's primary, as the owner (the same password as weldid-db-owner).
  WELDID_DATABASE_URL: postgres://weldid:CHANGE_ME_WELDID_DB@weldid-db-rw.weldid.svc:5432/weldid?sslmode=require
  # base64 of 32 random bytes (`openssl rand -base64 32`): seals WeldID's
  # signing keys. Losing it makes every key WeldID made unusable, so keep it
  # in the password manager too; never replace it on a running install.
  WELDID_MASTER_KEY: CHANGE_ME_WELDID_MASTER_KEY
  # The MTA's system pool, as the platform's own system mail (submission
  # inside the cluster, without TLS, which WeldID allows only for a host in
  # the cluster): the same password as weldsuite-mta's.
  WELDID_SMTP_URL: smtp://system:CHANGE_ME_MTA_SUBMISSION_SYSTEM@weldsuite-mta.weldsuite-mail.svc:587?tls=none
  # The services layer's Valkey (valkey-users), for rate limits shared by
  # both replicas.
  WELDID_VALKEY_URL: redis://default:CHANGE_ME_VALKEY@valkey.weldsuite.svc:6379
  # The admin console's client secret: the same value as weldsuite-env's
  # ADMIN_OIDC_CLIENT_SECRET.
  WELDID_CLIENT_SECRET_WELDSUITE_ADMIN: CHANGE_ME_ADMIN_OIDC_CLIENT_SECRET
  # Grafana's: the same value as monitoring/grafana-oidc's.
  WELDID_CLIENT_SECRET_GRAFANA: CHANGE_ME_GRAFANA_OIDC_CLIENT_SECRET
---
# The database owner CloudNativePG creates at initdb (weldid-db).
apiVersion: v1
kind: Secret
metadata:
  name: weldid-db-owner
  namespace: weldid
type: kubernetes.io/basic-auth
stringData:
  username: weldid
  password: CHANGE_ME_WELDID_DB
---
# weldid-db's backups go to the cluster's backup bucket, with the same keys
# as postgres/postgres-backup-s3.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-backup-s3
  namespace: weldid
type: Opaque
stringData:
  ACCESS_KEY_ID: CHANGE_ME
  ACCESS_SECRET_KEY: CHANGE_ME
---
# Pulls WeldID's chart and image, both private until WeldID 1.0: a classic
# GitHub token with read:packages of an account that can read them, as
# base64 of <user>:<token> (the same login as weldsuite/registry will do when
# that account can read the weldid packages). Delete it, and the secretRef
# in infrastructure/weldid/source.yaml, once they are public.
apiVersion: v1
kind: Secret
metadata:
  name: registry
  namespace: weldid
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"CHANGE_ME_BASE64_USER_COLON_TOKEN"}}}'
---
# --- weldsuite: the server's key for WeldID's admin API (client
# weldsuite-backend, private_key_jwt): a P-256 private key, PKCS#8 PEM. Next
# to weldsuite-env rather than in it, so turning WeldID on never touches the
# server's Secret; the weldid-switch values hand it to the server as
# WELDID_CLIENT_KEY. Its public half is in the cluster's settings.
apiVersion: v1
kind: Secret
metadata:
  name: weldid-client
  namespace: weldsuite
type: Opaque
stringData:
  WELDID_CLIENT_KEY: CHANGE_ME_ES256_PRIVATE_KEY
