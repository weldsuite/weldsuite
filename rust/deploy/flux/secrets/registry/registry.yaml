# The registry login in both namespaces that run the weldsuite image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry
  namespace: weldsuite
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: registry
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .USERNAME .TOKEN | b64enc }}"}}}'
  data:
    - secretKey: USERNAME
      remoteRef: { key: weldsuite/registry, property: USERNAME }
    - secretKey: TOKEN
      remoteRef: { key: weldsuite/registry, property: TOKEN }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry
  namespace: weldsuite-mail
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
