# The example cluster's secrets. In your copy of this repository, secrets go
# in secrets/<your cluster> (the path of the secrets layer in
# clusters/<your cluster>/layers.yaml): generate secrets.sops.yaml here with
# ../../scripts/fill-secrets.mjs (or copy ../examples/secrets.example.yaml and
# fill it in), `sops --encrypt --in-place secrets.sops.yaml` with your
# .sops.yaml (rust/deploy/hetzner/README.md, step 4), and list it below.
# Never commit an unencrypted secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
#  - secrets.sops.yaml
