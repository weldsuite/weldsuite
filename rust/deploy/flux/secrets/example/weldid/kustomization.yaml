# The example cluster's WeldID secrets, applied by the weldid-secrets layer
# (clusters/example/weldid.yaml) once the weldid namespace exists. In your
# copy of this repository: generate weldid.sops.yaml here with
#   node ../../../scripts/fill-secrets.mjs --weldid --main ../secrets.sops.yaml weldid.sops.yaml
# (or copy ../../examples/weldid.example.yaml and fill it in), encrypt it
# with SOPS like the cluster's other secrets, and list it below. Never
# commit an unencrypted secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
#  - weldid.sops.yaml
