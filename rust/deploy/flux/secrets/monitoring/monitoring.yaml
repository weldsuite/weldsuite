# --- monitoring: where Alertmanager sends alerts, by role
# (infrastructure/monitoring-config/ALERTS.md, "Receivers").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alerting-receivers
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: alerting-receivers
  data:
    - secretKey: critical-url
      remoteRef: { key: weldsuite/alerting, property: CRITICAL_URL }
    - secretKey: warning-url
      remoteRef: { key: weldsuite/alerting, property: WARNING_URL }
    - secretKey: heartbeat-url
      remoteRef: { key: weldsuite/alerting, property: HEARTBEAT_URL }
    - secretKey: token
      remoteRef: { key: weldsuite/alerting, property: TOKEN }
---
# Grafana's OIDC client in Zitadel, as Grafana's environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: grafana-oidc
  data:
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef: { key: weldsuite/grafana, property: OIDC_CLIENT_ID }
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef: { key: weldsuite/grafana, property: OIDC_CLIENT_SECRET }
---
# Grafana's own admin login, for when Zitadel is down: the form at
# https://grafana.<domain>/login?disableAutoLogin=true.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: grafana-admin
    template:
      type: Opaque
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: '{{ .ADMIN_PASSWORD }}'
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: weldsuite/grafana, property: ADMIN_PASSWORD }
