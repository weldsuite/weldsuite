# --- livekit: the media server (infrastructure/video). The same key pair as
# weldsuite-env ("<key>: <secret>"; the key name is also the webhook's api_key
# in values/livekit.yaml), and Valkey's password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit-env
  namespace: livekit
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: livekit-env
    template:
      type: Opaque
      engineVersion: v2
      data:
        LIVEKIT_KEYS: 'weldsuite: {{ .LIVEKIT_API_SECRET }}'
        REDIS_PASSWORD: '{{ .VALKEY_PASSWORD }}'
  data:
    - secretKey: LIVEKIT_API_SECRET
      remoteRef: { key: weldsuite/livekit, property: API_SECRET }
    - secretKey: VALKEY_PASSWORD
      remoteRef: { key: weldsuite/valkey, property: PASSWORD }
