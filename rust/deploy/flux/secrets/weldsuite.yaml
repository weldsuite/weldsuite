# --- weldsuite: the server's environment (rust/bins/weldsuite/src/config.rs).
# Every value in the store's weldsuite/server comes in under its own name, so
# an optional one (PONTO_CLIENT_ID, MONEYBIRD_CLIENT_ID, …; store.example.yaml)
# only needs adding there. The connection URLs are built from the passwords
# of the services they reach. Because the template merges, those passwords
# are keys of the Secret too (MASTER_DB_PASSWORD, TENANT_DB_PASSWORD,
# VALKEY_PASSWORD), which the server ignores; the URLs carry them anyway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weldsuite-env
  namespace: weldsuite
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: weldsuite-env
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Merge
      data:
        # Through the PgBouncer Pooler, transaction mode (spikes S3/S4).
        DATABASE_URL_MASTER: 'postgres://weldsuite:{{ .MASTER_DB_PASSWORD }}@master-pooler.postgres.svc:5432/weldsuite_master?sslmode=require'
        # The tenant shards the database provisioner places new workspaces
        # on, as the tenant role on each cluster's primary
        # (crates/adapters-oss/src/cnpg.rs).
        TENANT_SHARDS: '[{"name":"tenants-1","adminUrl":"postgres://tenant:{{ .TENANT_DB_PASSWORD }}@tenants-1-rw.postgres.svc:5432/tenants?sslmode=require","poolerHost":"tenants-1-pooler.postgres.svc"}]'
        VALKEY_URL: 'redis://default:{{ .VALKEY_PASSWORD }}@valkey.weldsuite.svc:6379'
        NATS_URL: nats://nats.weldsuite.svc:4222
        # WeldMeet on LiveKit: the key of the pair the server mints join
        # tokens, manages rooms and checks LiveKit's webhooks with (the same
        # pair is in livekit-env).
        LIVEKIT_API_KEY: weldsuite
  dataFrom:
    - extract: { key: weldsuite/server }
  data:
    - secretKey: MASTER_DB_PASSWORD
      remoteRef: { key: weldsuite/postgres, property: MASTER_OWNER_PASSWORD }
    - secretKey: TENANT_DB_PASSWORD
      remoteRef: { key: weldsuite/postgres, property: TENANT_PASSWORD }
    - secretKey: VALKEY_PASSWORD
      remoteRef: { key: weldsuite/valkey, property: PASSWORD }
    - secretKey: NATS_TOKEN
      remoteRef: { key: weldsuite/nats, property: TOKEN }
    - secretKey: LIVEKIT_API_SECRET
      remoteRef: { key: weldsuite/livekit, property: API_SECRET }
---
# NATS's token (the server's NATS_TOKEN).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-auth
  namespace: weldsuite
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: nats-auth
  data:
    - secretKey: token
      remoteRef: { key: weldsuite/nats, property: TOKEN }
---
# Valkey's ACL: the default user's password (also in the server's VALKEY_URL
# and LiveKit's REDIS_PASSWORD).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-users
  namespace: weldsuite
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: valkey-users
  data:
    - secretKey: default
      remoteRef: { key: weldsuite/valkey, property: PASSWORD }
