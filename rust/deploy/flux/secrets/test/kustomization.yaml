# The test cluster's secrets, encrypted with SOPS (age). Generate
# secrets.sops.yaml here with ../../scripts/fill-secrets.mjs, fill in the
# provider keys it leaves, `sops --encrypt --in-place secrets.sops.yaml`, and
# list it below (TEST-CLUSTER.md). Never commit an unencrypted secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - secrets.sops.yaml
