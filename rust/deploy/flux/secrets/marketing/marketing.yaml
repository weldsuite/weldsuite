# --- marketing: pulls the marketing site's chart and image, which stay private
# like weldsuite-eu-marketing (apps/marketing). Its own login, so the
# platform's images never depend on it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
  namespace: marketing
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .USERNAME .TOKEN | b64enc }}"}}}'
  data:
    - secretKey: USERNAME
      remoteRef: { key: weldsuite/marketing-registry, property: USERNAME }
    - secretKey: TOKEN
      remoteRef: { key: weldsuite/marketing-registry, property: TOKEN }
---
# The site's environment (existingSecret in apps/marketing/values): the
# cluster's own master database, as the marketing role, which reads the plan
# prices and nothing else (postgres/master-db-marketing).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketing-env
  namespace: marketing
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: marketing-env
    template:
      type: Opaque
      engineVersion: v2
      data:
        MASTER_DATABASE_URL: 'postgres://marketing:{{ .PASSWORD }}@master-r.postgres.svc:5432/weldsuite_master?sslmode=require'
  data:
    - secretKey: PASSWORD
      remoteRef: { key: weldsuite/postgres, property: MARKETING_PASSWORD }
