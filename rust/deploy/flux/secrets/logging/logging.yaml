# --- logging: Loki's key for the cluster's logs bucket (LOGS_BUCKET), limited
# to that bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3
  namespace: logging
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: loki-s3
  data:
    - secretKey: access-key-id
      remoteRef: { key: weldsuite/logs-s3, property: ACCESS_KEY_ID }
    - secretKey: secret-access-key
      remoteRef: { key: weldsuite/logs-s3, property: SECRET_ACCESS_KEY }
