# --- mta: the MTA runs in its own namespace, weldsuite-mail (host network,
# which `weldsuite`'s restricted Pod Security level forbids). Its keys
# (mta.existingSecret in apps/eu/values) live there, so the server never
# holds the MTA's database login or key; the server reads the API secret and
# the submission passwords from weldsuite-mta-client (the same store values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weldsuite-mta
  namespace: weldsuite-mail
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: weldsuite-mta
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Straight to the master cluster's primary (not the PgBouncer pooler:
        # the MTA migrates under an advisory lock), as the mta role.
        MTA_DATABASE_URL: 'postgres://mta:{{ .MTA_DB_PASSWORD }}@master-rw.postgres.svc:5432/weldsuite_mta?sslmode=require'
        MTA_KEY: '{{ .MTA_KEY }}'
        MTA_API_SECRET: '{{ .MTA_API_SECRET }}'
        MTA_SUBMISSION_PASSWORD_SYSTEM: '{{ .MTA_SUBMISSION_PASSWORD_SYSTEM }}'
        MTA_SUBMISSION_PASSWORD_CUSTOMER: '{{ .MTA_SUBMISSION_PASSWORD_CUSTOMER }}'
        # Where the delivery events go (weldsuite consume reads them): the
        # same NATS and token as weldsuite-env's, which the MTA can't read
        # from this namespace. Without them the events stay in the MTA's
        # outbox.
        NATS_URL: nats://nats.weldsuite.svc:4222
        NATS_TOKEN: '{{ .NATS_TOKEN }}'
  data:
    - secretKey: NATS_TOKEN
      remoteRef: { key: weldsuite/nats, property: TOKEN }
    - secretKey: MTA_DB_PASSWORD
      remoteRef: { key: weldsuite/postgres, property: MTA_PASSWORD }
    - secretKey: MTA_KEY
      remoteRef: { key: weldsuite/mta, property: MTA_KEY }
    - secretKey: MTA_API_SECRET
      remoteRef: { key: weldsuite/mta, property: MTA_API_SECRET }
    - secretKey: MTA_SUBMISSION_PASSWORD_SYSTEM
      remoteRef: { key: weldsuite/mta, property: MTA_SUBMISSION_PASSWORD_SYSTEM }
    - secretKey: MTA_SUBMISSION_PASSWORD_CUSTOMER
      remoteRef: { key: weldsuite/mta, property: MTA_SUBMISSION_PASSWORD_CUSTOMER }
---
# What the server, consume and the cron jobs need to reach the MTA
# (mta.clientSecret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weldsuite-mta-client
  namespace: weldsuite
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: weldsuite-mta-client
  data:
    - secretKey: MTA_API_SECRET
      remoteRef: { key: weldsuite/mta, property: MTA_API_SECRET }
    - secretKey: MTA_SUBMISSION_PASSWORD_SYSTEM
      remoteRef: { key: weldsuite/mta, property: MTA_SUBMISSION_PASSWORD_SYSTEM }
    - secretKey: MTA_SUBMISSION_PASSWORD_CUSTOMER
      remoteRef: { key: weldsuite/mta, property: MTA_SUBMISSION_PASSWORD_CUSTOMER }
---
# The MTA's login on master (a managed role owning weldsuite_mta, added by the
# configs patch in clusters/example/layers.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: master-db-mta
  namespace: postgres
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: master-db-mta
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: mta
        password: '{{ .PASSWORD }}'
  data:
    - secretKey: PASSWORD
      remoteRef: { key: weldsuite/postgres, property: MTA_PASSWORD }
