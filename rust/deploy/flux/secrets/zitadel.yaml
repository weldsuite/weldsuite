# --- zitadel
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-masterkey
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: zitadel-masterkey
  data:
    - secretKey: masterkey
      remoteRef: { key: weldsuite/zitadel, property: MASTERKEY }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-user
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: zitadel-db-user
  data:
    - secretKey: password
      remoteRef: { key: weldsuite/zitadel, property: DB_PASSWORD }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-first-admin
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: zitadel-first-admin
  data:
    - secretKey: password
      remoteRef: { key: weldsuite/zitadel, property: FIRST_ADMIN_PASSWORD }
---
# Zitadel's database backups go to the same bucket as Postgres's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-s3
  namespace: zitadel
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: postgres-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: weldsuite/backup-s3, property: ACCESS_KEY_ID }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: weldsuite/backup-s3, property: ACCESS_SECRET_KEY }
