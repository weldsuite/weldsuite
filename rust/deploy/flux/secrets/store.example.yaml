# Every value a cluster's secret store holds, by entry (a path in the store's
# `secret` mount) and property, with what fills it. Not applied by Flux: the
# ExternalSecrets next to it build the Secrets from these values, and
# ../scripts/seed-secrets.mjs writes each one a store lacks:
#
#   CHANGE_ME                          32 random bytes as hex (64 characters)
#   CHANGE_ME_EXACTLY_32_CHARACTERS_   32 random letters and digits
#   CHANGE_ME_BASE64_32_BYTES          base64 of 32 random bytes
#   CHANGE_ME_Aa1!                     a password with upper and lower case,
#                                      a digit and a symbol
#   $NAME                              a provider's value, from the
#                                      environment variable NAME; without it
#                                      the store gets CHANGE_ME, which a later
#                                      run with NAME set replaces
#
# A placeholder keeps every ExternalSecret readable, so the layers come up
# before a provider's value exists (Zitadel's tokens can only be made once it
# runs); the Secret holds CHANGE_ME until then, as the SOPS files did.
# `seed-secrets.mjs --check` (validate.sh) fails when an ExternalSecret reads
# a value that isn't listed here, or when no ExternalSecret reads a listed one.

# --- the server's own values. weldsuite-env takes every property of this
# entry under its own name, so an optional one (below) only needs adding here.
weldsuite/server:
  # Decrypts workspaces.database_url (same format as the workers').
  DATABASE_ENCRYPTION_KEY: CHANGE_ME
  # Seals new workspaces' database URLs (v2; FIELD_ENCRYPTION_AAD_WRITES binds
  # them to the workspace). 64 hex characters.
  DATABASE_ENCRYPTION_KEY_V2: CHANGE_ME
  # The weldsuite service user's personal access token in Zitadel (IAM_OWNER,
  # and IAM_LOGIN_CLIENT for the platform's own sign-in screens): onboarding,
  # team changes, the identity sync and sign-in (rust/deploy/hetzner/README.md,
  # step 7). To keep sign-in on a user of its own, add its token as
  # ZITADEL_LOGIN_TOKEN. Sign-in itself is OIDC against the in-cluster
  # Zitadel, whose keys are public.
  ZITADEL_SERVICE_TOKEN: $ZITADEL_SERVICE_TOKEN
  # The files bucket (FILES_BUCKET_PRIVATE).
  S3_ACCESS_KEY_ID: $FILES_S3_ACCESS_KEY_ID
  S3_SECRET_ACCESS_KEY: $FILES_S3_SECRET_ACCESS_KEY
  SIGN_SESSION_SECRET: CHANGE_ME
  # Shared by the server and the sign portal (ADR FE-017): the portal sends it
  # to /public/sign-portal, and the server trusts the signer IP the portal
  # reports only next to it. The same value in the portal's Secret.
  SIGN_PORTAL_SECRET: CHANGE_ME
  # WeldForms (ADR FORMS-002): respondent sessions, the key the forms portal
  # sends to /public/forms (the same value in the portal's Secret), and the
  # HMAC key of the ALTCHA proof-of-work bot check (FORMS-005).
  FORMS_SESSION_SECRET: CHANGE_ME
  FORMS_PORTAL_SECRET: CHANGE_ME
  ALTCHA_HMAC_KEY: CHANGE_ME
  # WeldCommerce's online stores (storefront): shared by the server and the
  # storefront renderer, which reads it from weldsuite-env too. The renderer's
  # bearer token to /public/storefront, the edge's header to the renderer, and
  # the key of preview links, visitor passes and the stored shop passwords:
  # replacing it makes every shop password stop working until the merchant
  # sets it again.
  STOREFRONT_RENDERER_SECRET: CHANGE_ME
  # The staff admin console (admin.<domain>, ADR FE-018). Its confidential app
  # in Zitadel's `WeldSuite Staff` project (Hetzner runbook, "Staff work"),
  # and the key that seals its session cookies (64 hex characters). Without
  # them the console lets nobody in.
  ADMIN_OIDC_CLIENT_ID: $ADMIN_OIDC_CLIENT_ID
  ADMIN_OIDC_CLIENT_SECRET: $ADMIN_OIDC_CLIENT_SECRET
  ADMIN_SESSION_SECRET: CHANGE_ME
  # Shared by the server and the admin console: what the console sends to
  # the server's /internal/outbound (outbound mail review).
  OUTBOUND_ADMIN_SECRET: CHANGE_ME
  # Signs the files cookie and the signed URLs that open private objects.
  STORAGE_SIGNING_KEY: CHANGE_ME
  # What callers of the realtime gateway's /publish/* and /internal/* send in
  # x-internal-secret; unset refuses them all.
  REALTIME_INTERNAL_SECRET: CHANGE_ME
  # WeldDesk's helpdesk widget: the widget API signs its visitors' realtime
  # tokens with it, and the gateway in the same server verifies them.
  WIDGET_TOKEN_SECRET: CHANGE_ME
  # WeldDocs' and WeldSheets' rooms (collabRooms): the server and the
  # collab-rooms pods send it as x-internal-secret on every call between them.
  COLLAB_ROOMS_SECRET: CHANGE_ME
  # Internal calls between the server's own parts: WeldConnect's internal
  # routes (workflow polls, crm-due, ad-sync, connector-catchup), WeldCall's
  # internal API and WooCommerce's app-auth state.
  INTERNAL_API_SECRET: CHANGE_ME
  # Seals the WeldReach warmup pool's mailbox logins (a v2 key, 64 hex
  # characters). Without it, creating a WeldReach mailbox answers 503 and the
  # warmup crons and subscribers do nothing.
  WELDREACH_WARMUP_KEY: CHANGE_ME
  # WeldPass's root key (64 hex characters): wraps every vault's and secrets
  # project's key. Without it every vault and project answers 500
  # CRYPTO_ERROR. Losing or replacing it makes every stored password and
  # secret unrecoverable: never change it on a cluster that has WeldPass data.
  WELDPASS_ROOT_KEY: CHANGE_ME
  # WeldMail's MX (mailInbound): Haraka sends it with its RCPT TO check, the
  # server compares. Haraka reads it from weldsuite-env too.
  MAIL_INBOUND_SECRET: CHANGE_ME
  # AI on Mistral (config.ai, ADR AI-012): WeldSuite's Mistral API key (La
  # Plateforme, the EU edition's account), which the search index's
  # embeddings use too. The server, consume and the cron jobs don't start
  # without it while config.ai.defaultProvider is mistral; with CHANGE_ME
  # they start, and every AI call fails until the real key is in.
  MISTRAL_API_KEY: $MISTRAL_API_KEY
  # Seals the API keys workspaces bring for Claude and ChatGPT (64 hex
  # characters). Losing it loses every stored own key, nothing else.
  AI_KEYS_ENCRYPTION_KEY: CHANGE_ME
  # WeldAgent's sandbox (sandbox.enabled): derives each sandbox pod's token,
  # the same on every replica. At least 32 characters.
  SANDBOX_TOKEN_SECRET: CHANGE_ME
  # Optional, WeldSuite's EU-edition Anthropic and OpenAI accounts, for
  # workspaces that opt in with WeldSuite's key (config.ai.optIn.<provider>
  # .weldsuiteKey, which needs its key here). Unset: those providers are
  # offered with the workspace's own key only.
  # ANTHROPIC_API_KEY: <WeldSuite's EU-edition Anthropic key>
  # OPENAI_API_KEY: <WeldSuite's EU-edition OpenAI key>
  # Optional, WeldBooks' bank feeds on Ponto Connect (Isabel) for EU banks:
  # the Ponto Connect product's OAuth client from developer.isabel.eu (API
  # version 2) and the application's mTLS client certificate and key as PEM,
  # the key without its passphrase
  # (`openssl pkey -in private_key.pem -out key.pem`). Register
  # https://app.<domain>/weldbooks/banking/feeds/callback as a redirect URI.
  # Unset: Ponto is not offered.
  # A sandbox application: also set PONTO_ENV: sandbox, which sends people to
  # the sandbox's authorization page (the certificate decides which data the
  # API answers with). Leave it out for a live application.
  # A live application may also sign its requests: add the signature
  # certificate's id from the developer portal and that certificate's private
  # key (PEM, unencrypted the same way). Ponto requires signatures for
  # payments only, which WeldBooks does not make; leave both out in the
  # sandbox.
  # PONTO_ENV: sandbox
  # PONTO_CLIENT_ID: <the OAuth client's id>
  # PONTO_CLIENT_SECRET: <its secret>
  # PONTO_MTLS_CERT: -----BEGIN CERTIFICATE----- …
  # PONTO_MTLS_KEY: -----BEGIN PRIVATE KEY----- …
  # PONTO_SIGNATURE_CERT_ID: <the signature certificate's id>
  # PONTO_SIGNATURE_KEY: -----BEGIN PRIVATE KEY----- …
  # Ponto's webhooks (new transactions as soon as Ponto has them, instead of
  # a poll every six hours): the application's id from the developer portal,
  # which the webhook signatures name. In the application's Webhooks tab,
  # register https://api.<domain>/webhooks/bank-feeds/ponto and subscribe to
  # the pontoConnect account, synchronization, integration and organization
  # events. The receiver fetches the signing keys with the mTLS certificate
  # above.
  # PONTO_APPLICATION_ID: <the application's id>
  # Optional, WeldBooks' filing through Logius Digipoort: the BTW-aangifte and
  # the Opgaaf ICP to the Belastingdienst and the jaarrekening to the KvK, all
  # sent by this install as the intermediary with one PKIoverheid services
  # server certificate (rust/crates/digipoort). Needs WeldSuite's ODB
  # registration, the certificate and a connection to the new Digipoort
  # (Logius' Aansluit Suite). The certificate PEM is the leaf first with its
  # intermediates; the key unencrypted (`openssl pkey -in key.pem -out
  # key-plain.pem`). DIGIPOORT_CA holds the PKIoverheid roots Digipoort's own
  # server certificate chains to (Staat der Nederlanden Private Root CA - G1
  # and its Private Services CA), which no public trust store has. The URLs
  # are the environment's aanleverservice and statusinformatieservice 1.2
  # endpoints as the Aansluit Suite lists them (production:
  # https://wus.digipoort.logius.nl/wus/2.0/aanleverservice/1.2 and
  # .../statusinformatieservice/1.2; pre-production on
  # wus.preproductie.digipoort.logius.nl). Start with preprod. Unset, or
  # DIGIPOORT_MODE: simulated: filing is hidden and returns are filed by hand
  # and marked as filed. Set but incomplete or unreadable: the server refuses
  # to start.
  # DIGIPOORT_MODE: preprod
  # DIGIPOORT_AANLEVER_URL: https://…/wus/2.0/aanleverservice/1.2
  # DIGIPOORT_STATUS_URL: https://…/wus/2.0/statusinformatieservice/1.2
  # DIGIPOORT_CERT: -----BEGIN CERTIFICATE----- …
  # DIGIPOORT_KEY: -----BEGIN PRIVATE KEY----- …
  # DIGIPOORT_CA: -----BEGIN CERTIFICATE----- …
  # Optional, WeldSign eIDAS (plan weldsign-eidas): advanced and qualified
  # signatures through a qualified trust service provider over the CSC API v2,
  # and the operator's qualified seal and timestamps on every signed PDF.
  # Register https://sign.<domain>/signature-callback as the redirect URI.
  # Unset (SIGN_TRUST_MODE off): simple signatures only, nothing sealed.
  # SIGN_TRUST_MODE: csc
  # SIGN_CSC_PROVIDER: <the provider's name, shown to signers>
  # SIGN_CSC_BASE_URL: https://…/csc/v2
  # SIGN_CSC_CLIENT_ID: <WeldSign's client at the provider>
  # SIGN_CSC_CLIENT_SECRET: <its secret>
  # SIGN_CSC_QES_PROFILE: <the provider's qualified profile>
  # SIGN_CSC_AES_PROFILE: <its advanced profile>
  # SIGN_SEAL_CREDENTIAL_ID: <the seal credential>
  # SIGN_TSA_URL: https://…/tsa
  # SIGN_AES_CREDITS: "100"
  # SIGN_QES_CREDITS: "300"
  # Optional, WeldConnect's Moneybird connector (contacts, invoices, bills,
  # receipts and bank lines into WeldBooks; the Stripe sales push back): an
  # OAuth app registered in Moneybird (developer.moneybird.com/authentication),
  # its own or Global's with this redirect URI added. Register
  # https://app.<domain>/weldconnect/connectors/callback as its redirect URI.
  # Unset: connecting Moneybird answers that it is not configured.
  # MONEYBIRD_CLIENT_ID: <the OAuth app's id>
  # MONEYBIRD_CLIENT_SECRET: <its secret>
  # Optional, buying credits (the platform's top-up) through Mollie (ADR
  # OPS-012): the website profile's live API key from my.mollie.com
  # (Developers › API keys; a test_… key for a test cluster). Mollie posts
  # payment changes to https://app.<domain>/api/webhooks/mollie, which the
  # server derives from publicUrl. Unset: credits can't be bought.
  # MOLLIE_API_KEY: <the profile's API key>
  # Optional, WeldCommerce taking payments into each workspace's own Mollie
  # account (ADR COM-013): the Mollie Connect app from my.mollie.com
  # (Developers › Your apps), with
  # https://app.<domain>/api/commerce-payments/connection/mollie/callback as
  # its redirect URI. Mollie posts payment changes to
  # https://app.<domain>/webhooks/commerce/mollie/<connection id>. Unset:
  # workspaces connect Mollie with their own API key.
  # MOLLIE_CONNECT_CLIENT_ID: <the app's client id>
  # MOLLIE_CONNECT_CLIENT_SECRET: <its client secret>
  # Optional, WeldChat's call ring on iPhones: an APNs auth key from
  # developer.apple.com (Certificates, Identifiers & Profiles › Keys, with
  # Apple Push Notifications service) of the team that owns the WeldChat app,
  # for the VoIP push that makes CallKit ring on the lock screen. The key's id,
  # the team's id and the .p8 file's PEM; all three or none. Unset: an iPhone
  # gets the ordinary "Incoming call" notification and no CallKit ring
  # (Android's ring needs none of them).
  # APNS_KEY_ID: <the key's id>
  # APNS_TEAM_ID: <the Apple team's id>
  # APNS_PRIVATE_KEY: -----BEGIN PRIVATE KEY----- …
  # Optional, WeldChat: signs the ring token each incoming-call push carries,
  # with which the lock-screen or CallKit Decline ends the ring at
  # /public/chat-calls/decline without a session, while the app is not
  # running. Any random value (32 random bytes as hex, as CHANGE_ME above).
  # Unset: no token is sent and that route answers 401, so a Decline needs
  # the app and its session, and one the app doesn't get to send leaves the
  # caller ringing until the ring times out.
  # CALL_RING_SECRET: <32 random bytes as hex>

# --- the Postgres logins. CloudNativePG creates the owners at initdb and keeps
# the managed roles in step with their Secrets; the URLs that use them are
# built from the same values.
weldsuite/postgres:
  # master's owner, weldsuite (master-db-owner; the server's
  # DATABASE_URL_MASTER).
  MASTER_OWNER_PASSWORD: CHANGE_ME
  # tenants-1's owner, tenant (tenants-1-owner; the server's TENANT_SHARDS).
  TENANT_PASSWORD: CHANGE_ME
  # The marketing site's login on master (master-db-marketing; marketing-env).
  MARKETING_PASSWORD: CHANGE_ME
  # The MTA's login on master, owning weldsuite_mta (master-db-mta;
  # weldsuite-mta's MTA_DATABASE_URL).
  MTA_PASSWORD: CHANGE_ME

# Valkey's default user (valkey-users; the server's VALKEY_URL, LiveKit's
# REDIS_PASSWORD).
weldsuite/valkey:
  PASSWORD: CHANGE_ME

# NATS's token (nats-auth; the server's and the MTA's NATS_TOKEN).
weldsuite/nats:
  TOKEN: CHANGE_ME

# WeldMeet on LiveKit: the secret of the API key `weldsuite`, which the server
# mints join tokens, manages rooms and checks LiveKit's webhooks with (the
# server's LIVEKIT_API_SECRET, livekit-env's LIVEKIT_KEYS). At least 32
# characters.
weldsuite/livekit:
  API_SECRET: CHANGE_ME

weldsuite/zitadel:
  # Exactly 32 characters. Losing it makes Zitadel's encrypted data
  # unreadable: keep it in the password manager too.
  MASTERKEY: CHANGE_ME_EXACTLY_32_CHARACTERS_
  DB_PASSWORD: CHANGE_ME
  # The first admin's password, changed at first login (README.md, step 7).
  FIRST_ADMIN_PASSWORD: CHANGE_ME_Aa1!

# The backup bucket at the second EU provider (postgres-backup-s3 in postgres
# and in zitadel).
weldsuite/backup-s3:
  ACCESS_KEY_ID: $BACKUP_S3_ACCESS_KEY_ID
  ACCESS_SECRET_KEY: $BACKUP_S3_SECRET_ACCESS_KEY

# --- the mta component (weldsuite-mta, weldsuite-mta-client).
weldsuite/mta:
  # Seals the DKIM private keys in the database and keys the VERP tags.
  # Losing it loses every sending domain's DKIM key: keep it in the password
  # manager too.
  MTA_KEY: CHANGE_ME_BASE64_32_BYTES
  # The MTA's HTTP API bearer token (the server's mail domain routes).
  MTA_API_SECRET: CHANGE_ME
  # Submission passwords per pool (usernames system, customer). Hex: they go
  # into smtp:// URLs.
  MTA_SUBMISSION_PASSWORD_SYSTEM: CHANGE_ME
  MTA_SUBMISSION_PASSWORD_CUSTOMER: CHANGE_ME

# --- the monitoring component (ADR OPS-021). Where alerts go, by role:
# Alertmanager posts its webhook JSON to each URL, with the token as a bearer
# token (critical and warning only). WeldSuite's clusters use ntfy topics with
# ntfy's message template in the URL and a healthchecks.io ping URL for the
# heartbeat; any webhook works (infrastructure/monitoring-config/ALERTS.md,
# "Receivers", has the ntfy URL). Point critical and warning at the same URL
# to have one channel.
weldsuite/alerting:
  CRITICAL_URL: $ALERT_CRITICAL_URL
  WARNING_URL: $ALERT_WARNING_URL
  # Pinged every minute; whatever is behind it alarms when the pings stop.
  HEARTBEAT_URL: $ALERT_HEARTBEAT_URL
  TOKEN: $ALERT_TOKEN

weldsuite/grafana:
  # Grafana's OIDC client in Zitadel (an app in the WeldSuite project, redirect
  # https://grafana.<domain>/login/generic_oauth).
  OIDC_CLIENT_ID: $GRAFANA_OIDC_CLIENT_ID
  OIDC_CLIENT_SECRET: $GRAFANA_OIDC_CLIENT_SECRET
  # Grafana's own admin (user admin), for when Zitadel is down.
  ADMIN_PASSWORD: CHANGE_ME

# --- the logging component: Loki's key for the cluster's logs bucket
# (LOGS_BUCKET), limited to that bucket.
weldsuite/logs-s3:
  ACCESS_KEY_ID: $LOGS_S3_ACCESS_KEY_ID
  SECRET_ACCESS_KEY: $LOGS_S3_SECRET_ACCESS_KEY

# --- the offsite-copy component: the offsite copy's two keys
# (infrastructure/offsite-copy). SOURCE: one key that can list and read
# every bucket in OFFSITE_SOURCE_BUCKETS at OFFSITE_SOURCE_S3_ENDPOINT, and
# nothing more where the store can limit it. DESTINATION: a key for
# OFFSITE_BUCKET at OFFSITE_S3_ENDPOINT that can list, read and write; in
# copy mode (the default) one that can't delete.
weldsuite/offsite-copy:
  SOURCE_ACCESS_KEY_ID: $OFFSITE_SOURCE_S3_ACCESS_KEY_ID
  SOURCE_SECRET_ACCESS_KEY: $OFFSITE_SOURCE_S3_SECRET_ACCESS_KEY
  DESTINATION_ACCESS_KEY_ID: $OFFSITE_S3_ACCESS_KEY_ID
  DESTINATION_SECRET_ACCESS_KEY: $OFFSITE_S3_SECRET_ACCESS_KEY

# --- the registry component: pulling the weldsuite images while they are
# private. A GitHub token with only read:packages.
weldsuite/registry:
  USERNAME: $GHCR_USER
  TOKEN: $GHCR_TOKEN

# --- the marketing component: pulling the marketing site's chart and image. A
# classic GitHub token with only read:packages, of an account that can read
# weldsuite-eu-marketing.
weldsuite/marketing-registry:
  USERNAME: $MARKETING_GHCR_USER
  TOKEN: $MARKETING_GHCR_TOKEN

# --- WeldID (opt-in, ../secrets/weldid). What it shares with the platform
# (Valkey, the MTA's system pool, the admin console's and Grafana's client
# secrets, the backup bucket, the registry login) it reads from the entries
# above.
weldsuite/weldid:
  # Its database owner (weldid-db-owner; WELDID_DATABASE_URL).
  DB_PASSWORD: CHANGE_ME
  # WELDID_MASTER_KEY: seals WeldID's signing keys. Losing it makes every
  # key WeldID made unusable: keep it in the password manager too, and never
  # replace it on a running install.
  MASTER_KEY: CHANGE_ME_BASE64_32_BYTES
  # The server's key for WeldID's admin API (weldsuite/weldid-client). When
  # seed-secrets.mjs makes it, it prints the public half for the cluster's
  # WELDID_BACKEND_KEY_X and _Y.
  CLIENT_KEY: CHANGE_ME_ES256_PRIVATE_KEY
