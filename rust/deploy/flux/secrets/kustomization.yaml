# The secrets layer: an ExternalSecret for every Secret the later layers read,
# which External Secrets Operator (infrastructure/controllers) fills from the
# cluster's secret store (store.yaml). Names and templates only: no value of a
# secret is ever in this repository. store.example.yaml lists every value the
# store holds; ../scripts/seed-secrets.mjs fills a store from it and checks
# that the two agree (validate.sh runs `--check`).
#
# Always: the server's environment, Postgres, Zitadel, LiveKit and the
# services. The rest are components a cluster names in its secrets layer
# (`components:` in clusters/<cluster>/layers.yaml), each with the layer that
# reads it:
#   mta/         the MTA (mta.enabled in apps/eu/values, the configs patch
#                that adds its role, the cluster's configs-extra)
#   marketing/   the marketing site (apps/marketing)
#   monitoring/  the monitoring layer (alerting, Grafana)
#   logging/     the logging layer (Loki's bucket)
#   offsite-copy/ the offsite-copy layer (its two stores' keys)
#   registry/    pulling the images when they are private
#
# ESO owns each Secret it writes (an ExternalSecret removed takes its Secret
# with it) and keeps it as it is while the store can't be read.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - store.yaml
  - weldsuite.yaml
  - postgres.yaml
  - zitadel.yaml
  - livekit.yaml
