# WeldID's Secrets (opt-in, infrastructure/weldid). Its own values are the
# store's weldsuite/weldid; the ones it shares with the platform (Valkey, the
# MTA's system pool, the admin console's and Grafana's client secrets, the
# backup bucket, the registry login) are read from the platform's entries,
# so each is stored once and a rotation reaches both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weldid-env
  namespace: weldid
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: weldid-env
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Its own CloudNativePG cluster (infrastructure/weldid/database.yaml).
        WELDID_DATABASE_URL: 'postgres://weldid:{{ .DB_PASSWORD }}@weldid-db-rw.weldid.svc:5432/weldid?sslmode=require'
        WELDID_MASTER_KEY: '{{ .MASTER_KEY }}'
        # Its mails through the MTA's system pool.
        WELDID_SMTP_URL: 'smtp://system:{{ .MTA_SUBMISSION_PASSWORD_SYSTEM }}@weldsuite-mta.weldsuite-mail.svc:587?tls=none'
        WELDID_VALKEY_URL: 'redis://default:{{ .VALKEY_PASSWORD }}@valkey.weldsuite.svc:6379'
        # The confidential clients that move to WeldID: the same secrets the
        # admin console and Grafana send.
        WELDID_CLIENT_SECRET_WELDSUITE_ADMIN: '{{ .ADMIN_OIDC_CLIENT_SECRET }}'
        WELDID_CLIENT_SECRET_GRAFANA: '{{ .GRAFANA_OIDC_CLIENT_SECRET }}'
  data:
    - secretKey: DB_PASSWORD
      remoteRef: { key: weldsuite/weldid, property: DB_PASSWORD }
    - secretKey: MASTER_KEY
      remoteRef: { key: weldsuite/weldid, property: MASTER_KEY }
    - secretKey: MTA_SUBMISSION_PASSWORD_SYSTEM
      remoteRef: { key: weldsuite/mta, property: MTA_SUBMISSION_PASSWORD_SYSTEM }
    - secretKey: VALKEY_PASSWORD
      remoteRef: { key: weldsuite/valkey, property: PASSWORD }
    - secretKey: ADMIN_OIDC_CLIENT_SECRET
      remoteRef: { key: weldsuite/server, property: ADMIN_OIDC_CLIENT_SECRET }
    - secretKey: GRAFANA_OIDC_CLIENT_SECRET
      remoteRef: { key: weldsuite/grafana, property: OIDC_CLIENT_SECRET }
---
# The database's owner, which CloudNativePG creates at initdb.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weldid-db-owner
  namespace: weldid
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: weldid-db-owner
    template:
      type: kubernetes.io/basic-auth
      engineVersion: v2
      data:
        username: weldid
        password: '{{ .PASSWORD }}'
  data:
    - secretKey: PASSWORD
      remoteRef: { key: weldsuite/weldid, property: DB_PASSWORD }
---
# Its database's backups go to the cluster's backup bucket.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-s3
  namespace: weldid
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: postgres-backup-s3
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef: { key: weldsuite/backup-s3, property: ACCESS_KEY_ID }
    - secretKey: ACCESS_SECRET_KEY
      remoteRef: { key: weldsuite/backup-s3, property: ACCESS_SECRET_KEY }
---
# Pulling WeldID's chart and image, private until WeldID 1.0: the registry
# component's login.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry
  namespace: weldid
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: registry
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .USERNAME .TOKEN | b64enc }}"}}}'
  data:
    - secretKey: USERNAME
      remoteRef: { key: weldsuite/registry, property: USERNAME }
    - secretKey: TOKEN
      remoteRef: { key: weldsuite/registry, property: TOKEN }
---
# The server's key for WeldID's admin API (private_key_jwt): its public half
# is WELDID_BACKEND_KEY_X and _Y in the cluster's settings, which
# seed-secrets.mjs prints when it makes the key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weldid-client
  namespace: weldsuite
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: weldid-client
  data:
    - secretKey: WELDID_CLIENT_KEY
      remoteRef: { key: weldsuite/weldid, property: CLIENT_KEY }
