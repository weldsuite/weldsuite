# WeldID's Secrets (opt-in), applied by the weldid-secrets layer
# (clusters/example/weldid.yaml) once the weldid namespace exists. Its own
# layer rather than a component of ../, which runs before that namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - weldid.yaml
