# --- offsite-copy: the keys of the two S3 stores the offsite copy reads from
# (the cluster's own, OFFSITE_SOURCE_S3_ENDPOINT) and writes to (another
# provider's, OFFSITE_S3_ENDPOINT).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: offsite-copy-s3
  namespace: offsite-copy
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: weldsuite }
  target:
    name: offsite-copy-s3
  data:
    - secretKey: source-access-key-id
      remoteRef: { key: weldsuite/offsite-copy, property: SOURCE_ACCESS_KEY_ID }
    - secretKey: source-secret-access-key
      remoteRef: { key: weldsuite/offsite-copy, property: SOURCE_SECRET_ACCESS_KEY }
    - secretKey: destination-access-key-id
      remoteRef: { key: weldsuite/offsite-copy, property: DESTINATION_ACCESS_KEY_ID }
    - secretKey: destination-secret-access-key
      remoteRef: { key: weldsuite/offsite-copy, property: DESTINATION_SECRET_ACCESS_KEY }
