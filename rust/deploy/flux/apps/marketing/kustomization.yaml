apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - source.yaml
  - marketing.yaml
generatorOptions:
  disableNameSuffixHash: true
  # helm-controller upgrades a release as soon as its values ConfigMap
  # changes, not at the release's next interval (an hour for most).
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: marketing-values
    namespace: marketing
    files: [values.yaml=values/marketing.yaml]
