# WeldID on auth.${DOMAIN}, with the certificate its layer had issued
# meanwhile (infrastructure/weldid/certificate.yaml).
ingress:
  enabled: true
  # The sign-in host's rate limit in Traefik, on top of every request's and
  # WeldID's own (controllers/values/traefik.yaml).
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-auth-ratelimit@kubernetescrd

# MCP clients (Claude, Cursor, …) register themselves on the platform issuer
# once the MCP server names WeldID, which is from this switch on. Metadata
# documents are the MCP spec's preferred way, dynamic registration its
# fallback; both get consent and tokens for weldsuite-api only. Without the
# resources below, every MCP client's `resource` is refused (invalid_target).
# The server is at https://mcp.${DOMAIN}/mcp (config.mcp.serverUrl in
# ../eu/values/weldsuite.yaml), whose discovery documents name that
# resource, and /mcp/w/<workspace> for one workspace; its first address,
# https://app.${DOMAIN}/mcp, still answers for clients set up with it. An
# entry ending in / covers every path under it.
#
# The workspace step (WeldID 0.1.0-alpha.4 and later, ADR SEC-021): after
# the consent screen, a sign-in for one of these resources goes to the
# platform's page below, which asks which workspace the connection is for
# and records it through WeldID's admin API (weldid:tenants on the
# weldsuite-backend client); the grant's access tokens then carry it as
# the `tenant` claim. An older WeldID ignores the setting.
registration:
  dynamic: true
  metadataDocuments: true
  resources:
    - https://mcp.${DOMAIN}/mcp
    - https://mcp.${DOMAIN}/mcp/
    - https://app.${DOMAIN}/mcp
    - https://app.${DOMAIN}/mcp/
  tenantSelectionUrl: https://app.${DOMAIN}/auth/mcp-workspace
