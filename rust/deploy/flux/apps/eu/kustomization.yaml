apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - weldsuite.yaml
generatorOptions:
  disableNameSuffixHash: true
  # helm-controller upgrades a release as soon as its values ConfigMap
  # changes, not at the release's next interval (an hour for most).
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: weldsuite-values
    namespace: weldsuite
    files: [values.yaml=values/weldsuite.yaml]
