image:
  repository: ghcr.io/weldsuite/weldsuite
  tag: ${WELDSUITE_IMAGE_TAG}
imagePullSecrets:
  - name: registry

replicaCount: 2

config:
  environment: production
  logFormat: json
  # The EU edition, told to the platform by /config.json, which also offers
  # only the modules this release ports to Rust and hides what it lacks.
  edition: eu
  # Public settings for the platform (/config.json `env`); empty ones are
  # left out. The chart lists the names the server accepts.
  publicEnv:
    VITE_MAPBOX_ACCESS_TOKEN: "${MAPBOX_PUBLIC_TOKEN}"
  # Sign-in through the in-cluster Zitadel (ADR SEC-012). The project and the
  # platform's application are made once in Zitadel's console (Hetzner
  # runbook, step 7); their ids go in the cluster settings.
  auth:
    provider: oidc
    oidc:
      issuer: https://auth.${DOMAIN}
      audience: "${ZITADEL_PROJECT_ID}"
      # The project's roles claim names every workspace organisation the
      # person has a role in; the platform narrows it to the active one with
      # the urn:zitadel:iam:org:roles:id:<org id> scope. (The default,
      # urn:zitadel:iam:org:id, only works for people whose own organisation
      # is the workspace, not for someone in several.)
      orgClaim: urn:zitadel:iam:org:project:${ZITADEL_PROJECT_ID}:roles
      webClientId: "${ZITADEL_WEB_CLIENT_ID}"
      # The mobile apps' native application (runbook step 7, item 2b).
      # Empty: the apps can't sign in to this cluster yet.
      mobileClientId: "${ZITADEL_MOBILE_CLIENT_ID}"
      # The desktop app's native application (runbook step 7, item 2c).
      # Empty: the app signs in inside its window with the web application.
      desktopClientId: "${ZITADEL_DESKTOP_CLIENT_ID:=}"
      # WeldSuite's own sign-in screens (the ones Global shows) rather than
      # Zitadel's, with the server as Zitadel's login client (ADR SEC-016).
      # They show once Zitadel's sign-in for the platform's application
      # points at https://app.${DOMAIN}/auth (Hetzner runbook, step 7);
      # until then Zitadel's own pages still do.
      signIn: platform
  # Flag values from the master database (feature_flag_overrides).
  featureFlags: master-db
  nats:
    # Creates the entity-event stream on start (three replicas on the
    # three-node JetStream cluster).
    ensureStreams: true
  files:
    endpoint: ${FILES_S3_ENDPOINT}
    region: ${FILES_S3_REGION}
    privateBucket: ${FILES_BUCKET_PRIVATE}
    # Public uploads (avatars, product images, social media, chat
    # attachments): a bucket next to the private one, same keys, private at
    # Hetzner; the server serves it at https://app.${DOMAIN}/api/storage/public.
    # Empty on a cluster whose settings don't name it: those uploads then
    # answer "Storage is not configured".
    publicBucket: ${FILES_BUCKET_PUBLIC:=}
    forcePathStyle: false
  # WeldPanel's store (ADR EVT-019): a Hetzner bucket made next to the
  # others with the same keys. Empty until it exists: WeldPanel analytics
  # stays off and /config.json keeps listing panel-analytics as unavailable.
  # Set, the platform offers it and consume runs panel-writer and
  # panel-state (consume.subscribers below is empty: every subscriber runs).
  # The chart's panel-usage, panel-schedule and panel-maintenance cron jobs
  # are on by default.
  panel:
    bucket: "${FILES_BUCKET_PANEL:=}"
    # Collection on a customer's own host name (ADR PANEL-014): customers
    # point a CNAME at collect.${DOMAIN} (collect.weldsuite.eu in
    # production), and the server creates a cert-manager Certificate
    # (letsencrypt, HTTP-01 through Traefik) and an Ingress for each in this
    # namespace. Off until DNS for collect.${DOMAIN} points at the ingress
    # load balancer (the deploy repository's eu/scripts/ingress-dns.ps1
    # -Names collect); then the cluster's settings set PANEL_CUSTOM_DOMAINS
    # to "true".
    customDomains:
      enabled: ${PANEL_CUSTOM_DOMAINS:=false}
      collectorHost: collect.${DOMAIN}
  # Durable jobs (sign's finalize, …) on the in-cluster Restate; each pod
  # registers its jobs endpoint with the admin API at start.
  jobs:
    restate:
      ingressUrl: http://restate:8080
      adminUrl: http://restate:9070
  # Signing links point at the portal below.
  sign:
    portalUrl: https://sign.${DOMAIN}
  # Form and invitation links point at the forms portal below. The bot check
  # is ALTCHA's self-hosted proof of work (ADR FORMS-005, the chart's default).
  forms:
    portalUrl: https://forms.${DOMAIN}
  # Signup and team changes go to the in-cluster Zitadel's management API
  # as the weldsuite service user (ZITADEL_SERVICE_TOKEN in the Secret);
  # Zitadel picks its instance by the external domain.
  identity:
    zitadel:
      apiUrl: http://zitadel.zitadel.svc:8080
      host: auth.${DOMAIN}
      projectId: "${ZITADEL_PROJECT_ID}"
  # New workspace databases on the tenant shards (TENANT_SHARDS in the
  # Secret), their URLs sealed bound to the workspace.
  tenants:
    region: eu
  aadWrites: true
  # WeldMeet and WeldChat calls on the in-cluster LiveKit
  # (infrastructure/video): browsers connect to livekit.${DOMAIN}, the
  # server reaches its API inside the cluster. The key pair is in the Secret
  # (LIVEKIT_API_KEY, LIVEKIT_API_SECRET).
  video:
    provider: livekit
    livekit:
      url: wss://livekit.${DOMAIN}
      apiUrl: http://livekit.livekit.svc:7880
  # The platform's origin: links in mail (invites, WeldSign, the W-9 requests
  # of WeldBooks, the WeldReach access decisions of `weldsuite admin access`),
  # OAuth redirects and webhook registrations. The chart sets PUBLIC_URL and
  # every URL setting that names this host from it.
  publicUrl: https://app.${DOMAIN}
  # The MCP server on a host of its own, as Global's mcp.weldsuite.org: AI
  # clients connect to https://mcp.${DOMAIN}/mcp, and its OAuth discovery
  # documents name that origin. The ingress below sends only the MCP paths
  # there.
  mcp:
    serverUrl: https://mcp.${DOMAIN}
  # AI on Mistral, in the EU (ADR AI-012, weldsuite-documentation/plans/eu-ai-mistral.md):
  # every AI feature runs there unless a workspace admin opts in to a
  # provider outside the EU. Keys in weldsuite-env: MISTRAL_API_KEY and
  # AI_KEYS_ENCRYPTION_KEY (seals the keys workspaces bring); the server
  # doesn't start without them. A workspace admin can opt in to Claude with
  # WeldSuite's Anthropic key (ANTHROPIC_API_KEY, also required: the server
  # doesn't start without it either) or the workspace's own key, and to
  # ChatGPT with the workspace's own key; set openai.weldsuiteKey once
  # WeldSuite's OpenAI account is open and OPENAI_API_KEY is in the Secret.
  # Calls on WeldSuite's keys are charged in credits from the shared rate
  # table. The credit gate (402 at an empty wallet) is on: the Mollie top-up
  # lets a workspace buy credits.
  #
  # Every key goes in both clusters' weldsuite-env before this reaches
  # them: with AI on, serve and consume refuse to start
  # without them, as every build from 0.1.0-main.109 did until AI was
  # switched off on 2026-11-16.
  ai:
    defaultProvider: mistral
    mistral:
      baseUrl: https://api.mistral.ai/v1
    optIn:
      anthropic: { weldsuiteKey: true, ownKey: true }
      openai: { weldsuiteKey: false, ownKey: true }
    creditGate: true
    billing: credits
  # Buying credits through Mollie (ADR OPS-012), on once MOLLIE_API_KEY is in
  # weldsuite-env: Mollie reports payments to
  # https://app.${DOMAIN}/api/webhooks/mollie and checkouts return to the
  # billing page, both from publicUrl. The packages on sale are the master
  # credit_packages rows priced in EUR.
  credits:
    mollie:
      webhookUrl: ""
      redirectUrl: ""

# DATABASE_URL_MASTER (through the master-pooler Pooler), DATABASE_ENCRYPTION_KEY,
# WELDPASS_ROOT_KEY, VALKEY_URL, NATS_URL + NATS_TOKEN, S3 keys, SIGN_SESSION_SECRET,
# SIGN_PORTAL_SECRET, FORMS_SESSION_SECRET, FORMS_PORTAL_SECRET, ALTCHA_HMAC_KEY,
# WIDGET_TOKEN_SECRET, ZITADEL_SERVICE_TOKEN, TENANT_SHARDS,
# COLLAB_ROOMS_SECRET, LIVEKIT_API_KEY + LIVEKIT_API_SECRET, MAIL_INBOUND_SECRET,
# MISTRAL_API_KEY + AI_KEYS_ENCRYPTION_KEY + ANTHROPIC_API_KEY (config.ai),
# SANDBOX_TOKEN_SECRET (once the sandbox is on again), STOREFRONT_RENDERER_SECRET
# (read once storefront is on), and optionally MOLLIE_API_KEY
# and MOLLIE_CONNECT_CLIENT_ID + MOLLIE_CONNECT_CLIENT_SECRET (WeldCommerce's Mollie Connect app):
# secrets/weldsuite.yaml, from the store's values (secrets/store.example.yaml).
# The MTA's keys are in weldsuite-mta (mta below).
secret:
  existingSecret: weldsuite-env
  # The EU edition's keys live in its secret store, which a rebuilt cluster
  # (the drill) reads again; a key the chart generated in the cluster wouldn't
  # come back.
  generate: false

# The platform (the SPA in the image) and its API on one origin, app.${DOMAIN};
# api.${DOMAIN} for clients that call the API by that name.
spa:
  enabled: true

# WeldDesk's helpdesk widget at widget.${DOMAIN}: the iframe app the
# edition's own sites embed (the SDK's api.baseUrl: https://widget.${DOMAIN}),
# served by this server from the image, with the widget API on the same
# origin (/public/helpdesk-widget). The record is in `tofu output dns_records`.
helpdeskWidget:
  enabled: true
  hosts:
    - widget.${DOMAIN}
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tlsSecretName: weldsuite-helpdesk-widget-tls

# `weldsuite migrate --master --tenants` as a hook Job before every install
# and upgrade Flux makes: the master database, then every workspace database
# on the tenant shards, to the migrations built into the release's image. The
# new pods roll out only once it succeeded. A failure fails the upgrade and
# Flux rolls the release back; databases the Job already migrated stay
# migrated (migrations are forward-only, so a release must keep working on
# the schema its successor migrates to). Its deadline stays under the
# HelmRelease's spec.timeout (../weldsuite.yaml).
migrations:
  enabled: true
  args: ["--master", "--tenants"]
  # Workspace databases migrated at once, across the shards' poolers.
  concurrency: 4
  activeDeadlineSeconds: 1500

# The identity sync every minute (what Clerk's webhooks do on Global), the
# scheduled workspace deletions daily, unfinished teardowns hourly.
cron:
  jobs:
    identity-sync:
      enabled: true
    workspace-deletion:
      enabled: true
    workspace-teardown:
      enabled: true

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: app.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
    - host: api.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
    # The MCP server (config.mcp): /mcp, its OAuth discovery documents and
    # OpenAI's domain verification, nothing else (any other path on this
    # host is Traefik's 404).
    - host: mcp.${DOMAIN}
      paths:
        - path: /mcp
          pathType: Prefix
        - path: /.well-known/oauth-protected-resource
          pathType: Prefix
        - path: /.well-known/oauth-authorization-server
          pathType: Prefix
        - path: /.well-known/openai-apps-challenge
          pathType: Exact
  tls:
    - secretName: weldsuite-api-tls
      hosts:
        - app.${DOMAIN}
        - api.${DOMAIN}
    # Its own certificate, so app. and api. never wait on mcp.'s DNS.
    - secretName: weldsuite-mcp-tls
      hosts:
        - mcp.${DOMAIN}

# The WeldSign signer portal at sign.${DOMAIN} (ADR FE-017). Its image is the
# `sign-portal` target of rust/Dockerfile, released with the server's.
signPortal:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-sign-portal
    tag: ${WELDSUITE_IMAGE_TAG}
  # Traefik is the only proxy that appends to X-Forwarded-For: the Hetzner
  # load balancer passes the client's address with the PROXY protocol.
  trustedProxies: 1
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: sign.${DOMAIN}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: weldsuite-sign-tls
        hosts:
          - sign.${DOMAIN}

# The WeldForms respondent page at forms.${DOMAIN} (ADR FORMS-002): form links,
# invitation links and /embed.js. Its image is the `forms-portal` target of
# rust/Dockerfile, released with the server's. It calls the server's
# /public/forms/* with FORMS_PORTAL_SECRET from weldsuite-env.
formsPortal:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-forms-portal
    tag: ${WELDSUITE_IMAGE_TAG}
  # As the sign portal: only Traefik appends to X-Forwarded-For.
  trustedProxies: 1
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: forms.${DOMAIN}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: weldsuite-forms-tls
        hosts:
          - forms.${DOMAIN}

# WeldCommerce's online stores (weldsuite-documentation/plans/weldcommerce-storefronts.md):
# every shop host goes to the server's storefront edge (port 8791, the
# Service's port storefront), which proxies builder shops to the renderer,
# the `storefront` target of rust/Dockerfile, released with the server's
# image. STOREFRONT_RENDERER_SECRET is in weldsuite-env.
#
# OFF until the owner has picked the shop domain: a registrable domain of its
# own, never under ${DOMAIN} (a shop could set cookies on the platform), with
# a Public Suffix List entry requested. Then the cluster's settings set
#   STOREFRONT_ENABLED: "true" and STOREFRONT_BASE_DOMAIN: <the shop domain>
# once *.<shop domain> points at the ingress load balancer and its wildcard
# certificate is in the Secret weldsuite-storefront-wildcard-tls (a
# cert-manager Certificate from a DNS-01 issuer: letsencrypt's HTTP-01 can't
# issue wildcards); and, for merchants' own domains,
#   STOREFRONT_CUSTOM_DOMAINS: "true" once shops.${DOMAIN} points at the load
#   balancer, with STOREFRONT_APEX_ADDRESSES its addresses for apex domains,
#   e.g. "[203.0.113.10, 2001:db8::10]" (tofu output); the server then makes a
#   letsencrypt Certificate (HTTP-01 through Traefik) and an Ingress per host
#   name in this namespace, as for WeldPanel's collector domains.
storefront:
  enabled: ${STOREFRONT_ENABLED:=false}
  baseDomain: "${STOREFRONT_BASE_DOMAIN:=}"
  ingress:
    className: traefik
  wildcardTls:
    secretName: weldsuite-storefront-wildcard-tls
  renderer:
    image:
      repository: ghcr.io/weldsuite/weldsuite-storefront
      tag: ${WELDSUITE_IMAGE_TAG}
  customDomains:
    enabled: ${STOREFRONT_CUSTOM_DOMAINS:=false}
    cnameTarget: shops.${DOMAIN}
    apexAddresses: ${STOREFRONT_APEX_ADDRESSES:=[]}

# The staff admin console at admin.${DOMAIN} (ADR FE-018): access requests,
# workspaces, the app catalog, warmup and outbound mail. Its image is the
# `admin` target of rust/Dockerfile, released with the server's. Staff sign in
# with Zitadel's `WeldSuite Staff` project, with an account of the
# `WeldSuite Staff` organization (ZITADEL_STAFF_ORG_ID, cluster settings), and
# get in only with an active admin_users row (`weldsuite admin staff add`,
# Hetzner runbook "Staff work"). Only ADMIN_CIDRS (cluster settings) reach it;
# the console's keys (ADMIN_OIDC_CLIENT_ID, ADMIN_OIDC_CLIENT_SECRET,
# ADMIN_SESSION_SECRET) and OUTBOUND_ADMIN_SECRET are in weldsuite-env.
# Without them nobody gets in.
admin:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-admin
    tag: ${WELDSUITE_IMAGE_TAG}
  publicUrl: https://admin.${DOMAIN}
  staffOrgId: "${ZITADEL_STAFF_ORG_ID}"
  platformUrl: https://app.${DOMAIN}
  allowedSourceRanges: ${ADMIN_CIDRS}
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: admin.${DOMAIN}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: weldsuite-admin-tls
        hosts:
          - admin.${DOMAIN}

# WeldDocs' and WeldSheets' live editing: the workers' rooms on Node beside
# the server (rust/docs/collab-rooms.md), released with the server's image.
# Without it /config.json lists `collab-rooms` as unavailable and the
# platform hides both apps. COLLAB_ROOMS_SECRET is in the Secret.
collabRooms:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-collab-rooms
    tag: ${WELDSUITE_IMAGE_TAG}
  replicaCount: 2

# WeldAgent's sandbox, computer use and browsing on the EU edition's own
# cluster (ADR AI-012 phase 5): gVisor pods in weldsuite-sandbox
# (infrastructure/controllers/namespaces.yaml), released with the server's
# image. Needs gVisor on the nodes (the gvisor extension in the Talos image,
# hetzner/scripts/schematic.yaml) and a CNI that enforces NetworkPolicy:
# until a new sandbox can't reach the metadata service or the Kubernetes API,
# the server hands out none and says so in its log and `weldsuite doctor`
# (rust/deploy/hetzner/README.md, "Agent sandbox"). SANDBOX_TOKEN_SECRET is in
# the Secret.
#
# OFF for now (2026-11-16), with config.ai above: SANDBOX_TOKEN_SECRET is not in
# either cluster's weldsuite-env, so serve and consume refused to start, and
# the nodes run without gVisor (only runc), so no sandbox pod could start
# anyway. Turn it on (and searxng below) after both are fixed, together with AI.
sandbox:
  enabled: false
  image:
    repository: ghcr.io/weldsuite/weldsuite-sandbox
    tag: ${WELDSUITE_IMAGE_TAG}
  # The nodes' public addresses: a pod could reach its own node's host ports
  # on them. Add them when they are known (tofu output).
  deniedCidrs: []

# Web search for WeldAgent (web_search): SearXNG in the cluster, asked only by
# the server; only the query leaves, to Qwant, Startpage, Mojeek and Wikipedia.
# Off while WeldAgent's sandbox and AI are (above): nothing else asks it.
searxng:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

# The entity-event subscribers on the in-cluster JetStream: audit log,
# outgoing webhooks, realtime fan-out (VALKEY_URL is in the Secret) and the
# semantic search index. The index's vectors come from config.ai: Mistral's
# mistral-embed (1024 dimensions), metered as search-index per workspace and
# batch, so consume.embeddings (for installs without AI) stays unset. While
# config.ai is off, the search-index subscriber does not run (as before AI).
consume:
  enabled: true
  replicaCount: 2
  # The hub and dead-letter streams on all three JetStream nodes, capped
  # under the 20Gi JetStream volume (infrastructure/services/values/nats.yaml):
  # 12 GiB of events, 2 GiB of dead letters.
  streamReplicas: 3
  streamMaxBytes: 12884901888
  deadLetterMaxBytes: 2147483648
  # With the panel bucket set, panel-writer buffers up to 64 MB per WeldPanel
  # table before a commit (PANEL_WRITER_FLUSH_BYTES, five tables) and encodes
  # them as Parquet: about 1 GiB above what the other subscribers need.
  resources:
    requests:
      cpu: 100m
      memory: 320Mi
    limits:
      memory: 1536Mi

# WeldMail's MX (ADR MAIL-010): Haraka at mx.${DOMAIN}, released with the
# server's image. The ingress load balancer passes port 25 to this NodePort
# with the PROXY protocol (hetzner mx_node_port); mx.${DOMAIN} points at the
# load balancer, so cert-manager's HTTP-01 issues its certificate through
# Traefik. Haraka spools to the mail bucket (FILES_BUCKET_MAIL, made next to
# the private one with the same keys) and consume stores the messages.
# MAIL_INBOUND_SECRET is in weldsuite-env. Inbound attachments are kept in
# config.files' public bucket once the cluster names one (FILES_BUCKET_PUBLIC).
mailInbound:
  enabled: true
  bucket: ${FILES_BUCKET_MAIL}
  haraka:
    image:
      repository: ghcr.io/weldsuite/weldsuite-haraka
      tag: ${WELDSUITE_IMAGE_TAG}
    hostname: mx.${DOMAIN}
    # The load balancer's private address; Traefik trusts the same range.
    proxyProtocolHosts: ["10.10.0.0/16"]
    service:
      type: NodePort
      nodePort: 30025
      # Only nodes with a Haraka pod pass the load balancer's health check.
      externalTrafficPolicy: Local

# The MTA (weldsuite-documentation/plans/eu-mail-service.md): system and customer mail from the
# mail nodes' own addresses (hetzner mail_pools, one node each to start),
# its queue in weldsuite_mta on master (clusters/example/configs). Bounces
# and complaint reports come back to bounces.${DOMAIN}, whose MX are the mail
# nodes. The server's SMTP_URL and MAIL_SMTP_URL point at it (wireServer).
# Its keys are the weldsuite-mta Secret (secrets/mta); the bounce MX's
# certificate is self-signed for the mail nodes' names (the chart's default).
# Before it sends: the port 25 unblock, DNS and the warm-up in the Hetzner
# runbook, "Mail".
mta:
  enabled: true
  # Its own namespace: the host network is forbidden in weldsuite (restricted).
  namespace: weldsuite-mail
  existingSecret: weldsuite-mta
  clientSecret: weldsuite-mta-client
  bounceDomain: bounces.${DOMAIN}
  spfInclude: _spf.${DOMAIN}
  pools:
    - name: system
    - name: customer
  inbound:
    tls:
      dnsNames:
        - mail1-system.${DOMAIN}
        - mail1-customer.${DOMAIN}
