image:
  repository: ghcr.io/weldsuite/weldsuite
  tag: ${WELDSUITE_IMAGE_TAG}
imagePullSecrets:
  - name: registry

replicaCount: 2

config:
  environment: production
  logFormat: json
  # Sign-in through the in-cluster Zitadel (ADR SEC-012). The project and the
  # platform's application are made once in Zitadel's console (Hetzner
  # runbook, step 7); their ids go in the cluster settings.
  auth:
    provider: oidc
    oidc:
      issuer: https://auth.${DOMAIN}
      audience: "${ZITADEL_PROJECT_ID}"
      # The project's roles claim names every workspace organisation the
      # person has a role in; the platform narrows it to the active one with
      # the urn:zitadel:iam:org:roles:id:<org id> scope. (The default,
      # urn:zitadel:iam:org:id, only works for people whose own organisation
      # is the workspace, not for someone in several.)
      orgClaim: urn:zitadel:iam:org:project:${ZITADEL_PROJECT_ID}:roles
      webClientId: "${ZITADEL_WEB_CLIENT_ID}"
  # Flag values from the master database (feature_flag_overrides).
  featureFlags: master-db
  nats:
    # Creates the entity-event stream on start (three replicas on the
    # three-node JetStream cluster).
    ensureStreams: true
  files:
    endpoint: ${FILES_S3_ENDPOINT}
    region: ${FILES_S3_REGION}
    privateBucket: ${FILES_BUCKET_PRIVATE}
    forcePathStyle: false
  # Durable jobs (sign's finalize, …) on the in-cluster Restate; each pod
  # registers its jobs endpoint with the admin API at start.
  jobs:
    restate:
      ingressUrl: http://restate:8080
      adminUrl: http://restate:9070

# DATABASE_URL_MASTER (through the master-pooler Pooler), DATABASE_ENCRYPTION_KEY,
# VALKEY_URL, NATS_URL + NATS_TOKEN, S3 keys,
# SIGN_SESSION_SECRET, SIGN_PORTAL_SECRET: secrets/examples/weldsuite-env.yaml.
secret:
  existingSecret: weldsuite-env

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: api.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: weldsuite-api-tls
      hosts:
        - api.${DOMAIN}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi
