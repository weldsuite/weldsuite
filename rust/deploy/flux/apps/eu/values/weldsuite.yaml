image:
  repository: ghcr.io/weldsuite/weldsuite
  tag: ${WELDSUITE_IMAGE_TAG}
imagePullSecrets:
  - name: registry

replicaCount: 2

config:
  environment: production
  logFormat: json
  # The EU edition, told to the platform by /config.json, which also offers
  # only the modules this release ports to Rust and hides what it lacks.
  edition: eu
  # Public settings for the platform (/config.json `env`); empty ones are
  # left out. The chart lists the names the server accepts.
  publicEnv:
    VITE_MAPBOX_ACCESS_TOKEN: "${MAPBOX_PUBLIC_TOKEN}"
  # Sign-in through the in-cluster Zitadel (ADR SEC-012). The project and the
  # platform's application are made once in Zitadel's console (Hetzner
  # runbook, step 7); their ids go in the cluster settings.
  auth:
    provider: oidc
    oidc:
      issuer: https://auth.${DOMAIN}
      audience: "${ZITADEL_PROJECT_ID}"
      # The project's roles claim names every workspace organisation the
      # person has a role in; the platform narrows it to the active one with
      # the urn:zitadel:iam:org:roles:id:<org id> scope. (The default,
      # urn:zitadel:iam:org:id, only works for people whose own organisation
      # is the workspace, not for someone in several.)
      orgClaim: urn:zitadel:iam:org:project:${ZITADEL_PROJECT_ID}:roles
      webClientId: "${ZITADEL_WEB_CLIENT_ID}"
      # The mobile apps' native application (runbook step 7, item 2b).
      # Empty: the apps can't sign in to this cluster yet.
      mobileClientId: "${ZITADEL_MOBILE_CLIENT_ID}"
      # WeldSuite's own sign-in screens (the ones Global shows) rather than
      # Zitadel's, with the server as Zitadel's login client (ADR SEC-016).
      # They show once Zitadel's sign-in for the platform's application
      # points at https://app.${DOMAIN}/auth (Hetzner runbook, step 7);
      # until then Zitadel's own pages still do.
      signIn: platform
  # Flag values from the master database (feature_flag_overrides).
  featureFlags: master-db
  nats:
    # Creates the entity-event stream on start (three replicas on the
    # three-node JetStream cluster).
    ensureStreams: true
  files:
    endpoint: ${FILES_S3_ENDPOINT}
    region: ${FILES_S3_REGION}
    privateBucket: ${FILES_BUCKET_PRIVATE}
    forcePathStyle: false
  # Durable jobs (sign's finalize, …) on the in-cluster Restate; each pod
  # registers its jobs endpoint with the admin API at start.
  jobs:
    restate:
      ingressUrl: http://restate:8080
      adminUrl: http://restate:9070
  # Signing links point at the portal below.
  sign:
    portalUrl: https://sign.${DOMAIN}
  # Signup and team changes go to the in-cluster Zitadel's management API
  # as the weldsuite service user (ZITADEL_SERVICE_TOKEN in the Secret);
  # Zitadel picks its instance by the external domain.
  identity:
    zitadel:
      apiUrl: http://zitadel.zitadel.svc:8080
      host: auth.${DOMAIN}
      projectId: "${ZITADEL_PROJECT_ID}"
  # New workspace databases on the tenant shards (TENANT_SHARDS in the
  # Secret), their URLs sealed bound to the workspace.
  tenants:
    region: eu
  aadWrites: true
  # WeldMeet and WeldChat calls on the in-cluster LiveKit
  # (infrastructure/video): browsers connect to livekit.${DOMAIN}, the
  # server reaches its API inside the cluster. The key pair is in the Secret
  # (LIVEKIT_API_KEY, LIVEKIT_API_SECRET).
  video:
    provider: livekit
    livekit:
      url: wss://livekit.${DOMAIN}
      apiUrl: http://livekit.livekit.svc:7880
  # The platform's origin: links in mail (invites, WeldSign, the W-9 requests
  # of WeldBooks, the WeldReach access decisions of `weldsuite admin access`),
  # OAuth redirects and webhook registrations. The chart sets PUBLIC_URL and
  # every URL setting that names this host from it.
  publicUrl: https://app.${DOMAIN}
  # AI on Mistral, in the EU (ADR AI-012, docs/plans/eu-ai-mistral.md):
  # every AI feature runs there unless a workspace admin opts in to a
  # provider outside the EU. Keys in weldsuite-env: MISTRAL_API_KEY and
  # AI_KEYS_ENCRYPTION_KEY (seals the keys workspaces bring); the server
  # doesn't start without them. Claude and ChatGPT are offered with the
  # workspace's own key; set weldsuiteKey once WeldSuite's EU-edition
  # accounts are open and ANTHROPIC_API_KEY / OPENAI_API_KEY are in the
  # Secret. The credit gate (402 at an empty wallet) is on: the Mollie
  # top-up lets a workspace buy credits.
  ai:
    defaultProvider: mistral
    mistral:
      baseUrl: https://api.mistral.ai/v1
    optIn:
      anthropic: { weldsuiteKey: false, ownKey: true }
      openai: { weldsuiteKey: false, ownKey: true }
    creditGate: true
    billing: credits
  # Buying credits through Mollie (ADR OPS-012), on once MOLLIE_API_KEY is in
  # weldsuite-env: Mollie reports payments to
  # https://app.${DOMAIN}/api/webhooks/mollie and checkouts return to the
  # billing page, both from publicUrl. The packages on sale are the master
  # credit_packages rows priced in EUR.
  credits:
    mollie:
      webhookUrl: ""
      redirectUrl: ""

# DATABASE_URL_MASTER (through the master-pooler Pooler), DATABASE_ENCRYPTION_KEY,
# VALKEY_URL, NATS_URL + NATS_TOKEN, S3 keys, SIGN_SESSION_SECRET,
# SIGN_PORTAL_SECRET, WIDGET_TOKEN_SECRET, ZITADEL_SERVICE_TOKEN, TENANT_SHARDS,
# COLLAB_ROOMS_SECRET, LIVEKIT_API_KEY + LIVEKIT_API_SECRET, MAIL_INBOUND_SECRET,
# MISTRAL_API_KEY + AI_KEYS_ENCRYPTION_KEY, SANDBOX_TOKEN_SECRET, and optionally MOLLIE_API_KEY:
# secrets/examples/secrets.example.yaml. The MTA's keys are in weldsuite-mta
# (mta below).
secret:
  existingSecret: weldsuite-env
  # The EU edition's keys live in its SOPS Secret, which a rebuilt cluster
  # (the drill) gets back; a key the chart generated in the cluster wouldn't.
  generate: false

# The platform (the SPA in the image) and its API on one origin, app.${DOMAIN};
# api.${DOMAIN} for clients that call the API by that name.
spa:
  enabled: true

# `weldsuite migrate --master --tenants` as a hook Job before every install
# and upgrade Flux makes: the master database, then every workspace database
# on the tenant shards, to the migrations built into the release's image. The
# new pods roll out only once it succeeded. A failure fails the upgrade and
# Flux rolls the release back; databases the Job already migrated stay
# migrated (migrations are forward-only, so a release must keep working on
# the schema its successor migrates to). Its deadline stays under the
# HelmRelease's spec.timeout (../weldsuite.yaml).
migrations:
  enabled: true
  args: ["--master", "--tenants"]
  # Workspace databases migrated at once, across the shards' poolers.
  concurrency: 4
  activeDeadlineSeconds: 1500

# The identity sync every minute (what Clerk's webhooks do on Global), the
# scheduled workspace deletions daily, unfinished teardowns hourly.
cron:
  jobs:
    identity-sync:
      enabled: true
    workspace-deletion:
      enabled: true
    workspace-teardown:
      enabled: true

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: app.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
    - host: api.${DOMAIN}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: weldsuite-api-tls
      hosts:
        - app.${DOMAIN}
        - api.${DOMAIN}

# The WeldSign signer portal at sign.${DOMAIN} (ADR FE-017). Its image is the
# `sign-portal` target of rust/Dockerfile, released with the server's.
signPortal:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-sign-portal
    tag: ${WELDSUITE_IMAGE_TAG}
  # Traefik is the only proxy that appends to X-Forwarded-For: the Hetzner
  # load balancer passes the client's address with the PROXY protocol.
  trustedProxies: 1
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: sign.${DOMAIN}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: weldsuite-sign-tls
        hosts:
          - sign.${DOMAIN}

# The staff admin console at admin.${DOMAIN} (ADR FE-018): access requests,
# workspaces, the app catalog, warmup and outbound mail. Its image is the
# `admin` target of rust/Dockerfile, released with the server's. Staff sign in
# with Zitadel's `WeldSuite Staff` project and get in only with an active
# admin_users row (`weldsuite admin staff add`, Hetzner runbook "Staff work").
# Only ADMIN_CIDRS (cluster settings) reach it; the console's keys
# (ADMIN_OIDC_CLIENT_ID, ADMIN_OIDC_CLIENT_SECRET, ADMIN_SESSION_SECRET) and
# OUTBOUND_ADMIN_SECRET are in weldsuite-env. Without them nobody gets in.
admin:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-admin
    tag: ${WELDSUITE_IMAGE_TAG}
  publicUrl: https://admin.${DOMAIN}
  platformUrl: https://app.${DOMAIN}
  allowedSourceRanges: ${ADMIN_CIDRS}
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - host: admin.${DOMAIN}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: weldsuite-admin-tls
        hosts:
          - admin.${DOMAIN}

# WeldDocs' and WeldSheets' live editing: the workers' rooms on Node beside
# the server (rust/docs/collab-rooms.md), released with the server's image.
# Without it /config.json lists `collab-rooms` as unavailable and the
# platform hides both apps. COLLAB_ROOMS_SECRET is in the Secret.
collabRooms:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-collab-rooms
    tag: ${WELDSUITE_IMAGE_TAG}
  replicaCount: 2

# WeldAgent's sandbox, computer use and browsing on the EU edition's own
# cluster (ADR AI-012 phase 5): gVisor pods in weldsuite-sandbox
# (infrastructure/controllers/namespaces.yaml), released with the server's
# image. Needs gVisor on the nodes (the gvisor extension in the Talos image,
# hetzner/scripts/schematic.yaml) and a CNI that enforces NetworkPolicy:
# until a new sandbox can't reach the metadata service or the Kubernetes API,
# the server hands out none and says so in its log and `weldsuite doctor`
# (rust/deploy/hetzner/README.md, "Agent sandbox"). SANDBOX_TOKEN_SECRET is in
# the Secret.
sandbox:
  enabled: true
  image:
    repository: ghcr.io/weldsuite/weldsuite-sandbox
    tag: ${WELDSUITE_IMAGE_TAG}
  # The nodes' public addresses: a pod could reach its own node's host ports
  # on them. Add them when they are known (tofu output).
  deniedCidrs: []

# Web search for WeldAgent (web_search): SearXNG in the cluster, asked only by
# the server; only the query leaves, to Qwant, Startpage, Mojeek and Wikipedia.
searxng:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi

# The entity-event subscribers on the in-cluster JetStream: audit log,
# outgoing webhooks, realtime fan-out (VALKEY_URL is in the Secret) and the
# semantic search index. The index's vectors come from config.ai: Mistral's
# mistral-embed (1024 dimensions), metered as search-index per workspace and
# batch, so consume.embeddings (for installs without AI) stays unset.
consume:
  enabled: true
  replicaCount: 2
  # The hub and dead-letter streams on all three JetStream nodes, capped
  # under the 20Gi JetStream volume (infrastructure/services/values/nats.yaml):
  # 12 GiB of events, 2 GiB of dead letters.
  streamReplicas: 3
  streamMaxBytes: 12884901888
  deadLetterMaxBytes: 2147483648
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

# WeldMail's MX (ADR MAIL-010): Haraka at mx.${DOMAIN}, released with the
# server's image. The ingress load balancer passes port 25 to this NodePort
# with the PROXY protocol (hetzner mx_node_port); mx.${DOMAIN} points at the
# load balancer, so cert-manager's HTTP-01 issues its certificate through
# Traefik. Haraka spools to the mail bucket (FILES_BUCKET_MAIL, made next to
# the private one with the same keys) and consume stores the messages.
# MAIL_INBOUND_SECRET is in weldsuite-env. No public bucket here, so
# inbound attachments aren't kept yet (mailInbound.publicUrl).
mailInbound:
  enabled: true
  bucket: ${FILES_BUCKET_MAIL}
  haraka:
    image:
      repository: ghcr.io/weldsuite/weldsuite-haraka
      tag: ${WELDSUITE_IMAGE_TAG}
    hostname: mx.${DOMAIN}
    # The load balancer's private address; Traefik trusts the same range.
    proxyProtocolHosts: ["10.10.0.0/16"]
    service:
      type: NodePort
      nodePort: 30025
      # Only nodes with a Haraka pod pass the load balancer's health check.
      externalTrafficPolicy: Local

# The MTA (docs/plans/eu-mail-service.md): system and customer mail from the
# mail nodes' own addresses (hetzner mail_pools, one node each to start),
# its queue in weldsuite_mta on master (clusters/example/configs). Bounces
# and complaint reports come back to bounces.${DOMAIN}, whose MX are the mail
# nodes. The server's SMTP_URL and MAIL_SMTP_URL point at it (wireServer).
# Its keys are the weldsuite-mta Secret (secrets example); the bounce MX's
# certificate is self-signed for the mail nodes' names (the chart's default).
# Before it sends: the port 25 unblock, DNS and the warm-up in the Hetzner
# runbook, "Mail".
mta:
  enabled: true
  # Its own namespace: the host network is forbidden in weldsuite (restricted).
  namespace: weldsuite-mail
  existingSecret: weldsuite-mta
  clientSecret: weldsuite-mta-client
  bounceDomain: bounces.${DOMAIN}
  spfInclude: _spf.${DOMAIN}
  pools:
    - name: system
    - name: customer
  inbound:
    tls:
      dnsNames:
        - mail1-system.${DOMAIN}
        - mail1-customer.${DOMAIN}
