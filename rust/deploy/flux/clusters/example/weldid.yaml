# WeldID (infrastructure/weldid, ADR SEC-019), OPT-IN: applied only when
# kustomization.yaml here lists this file. Three Kustomizations, in order:
# the namespace, WeldID's Secrets in it (ExternalSecrets from the cluster's
# secret store, secrets/weldid), then WeldID with its database. WeldID then
# runs next to Zitadel without taking auth.${DOMAIN}; weldid-switch.yaml
# moves sign-in over (infrastructure/weldid/README.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weldid-namespace
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/weldid/namespace
  # Never deleted by Flux: the namespace holds WeldID's database.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# The store's weldsuite/weldid and the platform's entries it shares
# (secrets/store.example.yaml); scripts/seed-secrets.mjs fills them. Ready
# once each Secret is written, like the secrets layer.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weldid-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: weldid-namespace
    - name: secrets
  interval: 1h
  retryInterval: 2m
  path: ./rust/deploy/flux/secrets/weldid
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      current: status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
---
# After the services (Valkey) and monitoring (the Prometheus Operator's
# CRDs for its monitors and rules). The database is in this layer, so the
# first install waits a few minutes for it (values/weldid.yaml, migrations).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: weldid
  namespace: flux-system
spec:
  dependsOn:
    - name: weldid-secrets
    - name: services
    - name: monitoring
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/weldid
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
