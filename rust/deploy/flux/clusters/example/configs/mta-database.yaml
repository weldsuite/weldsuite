# The MTA's queue (docs/plans/eu-mail-service.md): its own database,
# weldsuite_mta, on the master cluster, owned by its own role `mta` (the
# managed role the configs patch in ../layers.yaml adds, password from
# postgres/master-db-mta).
# `weldsuite mta` creates its tables itself at start, under an advisory lock,
# so it connects to master-rw directly, not through the transaction-mode
# PgBouncer (MTA_DATABASE_URL in weldsuite-mail/weldsuite-mta, secrets example).
# The database is in master's WAL archive and nightly backups like the rest;
# `retain` keeps it when this resource goes.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: master-weldsuite-mta
  namespace: postgres
spec:
  cluster:
    name: master
  name: weldsuite_mta
  owner: mta
  ensure: present
  databaseReclaimPolicy: retain
