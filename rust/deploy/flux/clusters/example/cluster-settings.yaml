# An example cluster's settings, substituted into the layers (${NAME}). Copy
# clusters/example to clusters/<your cluster> in your copy of this repository
# and replace every example value (rust/deploy/hetzner/README.md, step 4).
# Not secret: secrets go in secrets/<your cluster>, encrypted with SOPS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # app., api., auth., sign., admin., livekit., turn. and mx. under this name
  # point at the ingress load balancer.
  DOMAIN: weldsuite.example.com
  ACME_EMAIL: ops@example.com
  # Postgres backups: object storage at a second provider.
  BACKUP_S3_ENDPOINT: https://s3.backups.example.com
  BACKUP_S3_BUCKET: example-pg-backups
  # Files (the workers' R2 buckets): Hetzner Object Storage.
  FILES_S3_ENDPOINT: https://fsn1.your-objectstorage.com
  FILES_S3_REGION: fsn1
  FILES_BUCKET_PRIVATE: example-files
  # WeldMail's inbound spool and raw messages (Haraka, mailInbound).
  FILES_BUCKET_MAIL: example-mail
  # WeldPanel's Iceberg tables (config.panel, ADR EVT-019).
  FILES_BUCKET_PANEL: example-panel
  # Zitadel (auth.${DOMAIN}): the WeldSuite project's id (the tokens'
  # audience) and the platform's web application's client id (PKCE). Made in
  # Zitadel's console after its first start (README, step 7).
  ZITADEL_PROJECT_ID: "000000000000000000"
  ZITADEL_WEB_CLIENT_ID: "000000000000000000"
  # The mobile apps' native application (PKCE, <app scheme>://sso-callback
  # redirects; runbook step 7, item 2b). Empty until it is made: the apps
  # then can't sign in to this cluster.
  ZITADEL_MOBILE_CLIENT_ID: ""
  # The desktop app's native application (PKCE, the loopback redirect
  # http://127.0.0.1/callback; runbook step 7, item 2c). Optional: empty or
  # absent, the desktop app signs in inside its window with the web
  # application, where Google and Microsoft sign-in is refused.
  ZITADEL_DESKTOP_CLIENT_ID: ""
  # The Zitadel organisation whose users may open Grafana (grafana.${DOMAIN})
  # and the staff admin console (admin.${DOMAIN}, ADR SEC-018; the WeldSuite
  # Staff org on WeldSuite's clusters): its id, from the organisation's
  # settings in Zitadel's console.
  ZITADEL_STAFF_ORG_ID: "000000000000000000"
  # Logs (infrastructure/logging): Loki's bucket, with its S3 endpoint as a
  # host name (no https://) and region. Its key is the Secret logging/loki-s3.
  LOGS_S3_ENDPOINT: fsn1.your-objectstorage.com
  LOGS_S3_REGION: fsn1
  LOGS_BUCKET: example-logs
  # Mapbox's public token (pk.…) for maps and address search in the
  # platform, served in /config.json; empty for none.
  MAPBOX_PUBLIC_TOKEN: ""
  # The release this cluster runs (X.Y.Z, tag weldsuite-vX.Y.Z of this
  # repository): its chart, which installs its images (README, "Releases").
  WELDSUITE_VERSION: "0.0.0"
  # Empty: the images are the release's. Set a tag only to run other images
  # under the release's chart, briefly and on purpose.
  WELDSUITE_IMAGE_TAG: ""
  # Client addresses that may open the staff admin console (admin.${DOMAIN}):
  # a YAML list of CIDRs, unquoted, e.g. [203.0.113.7/32, 198.51.100.0/24].
  # 127.0.0.1/32 lets nobody in from outside; put the staff's addresses here
  # (README, "Staff work").
  ADMIN_CIDRS: "[127.0.0.1/32]"
  # The cluster's secret store (rust/deploy/hetzner/secret-store), as
  # https://<its hostname>, no trailing slash. Set, Prometheus probes its
  # /v1/sys/health and SecretStoreDown fires while it is sealed or
  # unreachable (monitoring-config/ALERTS.md). Empty or left out: no store,
  # no probe.
  SECRET_STORE_URL: ""
  # WeldID, opt-in (weldid.yaml here; infrastructure/weldid/README.md). Read
  # only by its layers, so a cluster without WeldID may leave these out.
  # The chart's release (X.Y.Z, oci://ghcr.io/weldsuite/charts/weldid),
  # which installs the image of the same version.
  WELDID_VERSION: "0.1.0"
  # The passkeys' relying party id: auth.<DOMAIN> or a parent of it,
  # normally DOMAIN itself. Chosen once, before WeldID's first start, and
  # NEVER changed: every passkey is bound to it.
  WELDID_RP_ID: weldsuite.example.com
  # The public half of the server's admin API key (base64url x and y of its
  # P-256 key), which `fill-secrets.mjs --weldid` prints when it makes the
  # key. Empty or wrong: WeldID starts, but refuses every call the server
  # makes to its admin API (sign-up, team changes, the identity sync).
  WELDID_BACKEND_KEY_X: ""
  WELDID_BACKEND_KEY_Y: ""
  # Optional: WeldID's sender, when the platform's isn't the chart's
  # default (infrastructure/weldid/values/weldid.yaml, mail.from).
  # WELDID_MAIL_FROM: WeldSuite <notifications@mail.example.com>
  # Optional: the path the auth. probe asks for (monitoring-config/
  # probes.yaml). Zitadel's /debug/healthz by default; once sign-in is on
  # WeldID, /.well-known/openid-configuration.
  # AUTH_PROBE_PATH: /.well-known/openid-configuration
