# An example cluster's settings, substituted into the layers (${NAME}). Copy
# clusters/example to clusters/<your cluster> in your copy of this repository
# and replace every example value (rust/deploy/hetzner/README.md, step 4).
# Not secret: secrets go in secrets/<your cluster>, encrypted with SOPS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  # app., api., auth., sign., admin., livekit., turn. and mx. under this name
  # point at the ingress load balancer.
  DOMAIN: weldsuite.example.com
  ACME_EMAIL: ops@example.com
  # Postgres backups: object storage at a second provider.
  BACKUP_S3_ENDPOINT: https://s3.backups.example.com
  BACKUP_S3_BUCKET: example-pg-backups
  # Files (the workers' R2 buckets): Hetzner Object Storage.
  FILES_S3_ENDPOINT: https://fsn1.your-objectstorage.com
  FILES_S3_REGION: fsn1
  FILES_BUCKET_PRIVATE: example-files
  # WeldMail's inbound spool and raw messages (Haraka, mailInbound).
  FILES_BUCKET_MAIL: example-mail
  # Zitadel (auth.${DOMAIN}): the WeldSuite project's id (the tokens'
  # audience) and the platform's web application's client id (PKCE). Made in
  # Zitadel's console after its first start (README, step 7).
  ZITADEL_PROJECT_ID: "000000000000000000"
  ZITADEL_WEB_CLIENT_ID: "000000000000000000"
  # Mapbox's public token (pk.…) for maps and address search in the
  # platform, served in /config.json; empty for none.
  MAPBOX_PUBLIC_TOKEN: ""
  # The release this cluster runs (X.Y.Z, tag weldsuite-vX.Y.Z of this
  # repository): its chart, which installs its images (README, "Releases").
  WELDSUITE_VERSION: "0.0.0"
  # Empty: the images are the release's. Set a tag only to run other images
  # under the release's chart, briefly and on purpose.
  WELDSUITE_IMAGE_TAG: ""
  # Client addresses that may open the staff admin console (admin.${DOMAIN}):
  # a YAML list of CIDRs, unquoted, e.g. [203.0.113.7/32, 198.51.100.0/24].
  # 127.0.0.1/32 lets nobody in from outside; put the staff's addresses here
  # (README, "Staff work").
  ADMIN_CIDRS: "[127.0.0.1/32]"
