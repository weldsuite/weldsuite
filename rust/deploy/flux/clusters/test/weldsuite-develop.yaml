# The weldsuite charts the "Rust images" workflow publishes for every develop
# build (.github/workflows/rust-images.yml): version <chart>-develop.<run>,
# appVersion the build's image tag (sha-<commit>). The apps layer's weldsuite
# HelmRelease takes the newest (layers.yaml), so the cluster runs what develop
# runs, with no deploy branch and no commit to bump a tag.
#
# A Helm repository of type oci, not an OCIRepository: through an
# OCIRepository, helm-controller adds +<digest> to the chart version, which may
# not go into labels (see Restate in infrastructure/sources). The package is
# public (ghcr.io/weldsuite/charts/weldsuite), like the images; while it isn't,
# give this a secretRef to a docker-registry Secret in flux-system.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: weldsuite-develop
  namespace: flux-system
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/weldsuite/charts
