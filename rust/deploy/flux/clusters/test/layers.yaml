# The test cluster (rust/deploy/hetzner/TEST-CLUSTER.md): the eu layers on
# small nodes, following develop, with
#   - the weldsuite chart and images of the newest develop build instead of a
#     release (weldsuite-develop.yaml), so every develop push that the "Rust
#     images" workflow builds reaches the cluster, as it reaches Global's test
#     environment;
#   - single-instance Postgres (infrastructure/configs/test);
#   - one replica of everything else (the patches below, on top of each
#     release's values).
# In order: chart sources, operators and the ingress, the encrypted secrets,
# Postgres and the issuer, the services, the weldsuite server with video
# (LiveKit) beside it, and Prometheus for Lens's charts (test only, so far).
# `flux create kustomization ... --path=./rust/deploy/flux/clusters/test`
# applies this directory (runbook step 6).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/sources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  # The chart comes from the develop builds (weldsuite-develop.yaml), not from
  # a release tag in Git, so the release-tag source is left out.
  patches:
    - target:
        kind: GitRepository
        name: weldsuite
      patch: |
        $patch: delete
        apiVersion: source.toolkit.fluxcd.io/v1
        kind: GitRepository
        metadata:
          name: weldsuite
          namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: sources
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/controllers
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  patches:
    - target:
        kind: HelmRelease
        name: traefik
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: traefik
        spec:
          values:
            deployment:
              replicas: 1
    - target:
        kind: HelmRelease
        name: (cert-manager|cloudnative-pg)
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: any
        spec:
          values:
            replicaCount: 1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  path: ./rust/deploy/flux/secrets/test
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/configs/test
  prune: false
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/services
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    # One JetStream server instead of a three-node cluster.
    - target:
        kind: HelmRelease
        name: nats
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: nats
        spec:
          values:
            config:
              cluster:
                enabled: false
    # Restate with a quarter of the memory (RocksDB under half its limit).
    - target:
        kind: HelmRelease
        name: restate
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: restate
        spec:
          values:
            env:
              - name: RESTATE_LOG_FORMAT
                value: json
              - name: RESTATE_CLUSTER_NAME
                value: weldsuite
              - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
                value: 512Mi
            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                memory: 1536Mi
    - target:
        kind: HelmRelease
        name: zitadel
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: zitadel
        spec:
          values:
            replicaCount: 1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: services
  interval: 10m
  path: ./rust/deploy/flux/apps/eu
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    # The chart of the newest develop build, whose appVersion is that build's
    # image tag (WELDSUITE_IMAGE_TAG is empty here, so the images follow it).
    # One pod of each; no autoscaling, and no disruption budget (with one
    # replica it would block every drain). Streams on the one NATS server.
    - target:
        kind: HelmRelease
        name: weldsuite
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: weldsuite
        spec:
          chart:
            spec:
              chart: weldsuite
              version: ">=0.0.0-0"
              reconcileStrategy: ChartVersion
              interval: 5m
              sourceRef:
                kind: HelmRepository
                name: weldsuite-develop
                namespace: flux-system
          values:
            replicaCount: 1
            autoscaling:
              enabled: false
            podDisruptionBudget:
              enabled: false
            signPortal:
              replicaCount: 1
            collabRooms:
              replicaCount: 1
            consume:
              replicaCount: 1
              streamReplicas: 1
              podDisruptionBudget:
                enabled: false
---
# WeldMeet's media server (LiveKit) and its TURN, as on eu: one pod on each of
# the two workers OpenTofu labels node.weldsuite.org/livekit.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: video
  namespace: flux-system
spec:
  dependsOn:
    - name: services
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/video
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# CPU, memory and disk history for Lens (infrastructure/monitoring). Lens:
# the cluster's Metrics settings, "Prometheus Operator",
# monitoring/kube-prometheus-stack-prometheus:9090.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/monitoring
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
