# The test cluster (rust/deploy/hetzner/TEST-CLUSTER.md): the eu layers on one
# node, with
#   - the weldsuite chart taken from the deploy branch instead of a release
#     tag, so a push to that branch reaches the cluster without tagging;
#   - single-instance Postgres (infrastructure/configs/test);
#   - one replica of everything else (the patches below, on top of each
#     release's values).
# In order: chart sources, operators and the ingress, the encrypted secrets,
# Postgres and the issuer, the services, and the weldsuite server.
# `flux create kustomization ... --path=./rust/deploy/flux/clusters/test`
# applies this directory (runbook step 6).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sources
  namespace: flux-system
spec:
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/sources
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  # The chart follows the branch this cluster was bootstrapped from, over
  # anonymous HTTPS: the repository is public, and the organisation doesn't
  # allow deploy keys.
  patches:
    - target:
        kind: GitRepository
        name: weldsuite
      patch: |
        - op: replace
          path: /spec/ref
          value:
            branch: deploy/eu-test
        - op: replace
          path: /spec/url
          value: https://github.com/weldsuite/weldsuite
        - op: remove
          path: /spec/secretRef
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: sources
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/controllers
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  patches:
    - target:
        kind: HelmRelease
        name: traefik
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: traefik
        spec:
          values:
            deployment:
              replicas: 1
    - target:
        kind: HelmRelease
        name: (cert-manager|cloudnative-pg)
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: any
        spec:
          values:
            replicaCount: 1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  path: ./rust/deploy/flux/secrets/test
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/configs/test
  prune: false
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: services
  namespace: flux-system
spec:
  dependsOn:
    - name: configs
  interval: 1h
  path: ./rust/deploy/flux/infrastructure/services
  prune: true
  wait: true
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    # One JetStream server instead of a three-node cluster.
    - target:
        kind: HelmRelease
        name: nats
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: nats
        spec:
          values:
            config:
              cluster:
                enabled: false
    # Restate with a quarter of the memory (RocksDB under half its limit).
    - target:
        kind: HelmRelease
        name: restate
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: restate
        spec:
          values:
            env:
              - name: RESTATE_LOG_FORMAT
                value: json
              - name: RESTATE_CLUSTER_NAME
                value: weldsuite
              - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
                value: 512Mi
            resources:
              requests:
                cpu: 250m
                memory: 768Mi
              limits:
                memory: 1536Mi
    - target:
        kind: HelmRelease
        name: zitadel
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: zitadel
        spec:
          values:
            replicaCount: 1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: services
  interval: 10m
  path: ./rust/deploy/flux/apps/eu
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    # One pod of each; no autoscaling, and no disruption budget (with one
    # replica it would block every drain). Streams on the one NATS server.
    - target:
        kind: HelmRelease
        name: weldsuite
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: weldsuite
        spec:
          values:
            replicaCount: 1
            autoscaling:
              enabled: false
            podDisruptionBudget:
              enabled: false
            signPortal:
              replicaCount: 1
            consume:
              replicaCount: 1
              streamReplicas: 1
              podDisruptionBudget:
                enabled: false
