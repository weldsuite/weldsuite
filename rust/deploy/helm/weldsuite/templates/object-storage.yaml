{{- if .Values.bundle.objectStorage }}
{{- /*
The bundled object store (bundle.objectStorage): one RustFS node on a volume,
reached only inside the cluster. The server creates its buckets at start
(S3_ENSURE_BUCKETS) and serves the public bucket's objects itself unless
config.files.publicUrl names another public endpoint.
*/}}
{{- $name := include "weldsuite.objectStorage.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "weldsuite.objectStorage.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "weldsuite.objectStorage.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "weldsuite.objectStorage.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "weldsuite.objectStorage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weldsuite.objectStorage.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.objectStorage.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: rustfs
          image: "{{ .Values.objectStorage.image.repository }}:{{ .Values.objectStorage.image.tag }}"
          imagePullPolicy: {{ .Values.objectStorage.image.pullPolicy }}
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.generatedName }}
                  key: S3_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.generatedName }}
                  key: S3_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.objectStorage.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.objectStorage.storage.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.objectStorage.storage.size | quote }}
{{- end }}
