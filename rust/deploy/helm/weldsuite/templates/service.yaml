apiVersion: v1
kind: Service
metadata:
  name: {{ include "weldsuite.fullname" . }}
  labels:
    {{- include "weldsuite.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- /* For a ServiceMonitor; the Ingress names port http only. */}}
    {{- with include "weldsuite.metricsServicePort" . }}{{ . | nindent 4 }}{{- end }}
  selector:
    {{- include "weldsuite.selectorLabels" . | nindent 4 }}
