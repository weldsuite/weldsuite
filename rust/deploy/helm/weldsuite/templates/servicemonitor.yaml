{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
{{- if .Values.consume.enabled }}
# consume has no Service of its own (probes only): this headless one gives
# the ServiceMonitor its pods' metrics port, and nothing else.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "weldsuite.consume.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "weldsuite.consume.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    {{- include "weldsuite.metricsServicePort" . | nindent 4 }}
  selector:
    {{- include "weldsuite.consume.selectorLabels" . | nindent 4 }}
---
{{- end }}
# /metrics of the server, consume and the MTA (Prometheus Operator), through
# the `metrics` port of their Services: the server's, consume's headless one
# above and the MTA's API Service. The cluster's monitoring layer may scrape
# the pods with a PodMonitor of its own instead (metrics.serviceMonitor).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "weldsuite.fullname" . }}
  labels:
    {{- include "weldsuite.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "weldsuite.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, consume, mta]
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
      {{- if and .Values.mta.enabled (ne (include "weldsuite.mta.namespace" .) .Release.Namespace) }}
      - {{ include "weldsuite.mta.namespace" . }}
      {{- end }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
