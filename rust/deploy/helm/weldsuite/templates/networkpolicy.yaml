{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weldsuite.fullname" . }}
  labels:
    {{- include "weldsuite.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weldsuite.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        {{- if $.Values.mailInbound.enabled }}
        # Haraka asks /internal/mail-inbound/recipients at RCPT TO (MAIL-010).
        - podSelector:
            matchLabels:
              {{- include "weldsuite.mx.selectorLabels" $ | nindent 14 }}
        {{- end }}
        {{- if $.Values.signPortal.enabled }}
        # The sign portal calls /public/sign-portal/* (ADR FE-017).
        - podSelector:
            matchLabels:
              {{- include "weldsuite.signPortal.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
    {{- if .Values.config.jobs.restate.ingressUrl }}
    - ports:
        - port: jobs
          protocol: TCP
      {{- with .Values.networkPolicy.jobsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- if .Values.signPortal.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "weldsuite.signPortal.fullname" . }}
  labels:
    {{- include "weldsuite.signPortal.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "weldsuite.signPortal.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.signPortalFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
