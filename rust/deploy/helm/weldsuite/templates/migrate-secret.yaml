{{- if and .Values.migrations.enabled (not .Values.secret.existingSecret) .Values.secret.values }}
# The chart-made Secret (secret.values) for the migration Job. The Job is a
# pre-install hook, which runs before the release's own Secret exists, so it
# reads this hook copy, made just before it and removed once the hooks have
# run, whatever the outcome. With secret.existingSecret the Job reads that
# Secret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weldsuite.migrateSecretName" . }}
  labels:
    {{- include "weldsuite.migrateLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
