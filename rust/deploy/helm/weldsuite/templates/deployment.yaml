{{- if and (not .Values.secret.existingSecret) (not .Values.secret.values) }}
{{- fail "set secret.existingSecret (or secret.values for a test cluster): the server needs DATABASE_URL_MASTER" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weldsuite.fullname" . }}
  labels:
    {{- include "weldsuite.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "weldsuite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "weldsuite.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weldsuite.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.config.jobs.restate.ingressUrl }}
            - name: jobs
              containerPort: {{ .Values.config.jobs.port }}
              protocol: TCP
            {{- end }}
          env:
            {{- include "weldsuite.env" . | nindent 12 }}
            {{- with .Values.config.realtime }}
            {{- if .publicUrl }}
            - name: REALTIME_PUBLIC_URL
              value: {{ .publicUrl | quote }}
            {{- end }}
            - name: REALTIME_MAX_CONNECTIONS
              value: {{ .maxConnections | quote }}
            - name: REALTIME_MAX_CONNECTIONS_PER_USER
              value: {{ .maxConnectionsPerUser | quote }}
            - name: REALTIME_MAX_SUBSCRIPTIONS
              value: {{ .maxSubscriptions | quote }}
            - name: REALTIME_SEND_QUEUE
              value: {{ .sendQueue | quote }}
            {{- end }}
            # The WeldApps gateway forwards an app's API calls to the public
            # API (`/v1`), which this server serves itself: through its own
            # Service, unless config.publicApi.gatewayUrl names another.
            - name: EXTERNAL_API_URL
              value: {{ .Values.config.publicApi.gatewayUrl | default (printf "http://%s:%v" (include "weldsuite.fullname" .) .Values.service.port) | quote }}
            # The platform SPA in the image, for every path the API doesn't
            # answer; empty serves the API alone.
            - name: SPA_DIR
              value: {{ ternary .Values.spa.dir "" .Values.spa.enabled | quote }}
          envFrom:
            - secretRef:
                name: {{ include "weldsuite.secretName" . }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.clerkJwks.enabled }}
          volumeMounts:
            - name: clerk-jwks
              mountPath: /etc/weldsuite/clerk
              readOnly: true
          {{- end }}
      {{- if .Values.clerkJwks.enabled }}
      volumes:
        - name: clerk-jwks
          configMap:
            name: {{ include "weldsuite.jwksConfigMap" . }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
