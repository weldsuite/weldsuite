{{- if and (not .Values.secret.existingSecret) (not .Values.secret.values) }}
{{- fail "set secret.existingSecret (or secret.values for a test cluster): the server needs DATABASE_URL_MASTER" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weldsuite.fullname" . }}
  labels:
    {{- include "weldsuite.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "weldsuite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "weldsuite.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weldsuite.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.config.logFormat | quote }}
            - name: RUST_LOG
              value: {{ .Values.config.logLevel | quote }}
            - name: PERMISSIONS_APP_ENFORCE
              value: {{ .Values.config.permissionsAppEnforce | toString | quote }}
            {{- with .Values.config.clerkAuthorizedParties }}
            - name: CLERK_AUTHORIZED_PARTIES
              value: {{ . | quote }}
            {{- end }}
            - name: DATABASE_MASTER_MAX_CONNECTIONS
              value: {{ .Values.config.masterMaxConnections | quote }}
            - name: TENANT_POOL_MAX_CONNECTIONS
              value: {{ .Values.config.tenantPoolMaxConnections | quote }}
            - name: TENANT_POOLS_MAX
              value: {{ .Values.config.tenantPoolsMax | quote }}
            - name: WORKSPACE_CACHE_TTL_SECONDS
              value: {{ .Values.config.workspaceCacheTtlSeconds | quote }}
            - name: SHUTDOWN_DELAY_SECONDS
              value: {{ .Values.config.shutdownDelaySeconds | quote }}
            {{- if .Values.clerkJwks.enabled }}
            - name: CLERK_JWKS_FILE
              value: /etc/weldsuite/clerk/jwks.json
            {{- end }}
            {{- with .Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "weldsuite.secretName" . }}
          startupProbe:
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.clerkJwks.enabled }}
          volumeMounts:
            - name: clerk-jwks
              mountPath: /etc/weldsuite/clerk
              readOnly: true
          {{- end }}
      {{- if .Values.clerkJwks.enabled }}
      volumes:
        - name: clerk-jwks
          configMap:
            name: {{ include "weldsuite.jwksConfigMap" . }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
