{{- if .Values.payPortal.enabled }}
# WeldBooks' public document page (ADR BOOKS-014): TanStack Start's Node build,
# which calls the server's unauthenticated /public/weldbooks/documents/{token}
# endpoints. The link's token is the only credential, so there is no shared
# secret and nothing to put in the Secret.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "weldsuite.payPortal.fullname" . }}
  labels:
    {{- include "weldsuite.payPortal.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weldsuite.payPortal.fullname" . }}
  labels:
    {{- include "weldsuite.payPortal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.payPortal.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "weldsuite.payPortal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weldsuite.payPortal.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ if .Values.serviceAccount.create }}{{ include "weldsuite.payPortal.fullname" . }}{{ else }}{{ include "weldsuite.serviceAccountName" . }}{{ end }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: pay-portal
          image: "{{ .Values.payPortal.image.repository }}:{{ .Values.payPortal.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.payPortal.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: PAY_PORTAL_BACKEND_URL
              value: {{ include "weldsuite.payPortal.backendUrl" . | quote }}
            {{- with .Values.payPortal.publicUrl }}
            - name: PAY_PORTAL_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.payPortal.resources | nindent 12 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.payPortal.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "weldsuite.payPortal.fullname" . }}
  labels:
    {{- include "weldsuite.payPortal.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "weldsuite.payPortal.selectorLabels" . | nindent 4 }}
{{- with .Values.payPortal.ingress }}
{{- if .enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "weldsuite.payPortal.fullname" $ }}
  labels:
    {{- include "weldsuite.payPortal.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "weldsuite.payPortal.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
