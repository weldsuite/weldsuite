{{- if .Values.consume.enabled }}
{{- with .Values.consume }}
{{- if ge (int .drainSeconds) (int .terminationGracePeriodSeconds) }}
{{- fail "consume.drainSeconds must be below consume.terminationGracePeriodSeconds" }}
{{- end }}
{{- end }}
# The entity-event subscribers (`weldsuite consume`): durable consumers on the
# NATS JetStream hub for the audit log, the search index, outgoing webhooks
# and realtime fan-out. Same image as the API; no Service, only probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weldsuite.consume.fullname" . }}
  labels:
    {{- include "weldsuite.consume.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.consume.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "weldsuite.consume.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.secret.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.consume.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "weldsuite.consume.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weldsuite.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.consume.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: consume
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["consume"]
          ports:
            - name: probes
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "weldsuite.env" . | nindent 12 }}
            {{- with .Values.consume }}
            - name: NATS_STREAM_REPLICAS
              value: {{ .streamReplicas | quote }}
            - name: NATS_DEAD_LETTER_STREAM
              value: {{ .deadLetterStream | quote }}
            {{- with .subscribers }}
            - name: CONSUME_SUBSCRIBERS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .embeddings.url }}
            - name: EMBEDDINGS_URL
              value: {{ .embeddings.url | quote }}
            - name: EMBEDDINGS_MODEL
              value: {{ required "consume.embeddings.model is required with consume.embeddings.url" .embeddings.model | quote }}
            {{- end }}
            - name: WEBHOOK_ALLOW_PRIVATE_NETWORKS
              value: {{ .webhooks.allowPrivateNetworks | toString | quote }}
            - name: WEBHOOK_RETRY_SWEEP
              value: {{ .webhooks.retrySweep | toString | quote }}
            - name: CONSUME_DRAIN_SECONDS
              value: {{ .drainSeconds | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "weldsuite.secretName" . }}
          startupProbe:
            {{- toYaml .Values.consume.probes.startup | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.consume.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.consume.probes.readiness | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.consume.resources | nindent 12 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.consume.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "weldsuite.consume.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
