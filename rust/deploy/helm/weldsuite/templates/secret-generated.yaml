{{- if .Values.secret.generate }}
{{- /*
The install's own keys and the bundled dependencies' credentials, generated
once (secret.generate). A key already in the Secret keeps its value, so an
upgrade never changes one; keys this render doesn't know about stay too. Kept
when the release is uninstalled (resource policy keep): the encryption keys
open data that outlives the release. `lookup` sees nothing under `helm
template` or --dry-run, so those show fresh values that are never applied.
*/}}
{{- $name := .Values.secret.generatedName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = deepCopy ($existing.data | default dict) }}
{{- end }}
{{- $hex := list "DATABASE_ENCRYPTION_KEY" "DATABASE_ENCRYPTION_KEY_V2" "WELDPASS_ROOT_KEY" "WELDREACH_WARMUP_KEY" "ADMIN_SESSION_SECRET" }}
{{- $secrets := list "SIGN_SESSION_SECRET" "SIGN_PORTAL_SECRET" "STORAGE_SIGNING_KEY" "REALTIME_INTERNAL_SECRET" "WIDGET_TOKEN_SECRET" "COLLAB_ROOMS_SECRET" "INTERNAL_API_SECRET" "MAIL_INBOUND_SECRET" "OUTBOUND_ADMIN_SECRET" }}
{{- range $hex }}
{{- if not (hasKey $data .) }}
{{- /* 64 hex characters: a SHA-256 of 64 random characters. */}}
{{- $_ := set $data . (sha256sum (randAlphaNum 64) | b64enc) }}
{{- end }}
{{- end }}
{{- range $secrets }}
{{- if not (hasKey $data .) }}
{{- $_ := set $data . (randAlphaNum 48 | b64enc) }}
{{- end }}
{{- end }}
{{- $credentials := dict }}
{{- if .Values.bundle.valkey }}{{- $_ := set $credentials "VALKEY_PASSWORD" 32 }}{{- end }}
{{- if .Values.bundle.nats }}{{- $_ := set $credentials "NATS_TOKEN" 32 }}{{- end }}
{{- if .Values.bundle.objectStorage }}
{{- $_ := set $credentials "S3_ACCESS_KEY_ID" 20 }}
{{- $_ := set $credentials "S3_SECRET_ACCESS_KEY" 40 }}
{{- end }}
{{- range $key, $length := $credentials }}
{{- if not (hasKey $data $key) }}
{{- $_ := set $data $key (randAlphaNum (int $length) | b64enc) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "weldsuite.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ index $data $key | quote }}
  {{- end }}
{{- end }}
