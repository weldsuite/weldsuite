# Values `helm lint` and `helm template` run with in CI: every optional
# resource on.
secret:
  values:
    DATABASE_URL_MASTER: postgres://weldsuite:weldsuite@postgres:5432/weldsuite
    CLERK_JWT_KEY: "not-a-real-key"
    S3_ACCESS_KEY_ID: not-a-real-key
    S3_SECRET_ACCESS_KEY: not-a-real-secret
    SIGN_PORTAL_SECRET: not-a-real-secret
    FORMS_PORTAL_SECRET: not-a-real-secret
    ADMIN_SESSION_SECRET: not-a-real-secret-not-a-real-secret
    ADMIN_OIDC_CLIENT_ID: not-a-real-client
    ADMIN_OIDC_CLIENT_SECRET: not-a-real-secret
    MAIL_INBOUND_SECRET: not-a-real-secret
    MTA_DATABASE_URL: postgres://mta:mta@postgres:5432/weldsuite_mta
    MTA_KEY: bm90LWEtcmVhbC1rZXktbm90LWEtcmVhbC1rZXktMzI=
    MTA_API_SECRET: not-a-real-secret
    MTA_SUBMISSION_PASSWORD_SYSTEM: 0123456789abcdef
    MTA_SUBMISSION_PASSWORD_CUSTOMER: fedcba9876543210
    ZITADEL_SERVICE_TOKEN: not-a-real-token
    TENANT_SHARDS: '[{"name":"tenants-1","adminUrl":"postgres://tenant:x@tenants-1-rw:5432/tenants","poolerHost":"tenants-1-pooler"}]'
config:
  edition: eu
  publicUrl: https://app.example.org/
  auth:
    provider: oidc
    oidc:
      issuer: https://auth.example.org
      audience: "123456789012345678"
  extraEnv:
    # Wins over the value config.publicUrl derives, without a duplicate.
    - { name: PUBLIC_API_URL, value: "https://api.example.org" }
  publicEnv:
    VITE_MAPBOX_ACCESS_TOKEN: pk.example
  sign:
    portalUrl: https://sign.example.org
  identity:
    zitadel:
      apiUrl: http://zitadel.zitadel.svc:8080
      host: auth.example.org
      projectId: "123456789012345678"
  tenants:
    region: eu
  aadWrites: true
  realtime:
    publicUrl: wss://app.example.org/ws
  files:
    endpoint: https://s3.example.com
    publicBucket: weldsuite-public
    publicUrl: https://files.example.org
ingress:
  enabled: true
autoscaling:
  enabled: true
metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  signPortalFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  formsPortalFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
  adminFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
clerkJwks:
  enabled: true
  json: '{"keys":[]}'
signPortal:
  enabled: true
  ingress:
    enabled: true
formsPortal:
  enabled: true
  ingress:
    enabled: true
admin:
  enabled: true
  publicUrl: https://admin.example.org
  platformUrl: https://app.example.org
  allowedSourceRanges: [203.0.113.7/32, 198.51.100.0/24]
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
cron:
  jobs:
    identity-sync:
      enabled: true
    workspace-deletion:
      enabled: true
    workspace-teardown:
      enabled: true
mailInbound:
  enabled: true
  publicUrl: https://files.example.org
  haraka:
    hostname: mx.example.org
    proxyProtocolHosts: [10.0.0.2]
    service:
      annotations:
        load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
consume:
  enabled: true
  subscribers: [audit, search-index, webhooks, realtime]
  streamMaxBytes: 1073741824
  deadLetterMaxBytes: 268435456
  embeddings:
    url: http://embeddings.example.com/v1
    model: bge-m3
mta:
  enabled: true
  bounceDomain: bounces.example.org
  spfInclude: _spf.example.org
  warmupSchedule: "50,100,200"
  pools:
    - name: system
      hostname: mail1-system.example.org
    - name: customer
  submission:
    tls:
      enabled: true
  inbound:
    tls:
      dnsNames: [mail1-system.example.org, mail1-customer.example.org]
