apiVersion: v2
name: weldsuite
description: The WeldSuite backend (the Rust API server) for Kubernetes, the EU and self-hosted editions.
type: application
version: 0.1.0
appVersion: "0.0.0"
home: https://github.com/weldsuite/weldsuite
sources:
  - https://github.com/weldsuite/weldsuite/tree/develop/rust
keywords:
  - weldsuite
# Dependencies the chart can run itself for a self-hosted install (`bundle`
# in values.yaml; docs/plans/self-hosted-edition.md, decision 2). Each is off
# unless its bundle toggle is on, and pinned to the version the EU cluster's
# Flux layers run (rust/deploy/flux/infrastructure/services/releases.yaml).
# The packaged charts are committed under charts/, so no build step needs
# `helm dependency build`.
dependencies:
  - name: valkey
    version: 0.12.0
    repository: https://valkey.io/valkey-helm
    condition: bundle.valkey
  - name: nats
    version: 2.15.0
    repository: https://nats-io.github.io/k8s/helm/charts
    condition: bundle.nats
  - name: restate-helm
    alias: restate
    version: 1.7.13
    repository: oci://ghcr.io/restatedev
    condition: bundle.restate
