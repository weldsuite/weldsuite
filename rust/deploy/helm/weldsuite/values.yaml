# Values for the weldsuite chart. The server is configured by environment
# variables only; see rust/bins/weldsuite/src/config.rs for the full list.

image:
  repository: ghcr.io/weldsuite/weldsuite
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2

nameOverride: ""
fullnameOverride: ""

config:
  # Reported by /health.
  environment: production
  # json for the cluster log pipeline, text for local runs.
  logFormat: json
  # RUST_LOG filter.
  logLevel: info
  # Refuse per-app permission denials instead of only logging them.
  permissionsAppEnforce: false
  # How many proxies in front of the server append to X-Forwarded-For: 1 for
  # the ingress controller, 2 with a CDN the ingress trusts. The client's
  # address is that many entries from the right (the helpdesk widget's rate
  # limit keys on it); the entries to its left are what the client sent.
  trustedProxies: 1
  # Which edition this install is, told to the platform by /config.json:
  # self-hosted (a customer's own install) or eu (WeldSuite's EU edition).
  # The platform offers only the modules this release ports to Rust and hides
  # the features it lacks (rust/bins/weldsuite/src/edition.rs); neither is a
  # setting.
  edition: self-hosted
  # The install's public origin, e.g. https://weldsuite.example.com: where the
  # platform, /api, /v1 and the webhooks are served. Set, it becomes
  # PUBLIC_URL and fills every URL setting that names this host and isn't in
  # extraEnv (PUBLIC_APP_URL, APP_URL, PLATFORM_URL, APP_API_PUBLIC_URL,
  # PUBLIC_API_URL, CONNECT_API_URL, CONNECTOR_WEBHOOK_BASE_URL,
  # WEBHOOK_BASE_URL, PANEL_COLLECTOR_URL). Unset, the server falls back to
  # Global's *.weldsuite.org hosts for links in mail, OAuth redirects and
  # webhook registrations, and warns about it at start.
  publicUrl: ""
  # Public settings the platform would otherwise bake in at build time, by
  # their VITE_* name, served in /config.json's `env`. Anyone can read that
  # document, so the server takes only the names it knows are public
  # (PUBLIC_ENV_KEYS in edition.rs) and refuses to start on any other:
  #   VITE_MAPBOX_ACCESS_TOKEN              Mapbox public token (pk.…): maps, address search
  #   VITE_EXTERNAL_API_URL                 the public API's origin
  #   VITE_USER_APP_BUNDLE_ORIGIN           WeldApps' dedicated bundle origin
  #   VITE_USER_APP_ISOLATE_COMMUNITY_APPS  "true": one origin per community app
  #   VITE_BOOKING_PORTAL_URL, VITE_MEETING_PORTAL_URL  public pages the platform links to
  publicEnv: {}
  # WeldMeet's video provider. livekit: a LiveKit server you run next to the
  # chart (not part of it; see rust/README.md, "WeldMeet on LiveKit"). The
  # server mints LiveKit join tokens with the key pair in the Secret
  # (LIVEKIT_API_KEY, LIVEKIT_API_SECRET), administers rooms over its API, and
  # tells the platform where to connect (/config.json videoProvider and
  # videoUrl). Point LiveKit's webhook at https://<host>/api/webhooks/livekit,
  # signed with the same key. Empty: the server's default (realtimekit, which
  # only Global's Cloudflare account can serve).
  video:
    provider: ""
    livekit:
      # What browsers connect to (wss://livekit.<domain>); also the API's
      # address unless apiUrl is set.
      url: ""
      # The API inside the cluster, e.g. http://livekit.livekit:7880 (optional).
      apiUrl: ""
      # How long a join token can be used to connect (default 600).
      tokenTtlSeconds: ""
  # Who signs people in (ADR SEC-012): oidc (Zitadel, or the customer's own
  # provider; set oidc.issuer and oidc.audience) or clerk (the Global
  # edition's provider, for testing against Global's tokens; its key goes in
  # the Secret: CLERK_JWT_KEY, CLERK_JWKS_URL, ... or clerkJwks below).
  auth:
    provider: oidc
    oidc:
      # Compared with the token's iss exactly; discovery reads
      # <issuer>/.well-known/openid-configuration. Zitadel: https://auth.<domain>.
      issuer: ""
      # A token's aud must name one of these (comma separated). Zitadel: the
      # WeldSuite project id; the platform asks for it with the
      # urn:zitadel:iam:org:project:id:<project id>:aud scope. Quote Zitadel's
      # 18-digit ids: unquoted, YAML reads them as (rounded) numbers.
      audience: ""
      # The claim naming the session's organization (the workspace).
      # Zitadel sets urn:zitadel:iam:org:id when the platform asks for the
      # urn:zitadel:iam:org:id:<org id> scope. For people in several
      # workspaces: urn:zitadel:iam:org:project:<project id>:roles, narrowed
      # by the urn:zitadel:iam:org:roles:id:<org id> scope.
      orgClaim: urn:zitadel:iam:org:id
      # Fetch the keys here instead of discovery's jwks_uri (optional).
      jwksUrl: ""
      # The platform's public client (PKCE), told to the frontends by
      # /config.json (optional).
      webClientId: ""
      # The mobile apps' public native client (PKCE, redirect URIs
      # <app scheme>://sso-callback), told to the apps by /config.json.
      # Without it the mobile apps can't sign in to this server (optional).
      mobileClientId: ""
      # Who shows the sign-in screens (ADR SEC-016). Empty or provider: the
      # provider's own pages. platform: WeldSuite's, the ones Global shows,
      # with the server as Zitadel's login client behind them (/api/sign-in).
      # That takes config.identity.zitadel, a service user with the
      # IAM_LOGIN_CLIENT role, and Zitadel's sign-in for the platform's
      # application pointed at <platform>/auth (Hetzner runbook, step 7).
      # The links in its emails open the platform at PLATFORM_URL, which
      # config.publicUrl fills.
      signIn: ""
  # Extra origins allowed as a Clerk session token's azp (comma separated).
  clerkAuthorizedParties: ""
  masterMaxConnections: 10
  # One connection per workspace database and up to 2,000 pools: the pair
  # that held 300 active workspaces through PgBouncer in spike S4
  # (rust/docs/spikes.md). More connections per pool exhaust the pooler's
  # server connections. The CloudNativePG Pooler needs max_client_conn >=
  # pods x pools and a max_user_connections cap under Postgres's
  # max_connections; leave max_prepared_statements at its default (S3).
  tenantPoolMaxConnections: 1
  tenantPoolsMax: 2000
  workspaceCacheTtlSeconds: 300
  # /readyz fails this long before the server stops accepting connections,
  # so the Service stops sending traffic first. Keep it below
  # terminationGracePeriodSeconds.
  shutdownDelaySeconds: 5
  # Where feature flag values come from: defaults (the catalog defaults, as
  # the workers without Flagship) or master-db (the master database's
  # overrides; needs the feature_flag_overrides table).
  featureFlags: defaults
  featureFlagsRefreshSeconds: 30
  valkey:
    cachePrefix: "cache:"
    # The WebSocket gateway subscribes under the same prefix.
    realtimePrefix: "realtime:"
  # The realtime WebSocket gateway (/ws…): on whenever VALKEY_URL is set, on
  # every pod; pods share hubs, rooms, presence and the replay log through
  # Valkey, so no sticky sessions are needed. It needs a standalone Valkey
  # (or a primary with replicas), not a Valkey cluster.
  # The public API (external-api's `/v1`: wsk_ keys, WeldApps tokens, the
  # weld CLI) is served on the same host as /api. The WeldApps gateway
  # reaches it through this release's own Service by default.
  publicApi:
    gatewayUrl: ""
  # The MCP server (mcp-server: /mcp on the same host, OAuth bearer tokens of
  # the identity provider). The origin its discovery documents name; empty:
  # https:// and the first ingress host.
  mcp:
    serverUrl: ""
  realtime:
    # The URL /config.json gives the frontends. Empty: the origin that
    # /config.json was requested on, with /ws (wss:// behind TLS), which is
    # right when the SPA and the API share a host.
    publicUrl: ""
    # Sockets per pod; more are refused (503) and the client retries.
    maxConnections: 20000
    # Sockets per person per pod (tabs, devices).
    maxConnectionsPerUser: 100
    # Topics one workspace socket may hold.
    maxSubscriptions: 2000
    # Messages queued for one socket before a slow client is dropped (it
    # reconnects and replays from its cursor).
    sendQueue: 1024
  nats:
    entityEventsStream: ENTITY_EVENTS
    entityEventsSubject: entity-events
    # Create or update the entity-event stream at start.
    ensureStreams: false
  # Object storage over the S3 API (MinIO, RustFS, Garage, Ceph RGW, Hetzner
  # Object Storage, AWS): the workers' R2 buckets. Leave endpoint empty for
  # none (file routes then fail). The keys go in the Secret below.
  files:
    endpoint: ""
    region: us-east-1
    # Everything a member or signer must be authorised to read.
    privateBucket: weldsuite-private
    # Read only, for objects stored before the private bucket (optional).
    publicBucket: ""
    # Path-style URLs; MinIO, RustFS, Garage and endpoints reached by IP need them.
    forcePathStyle: false
    # Where browsers read public objects (avatars, logos, published
    # documents), e.g. https://files.weldsuite.example.com: S3_PUBLIC_URL.
    # Unset, public object links point at Global's test bucket host, and the
    # server warns at start.
    publicUrl: ""
  # Durable jobs (the workers' Workflows) on Restate. Leave ingressUrl empty
  # to run jobs inside the server process instead (lost on a restart; fine
  # for a small self-hosted install). With Restate, every pod also serves the
  # jobs service on `port` (HTTP/2) behind the <release>-jobs Service, and
  # registers that Service with the admin API at start (set adminUrl).
  jobs:
    restate:
      ingressUrl: ""   # http://restate:8080
      adminUrl: ""     # http://restate:9070
    port: 9080
  # System mail goes through the SMTP relay in the Secret (SMTP_URL), or the
  # chart's own MTA with mta.enabled. Mail is sent from
  # notifications@mail.weldsuite.org unless `from` names another address, for
  # a relay that only takes its own domain.
  mail:
    from: ""
    # WeldMail's free addresses, `<name>@<workspace slug>.<this domain>`
    # (ADR MAIL-012): weldmail.eu on the EU edition. Empty: no free addresses.
    # Needs inbound mail (mailInbound) and, to send, the domain registered
    # with the MTA for the customer pool (`weldsuite mta domains add <domain>
    # --pool customer`), plus a wildcard MX and SPF record (deploy/hetzner
    # README, "Mail"). weldmail.com and weldmail.org are Global's: the server
    # refuses to start with them.
    freeAddressDomain: ""
  # WeldSign: the signer portal's origin; signing links are <portalUrl>/r/<token>
  # (empty: https://sign.weldsuite.org). SIGN_SESSION_SECRET goes in the Secret.
  sign:
    portalUrl: ""
  # WeldForms: the respondent page's origin; form and invitation links are
  # <portalUrl>/f/<publicId> (empty: https://forms.weldsuite.org). The portal and
  # the server share FORMS_PORTAL_SECRET (in the Secret); FORMS_SESSION_SECRET
  # signs respondent sessions. The bot check (ADR FORMS-005) is ALTCHA's
  # self-hosted proof of work on Kubernetes (ALTCHA_HMAC_KEY in the Secret);
  # `turnstile` takes TURNSTILE_SECRET_KEY in the Secret and the site key here,
  # `none` is for local development only.
  forms:
    portalUrl: ""
    botCheckProvider: altcha
    turnstileSiteKey: ""
  # WeldFlow: the client portal's origin for the portal invitation and the status report
  # emails to client contacts (empty: those emails are not sent).
  flow:
    projectPortalUrl: ""
  # Buying credits (the platform's top-up, edition feature credit-top-up)
  # through Mollie (ADR OPS-012). MOLLIE_API_KEY in the Secret turns it on;
  # without it /config.json lists credit-top-up as unavailable. Mollie posts
  # every payment change to webhookUrl (empty: <publicUrl>/api/webhooks/mollie),
  # which must be reachable from the internet; redirectUrl is where a
  # checkout returns when the client named no address (empty:
  # <publicUrl>/settings/billing?credits=success). Packages are the master
  # credit_packages rows priced in EUR.
  credits:
    mollie:
      webhookUrl: ""
      redirectUrl: ""
  # The identity provider's management API (Zitadel, ADR SEC-012):
  # onboarding creates a workspace's organization through it, the team
  # routes change members, and the identity-sync cron reads its changes.
  # ZITADEL_SERVICE_TOKEN (a service user's personal access token, IAM_OWNER)
  # goes in the Secret. Empty apiUrl: no identity provider. With
  # config.auth.oidc.signIn: platform the sign-in screens call Zitadel's
  # login API too, as a service user with IAM_LOGIN_CLIENT: that same user
  # with the role added, or one of its own (ZITADEL_LOGIN_TOKEN).
  identity:
    zitadel:
      apiUrl: ""             # http://zitadel.zitadel.svc:8080
      # The instance's external domain, sent as Host when apiUrl is in-cluster.
      host: ""
      projectId: ""
      # Where Zitadel's invite email links to ({{.UserID}}, {{.Code}}, {{.OrgID}}).
      inviteUrlTemplate: ""
  # New workspace databases (P4 4a): the provisioner places them on the
  # CloudNativePG shards in TENANT_SHARDS (in the Secret, it holds the admin
  # passwords). With it set the server serves /api/onboarding and runs the
  # workspace.provision job.
  tenants:
    # neon_shared_projects.region of the shards (empty: "default").
    region: ""
  # Seal new workspaces.database_url values as v3 (bound to the workspace);
  # every Rust reader opens v3, so a new cluster can have it on.
  aadWrites: false
  # AI (ADR AI-012, docs/plans/eu-ai-mistral.md): the install's provider, what
  # workspaces may opt in to, fallback and billing. Empty defaultProvider is AI
  # off: the AI features are hidden and their routes answer as the workers do
  # without their model. The keys go in the Secret (MISTRAL_API_KEY,
  # ANTHROPIC_API_KEY, OPENAI_API_KEY, AI_COMPAT_API_KEY, AI_KEYS_ENCRYPTION_KEY;
  # the chart generates the last one with secret.generate). The server refuses
  # to start on an inconsistent setting: a provider without its key, a key
  # source a provider can't serve, a fallback outside the EU.
  ai:
    defaultProvider: ""             # AI_DEFAULT_PROVIDER: mistral | compat | empty (AI off; compat when openaiCompatible.baseUrl is set)
    mistral:
      baseUrl: https://api.mistral.ai/v1   # AI_MISTRAL_BASE_URL; MISTRAL_API_KEY in the Secret
    # Providers outside the EU a workspace admin may enable, and whose key pays:
    # weldsuiteKey (WeldSuite's account, charged as credits; needs the provider's
    # key in the Secret) and ownKey (the workspace's own key, not charged;
    # needs AI_KEYS_ENCRYPTION_KEY). Both off: not offered.
    optIn:
      anthropic: { weldsuiteKey: false, ownKey: false }   # AI_OPTIN_ANTHROPIC=weldsuite,own
      openai:    { weldsuiteKey: false, ownKey: false }   # AI_OPTIN_OPENAI=weldsuite,own
    anthropic:
      baseUrl: ""                   # AI_ANTHROPIC_BASE_URL (empty: https://api.anthropic.com)
    openai:
      baseUrl: ""                   # AI_OPENAI_BASE_URL (empty: https://api.openai.com/v1)
    # Self-hosted: the customer's own OpenAI-compatible endpoint (vLLM,
    # Ollama, Azure). AI_COMPAT_API_KEY in the Secret when it takes one.
    openaiCompatible:
      baseUrl: ""                   # AI_COMPAT_BASE_URL
      region: eu                    # AI_COMPAT_REGION (eu | outside-eu): how the platform labels it
      model: ""                     # AI_COMPAT_MODEL: the chat model it serves (required with baseUrl)
      embedModel: ""                # AI_COMPAT_EMBED_MODEL (optional)
    fallbackModel: ""               # AI_FALLBACK_MODEL: mistral/<id>, or the compat model in the EU; never outside it
    creditGate: false               # AI_CREDIT_GATE: refuse calls on WeldSuite's keys at an empty wallet (402)
    billing: credits                # AI_BILLING: credits | display (meter, never charge: self-hosted)
    workspaceConcurrency: 4         # AI_WORKSPACE_CONCURRENCY: calls one workspace may have in flight on WeldSuite's keys
  # Extra plain environment variables. Traces go to an OpenTelemetry
  # Collector when OTEL_EXPORTER_OTLP_ENDPOINT is set here, e.g.
  #   - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
  extraEnv: []

# The secrets the server needs. Point existingSecret at a Secret you manage
# (External Secrets, Sealed Secrets, sops, ...) holding these keys:
#   DATABASE_URL_MASTER          master database connection string (required)
#   DATABASE_ENCRYPTION_KEY      v1 key for workspaces.database_url and stored
#                                Sendcloud secrets (WeldStash) (optional)
#   DATABASE_ENCRYPTION_KEY_V2   v2 key for the same (optional)
#   CLERK_JWT_KEY                PEM public key of the Clerk instance; or
#   CLERK_SECRET_KEY             fetch the keys from Clerk's Backend API; or
#   CLERK_JWKS_URL               fetch them from a JWKS URL (or use clerkJwks)
#                                (none of the CLERK_* with config.auth.provider: oidc)
#   VALKEY_URL                   redis://… cache, realtime publish and the WebSocket gateway (optional)
#   REALTIME_INTERNAL_SECRET     what callers of /publish/* and /internal/presence send in
#                                x-internal-secret (optional; unset refuses them all)
#   WIDGET_TOKEN_SECRET          WeldDesk: signs and verifies the helpdesk widget visitors'
#                                realtime tokens (optional; unset: visitors get no live updates)
#   NATS_URL                     nats://… entity events (optional)
#   NATS_USER / NATS_PASSWORD, or NATS_TOKEN (optional)
#   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY  object storage keys (with config.files.endpoint)
#   LIVEKIT_API_KEY / LIVEKIT_API_SECRET  WeldMeet on LiveKit (config.video.provider: livekit):
#                                the key pair of the LiveKit server, signing join tokens,
#                                room administration and its webhooks
#   SMTP_URL                     smtp://user:password@relay:587?tls=required, or smtps://…:465:
#                                the relay system mail goes through (optional; unset skips mail;
#                                with mta.enabled and mta.wireServer the chart sets it)
#   MAIL_SMTP_URL                the same for customer mail (WeldMail and the modules' sends);
#                                unset: those sends answer 503 (with mta.wireServer the chart sets it)
#   MTA_DATABASE_URL             the MTA's own database, weldsuite_mta, not through PgBouncer
#                                (with mta.enabled; also mta.existingSecret, which holds the MTA_* keys)
#   MTA_KEY                      base64 of 32 random bytes (`openssl rand -base64 32`): seals the DKIM
#                                private keys at rest and keys the VERP tags. Losing it loses every
#                                domain's DKIM key (with mta.enabled)
#   MTA_API_SECRET               bearer token of the MTA's HTTP API, shared with the server (with mta.enabled)
#   MTA_SUBMISSION_PASSWORD_<POOL>  one per mta.pools entry (…_SYSTEM, …_CUSTOMER): the pool's
#                                submission password, its username the pool's name. Hex, it goes
#                                into an smtp:// URL (`openssl rand -hex 32`; with mta.enabled)
#   SIGN_SESSION_SECRET         WeldSign: keys signer sessions and access-code hashes (the workers' value)
#   SIGN_PORTAL_SECRET           shared by the server and the sign portal (required with signPortal.enabled)
#   FORMS_PORTAL_SECRET          shared by the server and the forms portal (required with formsPortal.enabled)
#   FORMS_SESSION_SECRET         WeldForms: signs respondent sessions and verification tokens and keys the
#                                hashes of IPs, browser keys and emailed codes (the workers' value, so a
#                                session either backend issued opens on the other); unset: 503 on /public/forms
#   ALTCHA_HMAC_KEY              WeldForms: signs ALTCHA's proof-of-work challenges (config.forms.botCheckProvider: altcha)
#   TURNSTILE_SECRET_KEY         WeldForms: Cloudflare Turnstile's secret (config.forms.botCheckProvider: turnstile)
#   OUTBOUND_ADMIN_SECRET        shared by the server and the admin console: what the console sends
#                                to /internal/outbound (optional; unset refuses those calls)
#   ADMIN_OIDC_CLIENT_ID / ADMIN_OIDC_CLIENT_SECRET  the admin console's app at the OIDC provider
#   ADMIN_SESSION_SECRET         seals the admin console's session cookies, at least 32 characters
#                                (the three ADMIN_* with admin.enabled; without them nobody signs in)
#   MAIL_INBOUND_SECRET          shared by the server and Haraka for the RCPT TO check
#                                (required with mailInbound.enabled)
#   TEST_FIXTURES_TOKEN          enables X-Test-Flags outside production (test clusters only)
#   ZITADEL_SERVICE_TOKEN        the identity provider's service user token (with config.identity.zitadel.apiUrl)
#   ZITADEL_LOGIN_TOKEN          the token of a service user with only IAM_LOGIN_CLIENT, for the sign-in
#                                screens (optional, with config.auth.oidc.signIn: platform; unset: the
#                                service user above, which then needs that role as well)
#   DATABASE_URL_PERSONAL        personal-api's shared personal database (consumer WeldMail and
#                                WeldCalendar on personal accounts, ADR DATA-011), a database of its
#                                own: set, the server serves personal-api at /personal-api and the
#                                migrations Job migrates it (optional; unset: no personal-api)
#   TENANT_SHARDS                JSON list of tenant shards: name, adminUrl (the shard's primary,
#                                as a role with CREATEDB and CREATEROLE), poolerHost (optional;
#                                unset: no new workspaces)
#   MISTRAL_API_KEY              WeldSuite's Mistral key (required with config.ai.defaultProvider
#                                mistral, or a mistral/ fallback); also the search index's
#                                embeddings key with consume.embeddings.apiKeySecretKey
#   ANTHROPIC_API_KEY            WeldSuite's EU-edition Anthropic account, for workspaces that opt in
#                                with WeldSuite's key (required with config.ai.optIn.anthropic.weldsuiteKey)
#   OPENAI_API_KEY               the same for OpenAI (config.ai.optIn.openai.weldsuiteKey)
#   AI_COMPAT_API_KEY            the key of config.ai.openaiCompatible's endpoint (optional)
#   AI_KEYS_ENCRYPTION_KEY       64 hex characters (`openssl rand -hex 32`): seals the API keys
#                                workspaces bring (required with an ownKey opt-in; generated with
#                                secret.generate). Losing it loses every stored own key, nothing else
#   MOLLIE_API_KEY               Mollie's live_… (or test_…) API key: buying credits
#                                (config.credits.mollie; optional, unset: no top-up)
# Or leave existingSecret empty and set `values` to let the chart create the
# Secret (fine for a test cluster, not for production: the values end up in
# the Helm release).
secret:
  existingSecret: ""
  values: {}
  # The install's own keys, generated once by the chart into the Secret
  # `generatedName` and kept across upgrades and uninstalls (resource policy
  # keep): DATABASE_ENCRYPTION_KEY(_V2), WELDPASS_ROOT_KEY,
  # WELDREACH_WARMUP_KEY, ADMIN_SESSION_SECRET, AI_KEYS_ENCRYPTION_KEY (64 hex characters each),
  # SIGN_SESSION_SECRET, SIGN_PORTAL_SECRET, STORAGE_SIGNING_KEY,
  # REALTIME_INTERNAL_SECRET, WIDGET_TOKEN_SECRET, COLLAB_ROOMS_SECRET,
  # INTERNAL_API_SECRET, MAIL_INBOUND_SECRET, OUTBOUND_ADMIN_SECRET,
  # SANDBOX_TOKEN_SECRET (WeldAgent's sandbox pods' tokens), and the
  # bundled dependencies' credentials (bundle below). Every pod reads it before
  # the Secret above, so a key set there wins. Back WELDPASS_ROOT_KEY and the
  # DATABASE_ENCRYPTION_KEYs up somewhere outside the cluster: losing them loses
  # every stored WeldPass secret and every workspace's database URL.
  generate: true
  # A fixed name, so the bundled subcharts' values can name it (valkey and
  # nats below). Change it there too if you change it here.
  generatedName: weldsuite-generated

# Dependencies the chart runs itself (Chart.yaml's dependencies, pinned to
# the EU cluster's versions; docs/plans/self-hosted-edition.md, decision 2).
# On, the chart also sets the server's settings for it from the generated
# Secret, overriding the same keys in the Secret above: VALKEY_URL; NATS_URL
# and NATS_TOKEN; RESTATE_INGRESS_URL and RESTATE_ADMIN_URL; S3_ENDPOINT, the
# buckets and keys, S3_ENSURE_BUCKETS and, without config.files.publicUrl,
# public objects served by this server at <config.publicUrl>/api/storage/public.
# Off, bring your own and put its settings in the Secret.
bundle:
  # A CloudNativePG Cluster for the master and the workspaces' databases
  # (postgres below): DATABASE_URL_MASTER and TENANT_SHARDS. Needs the
  # CloudNativePG operator in the cluster. With it, the migrations run in an
  # init container of the server's pods instead of a pre-install hook, which
  # would run before the database exists.
  postgres: false
  valkey: false
  nats: false
  restate: false
  objectStorage: false

# The bundled Postgres (bundle.postgres): one CloudNativePG Cluster,
# <release>-pg. The master database is weldsuite_master, owned by weldsuite;
# each workspace gets its own database and role on the same cluster, made by
# the tenant role (CREATEDB, CREATEROLE). Both passwords are generated into
# <release>-pg-owner and <release>-pg-tenant (basic-auth Secrets, kept on
# uninstall). Workspaces connect to the primary directly, without a pooler,
# which suits an install of up to a few hundred workspaces.
postgres:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.8-standard-trixie
  parameters:
    max_connections: "300"
    shared_buffers: 256MB
  storage:
    size: 20Gi
    # The cluster's default StorageClass when empty.
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# The bundled object store (bundle.objectStorage): one RustFS node (Apache-2.0,
# S3-compatible) on a volume. The buckets are created by the server at start.
objectStorage:
  image:
    repository: rustfs/rustfs
    tag: "1.0.1"
    pullPolicy: IfNotPresent
  buckets:
    private: weldsuite-private
    public: weldsuite-public
  storage:
    size: 50Gi
    # The cluster's default StorageClass when empty.
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch

# Values for the bundled subcharts, used only when their bundle toggle is on.
# Valkey with a password for its default user from the generated Secret.
valkey:
  auth:
    enabled: true
    usersExistingSecret: weldsuite-generated
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: VALKEY_PASSWORD
  dataStorage:
    enabled: true
    requestedSize: 5Gi
    keepPvc: true
# NATS with JetStream on a volume, one node, a token from the generated Secret.
nats:
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
    merge:
      authorization:
        token: << $NATS_TOKEN >>
  container:
    env:
      NATS_TOKEN:
        valueFrom:
          secretKeyRef:
            name: weldsuite-generated
            key: NATS_TOKEN
  natsBox:
    enabled: false
# Restate, one node; it is reached only inside the cluster.
restate:
  replicaCount: 1
  env:
    - name: RESTATE_LOG_FORMAT
      value: json
    - name: RESTATE_CLUSTER_NAME
      value: weldsuite
    # RocksDB's memory budget, well inside the limit below.
    - name: RESTATE_ROCKSDB_TOTAL_MEMORY_SIZE
      value: 768Mi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  storage:
    size: 10Gi

# The database migrations: a Job that runs `weldsuite migrate` with the same
# image, Secret and settings as the server, as a Helm pre-install and
# pre-upgrade hook. The server's pods roll out only after it succeeded; when it
# fails, the install or upgrade fails and the Job stays for its logs. It needs
# DATABASE_URL_MASTER, and the encryption keys to open the tenants' stored
# database URLs. Turn it off only when the migrations run some other way.
migrations:
  enabled: true
  # weldsuite migrate's flags (weldsuite migrate --help): the master database,
  # every active workspace's database, and personal-api's shared personal
  # database when DATABASE_URL_PERSONAL is in the Secret (skipped otherwise).
  # Add "--apply-skipped" to also apply migrations Drizzle skipped.
  args: ["--master", "--tenants", "--personal"]
  # Tenant databases migrated at once (the TypeScript runner does one).
  concurrency: 1
  # Retries of a failed run; every run starts where the last one stopped.
  backoffLimit: 2
  # The whole Job, retries included; keep it under the release's timeout
  # (helm --timeout, or the HelmRelease's spec.timeout under Flux).
  activeDeadlineSeconds: 1500
  # Leave a finished Job this long (unset: until the next install or upgrade).
  ttlSecondsAfterFinished: null
  # A succeeded Job is removed; a failed one stays until the next attempt.
  hookDeletePolicy: before-hook-creation,hook-succeeded
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi

# Verify session tokens against a JWKS document instead of CLERK_JWT_KEY: the
# document is mounted from a ConfigMap and read at start.
clerkJwks:
  enabled: false
  # Name of an existing ConfigMap with the document under `jwks.json`.
  existingConfigMap: ""
  # Or the document itself, and the chart creates the ConfigMap.
  json: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

# Prometheus metrics (rust/bins/weldsuite/src/monitoring.rs): the server,
# consume and the MTA serve GET /metrics on a port of their own (container
# port `metrics`, METRICS_ADDR), never on the API's, so the ingress never
# reaches it. The cron jobs exit and have none. The MTA, on the host network,
# listens on the node's private address only. Off: METRICS_ADDR=off.
metrics:
  enabled: true
  port: 9464
  # A ServiceMonitor (Prometheus Operator) for the server, consume and the
  # MTA, with a headless Service for consume, which has none. Off by
  # default: the cluster's monitoring layer scrapes the pods with its own
  # PodMonitor; turn it on for an install that wants the chart to do it.
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, for a Prometheus that selects ServiceMonitors by label.
    labels: {}
  # With networkPolicy.enabled: the namespace Prometheus scrapes from
  # (matched on its kubernetes.io/metadata.name label).
  networkPolicy:
    namespace: monitoring

# The server's ingress. With the SPA on, one host is the platform and its
# API on the same origin (app.<domain>); add api.<domain> for clients that
# call the API by that name.
# The realtime gateway's sockets (/ws…) go through the same Ingress and host
# as the API: Traefik passes the WebSocket upgrade on without annotations,
# and its default timeouts (3.6) keep a socket open as long as the client
# pings every 25 s, as @weldsuite/realtime's clients do. Pods share their
# state through Valkey, so no sticky sessions.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The platform SPA in the image (/srv/spa, built with VITE_RUNTIME_CONFIG=on):
# the server answers every path its API and probes don't with the app's files,
# or index.html for a client route (rust/bins/weldsuite/src/spa.rs). The app
# reads /config.json and calls the API on its own origin. Off: the API alone.
spa:
  enabled: true
  dir: /srv/spa

# The WeldSign signer portal (ADR FE-017): a Node container
# (ghcr.io/weldsuite/weldsuite-sign-portal, `--target sign-portal` of
# rust/Dockerfile) whose server routes call this server's
# /public/sign-portal/* endpoints. Needs SIGN_PORTAL_SECRET in the Secret.
signPortal:
  enabled: false
  image:
    repository: ghcr.io/weldsuite/weldsuite-sign-portal
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Where the portal calls the server; defaults to the server's Service.
  backendUrl: ""
  # How many proxies in front of the portal append to X-Forwarded-For, which
  # the signer's IP on the evidence trail is read from (counted from the
  # right): 1 for the ingress controller, 2 with a CDN the ingress trusts.
  trustedProxies: 1
  # The signing links the server emails point at config.sign.portalUrl: set
  # it to this portal's public URL (https://sign.<domain>).
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: sign.example.org
        paths:
          - path: /
            pathType: Prefix
    tls: []

# The WeldForms respondent page (ADR FE-017, FORMS-002): a Node container
# (ghcr.io/weldsuite/weldsuite-forms-portal, `--target forms-portal` of
# rust/Dockerfile) whose server routes call this server's /public/forms/*
# endpoints. Needs FORMS_PORTAL_SECRET in the Secret.
formsPortal:
  enabled: false
  image:
    repository: ghcr.io/weldsuite/weldsuite-forms-portal
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  # Where the portal calls the server; defaults to the server's Service.
  backendUrl: ""
  # How many proxies in front of the portal append to X-Forwarded-For, which
  # the respondent's IP (rate limits, bot checks) is read from (counted from the
  # right): 1 for the ingress controller, 2 with a CDN the ingress trusts.
  trustedProxies: 1
  # The links the server emails point at config.forms.portalUrl: set it to this
  # portal's public URL (https://forms.<domain>).
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: forms.example.org
        paths:
          - path: /
            pathType: Prefix
    tls: []

# The staff admin console (ADR FE-018) at admin.<domain>: WeldReach access
# requests, workspaces, the app catalog, warmup and outbound mail. Staff sign in
# at the install's OIDC provider (Zitadel: a confidential web app with the
# redirect URI <publicUrl>/auth/callback and the post-logout URI
# <publicUrl>/sign-in?signed_out=1) and get in only with an active admin_users
# row, the roster `weldsuite admin staff` manages (ADR SEC-014). Reads from the
# Secret: DATABASE_URL_MASTER, DATABASE_ENCRYPTION_KEY(_V2) (the tenants'
# stored URLs), SMTP_URL, OUTBOUND_ADMIN_SECRET, and its own
# ADMIN_OIDC_CLIENT_ID, ADMIN_OIDC_CLIENT_SECRET and ADMIN_SESSION_SECRET (at
# least 32 characters); until those three are there, nobody gets in.
admin:
  enabled: false
  image:
    repository: ghcr.io/weldsuite/weldsuite-admin
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  # Where staff open the console (ADMIN_PUBLIC_URL), e.g. https://admin.example.org.
  # Required: the sign-in's redirect URI is built from it, never from the Host header.
  publicUrl: ""
  # The issuer staff sign in at; empty: config.auth.oidc.issuer.
  oidcIssuer: ""
  # The platform's URL, for links in the emails the console sends.
  platformUrl: ""
  # Client addresses (CIDRs) that may reach the console, as a Traefik
  # ipAllowList Middleware on its Ingress (traefik.io/v1alpha1, so Traefik
  # only; the Ingress's own router.middlewares annotation is replaced). Empty:
  # no allowlist. Traefik must see the client's address (PROXY protocol).
  allowedSourceRanges: []
  extraEnv: []
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: admin.example.org
        paths:
          - path: /
            pathType: Prefix
    tls: []

# WeldDocs', WeldSheets' and WeldBoard's live editing (rust/docs/collab-rooms.md):
# the workers' DocRoom, SheetRoom and BoardRoom on Node, in a StatefulSet. The
# server serves the REST routes and proxies the room sockets (/api/docs/connect,
# /api/sheets/connect, /api/boards/connect) to the pod that holds each room, so
# the ingress needs no extra path. Needs config.files (the rooms' storage and checkpoints are
# in the private bucket) and COLLAB_ROOMS_SECRET in the Secret. Off: the
# documents and sheets are listed and managed, but opening one answers 503.
collabRooms:
  enabled: false
  image:
    repository: ghcr.io/weldsuite/weldsuite-collab-rooms
    # Defaults to the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Rooms are spread over the pods by id. Changing it restarts every pod
  # (they flush their rooms on SIGTERM) and the server, which routes by it.
  replicaCount: 1
  # V8's heap: an open spreadsheet is held whole in memory.
  heapMegabytes: 1536
  terminationGracePeriodSeconds: 60
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

terminationGracePeriodSeconds: 30

probes:
  startup:
    httpGet: { path: /livez, port: http }
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    httpGet: { path: /livez, port: http }
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    httpGet: { path: /readyz, port: http }
    periodSeconds: 5
    failureThreshold: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# The entity-event subscribers (`weldsuite consume`, its own Deployment from
# the same image, no Service): the audit log, the semantic search index,
# outgoing webhooks and realtime fan-out, each a durable consumer on the NATS
# JetStream hub (config.nats). Needs NATS_URL in the Secret; realtime needs
# VALKEY_URL. Analytics, WeldConnect and WeldAgent have no consumer yet.
consume:
  enabled: false
  replicaCount: 2
  # The subscribers to run; empty runs every ported one (audit, search-index,
  # webhooks, realtime, and reach-send: WeldReach's sends, which the
  # reach-send-sweep cron then queues on NATS; and reach-warmup-send and
  # reach-warmup-engage, which reach-warmup-dispatch queues). search-index needs
  # `embeddings` below.
  subscribers: []
  # With config.nats.ensureStreams: create or update the hub and the
  # dead-letter stream at start with this many replicas (3 on a three-node
  # JetStream cluster).
  streamReplicas: 1
  # With config.nats.ensureStreams: the most the hub and the dead-letter
  # stream keep on disk, in bytes; a full stream drops its oldest messages.
  # Keep both together under the JetStream volume. 0: no cap (age only).
  streamMaxBytes: 0
  deadLetterMaxBytes: 0
  # Where a message goes after a subscriber's last retry (subjects
  # <entityEventsSubject>-dlq.<subscriber>.<entityType>.<action>, kept 14 days).
  deadLetterStream: ENTITY_EVENTS_DLQ
  # An OpenAI-compatible embeddings endpoint for the semantic search index
  # (Mistral, or bge-m3 served in the cluster by TEI, vLLM or Ollama); the
  # vectors must have 1024 dimensions. A key goes in the Secret as
  # EMBEDDINGS_API_KEY, or under the name apiKeySecretKey gives (Mistral:
  # MISTRAL_API_KEY, the key config.ai uses). Without a url the search-index
  # subscriber is off.
  embeddings:
    url: ""
    model: ""
    apiKeySecretKey: ""
  webhooks:
    # Deliver to private and loopback addresses too. Off: the pod sits next
    # to the cluster's own services, so a customer's webhook URL must not
    # reach them.
    allowPrivateNetworks: false
    # Retry failed deliveries every ten minutes from this role (one pod at a
    # time, under an advisory lock on the master database).
    retrySweep: true
  # After SIGTERM, how long the batches in hand may take; below
  # terminationGracePeriodSeconds.
  drainSeconds: 45
  terminationGracePeriodSeconds: 60
  podAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  probes:
    startup:
      httpGet: { path: /livez, port: probes }
      periodSeconds: 2
      failureThreshold: 30
    liveness:
      httpGet: { path: /livez, port: probes }
      periodSeconds: 10
      failureThreshold: 3
    # The master database and NATS answer.
    readiness:
      httpGet: { path: /readyz, port: probes }
      periodSeconds: 10
      failureThreshold: 3

# WeldMail's inbound path (ADR MAIL-010), off by default: Haraka as the MX
# (its own image, rust/deploy/haraka) behind a LoadBalancer on port 25. At
# RCPT TO it asks the server whether the master registry knows the address
# (250, 550 5.1.1, or 451 when it cannot tell); it verifies SPF, DKIM and
# DMARC into an Authentication-Results header in Cloudflare's form, puts the
# raw message in the mail bucket and publishes its key and envelope on NATS
# (250 only when both succeeded, else 451). `weldsuite consume` (needs
# consume.enabled) then runs mail-inbound-worker's storage pipeline. Needs
# config.files.endpoint (the mail bucket lives on that store; create it),
# NATS_URL and the S3 keys in the Secret, and MAIL_INBOUND_SECRET. Haraka gets
# only those: no database credentials.
#
# WeldReach's replies come in the same way: with REACH_INBOUND_DOMAIN in the
# Secret (or config.extraEnv) and that domain's MX pointing at Haraka, the
# RCPT check accepts reply+<token>@<domain> for an active mailbox token and
# consume hands those recipients to WeldReach (storage in publicBucket as
# STORAGE), the rest to WeldMail.
mailInbound:
  enabled: false
  # The mail bucket: Haraka's spool (inbound/…) and each stored message's
  # raw MIME (mail/<workspace>/<mailbox>/<message>/raw.eml). An EU bucket on
  # the EU edition.
  bucket: weldsuite-mail
  # Inbound attachments and new contacts' avatars go to config.files'
  # publicBucket, served at this URL (the workers' R2_PUBLIC_URL). Empty: a
  # message keeps no attachments, as the worker without STORAGE.
  publicUrl: ""
  # The largest message accepted, in bytes (Cloudflare Email Routing's 25 MiB).
  maxMessageBytes: 26214400
  # The JetStream stream, subject and dead-letter stream (created by consume
  # with config.nats.ensureStreams).
  stream: MAIL_INBOUND
  subject: mail.inbound
  deadLetterStream: MAIL_INBOUND_DLQ
  haraka:
    image:
      repository: ghcr.io/weldsuite/weldsuite-haraka
      # Defaults to the chart's appVersion.
      tag: ""
      pullPolicy: IfNotPresent
    replicaCount: 2
    # The MX's name (mx.<domain>): the 220 greeting, Received and
    # Authentication-Results, and the certificate's name. Required.
    hostname: ""
    # The addresses (or CIDRs) the PROXY protocol comes from: the load
    # balancer's. Empty: none (a direct connection, kind or a test).
    proxyProtocolHosts: []
    service:
      type: LoadBalancer
      port: 25
      # Keep the client's address (SPF needs it) and pass TCP through.
      externalTrafficPolicy: Local
      # Hetzner: load-balancer.hetzner.cloud/uses-proxyprotocol: "true",
      # load-balancer.hetzner.cloud/name, …/location.
      annotations: {}
      # With type NodePort: the fixed port a load balancer outside the
      # cluster forwards 25 to (empty: Kubernetes picks one).
      nodePort: null
    # STARTTLS with a certificate for hostname: a cert-manager Certificate
    # from issuerRef, or a kubernetes.io/tls Secret you manage.
    tls:
      enabled: true
      existingSecret: ""
      issuerRef:
        name: letsencrypt
        kind: ClusterIssuer
    # How long the RCPT TO check may take before Haraka answers 451.
    rcptTimeoutMs: 5000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

# The MTA (docs/plans/eu-mail-service.md, ADR MAIL-011), off by default:
# `weldsuite mta` from the server's image, sending the platform's and the
# customers' mail straight to the recipients' MX from the mail nodes' own
# addresses. One DaemonSet per pool, on the nodes labelled
# weldsuite.org/mail-pool=<pool> and tainted weldsuite.org/mail (OpenTofu's
# mail_pools), on the host network. Submission (port 2587, the
# <release>-mta Service on 587) and the HTTP API (8025, <release>-mta-api)
# listen on the node's private address; the bounce MX on port 25 of every
# address. Its queue is its own database (MTA_DATABASE_URL), which it
# migrates at start. Needs MTA_DATABASE_URL, MTA_KEY, MTA_API_SECRET and a
# MTA_SUBMISSION_PASSWORD_<POOL> per pool in the Secret; NATS_URL (optional)
# carries delivery events to `weldsuite consume`. Haraka (mailInbound) stays
# WeldMail's MX and is not involved.
mta:
  enabled: false
  # A pool is a set of mail nodes; a node delivers only its pool's mail, and
  # any node takes submissions for any pool. system: the platform's own mail
  # (SMTP_URL); customer: what people write (MAIL_SMTP_URL). Names as in
  # mail_pools. hostname (optional, only for a pool of one node) overrides
  # the EHLO name, which is otherwise the PTR of the node's address.
  pools:
    - name: system
    - name: customer
  # The Secret holding the MTA_* keys. Empty: the release's (secret.existingSecret,
  # or the chart's). Another Secret keeps the MTA's database URL and key out
  # of the server's environment; the server then reads only MTA_API_SECRET
  # and the submission passwords from it.
  existingSecret: ""
  # The namespace the MTA runs in (empty: the release's). The MTA is on the
  # host network, which Pod Security's baseline and restricted levels forbid:
  # where the release's namespace enforces them (the Flux clusters'
  # `weldsuite` does), give the MTA a namespace labelled
  # pod-security.kubernetes.io/enforce: privileged, as LiveKit has. The chart
  # creates nothing else there: existingSecret must be in it (and the image
  # pull Secrets, if any), and clientSecret then holds what the server needs.
  # The MTA can't read the release's Secret from there, so existingSecret also
  # carries NATS_URL and NATS_TOKEN (or NATS_USER and NATS_PASSWORD), with a
  # NATS_URL that names the release's namespace: without them its delivery
  # events stay in its outbox.
  namespace: ""
  # A Secret in the release's namespace with MTA_API_SECRET and the
  # submission passwords (MTA_SUBMISSION_PASSWORD_<POOL>), the same values as
  # the MTA's: what the server, consume and the cron jobs read with
  # wireServer. Empty: the MTA's own Secret (one namespace). Required with
  # namespace.
  clientSecret: ""
  # The return-path domain (bounces.<domain>): its MX are the mail nodes, and
  # the envelope sender becomes b+<id>-<tag>@ it, so DSNs and complaint
  # reports come back here. Empty: senders keep their own MAIL FROM and only
  # refusals during the SMTP session are seen.
  bounceDomain: ""
  # The SPF include a customer domain publishes (_spf.<domain>, the TXT
  # record listing every mail node's IPv4), passed to the server as
  # MAIL_SPF_INCLUDE with wireServer. Empty: SPF records say "mx".
  spfInclude: ""
  # The largest message submission accepts, in bytes.
  maxMessageBytes: 26214400
  # A recipient still deferred after this bounces (5d, 36h, 90m).
  maxQueueAge: 5d
  # Parallel outbound connections per node.
  concurrency: 32
  # Per-IP daily caps on warm-up day 1, 2, … (comma separated), unlimited
  # after the last; "off" for an address with a history. Empty: the MTA's
  # schedule (50 on day one up to 50,000 on day eleven).
  warmupSchedule: ""
  # A hard-bounced recipient is refused at submission for this many days.
  suppressDays: 30
  # Point the server, consume and the cron jobs at the MTA: SMTP_URL (pool
  # system) and MAIL_SMTP_URL (pool customer) on the submission Service, and
  # MTA_API_URL / MTA_API_SECRET for the mail domain routes, which register
  # sending domains and their DKIM keys with it. These override the Secret's
  # SMTP_URL and MAIL_SMTP_URL (a chart-made Secret's own are kept); false
  # leaves both to the Secret.
  wireServer: true
  submission:
    service:
      port: 587
    # STARTTLS on submission, with a kubernetes.io/tls Secret (empty: the
    # bounce MX's). Traffic stays on the private network, and the chart's
    # SMTP_URL doesn't ask for it: the certificate names the mail nodes, not
    # the Service.
    tls:
      enabled: false
      existingSecret: ""
  # The bounce MX: DSNs and ARF complaint reports for bounceDomain, on port
  # 25 of the mail nodes. Needs bounceDomain.
  inbound:
    enabled: true
    # STARTTLS: a cert-manager Certificate for dnsNames (the mail nodes'
    # names, `tofu output mail_nodes`; empty: bounceDomain), or a
    # kubernetes.io/tls Secret you manage. Without an issuerRef the
    # certificate is self-signed: senders of bounces encrypt opportunistically
    # and don't check it, and Let's Encrypt's HTTP-01 can't reach the mail
    # nodes (a DNS-01 issuer can).
    tls:
      enabled: true
      existingSecret: ""
      dnsNames: []
      issuerRef: {}
  # Extra plain environment variables (MTA_RESOLVER, MTA_SOURCE_IP,
  # MTA_EVENTS_SUBJECT, MTA_TLSRPT_FROM, ...; the contract in the plan).
  extraEnv: []
  # Sessions and deliveries in flight get this long after SIGTERM.
  terminationGracePeriodSeconds: 60
  podAnnotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

# Spread pods over nodes and zones when the cluster has them.
topologySpread:
  enabled: true

# Only allow ingress to the HTTP port from the listed peers. Egress stays
# open (databases, Clerk).
networkPolicy:
  enabled: false
  ingressFrom: []
  # Who may call the jobs port (the Restate pods); empty allows any pod.
  jobsFrom: []
  # Who may call the sign portal (the ingress controller); empty allows any
  # peer. The portal's own pods may always call the server.
  signPortalFrom: []
  # Who may call the forms portal (the ingress controller); empty allows any peer.
  formsPortalFrom: []
  # Who may call the admin console (the ingress controller); empty allows any
  # peer. The console's own pods may always call the server.
  adminFrom: []

# Scheduled jobs (the workers' Cron Triggers), one CronJob each running
# `weldsuite cron <name>` with the server's environment. A run that is still
# going when the next is due is left alone (concurrencyPolicy: Forbid).
cron:
  jobs:
    # WeldSign: automatic reminders and expiry of open requests.
    sign-lifecycle:
      enabled: true
      schedule: "*/15 * * * *"
      # Kill a run that hangs before the next one is due.
      activeDeadlineSeconds: 840
    # WeldDesk: SLA warnings and breaches on inbox conversations, for the
    # workspaces the due index lists.
    desk-sla-sweep:
      enabled: true
      schedule: "* * * * *"
      activeDeadlineSeconds: 55
    # WeldDesk: the scheduled report emails that came due, for the workspaces
    # the due index lists. A tick sends at most 60 reports; a schedule is
    # claimed before it is sent, so a run that is cut short sends nothing twice.
    desk-report-sweep:
      enabled: true
      schedule: "* * * * *"
      activeDeadlineSeconds: 290
    # WeldReach: the send sweep over the due index (workspaces with outreach
    # due). With consume.enabled it publishes each one on NATS for the
    # reach-send subscriber; otherwise it runs their sends itself.
    reach-send-sweep:
      enabled: true
      schedule: "* * * * *"
      activeDeadlineSeconds: 290
    # WeldReach: warmup progress of the mailboxes (provisioning, warming,
    # active, the daily cap ramp, lapsed domains), for the workspaces the due
    # index lists. Needs MAILPOOL_API_KEY for mailboxes still provisioning.
    reach-warmup-sweep:
      enabled: true
      schedule: "15 * * * *"
      activeDeadlineSeconds: 3000
    # WeldReach: gives back Mailpool slots no active mailbox needs (master
    # database only). Does nothing without MAILPOOL_API_KEY.
    reach-slot-reconciliation:
      enabled: true
      schedule: "15 3 * * *"
      activeDeadlineSeconds: 600
    # WeldReach's warmup network (master database only; kill switch
    # weldreach-warmup; needs WELDREACH_WARMUP_KEY). The dispatch hands due
    # warmup mail to the reach-warmup-send / -engage subscribers on NATS with
    # consume.enabled; otherwise it sends and engages them itself.
    reach-warmup-dispatch:
      enabled: true
      schedule: "* * * * *"
      activeDeadlineSeconds: 290
    # Turns the pool into the day's scheduled warmup mail, and brings back
    # mailboxes whose login works again.
    reach-warmup-plan:
      enabled: true
      schedule: "*/30 * * * *"
      activeDeadlineSeconds: 1500
    # The ramp, stats, auto-pause and resume, and the cleanup of old warmup
    # mail over IMAP.
    reach-warmup-daily:
      enabled: true
      schedule: "30 2 * * *"
      activeDeadlineSeconds: 3000
    # The identity provider's changes (users, organizations, memberships)
    # into the databases: what Clerk's webhooks do on Global. Needs
    # config.identity.
    identity-sync:
      enabled: false
      schedule: "* * * * *"
      activeDeadlineSeconds: 55
    # WeldFlow: drafts the status reports whose cadence has come due, in the
    # workspaces the status_report_due due index lists.
    flow-status-reports:
      enabled: true
      schedule: "30 3 * * *"
      activeDeadlineSeconds: 3000
    # WeldMerge: the daily WeldChat digests, for the workspaces the
    # merge_digest due index lists (each subscription posts at its own UTC
    # hour). Does nothing while merge is not served.
    merge-digest-sweep:
      enabled: true
      schedule: "0 * * * *"
      activeDeadlineSeconds: 3000
    # WeldAgent: the due cron routines of the workspaces the weldagent_routine
    # due index lists. Does nothing without AI (config.ai) or while the agent
    # module is not served.
    weldagent-routines:
      enabled: true
      schedule: "0 * * * *"
      activeDeadlineSeconds: 3000
    # WeldAgent's sandbox: deletes finished, expired and stuck sandbox pods.
    # Runs whenever sandbox.enabled is on, whatever this says.
    sandbox-cleanup:
      enabled: false
      schedule: "*/5 * * * *"
      activeDeadlineSeconds: 240
    # WeldForms: the automatic invitation reminders and the daily response
    # digest, for the workspaces the forms_reminders / forms_digest due index
    # lists. Do nothing while forms is not served.
    forms-reminders:
      enabled: true
      schedule: "*/15 * * * *"
      activeDeadlineSeconds: 840
    forms-digest:
      enabled: true
      schedule: "*/15 * * * *"
      activeDeadlineSeconds: 840
    # WeldBooks: overdue invoices, due recurring invoices and the day's ECB
    # rates, in every workspace that used books (the books due index).
    books-sweep:
      enabled: true
      schedule: "0 3 * * *"
      activeDeadlineSeconds: 3000
    # WeldFlow: the weekly project finance snapshot of every workspace the
    # `finance_snapshot` due index lists (FLOW-019).
    flow-finance-snapshot:
      enabled: true
      schedule: "45 3 * * *"
      activeDeadlineSeconds: 900
    # WeldBooks' bank feeds whose next sync is due (the master
    # bank_feed_connection_index): the polled providers' syncs and the daily
    # safety net for the ones with webhooks (integration-sync-worker's cron).
    bank-feed-due:
      enabled: true
      schedule: "*/15 * * * *"
      activeDeadlineSeconds: 840
    # CRM connections (Attio, HubSpot, Google Calendar) whose next sync is
    # due (the master workspace_due_index, kind crm_sync): the sync started on
    # Restate and Google watches renewed through WeldConnect's internal routes
    # (integration-sync-worker's CRM due sweep). Needs
    # config.jobs.restate.ingressUrl and INTERNAL_API_SECRET.
    crm-due:
      enabled: true
      schedule: "*/15 * * * *"
      activeDeadlineSeconds: 840
    # WeldAds: connections whose metrics sync is due (the master
    # ad_sync_index), synced through WeldConnect's internal route
    # (integration-sync-worker's ad sweep). Needs INTERNAL_API_SECRET.
    ad-sync:
      enabled: true
      schedule: "*/15 * * * *"
      activeDeadlineSeconds: 840
    # WeldConnect's store and accounting connectors (WooCommerce, Shopify,
    # Picqer, Moneybird, Stripe) whose catch-up is due (the master
    # workspace_due_index, kind connector_catchup): each probed for changes
    # and caught up through WeldConnect's internal route when there are any
    # (integration-sync-worker's connector catch-up). Needs INTERNAL_API_SECRET.
    connector-catchup:
      enabled: true
      schedule: "*/15 * * * *"
      activeDeadlineSeconds: 840
    # WeldBooks to Moneybird: another push pass for the workspaces whose last
    # pass left work (Moneybird's rate limit; kind moneybird_push), through
    # WeldConnect's internal route. Needs INTERNAL_API_SECRET.
    moneybird-push:
      enabled: true
      schedule: "*/5 * * * *"
      activeDeadlineSeconds: 280
    # WeldConnect's Google Sheets, Gmail, Google Calendar and Airtable poll
    # triggers (the master workspace_due_index, kind workflow_poll), new items
    # dispatched to their workflows on Restate. Needs
    # config.jobs.restate.ingressUrl.
    workflow-polls:
      enabled: true
      schedule: "*/10 * * * *"
      activeDeadlineSeconds: 540
    # Workspaces past their scheduled deletion lose their organization (the
    # identity sync then tears the database down). Needs config.identity.
    workspace-deletion:
      enabled: false
      schedule: "0 3 * * *"
      activeDeadlineSeconds: 3000
    # WeldConnect's scheduled workflow runs, started on Restate. Needs
    # config.jobs.restate.ingressUrl (without it each run only logs a skip).
    workflow-schedules:
      enabled: true
      schedule: "* * * * *"
      activeDeadlineSeconds: 55
    # Deleted workspaces whose database teardown never finished, after 48
    # hours. Needs TENANT_SHARDS.
    workspace-teardown:
      enabled: false
      schedule: "17 * * * *"
      activeDeadlineSeconds: 3000
    # WeldHost's daily domain auto-renew sweep. Renewals are charged through
    # Stripe, which stays with Global (feature domain-purchase), so for now it
    # only reports that billing is missing; off until a billing provider exists.
    domain-auto-renew:
      enabled: false
      schedule: "0 4 * * *"
      activeDeadlineSeconds: 3000
    # WeldMail's outbound ledgers: every active ledger's alarm (state
    # changes, cases, staff alerts), as the Durable Object's 5-minute alarm
    # does on Global. Skips without VALKEY_URL (the ledgers then live in serve).
    mail-outbound-ledgers:
      enabled: true
      schedule: "*/5 * * * *"
      activeDeadlineSeconds: 280
    # WeldCalendar: re-plan stale auto-scheduled events, daily as on Global.
    calendar-replan:
      enabled: true
      schedule: "0 4 * * *"
      activeDeadlineSeconds: 3000
    # WeldFlow: hard-delete files soft-deleted more than 30 days ago, for the
    # workspaces the file_purge due index lists.
    flow-file-purge:
      enabled: true
      schedule: "30 3 * * *"
      activeDeadlineSeconds: 3000
    # WeldFlow: approval reminders and overdue notices, for the workspaces
    # the approval_due due index lists.
    flow-approval-due:
      enabled: true
      schedule: "30 3 * * *"
      activeDeadlineSeconds: 3000
    # WeldFlow: measure project benefits for the month that just ended, for
    # the workspaces the benefit_measure due index lists.
    flow-benefit-measure:
      enabled: true
      schedule: "30 3 * * *"
      activeDeadlineSeconds: 3000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# WeldAgent's sandbox (ADR AI-012 phase 5, rust/crates/sandbox): code
# execution, files, web fetches, a browser and a desktop for computer use, in
# pods of their own that the server starts per agent conversation or run.
# Without it the agent-sandbox edition feature is unavailable and the
# builder hides the sandbox and browsing toggles.
#
# Each pod runs under gVisor (runtimeClass), with no service-account token,
# a read-only root filesystem, CPU/memory/disk limits, an idle timeout and a
# hard lifetime, in a namespace whose NetworkPolicy lets it reach only the
# public internet on egressPorts and only the server's pods reach it. The
# server manages them through the Kubernetes API: the server, consume and
# the sandbox-cleanup CronJob get their pod's service-account token, and a
# Role allows pods get/list/create/delete in that namespace only; an
# admission policy there admits nothing but pods of the sandbox's shape.
# Before handing out a sandbox the server checks from inside one that the
# metadata service and the Kubernetes API are out of reach, and refuses
# while they aren't: the NetworkPolicy needs a CNI that enforces it (Flannel
# alone doesn't; rust/deploy/hetzner/README.md, "Agent sandbox").
sandbox:
  enabled: false
  # The namespace the pods run in. Pod Security `restricted` there; create
  # it with the chart (createNamespace) or beforehand (the Flux clusters).
  namespace: weldsuite-sandbox
  createNamespace: false
  image:
    repository: ghcr.io/weldsuite/weldsuite-sandbox
    # Defaults to the chart's appVersion.
    tag: ""
  # A pull secret in the sandbox namespace, for a private registry.
  imagePullSecret: ""
  runtimeClass:
    # The RuntimeClass the pods run under; empty: the node's default runtime
    # (a development cluster without gVisor only).
    name: gvisor
    # Create it (cluster-scoped). Its handler is runsc, the name Talos'
    # gvisor extension and the gVisor packages give it.
    create: true
    handler: runsc
  resources:
    cpu: "1"
    cpuRequest: 250m
    memory: 2Gi
    # The /workspace volume and the container's own writes.
    disk: 2Gi
  # The agent in a pod exits after this long without a call, and the pod ends.
  idleTimeoutSeconds: 900
  # Kubernetes stops a pod this long after it started, whatever it does.
  maxLifetimeSeconds: 3600
  maxPerWorkspace: 2
  maxTotal: 40
  # The resolvers the pods use (public: they never ask the cluster's DNS).
  dns: ["9.9.9.9", "149.112.112.112"]
  # The ports the pods may reach on the public internet, besides DNS on the
  # resolvers above. 80 and 443 cover the web, git over https, pip and npm;
  # anything else (mail on 25, ssh) stays shut.
  egressPorts: [80, 443]
  # Addresses on the public internet the pods may never reach: the cluster's
  # own nodes' public addresses (a pod reaches its node's host ports on them),
  # and anything else of the install's. The private, link-local, metadata and
  # reserved ranges are always shut.
  deniedCidrs: []
  # More host:port the isolation check must find unreachable (a database
  # service, a node's private address).
  egressProbes: []
  # The admission policy that admits only pods of the sandbox's shape in the
  # namespace (ValidatingAdmissionPolicy, Kubernetes 1.30+).
  admissionPolicy:
    enabled: true
  # Run the pods on these nodes only (a pool of their own keeps them off the
  # database and mail nodes): SANDBOX_NODE_SELECTOR and SANDBOX_TOLERATIONS.
  nodeSelector: {}
  tolerations: []
  # Development clusters only: hand out sandboxes without the isolation check.
  requireIsolation: true
  # The cleanup is the CronJob cron.jobs.sandbox-cleanup, which runs whenever
  # the sandbox is on.

# Web search for WeldAgent's web_search tool: a SearXNG in the release's
# namespace, reached only by the server's pods (SEARXNG_URL). Only the query
# leaves the cluster, to the engines below; no account, cookie or profile
# goes with it, the server sends it in a POST body (so it is in no access
# log), SearXNG keeps no query log (debug off, no metrics), and its limiter
# runs on a Valkey of its own in the pod. The engines are companies outside
# WeldSuite: each gets the queries routed to it.
searxng:
  enabled: false
  image:
    repository: docker.io/searxng/searxng
    tag: "2026.10.28-c360868e5"
  valkey:
    image:
      repository: docker.io/valkey/valkey
      tag: "9.1.2-alpine"
  # The engines asked, from SearXNG's own list. The default leans on the EU:
  # Qwant (France), Startpage (the Netherlands; Google's results, without the
  # user), Mojeek (the UK, its own index) and Wikipedia (Wikimedia, US).
  # duckduckgo and brave can be added; both are US companies.
  engines: [qwant, startpage, mojeek, wikipedia]
  # Who may skip the limiter: the server's pods (the cluster's pod network).
  passCidrs: ["10.244.0.0/16"]
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
