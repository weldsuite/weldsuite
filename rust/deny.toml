# cargo-deny: licences, advisories, duplicate crates and sources.
# Runs in CI (`Rust` job) and locally with `pnpm rust:deny`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Licences compatible with shipping the backend under AGPL-3.0-only (OPS-002).
# Adding one here is a licensing decision: say why in the PR.
allow = [
  # Zero-clause BSD: no conditions at all (quoted_printable, via lettre).
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory: allowances nothing uses yet are fine.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false` and AGPL; don't check them against the list.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
