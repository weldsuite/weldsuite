# cargo-deny: licences, advisories, duplicate crates and sources.
# Runs in CI (`Rust` job) and locally with `pnpm rust:deny`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Each entry names who pulls the crate in and when to drop it. Only
# unmaintained notices belong here; a vulnerability gets fixed, not ignored.
ignore = [
  # pin-utils is archived (2026-10-01), not vulnerable. Its only user is
  # async-imap 0.12.0 (crates/adapters-oss, the IMAP mail adapter), the newest
  # release. Drop this once async-imap moves to core::pin::pin!.
  { id = "RUSTSEC-2026-0441", reason = "unmaintained, no fix: async-imap 0.12.0 still depends on pin-utils" },
  # chrono is unmaintained (2026-11-17), not vulnerable, and no release is
  # safe from the notice. Its users are async-imap 0.12.0 and, since WeldPanel's
  # analytics store (EVT-019), Arrow 58 and iceberg 0.11 (crates/lakehouse).
  # Drop this once all of them move to jiff or time.
  { id = "RUSTSEC-2026-0543", reason = "unmaintained, no fix: async-imap 0.12.0, Arrow 58 and iceberg 0.11 depend on chrono" },
  # The next three are unmaintained, not vulnerable, and come in with
  # DataFusion 54 and Arrow 58 (crates/lakehouse, EVT-019; iceberg-datafusion
  # 0.11 pins DataFusion 54). Re-check each when DataFusion is upgraded.
  # chrono-tz: Arrow's time-zone support (arrow-array, arrow-cast).
  { id = "RUSTSEC-2026-0555", reason = "unmaintained, no fix: Arrow 58 depends on chrono-tz" },
  # humantime: DataFusion's config parsing (datafusion-common).
  { id = "RUSTSEC-2026-0542", reason = "unmaintained, no fix: DataFusion 54 depends on humantime" },
  # paste: a macro crate used by DataFusion 54, iceberg 0.11 and
  # datafusion-functions-json; it leaves nothing behind at run time.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained, no fix: DataFusion 54, iceberg 0.11 and datafusion-functions-json depend on paste" },
]

[licenses]
version = 2
# Licences compatible with shipping the backend under AGPL-3.0-only (OPS-002).
# Adding one here is a licensing decision: say why in the PR.
allow = [
  # Zero-clause BSD: no conditions at all (quoted_printable, via lettre).
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  # The bzip2 licence: BSD-style and permissive, no copyleft. libbz2-rs-sys,
  # the Rust port of libbzip2, comes in through DataFusion 54's default
  # compression codecs (crates/lakehouse, EVT-019). Accepted 2026-11-18.
  "bzip2-1.0.6",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# The list is the policy, not an inventory: allowances nothing uses yet are fine.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false` and AGPL; don't check them against the list.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
