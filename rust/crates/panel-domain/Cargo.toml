[package]
name = "weldsuite-panel-domain"
description = "@weldsuite/panel-domain/query: WeldPanel's report compiler (spec to SQL), its runner and the result shapes, byte for byte as the TypeScript writes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true, features = ["alloc"] }
icu_collator = { workspace = true }
jiff = { workspace = true }
# Unicode classes (`\d` in a path rule), as DataFusion's regexp_replace reads them.
regex = { workspace = true, features = ["unicode"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
