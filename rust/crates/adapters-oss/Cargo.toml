[package]
name = "weldsuite-adapters-oss"
description = "Open-source adapters for the ports: Valkey cache and pub/sub, NATS JetStream, flags from the master database, S3 files, SMTP mail"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-ports = { workspace = true }
async-nats = { workspace = true, features = ["aws-lc-rs", "jetstream"] }
bytes = { workspace = true }
lettre = { workspace = true }
reqwest = { workspace = true }
rusty-s3 = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
weldsuite-catalogs = { workspace = true }
weldsuite-events = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
