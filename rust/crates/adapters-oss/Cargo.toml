[package]
name = "weldsuite-adapters-oss"
description = "Open-source adapters for the ports: Valkey cache and pub/sub, NATS JetStream, flags from the master database, S3 files, Restate jobs, SMTP mail, CloudNativePG databases"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-db = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-migrations = { workspace = true }
weldsuite-ports = { workspace = true }
async-nats = { workspace = true, features = ["aws-lc-rs", "jetstream"] }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
jiff = { workspace = true }
lettre = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
restate-sdk = { workspace = true }
serde = { workspace = true }
rusty-s3 = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
weldsuite-catalogs = { workspace = true }
weldsuite-events = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
