[package]
name = "weldsuite-legal-entities"
description = "Legal entities (core): the companies of a workspace, per-entity access, the legalEntityContext middleware and the core service (@weldsuite/core-domain/legal-entities)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["formatting", "macros"] }
tower = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
