[package]
name = "weldsuite-realtime"
description = "The realtime WebSocket gateway: the realtime-worker's hubs and rooms on Valkey, for every pod of weldsuite serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-adapters-oss = { workspace = true }
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio", "ws"] }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true, features = ["sink", "std"] }
hmac = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }

[lints]
workspace = true
