[package]
name = "weldsuite-books-domain"
description = "WeldBooks rules every books area and other modules share (@weldsuite/books-domain and books-api's shared services): tables, entity context, guards, the posting engine, currency and FX, jurisdictions, the request glue of the books-* crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-pipeline = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
form_urlencoded = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
icu_collator = { workspace = true }
jiff = { workspace = true }
jsonwebtoken = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["parsing", "macros", "formatting"] }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
unicode-normalization = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
