[package]
name = "weldsuite-kit"
description = "What every WeldSuite API module is built on: the response envelope, errors, ids, CORS, request ids and the public portals' sign-in helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
form_urlencoded = { workspace = true }
regex = { workspace = true, features = ["unicode-perl"] }
weldsuite-catalogs = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json"] }
getrandom = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
