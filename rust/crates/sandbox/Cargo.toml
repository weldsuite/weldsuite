[package]
name = "weldsuite-sandbox"
description = "WeldAgent's sandbox on the Kubernetes editions: gVisor pods in their own namespace (create, reuse, clean up through the Kubernetes API), the HTTP client of the agent inside them (commands, files, code, page fetches, a headless Chromium and an X desktop), web search on a self-hosted SearXNG, and the agent tools over them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-ports = { workspace = true }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting"] }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }

[lints]
workspace = true
