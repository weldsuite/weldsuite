[package]
name = "weldsuite-connect-domain"
description = "WeldConnect's store and accounting connectors (@weldsuite/connect-domain with what it needs of @weldsuite/connectors): the connector catalog, stored credentials, connections, and the WooCommerce, Shopify and Picqer clients connect-api and commerce-api share"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-ports = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
