[package]
name = "weldsuite-ai"
description = "AI on the Kubernetes editions (ADR AI-012): the model catalog, the workspace policy resolver, the providers (Mistral and other OpenAI-compatible endpoints, Anthropic, Mistral OCR, transcription), fallback and credit metering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-core-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-ports = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
hex = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

[lints]
workspace = true
