[package]
name = "weldsuite-reach-domain"
description = "@weldsuite/reach-domain: WeldReach's campaigns, prospects, lists, suppressions, inbox, sending window and warmup pool, shared by reach-api and the public API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-mail-inbound = { workspace = true }
weldsuite-ports = { workspace = true }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
jiff = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
