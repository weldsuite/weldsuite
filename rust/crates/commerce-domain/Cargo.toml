[package]
name = "weldsuite-commerce-domain"
description = "WeldCommerce's order rules (ADR COM-010): the one place an order and its items are created or changed (numbering, totals, discount codes, status rules), shared by the commerce module's routes and the connector ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `Table`, the Drizzle-shaped writes of `tables`.
weldsuite-books-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-kit = { workspace = true }
# The outbound HTTP port VIES is asked through.
weldsuite-ports = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
