[package]
name = "weldsuite-mail-inbound"
description = "WeldMail's inbound path on Kubernetes (MAIL-010): the RCPT check, and the mail.inbound consumer that runs mail-inbound-worker's storage pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-desk-domain = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-mail-domain = { workspace = true }
weldsuite-notifications = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "tokio"] }
encoding_rs = { workspace = true }
regex = { workspace = true, features = ["unicode"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["macros", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[lints]
workspace = true
