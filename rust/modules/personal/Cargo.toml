[package]
name = "weldsuite-personal"
description = "personal-api (consumer WeldMail and WeldCalendar on personal accounts): onboarding, the profile, push tokens, calendars, events, booking pages, bookings and the personal mailboxes, on the shared personal database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-calendar-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-mail-domain = { workspace = true }
weldsuite-mail-inbound = { workspace = true }
weldsuite-notifications = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
form_urlencoded = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tower-http = { workspace = true, features = ["cors"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true
