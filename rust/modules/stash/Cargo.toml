[package]
name = "weldsuite-stash"
description = "WeldStash (the WMS: warehouses, locations, stock and its ledger, putaway, pick lists, pickers, suppliers, and the product catalogue): stash-api's routes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-books-domain = { workspace = true }
weldsuite-catalogs = { workspace = true }
# The Odoo client for the RFQ push (odoo_push.rs).
weldsuite-connect-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
# The planning run's "items to reorder" notification (replenishment/run.rs).
weldsuite-notifications = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
base64 = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The fake Odoo server, for the RFQ push tests.
weldsuite-connect-domain = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }

[lints]
workspace = true
