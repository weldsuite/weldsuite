[package]
name = "weldsuite-agent"
description = "WeldAgent (workspace agents, conversations, approvals, platform tools, the agent loop over weldsuite-ai): agent-api's /api/weldagent, /api/ai, /api/ai-models and /api/chat-agent on the Kubernetes editions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-ai = { workspace = true }
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-chat-domain = { workspace = true }
weldsuite-connect = { workspace = true }
weldsuite-crm-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-flow-domain = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
weldsuite-subscribers = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
http = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
serde = { workspace = true }
regex = { workspace = true, features = ["unicode"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
