[package]
name = "weldsuite-sheets"
description = "WeldSheets (spreadsheets, sessions in their rooms, imports and exports, version history, connected tables): sheets-api's /api/sheets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-core-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-flow-domain = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "multipart", "query"] }
flate2 = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
