[package]
name = "weldsuite-desk-widget"
description = "WeldDesk's helpdesk widget API (helpdesk-widget-api): the public webchat API a website's widget calls, authenticated by widget id"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-db = { workspace = true }
weldsuite-desk-domain = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-notifications = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "multipart", "query"] }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
