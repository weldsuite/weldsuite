[package]
name = "weldsuite-mcp"
description = "WeldSuite's MCP server (mcp-server): the tool catalog, the JSON-RPC endpoint, and tool calls into the /v1 API in process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-external-api = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "matched-path", "original-uri"] }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
http = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["formatting", "parsing"] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
