[package]
name = "weldsuite-books-tax"
description = "WeldBooks VAT, GST and Brazil (books-api's VAT returns, ICP declarations, the India GST worksheet, Brazil's apuração, SPED ECD and fiscal documents), on the books foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-books-domain = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query", "multipart"] }
base64 = { workspace = true }
encoding_rs = { workspace = true }
form_urlencoded = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
