[package]
name = "weldsuite-hr"
description = "WeldHR (employees, time, lifecycle, performance, payroll, My HR): hr-api's /api/weldhr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-core-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-emails = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-notifications = { workspace = true }
weldsuite-payroll-domain = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-pipeline = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "multipart", "query"] }
bytes = { workspace = true }
icu_collator = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["parsing", "formatting", "macros"] }
tokio = { workspace = true, features = ["macros", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
