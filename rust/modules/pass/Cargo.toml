[package]
name = "weldsuite-pass"
description = "WeldPass (secret vaults with provider sync, and the team password manager): pass-api's /api/weldpass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
aes-gcm = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
getrandom = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
