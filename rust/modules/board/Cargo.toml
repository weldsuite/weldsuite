[package]
name = "weldsuite-board"
description = "WeldBoard (boards as WeldDrive files and WeldFlow project whiteboards, sessions in their rooms, version history, record cards, link previews): board-api's /api/boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-ai = { workspace = true }
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-core-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-flow-domain = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
flate2 = { workspace = true }
http = { workspace = true }
regex = { workspace = true, features = ["unicode"] }
reqwest = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["net"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
