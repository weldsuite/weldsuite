[package]
name = "weldsuite-books-sales-tax"
description = "WeldBooks US sales tax (books-api's sales tax settings, agencies, jurisdictions, rules, zones, exemption certificates, reports, nexus monitor, returns and tax calendar), on the books foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-books-domain = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
base64 = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
