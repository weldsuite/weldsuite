[package]
name = "weldsuite-commerce"
description = "WeldCommerce, rebuilt for the EU edition (ADR COM-009): catalogue, orders, storefront. Rust only, no TypeScript worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
axum = { workspace = true, features = ["json"] }
http = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true }
weldsuite-ports = { workspace = true }

[lints]
workspace = true
