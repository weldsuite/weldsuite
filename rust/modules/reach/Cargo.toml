[package]
name = "weldsuite-reach"
description = "WeldReach (cold-email outreach): reach-api's /api/reach and the Mailpool webhook at /public/reach, the send sweep, the warmup sweep and the Mailpool slot reconciliation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-crm-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-pipeline = { workspace = true }
weldsuite-ports = { workspace = true }
weldsuite-reach-domain = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[lints]
workspace = true
