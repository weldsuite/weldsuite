[package]
name = "weldsuite-core-apps"
description = "Core platform: WeldApps (user-created apps), the bundle host, CLI login and the desktop sign-in handoff (app-api's user-apps, public-user-apps, cli-auth and auth-desktop routes)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
aws-lc-rs = { workspace = true }
axum = { workspace = true, features = ["json", "multipart", "query"] }
base64 = { workspace = true }
form_urlencoded = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
