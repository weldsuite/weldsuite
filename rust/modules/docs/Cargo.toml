[package]
name = "weldsuite-docs"
description = "WeldDocs (documents, sessions in their rooms, version history): docs-api's /api/docs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-core-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
flate2 = { workspace = true }
http = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true
