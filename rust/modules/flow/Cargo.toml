[package]
name = "weldsuite-flow"
description = "WeldFlow (projects, tasks, sprints, milestones, goals, documents, time tracking): flow-api's routes, jobs and crons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-auth = { workspace = true }
weldsuite-calendar-domain = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-core-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-emails = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-flow-domain = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-notifications = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-pipeline = { workspace = true }
weldsuite-ports = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
http = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true, features = ["parsing"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
