[package]
name = "weldsuite-connect"
description = "WeldConnect (workflow automation and integrations): connect-api's routes, the public workflow webhook receiver, and the execution engine (workflow-worker) as the connect.execute-workflow job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
weldsuite-ads-domain = { workspace = true }
weldsuite-auth = { workspace = true }
weldsuite-catalogs = { workspace = true }
weldsuite-connect-domain = { workspace = true }
weldsuite-db = { workspace = true }
weldsuite-desk-domain = { workspace = true }
weldsuite-events = { workspace = true }
weldsuite-kit = { workspace = true }
weldsuite-permissions = { workspace = true }
weldsuite-ports = { workspace = true }
weldsuite-subscribers = { workspace = true }
axum = { workspace = true, features = ["json", "query"] }
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
http = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
