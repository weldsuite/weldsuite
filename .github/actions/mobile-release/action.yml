name: Mobile release
description: >-
  Publish an OTA update for an Expo app. Runtime compatibility uses a string
  `runtimeVersion` matching `expo.version` (bare-workflow apps reject
  `policy: appVersion`). Bump `expo.version` and ship a native build when native
  code changes. Native builds are started by hand in the "Mobile native build"
  workflow.

inputs:
  app-dir:
    description: Path to the Expo app, e.g. apps/mobile/weldmail-app.
    required: true
  channel:
    description: >-
      EAS channel to release to. Doubles as the eas.json build profile name,
      so `preview` and `production` must exist in both places.
    required: true
  message:
    description: Message recorded on the update.
    required: true

runs:
  using: composite
  steps:
    - name: Publish OTA update
      shell: bash
      working-directory: ${{ inputs.app-dir }}
      env:
        CHANNEL: ${{ inputs.channel }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail
        eas update \
          --channel "$CHANNEL" \
          --environment "$CHANNEL" \
          --message "$MESSAGE" \
          --non-interactive

        {
          echo "### ${{ inputs.app-dir }} (\`$CHANNEL\`)"
          echo ""
          echo "OTA update published. It reaches installs whose \`expo.version\` matches this release."
          echo "After native changes, bump \`version\` in app.json and run **Mobile native build**."
        } >> "$GITHUB_STEP_SUMMARY"
