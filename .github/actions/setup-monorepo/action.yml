name: 'Setup Monorepo'
description: 'Setup pnpm, Node.js, and install dependencies for the WeldSuite monorepo'

# Ephemeral GitHub-hosted runners: use pnpm's setup-node cache + a turbo
# cache restore. Do not rely on a warm disk between jobs.

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    # Wrangler v4 requires Node >= 22 (deploy:* steps fail otherwise).
    default: '22'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10.34.5'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Cache turbo
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
