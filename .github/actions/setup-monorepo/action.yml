name: 'Setup Monorepo'
description: 'Setup pnpm, Node.js, and install dependencies for the WeldSuite monorepo'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    # Wrangler v4 requires Node >= 22 (deploy:* steps fail otherwise).
    default: '22'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10.4.1'
  install-dependencies:
    description: 'Whether to install dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    # setup-node first: pnpm/action-setup's self-installer fails on the
    # self-hosted box (exit 1) when it runs against the root-owned system Node.
    # Corepack ships with Node 22 and writes shims into the user-owned toolcache.
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Do not set cache: pnpm — setup-node hashes **/pnpm-lock.yaml and that
        # glob times out (120s) walking this monorepo on the Hetzner runners.
        # The explicit cache step below hashes only the root lockfile.

    - name: Setup pnpm
      shell: bash
      run: |
        set -euo pipefail
        export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
        corepack enable
        corepack prepare "pnpm@${{ inputs.pnpm-version }}" --activate
        pnpm --version

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

    - name: Setup pnpm cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup Turborepo cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
