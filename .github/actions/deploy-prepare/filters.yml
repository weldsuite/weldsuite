# Path filters for deploy change detection (dorny/paths-filter), read by the
# deploy-prepare action. Each key is a deploy target or a flag; the action's
# `changes` output lists the keys a diff touched, and
# .github/scripts/deploy-plan.mjs turns that list into the deploy plan.
#
# A new core worker (apps/workers/<name>, not a <module>-api) needs a key here
# and an entry in CORE_WORKERS in deploy-plan.mjs. Module API workers and
# Vercel apps are picked by module-workers.mjs and vercel-apps.mjs instead.
migrations:
  - 'packages/core/db/drizzle/**'
  - 'packages/core/db/src/schema/**'
  - 'apps/tools/migrate-databases/**'
# First-party WeldApps (deploy-hosted-apps action).
hosted_apps:
  - 'apps/hosted-apps/**'
  - 'packages/sdk/app-sdk/**'
  - 'packages/sdk/cli/**'
d1_connector_migrations:
  - 'apps/workers/integration-sync-worker/migrations/d1/**'
  - 'apps/workers/integration-sync-worker/wrangler.toml'
d1_schedule_migrations:
  - 'apps/workers/workflow-worker/migrations/d1/**'
  - 'apps/workers/workflow-worker/wrangler.toml'
