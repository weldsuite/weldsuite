name: Deploy hosted apps
description: >-
  Deploys the first-party WeldApps under apps/hosted-apps/<code>/ that changed
  since the diff base (all of them when there is none, or when the app SDK or
  the CLI changed) with `weld app deploy`. A no-op when the publisher key is
  unset or nothing changed. Expects this repo checked out at the workspace
  root with full history (fetch-depth: 0). The deploy plan's run_hosted_apps
  output says when to run it.

inputs:
  environment:
    description: test (api-test.weldsuite.org) or production (api.weldsuite.org).
    required: true
  sha:
    description: The deployed commit, recorded in each app's changelog.
    required: true
  base:
    description: Diff base (the last successful deploy of this environment). Empty deploys every app.
    required: false
    default: ''
  weld-api-key:
    description: HOSTED_APPS_WELD_API_KEY secret, the publisher workspace's wsk_ key (user-apps:manage).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check the publisher key
      id: key
      shell: bash
      env:
        WELD_API_KEY: ${{ inputs.weld-api-key }}
        TARGET: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "$TARGET" in
          test) echo "api_url=https://api-test.weldsuite.org" >> "$GITHUB_OUTPUT" ;;
          production) echo "api_url=https://api.weldsuite.org" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::environment must be test or production (got '$TARGET')"; exit 1 ;;
        esac
        if [ -z "${WELD_API_KEY:-}" ]; then
          echo "HOSTED_APPS_WELD_API_KEY is not set: skipping hosted app deploy."
          echo "set=false" >> "$GITHUB_OUTPUT"
        else
          echo "set=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: ./.github/actions/setup-monorepo
      if: steps.key.outputs.set == 'true'

    - name: Build CLI
      if: steps.key.outputs.set == 'true'
      shell: bash
      run: pnpm --filter @weldsuite/cli build

    - name: Detect hosted apps to deploy
      id: apps
      if: steps.key.outputs.set == 'true'
      shell: bash
      env:
        BEFORE: ${{ inputs.base }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        ROOT="apps/hosted-apps"
        codes=()
        all_apps() {
          while IFS= read -r dir; do
            code="$(basename "$dir")"
            case "$code" in _*) continue ;; esac
            if [ -f "$dir/weldapp.json" ]; then codes+=("$code"); fi
          done < <(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | sort)
        }
        if [ -z "$BEFORE" ] || [[ "$BEFORE" =~ ^0+$ ]]; then
          all_apps
        elif [ -n "$(git diff --name-only "$BEFORE" "$SHA" -- packages/sdk/app-sdk packages/sdk/cli || true)" ]; then
          all_apps
        else
          mapfile -t changed < <(git diff --name-only "$BEFORE" "$SHA" -- "$ROOT" | awk -F/ '
            $1=="apps" && $2=="hosted-apps" && NF>=3 { print $3 }
          ' | sort -u)
          for code in "${changed[@]:-}"; do
            case "$code" in _*|'') continue ;; esac
            if [ -f "$ROOT/$code/weldapp.json" ]; then codes+=("$code"); fi
          done
        fi
        unique="$(printf '%s\n' "${codes[@]:-}" | awk 'NF && !seen[$0]++')"
        {
          echo "codes<<EOF"
          echo "$unique"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        if [ -z "$(echo "$unique" | tr -d '[:space:]')" ]; then
          echo "has_apps=false" >> "$GITHUB_OUTPUT"
          echo "No hosted apps to deploy"
        else
          echo "has_apps=true" >> "$GITHUB_OUTPUT"
          printf 'Deploying:\n%s\n' "$unique"
        fi

    - name: Deploy
      if: steps.key.outputs.set == 'true' && steps.apps.outputs.has_apps == 'true'
      shell: bash
      env:
        WELD_API_KEY: ${{ inputs.weld-api-key }}
        WELD_API_URL: ${{ steps.key.outputs.api_url }}
        CODES: ${{ steps.apps.outputs.codes }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        WELD=(node "${GITHUB_WORKSPACE}/packages/sdk/cli/dist/cli.js")
        while IFS= read -r code; do
          [ -z "$code" ] && continue
          dir="${GITHUB_WORKSPACE}/apps/hosted-apps/${code}"
          echo "::group::Deploy ${code}"
          (cd "$dir" && pnpm install --frozen-lockfile=false)
          if ! (cd "$dir" && "${WELD[@]}" app list | grep -Fq "$code"); then
            (cd "$dir" && "${WELD[@]}" app create) || true
          fi
          (cd "$dir" && "${WELD[@]}" app deploy --changelog "deploy ${SHA}")
          (cd "$dir" && "${WELD[@]}" app publish --notes "Official hosted app ${code}") || true
          echo "::endgroup::"
        done <<< "$CODES"
