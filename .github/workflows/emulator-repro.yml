# Temporary: boot an Android emulator, install the WeldBooks production build
# from "Mobile native build" run 24 and capture what happens on launch
# (screenshot + logcat). Then swap in the JS bundle built from the fix branch
# and launch again, for a before/after. Delete once the crash is fixed.
name: Emulator repro (WeldBooks)

on:
  push:
    branches: [claude/weldbooks-emulator-repro]

permissions:
  actions: read
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download WeldBooks AAB from Mobile native build run 24
        uses: actions/download-artifact@v4
        with:
          name: weldbooks-production-android
          run-id: 36101692904
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Convert AAB to a universal APK (debug-signed)
        run: |
          set -euo pipefail
          ls -la build
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          java -jar bundletool.jar build-apks --bundle="$(ls build/*.aab)" --output=app.apks --mode=universal \
            --ks=debug.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -o app.apks universal.apk
          ls -la universal.apk

      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: claude/fix-event-target-shim-crash
          path: src

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Build the WeldBooks JS bundle from the fix branch
        working-directory: src
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsud2VsZHN1aXRlLm9yZyQ
          EXPO_PUBLIC_APP_API_URL: https://app-api.weldsuite.org
          NODE_ENV: production
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter weldbooks-app... --ignore-scripts
          cd apps/mobile/weldbooks-app
          npx expo export:embed --platform android --dev false \
            --entry-file ../../../node_modules/expo-router/entry.js \
            --bundle-output "$GITHUB_WORKSPACE/fixed/index.android.bundle" \
            --assets-dest "$GITHUB_WORKSPACE/fixed/res"

      - name: Build patched APK (same native build, fixed JS)
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          cp universal.apk patched-unsigned.apk
          zip -q -d patched-unsigned.apk 'META-INF/*' 'assets/index.android.bundle'
          mkdir -p stage/assets && cp fixed/index.android.bundle stage/assets/
          (cd stage && zip -q ../patched-unsigned.apk assets/index.android.bundle)
          "$BT/zipalign" -f -p 4 patched-unsigned.apk patched-aligned.apk
          "$BT/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out patched.apk patched-aligned.apk
          ls -la patched.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p out
            adb install -r universal.apk
            adb logcat -c
            adb shell monkey -p com.weldsuite.weldbooks -c android.intent.category.LAUNCHER 1
            sleep 30
            adb exec-out screencap -p > out/screenshot-30s.png
            adb shell pidof com.weldsuite.weldbooks > out/pid.txt || echo "NOT RUNNING" > out/pid.txt
            adb logcat -d -b all > out/logcat.txt
            adb logcat -d -b crash > out/crash.txt
            echo "=== process ===" && cat out/pid.txt
            echo "=== crash buffer ===" && cat out/crash.txt
            echo "=== fatal / JS errors ===" && (grep -n -A60 -E "FATAL EXCEPTION|Fatal signal|ReactNativeJS.*(Error|Exception)|Unhandled JS|Invariant Violation" out/logcat.txt | head -300 || true)
            adb uninstall com.weldsuite.weldbooks
            adb install -r patched.apk
            adb logcat -c
            adb shell monkey -p com.weldsuite.weldbooks -c android.intent.category.LAUNCHER 1
            sleep 45
            adb exec-out screencap -p > out/fixed-screenshot-45s.png
            adb shell pidof com.weldsuite.weldbooks > out/fixed-pid.txt || echo "NOT RUNNING" > out/fixed-pid.txt
            adb logcat -d -b all > out/fixed-logcat.txt
            adb logcat -d -b crash > out/fixed-crash.txt
            echo "=== FIXED process ===" && cat out/fixed-pid.txt
            echo "=== FIXED crash buffer ===" && cat out/fixed-crash.txt

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weldbooks-emulator-capture
          path: out/
