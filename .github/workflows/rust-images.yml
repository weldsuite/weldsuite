name: Rust images

# Publishes the Rust backend's images from develop (and from a deploy/*
# branch, should one exist):
#   ghcr.io/weldsuite/weldsuite:sha-<12 characters of the commit>
#   ghcr.io/weldsuite/weldsuite-sign-portal:sha-<same>
#   ghcr.io/weldsuite/weldsuite-collab-rooms:sha-<same>
# A push to develop also moves the tag `develop` on the images to that build,
# and publishes the weldsuite chart for it as
#   oci://ghcr.io/weldsuite/charts/weldsuite:<chart version>-develop.<run number>
# with the build's tag as its appVersion, so the chart installs these images.
# The EU test cluster follows those charts: every develop build reaches it,
# as every develop push reaches Global's test environment
# (rust/deploy/hetzner/TEST-CLUSTER.md).
# Releases for the EU edition come later from the EU registry (P5 5.4). The
# build is the one "Rust · image and chart" in ci.yml runs, amd64 only (the
# Hetzner servers), and reuses its layer cache.

on:
  workflow_dispatch:
  push:
    branches: [develop, 'deploy/**']
    # What the images are built from (rust/Dockerfile), and the chart that
    # installs them. Other deploy config and docs change neither, so they
    # start no build: a new run cancels the branch's running one, and a
    # settings push must not do that. A chart change rebuilds the images
    # (from the layer cache) so chart and images keep one tag.
    paths:
      - 'rust/**'
      - '!rust/deploy/**'
      - 'rust/deploy/helm/**'
      - 'apps/web/platform/**'
      - 'apps/web/sign-portal/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.github/workflows/rust-images.yml'
      - '!**/*.md'

concurrency:
  group: rust-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Rust · images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/weldsuite/weldsuite:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rust-image
          cache-to: type=gha,mode=max,scope=rust-image
      - name: Build the sign portal's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: sign-portal
          platforms: linux/amd64
          load: true
          tags: ghcr.io/weldsuite/weldsuite-sign-portal:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rust-image
      # WeldDocs' and WeldSheets' rooms (rust/docs/collab-rooms.md), which the
      # EU values turn on (collabRooms).
      - name: Build the collab-rooms image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: collab-rooms
          platforms: linux/amd64
          load: true
          tags: ghcr.io/weldsuite/weldsuite-collab-rooms:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rust-image
      - name: The image runs, without the conformance feature
        run: |
          set -euo pipefail
          version="$(docker run --rm "ghcr.io/weldsuite/weldsuite:${{ steps.tag.outputs.tag }}" version)"
          echo "$version"
          case "$version" in
            *conformance*) echo "the image was built with the test-only conformance feature" >&2; exit 1 ;;
          esac
      - name: Push
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MOVE_DEVELOP: ${{ github.ref == 'refs/heads/develop' }}
        run: |
          set -euo pipefail
          images=(ghcr.io/weldsuite/weldsuite ghcr.io/weldsuite/weldsuite-sign-portal ghcr.io/weldsuite/weldsuite-collab-rooms)
          for image in "${images[@]}"; do
            docker push "$image:$TAG"
            if [ "$MOVE_DEVELOP" = "true" ]; then
              docker tag "$image:$TAG" "$image:develop"
              docker push "$image:develop"
            fi
          done
          {
            echo "### Images"
            echo
            echo "WELDSUITE_IMAGE_TAG: $TAG"
            echo
            for image in "${images[@]}"; do echo "- $image:$TAG"; done
            if [ "$MOVE_DEVELOP" = "true" ]; then
              echo
              echo "\`develop\` now points at this build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The chart of this commit, installing this build's images (appVersion =
      # the tag). The version is a prerelease that rises with every run, so a
      # HelmRelease with `version: ">=0.0.0-0"` on this repository always takes
      # the newest develop build (the EU test cluster, clusters/test).
      - name: Publish the chart
        if: github.ref == 'refs/heads/develop'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          ACTOR: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chart=rust/deploy/helm/weldsuite
          base="$(awk '$1 == "version:" { print $2; exit }' "$chart/Chart.yaml")"
          version="${base}-develop.${GITHUB_RUN_NUMBER}"
          helm package "$chart" --version "$version" --app-version "$TAG" --destination "$RUNNER_TEMP/chart"
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          helm push "$RUNNER_TEMP/chart/weldsuite-$version.tgz" oci://ghcr.io/weldsuite/charts
          {
            echo
            echo "Chart: \`oci://ghcr.io/weldsuite/charts/weldsuite\` $version (appVersion $TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
