name: Rust images

# Publishes the Rust backend's images from a deploy branch (deploy/*) for the
# test clusters that follow one (rust/deploy/hetzner/TEST-CLUSTER.md):
#   ghcr.io/weldsuite/weldsuite:sha-<12 characters of the commit>
#   ghcr.io/weldsuite/weldsuite-sign-portal:sha-<same>
# Releases for the EU edition come later from the EU registry (P5 5.4). The
# build is the one "Rust · image and chart" in ci.yml runs, amd64 only (the
# Hetzner servers), and reuses its layer cache.

on:
  workflow_dispatch:
  push:
    branches: ['deploy/**']
    # Cluster settings and docs only: nothing to build.
    paths-ignore:
      - 'rust/deploy/flux/**'
      - 'rust/deploy/hetzner/**'
      - '**/*.md'

concurrency:
  group: rust-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Rust · images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ghcr.io/weldsuite/weldsuite:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rust-image
          cache-to: type=gha,mode=max,scope=rust-image
      - name: Build the sign portal's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: sign-portal
          platforms: linux/amd64
          load: true
          tags: ghcr.io/weldsuite/weldsuite-sign-portal:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=rust-image
      - name: The image runs, without the conformance feature
        run: |
          set -euo pipefail
          version="$(docker run --rm "ghcr.io/weldsuite/weldsuite:${{ steps.tag.outputs.tag }}" version)"
          echo "$version"
          case "$version" in
            *conformance*) echo "the image was built with the test-only conformance feature" >&2; exit 1 ;;
          esac
      - name: Push
        run: |
          set -euo pipefail
          docker push "ghcr.io/weldsuite/weldsuite:${{ steps.tag.outputs.tag }}"
          docker push "ghcr.io/weldsuite/weldsuite-sign-portal:${{ steps.tag.outputs.tag }}"
          {
            echo "### Images"
            echo
            echo "WELDSUITE_IMAGE_TAG: ${{ steps.tag.outputs.tag }}"
            echo
            echo "- ghcr.io/weldsuite/weldsuite:${{ steps.tag.outputs.tag }}"
            echo "- ghcr.io/weldsuite/weldsuite-sign-portal:${{ steps.tag.outputs.tag }}"
          } >> "$GITHUB_STEP_SUMMARY"
