name: Dispatch deploy

# The ONLY public workflow that uses a secret, and that secret can do exactly
# one thing: trigger a `deploy` event on the private deployment overlay repo.
# It holds no Cloudflare / Neon / Doppler / Expo credentials. All real deploy
# work happens in weldsuite/deployment-overlay (private).
#
# Requires the repo secret OVERLAY_DISPATCH_TOKEN: a fine-grained PAT scoped to
# ONLY weldsuite/deployment-overlay (see that repo's SECRETS.md). Until the
# token exists this workflow no-ops with a clear error and nothing deploys.
#
# Path-gated: frontend / desktop / docs / CI-only pushes never wake the overlay.
# Cloudflare Pages still ships the platform SPA on its own Git connection.
# The overlay then path-filters again so only the workers (or migrations /
# mobile OTA) that actually changed are released.

on:
  push:
    # `main` only. Production is the sole deploy environment, so any dispatch
    # resolves to production — listing `develop` here would mean that creating
    # that branch (it does not currently exist) silently deploys to production.
    branches: [main]
    paths:
      # Workers + the packages they bundle. A change under apps/web or
      # apps/desktop is not listed, so those commits never dispatch.
      - 'apps/workers/**'
      - 'apps/mobile/**'
      - 'apps/tools/migrate-databases/**'
      - 'packages/clients/**'
      - 'packages/core/ai/**'
      - 'packages/core/cloudflare-realtime/**'
      - 'packages/core/cloudflare-registrar/**'
      - 'packages/core/cloudflare-zones/**'
      - 'packages/core/credits/**'
      - 'packages/core/db/**'
      - 'packages/core/email/**'
      - 'packages/core/entity-events/**'
      - 'packages/core/feature-flags/**'
      - 'packages/core/nango/**'
      - 'packages/core/neon-provisioning/**'
      - 'packages/core/notifications/**'
      - 'packages/core/permissions/**'
      - 'packages/core/realtime/**'
      - 'packages/core/social-publishing/**'
      - 'packages/core/transactional-email/**'
      - 'packages/core/workflow-integrations/**'
      - 'packages/design/mobile-ui/**'
      - 'packages/config/typescript-config/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.npmrc'
      - '.github/actions/**'

# No repo write access needed; the PAT (not GITHUB_TOKEN) does the dispatch.
permissions: {}

concurrency:
  group: dispatch-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch to deployment overlay
    runs-on: ubuntu-latest
    steps:
      - name: Trigger overlay deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.OVERLAY_DISPATCH_TOKEN }}
          repository: weldsuite/deployment-overlay
          event-type: deploy
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "base_sha": "${{ github.event.before }}",
              "ref": "${{ github.ref_name }}"
            }
