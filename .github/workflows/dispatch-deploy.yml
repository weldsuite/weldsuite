name: Dispatch deploy

# The ONLY public workflow that uses a secret, and that secret can do exactly
# one thing: trigger a `deploy` event on the private deployment overlay repo.
# It holds no Cloudflare / Neon / Doppler / Expo credentials. All real deploy
# work happens in weldsuite/deployment-overlay (private).
#
# Requires the repo secret OVERLAY_DISPATCH_TOKEN: a fine-grained PAT scoped to
# ONLY weldsuite/deployment-overlay (see that repo's SECRETS.md). Until the
# token exists this workflow no-ops with a clear error and nothing deploys.
#
# Path filter: the overlay deploys workers, runs migrations, publishes the
# widget SDK, and path-gates mobile OTA. Frontend (platform SPA, sites,
# helpcenter, portals, widget Pages project) is deployed by Cloudflare Pages
# on its own GitHub App connection. Dispatching the overlay on a CSS tweak
# still redeploys every worker, so this workflow only fires when a path the
# overlay actually ships has changed.
#
# Intentionally NOT Cloudflare Workers Builds: wrangler.toml in this repo is
# a placeholder (REPLACE_WITH_*), real bindings live in the overlay, and
# Neon migrations must run before any worker that consumes the new schema.
# Cloudflare can own the static SPA; GitHub must keep orchestrating workers.
#
# `workflow_dispatch` bypasses the path filter for a manual full deploy.

on:
  workflow_dispatch:
  push:
    # `main` only. Production is the sole deploy environment, so any dispatch
    # resolves to production — listing `develop` here would mean that creating
    # that branch (it does not currently exist) silently deploys to production.
    branches: [main]
    paths:
      # Workers + the packages they import. A lockfile bump can change worker
      # resolution even when no worker source moved, so the root lockfile and
      # workspace config stay on the list (conservative: a frontend-only dep
      # bump still dispatches).
      - 'apps/workers/**'
      - 'apps/tools/migrate-databases/**'
      - 'packages/core/**'
      - 'packages/clients/**'
      - 'packages/sdk/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.npmrc'
      # Mobile OTA is path-gated inside the overlay, but the overlay never
      # sees the push unless we dispatch.
      - 'apps/mobile/**'

# No repo write access needed; the PAT (not GITHUB_TOKEN) does the dispatch.
permissions: {}

concurrency:
  group: dispatch-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch to deployment overlay
    runs-on: ubuntu-latest
    steps:
      - name: Trigger overlay deploy
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.OVERLAY_DISPATCH_TOKEN }}
          repository: weldsuite/deployment-overlay
          event-type: deploy
          client-payload: |
            {
              "sha": "${{ github.sha }}",
              "base_sha": "${{ github.event.before }}",
              "ref": "${{ github.ref_name }}"
            }
