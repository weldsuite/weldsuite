name: Hand-off

# ADR OPS-018 (docs/plans/main-only-private-deploys.md): when CI passes on a
# merge to main, hand the commit to the private repo
# weldsuite/weldsuite-deploy, whose deploy-test workflow checks it again and
# deploys it to test. This log names only the commit. Production is never
# handed off: it goes out through Promote in the private repo.
#
# Runs while the repository variable DEPLOYS_PRIVATE is "true"; unset it to
# stop handing commits over (test then stops deploying).
#
# The weldsuite-deploy-bot App (Actions read/write, installed on
# weldsuite-deploy only) signs in here. Its client id and private key sit on
# the environment `handoff`, which only main can use.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  handoff:
    name: Hand off to the private deploy
    # A pull request from a fork also completes CI, and workflow_run runs with
    # this repo's environments, so only a successful push to main in this
    # repo goes on (a fork's branch can be called main too).
    if: >-
      vars.DEPLOYS_PRIVATE == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # deployment: false: the job still gets the environment's secrets and
    # branch rule, but GitHub writes no deployment record for it, so the
    # public repo lists no deployments (TASK-1399).
    environment:
      name: handoff
      deployment: false
    steps:
      - name: Token for weldsuite-deploy
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPLOY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_BOT_PRIVATE_KEY }}
          owner: weldsuite
          repositories: weldsuite-deploy
          permission-actions: write

      - name: Hand off ${{ github.event.workflow_run.head_sha }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # The REST dispatch with an explicit ref: `gh workflow run` looks up the
        # repo's default branch over GraphQL first, which the App (Actions only)
        # may not read.
        run: |
          set -euo pipefail
          gh api -X POST repos/weldsuite/weldsuite-deploy/actions/workflows/deploy-test.yml/dispatches \
            -f ref=main -f "inputs[sha]=$SHA" > /dev/null
          echo "Handed $SHA to the test deploy."
