name: SonarQube

# Static analysis + coverage upload to SonarQube Cloud (sonarcloud.io).
# Project configuration lives in sonar-project.properties at the repo root.
#
# NON-BLOCKING for now. This job is deliberately NOT a required status check in
# branch protection, so the initial backlog of issues can be worked down without
# freezing merges — the same way lint and platform type-check were introduced.
# To make it block: add "SonarQube" to the required checks in branch protection
# and drop the `continue-on-error` on the quality-gate step below.
#
# Setup this workflow depends on (one-time, in SonarQube Cloud):
#   1. Import weldsuite/weldsuite into the "weldsuite" organization.
#   2. Administration → Analysis Method → turn OFF "Automatic Analysis".
#      CI-based analysis is rejected while Automatic Analysis is on.
#   3. Generate a token and store it as the SONAR_TOKEN repository secret.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Taint analysis is the long pole: the run that OOM'd was 29 minutes in and
    # only 56% of the way through it. Give a completing scan room rather than
    # trading an out-of-memory for a timeout.
    timeout-minutes: 60
    # Forked PRs cannot read SONAR_TOKEN, so the scan would fail on a secret
    # that is structurally unavailable. Skip rather than fail red on every
    # outside contribution.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads git history to attribute issues to authors and to work
          # out which code is "new". A shallow clone breaks both.
          fetch-depth: 0

      - uses: ./.github/actions/setup-monorepo

      # Coverage is generated per workspace rather than via `turbo test` so a
      # failing test in one workspace still lets the others report. The unit
      # tests themselves are gated by ci.yml — this job is about coverage data,
      # so it must not go red when a test fails.
      - name: Coverage · app-api
        continue-on-error: true
        working-directory: apps/workers/app-api
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: pnpm test:coverage

      - name: Coverage · personal-api
        continue-on-error: true
        working-directory: apps/workers/personal-api
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: pnpm test:coverage

      - name: Coverage · platform
        continue-on-error: true
        working-directory: apps/web/platform
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: pnpm test:coverage

      # Module workers and domain packages report coverage one by one as they
      # get a `test:coverage` script. A workspace that is not listed here (and in
      # sonar.javascript.lcov.reportPaths) reads as 0% covered to Sonar, however
      # well it is tested.
      - name: Coverage · chat-domain
        continue-on-error: true
        working-directory: packages/domains/chat
        run: pnpm test:coverage

      - name: Coverage · chat-api
        continue-on-error: true
        working-directory: apps/workers/chat-api
        run: pnpm test:coverage

      - name: Coverage · meet-api
        continue-on-error: true
        working-directory: apps/workers/meet-api
        run: pnpm test:coverage

      # Sonar's TypeScript programs come from these generated per-workspace
      # configs, not the real tsconfig.json files: they pin the options that
      # otherwise make the bridge cache every shared file several times over.
      # See sonar.typescript.tsconfigPaths in sonar-project.properties. Without
      # this step the scan falls back to the unbounded root tsconfig.json.
      - name: Generate Sonar tsconfigs
        run: node scripts/sonar-tsconfigs.mjs

      # The bridge's own log only reaches the scanner when the JS/TS sensor
      # finishes, so an out-of-memory crash says nothing about how far it got
      # or how big it was. Sample both processes from outside instead, every
      # 15 s, and print it after the scan whatever its outcome.
      - name: Start memory sampler
        run: |
          cat > "$RUNNER_TEMP/sample-memory.sh" <<'EOF'
          while true; do
            echo "$(date -u +%H:%M:%S) available=$(free -m | awk '/^Mem:/ {print $7}')MB$(ps -C node,java -o rss=,comm= | awk '{printf " %s=%dMB", $2, $1 / 1024}')"
            sleep 15
          done
          EOF
          nohup bash "$RUNNER_TEMP/sample-memory.sh" > "$RUNNER_TEMP/sonar-memory.log" 2>&1 &

      # Two heaps share this runner: the scanner JVM, and the "bridge" Node
      # process that analyses JS/TS. Both need a deliberate size, and they have
      # to be sized against each other.
      #
      # The bridge's cap (sonar.javascript.node.maxspace, 11 GB) is set in
      # sonar-project.properties. What decides whether it fits is how much the
      # bridge holds, not the cap: see the AST cache notes there.
      #
      # The JVM's hungry phase is JsSecuritySensorV2, the JS/TS taint analysis,
      # which holds a whole-program graph and died with "OutOfMemoryError: Java
      # heap space" partway through the file set at -Xmx2g. It runs after the
      # JS/TS sensor, but the bridge process stays up until the scan ends and
      # keeps its AST cache, so the two do share the runner's ~16 GB. Keep the
      # JVM capped: an uncapped Java 21 takes a quarter of RAM and turns a clean
      # Java OOM into an OS-level kill.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_JAVA_OPTS: -Xmx4g

      - name: Memory during the scan
        if: always()
        run: |
          log="$RUNNER_TEMP/sonar-memory.log"
          [ -f "$log" ] || exit 0
          cat "$log"
          echo "Peak RSS:"
          grep -oE '(node|java)=[0-9]+' "$log" | awk -F= '$2 > peak[$1] {peak[$1] = $2} END {for (p in peak) printf "  %s %d MB\n", p, peak[p]}'

      # Reports the gate result without failing the job. Remove
      # continue-on-error (and add this job to branch protection) to start
      # blocking on the gate.
      - name: Quality Gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
