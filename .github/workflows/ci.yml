name: CI

# Linux jobs run on the Hetzner self-hosted pool (labels self-hosted/linux/x64).
# Cap org runner-group concurrency at 2 — the box is 16 GB and two tsc heaps
# already fill it. macOS/Windows desktop packaging stays on GitHub-hosted.
#
# Job names are reused verbatim as required status checks in branch
# protection: "Build", "Lint", "Type Check · app-api",
# "Type Check · platform", "Unit · app-api", "Unit · platform". Renaming one
# without updating branch protection in the same change leaves a required check
# permanently pending and blocks every PR.
#
# Every job in this file now blocks. There are no informational jobs left.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # Lint and platform type-check were informational while pre-existing failures
  # were worked down (ESLint v9 migration in @weldsuite/db; the platform type
  # errors from the schema/refactor work). Both are clean now, so both block.
  #
  # Note on lint: only the three design packages run `--max-warnings 0`, so this
  # job blocks on ERRORS. Warnings elsewhere still pass — notably the remaining
  # react-hooks/exhaustive-deps ones in the mobile apps.
  #
  # The job NAMES are reused verbatim as required status checks in branch
  # protection, so don't rename them without updating that in the same change:
  # a renamed required check sits pending forever and blocks every PR.
  # ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Lint
        run: pnpm lint

  type-check-api:
    name: Type Check · app-api
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    # app-api's schema is clean — this one blocks.
    env:
      # ~565 source files against drizzle-orm's deep generics blow past Node's
      # default ~2 GB heap and tsc OOMs (exit 134) before it can report.
      # 5 GB leaves room for a second concurrent runner on the 16 GB Hetzner box.
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check app-api
        working-directory: apps/workers/app-api
        run: pnpm type-check

  type-check-platform:
    name: Type Check · platform
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    # Was informational while ~1300 pre-existing errors were worked down.
    # `tsc --noEmit` is clean as of this change, so it blocks.
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check platform
        working-directory: apps/web/platform
        run: pnpm type-check

  # ────────────────────────────────────────────
  # Desktop shell. Type-check + bundle only — NOT packaging: electron-builder
  # needs signing certs and platform-native runners, and desktop releases ship
  # from the overlay's release-desktop.yml, not from a merge.
  #
  # Blocking, unlike the platform's type-check: apps/desktop is small and
  # clean, and its main/preload code is the one place where a type error means
  # a shell that boots and then misbehaves at runtime rather than a build that
  # fails loudly.
  # ────────────────────────────────────────────
  desktop:
    name: Type Check + Build · desktop
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check desktop
        working-directory: apps/desktop
        run: pnpm type-check
      # electron-vite build: proves main/preload/renderer all bundle. Runs on
      # Linux even though we ship mac/win — the bundle step is platform-neutral
      # (esbuild + rollup); only electron-builder's packaging is not.
      - name: Build desktop bundles
        working-directory: apps/desktop
        run: pnpm build

  # ────────────────────────────────────────────
  # Unit + service tests — these DO block PRs.
  # ────────────────────────────────────────────
  unit-api:
    name: Unit · app-api
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/workers/app-api
        run: pnpm test

  unit-platform:
    name: Unit · platform
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/web/platform
        run: pnpm test

  # ────────────────────────────────────────────
  # Full-graph build. Blocking as of #66: verified green twice from a
  # from-scratch clone (6m51s and 7m34s). The secret-free run turned out to be
  # fine — turbo build is env-independent for types, and no app build actually
  # needs a VITE_*/EXPO_* value to compile.
  #
  # NOTE: this is no longer a COLD build. Since the warm-workspace change (see
  # .github/actions/setup-monorepo/action.yml) the runner keeps node_modules
  # and .turbo between jobs, so unchanged packages come back from turbo's
  # cache instead of being rebuilt. That is still a real signal — turbo's cache
  # is content-addressed, so a hit means these exact inputs built successfully
  # before, and anything you actually changed is always rebuilt.
  #
  # What is NOT covered any more is the clean-clone bootstrap check: that a
  # from-nothing `pnpm install` + `pnpm build` works, which is what catches a
  # package that only builds thanks to a leftover artifact or an undeclared
  # dependency. If that signal is wanted back, add a scheduled job that checks
  # out with `clean: true` into its own `path:` so it does not cold-wipe the
  # shared warm workspace out from under the other jobs.
  #
  # The 35min timeout is kept as headroom for the first run on a cold runner
  # (new box, or after the workspace is wiped by hand).
  # ────────────────────────────────────────────
  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
      - uses: ./.github/actions/setup-monorepo
      - name: Build
        run: pnpm build
