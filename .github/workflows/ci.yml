name: CI

# Linux jobs run on GitHub-hosted ubuntu-latest (free/unlimited on this
# public repo). Desktop packaging stays on macos-latest / windows-latest
# in release-desktop.yml.
#
# Job names are reused verbatim as required status checks in branch
# protection: "Build", "Lint", "Type Check · app-api",
# "Type Check · platform", "Unit · app-api", "Unit · platform". Renaming one
# without updating branch protection in the same change leaves a required check
# permanently pending and blocks every PR.
#
# Every job in this file now blocks. There are no informational jobs left.
#
# On a pull request most jobs run only when the PR touches what they check:
# the "changes" job maps the changed files onto areas (api, platform, desktop,
# packages, rust, image, crossbuild, deploy, conformance, workers; see
# .github/scripts/ci-changes.mjs) and
# each job skips when its area is "false". A job skipped by its `if:` counts as
# passed for branch protection, and the aggregating jobs accept "skipped" too.
# Never gate this workflow with `on.pull_request.paths`: a workflow that does
# not start leaves its required checks pending forever.
# Gated jobs run when the area is anything but "false", so if "changes" itself
# fails they all run. Pushes to main run everything.
#
# Caches are saved by pushes to main only; a pull request restores them and
# saves nothing (setup-monorepo, `save-if` on rust-cache, `cache-to` on the
# image builds). The Actions cache holds 10 GB, and pull requests saving their
# own copies evicted main's, so most jobs started cold.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels its running CI. On main a run that has
# started always finishes, and the newest push waits for it (GitHub keeps one
# pending run per group and drops older pending ones), so main never runs two
# at a time. A main run takes about an hour: when every merge cancelled the
# last, merges less than an hour apart left no commit with a passing CI, and
# that is what the test deploy (handoff.yml) and EU production's pin
# (ADR OPS-020, eu-production-watch.yml) wait for.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.areas.outputs.api }}
      platform: ${{ steps.areas.outputs.platform }}
      desktop: ${{ steps.areas.outputs.desktop }}
      packages: ${{ steps.areas.outputs.packages }}
      rust: ${{ steps.areas.outputs.rust }}
      image: ${{ steps.areas.outputs.image }}
      crossbuild: ${{ steps.areas.outputs.crossbuild }}
      deploy: ${{ steps.areas.outputs.deploy }}
      conformance: ${{ steps.areas.outputs.conformance }}
      workers: ${{ steps.areas.outputs.workers }}
    steps:
      # Full history without file contents, so the diff against the base
      # branch works and the checkout stays small.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Areas this change touches
        id: areas
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/ci-changes.mjs --base "origin/${{ github.base_ref }}"
          else
            node .github/scripts/ci-changes.mjs --all
          fi

  # ────────────────────────────────────────────
  # Lint and platform type-check were informational while pre-existing failures
  # were worked down (ESLint v9 migration in @weldsuite/db; the platform type
  # errors from the schema/refactor work). Both are clean now, so both block.
  #
  # Note on lint: only the three design packages run `--max-warnings 0`, so this
  # job blocks on ERRORS. Warnings elsewhere still pass — notably the remaining
  # react-hooks/exhaustive-deps ones in the mobile apps.
  #
  # The job NAMES are reused verbatim as required status checks in branch
  # protection, so don't rename them without updating that in the same change:
  # a renamed required check sits pending forever and blocks every PR.
  # ────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Check for mojibake
        run: pnpm check:mojibake
      - name: Lint
        run: pnpm lint
      # rust/catalogs is generated from the TypeScript catalogs (entity events,
      # permissions, flags, API modules, origins). Rerun `pnpm rust:catalogs`.
      - name: Rust catalogs are current
        run: pnpm rust:catalogs --check
      # rust/catalogs/emails is generated from the system email templates
      # (@weldsuite/emails) and the email strings. Rerun `pnpm rust:emails`.
      - name: Rust email templates are current
        run: pnpm rust:emails --check
      # rust/crates/subscribers/tests/fixtures: what the TypeScript hub consumers
      # do with the parity batches. Rerun `pnpm rust:subscriber-fixtures`.
      - name: Rust subscriber fixtures are current
        run: pnpm rust:subscriber-fixtures --check
      # rust/crates/payroll-domain: the rule tables (data/) and the vectors
      # (tests/fixtures/) the TypeScript payroll engines produce. Rerun
      # `pnpm rust:payroll-fixtures`.
      - name: Rust payroll fixtures are current
        run: pnpm rust:payroll-fixtures --check
      # rust/crates/mail-inbound/tests/fixtures: what mail-inbound-worker does
      # with the parity messages. Rerun `pnpm rust:mail-inbound-fixtures`.
      - name: Rust mail-inbound fixtures are current
        run: pnpm rust:mail-inbound-fixtures --check

  # The Rust backend (rust/, ADR API-014). The toolchain comes from
  # rust/rust-toolchain.toml, so CI and local builds use the same compiler.
  # Not a required check yet: add "Rust" to branch protection once the
  # workspace holds real code.
  # ── Rust backend (rust/, ADR API-014) ─────────────────────────────────────
  # Three jobs and one aggregator, as OPS-007 does it: "Rust" is the check to
  # require in branch protection; the jobs under it can change freely.
  rust-checks:
    name: Rust · checks
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The integration tests run against these (started below): a scratch
      # database, the master + tenant schema built from the journaled
      # migrations, Valkey, NATS JetStream and an S3 store (RustFS).
      WELDSUITE_TEST_DATABASE_URL: postgres://weldsuite:weldsuite@127.0.0.1:5432/scratch
      WELDSUITE_TEST_MASTER_URL: postgres://weldsuite:weldsuite@127.0.0.1:5432/master
      WELDSUITE_TEST_TENANT_URL: postgres://weldsuite:weldsuite@127.0.0.1:5432/tenant
      WELDSUITE_TEST_VALKEY_URL: redis://127.0.0.1:6379
      WELDSUITE_TEST_NATS_URL: nats://127.0.0.1:4222
      WELDSUITE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      WELDSUITE_TEST_S3_ACCESS_KEY_ID: weldsuite
      WELDSUITE_TEST_S3_SECRET_ACCESS_KEY: weldsuite-ci
      WELDSUITE_TEST_RESTATE_INGRESS: http://127.0.0.1:8080
      WELDSUITE_TEST_RESTATE_ADMIN: http://127.0.0.1:9070
      # How the Restate container reaches the test process on the runner.
      WELDSUITE_TEST_RESTATE_ENDPOINT_HOST: host.docker.internal
      WELDSUITE_TEST_SMTP_URL: smtp://127.0.0.1:1025
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (pgvector), Valkey, NATS, RustFS (S3), Restate and Mailpit (SMTP)
        run: |
          set -euo pipefail
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=weldsuite -e POSTGRES_PASSWORD=weldsuite -e POSTGRES_DB=scratch pgvector/pgvector:pg17
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8-alpine
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          docker run -d --name s3 -p 9000:9000 -e RUSTFS_ACCESS_KEY=weldsuite -e RUSTFS_SECRET_KEY=weldsuite-ci rustfs/rustfs:1.0.1
          docker run -d --name restate -p 8080:8080 -p 9070:9070 --add-host=host.docker.internal:host-gateway docker.io/restatedev/restate:1.7.14
          docker run -d --name mail -p 1025:1025 axllent/mailpit:v1.31.6
          for _ in $(seq 1 60); do docker exec pg pg_isready -U weldsuite >/dev/null 2>&1 && break; sleep 1; done
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/health >/dev/null 2>&1 && break; sleep 1; done
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:9070/health >/dev/null 2>&1 && break; sleep 1; done
          sleep 2
          docker exec pg psql -U weldsuite -d scratch -c "create database master" -c "create database tenant"
      - uses: ./.github/actions/setup-monorepo
      - name: Build master and tenant from the migrations
        run: pnpm exec tsx scripts/rust-test-db.ts --master "$WELDSUITE_TEST_MASTER_URL" --tenant "$WELDSUITE_TEST_TENANT_URL"
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Format
        working-directory: rust
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: rust
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p weldsuite --features conformance --all-targets --locked -- -D warnings
      - name: Test
        working-directory: rust
        run: cargo test --workspace --locked
      # The realtime gateway against the platform's own WebSocket clients
      # (@weldsuite/realtime), two pods on one Valkey.
      - name: Realtime protocol parity
        run: |
          cargo build -p weldsuite --locked --manifest-path rust/Cargo.toml
          pnpm exec tsx scripts/rust-realtime-parity.ts --bin rust/target/debug/weldsuite \
            --pg postgres://weldsuite:weldsuite@127.0.0.1:5432/scratch --valkey "$WELDSUITE_TEST_VALKEY_URL"
      - name: Licences, advisories and sources
        working-directory: rust
        run: cargo deny check

  # The amd64 image with the platform SPA, the
  # sign portal's image, and the Helm chart, deployed into kind with Postgres,
  # Valkey and NATS: the full authenticated pipeline, the SPA and the portal
  # (rust/deploy/kind/smoke-test.sh). The build context is the repo root
  # (rust/Dockerfile.dockerignore keeps it small). The arm64 cross-build is
  # its own job (rust-image-arm64), so the two no longer run one after the
  # other.
  # On a PR it runs only when a file the image alone reads changes (the
  # "image" area, IMAGE_PATHS in ci-changes.mjs); every push to main builds it.
  # A push to main builds the `release` profile, the one that ships (thin LTO,
  # one codegen unit: 20 to 40 minutes when the Rust layer misses the cache,
  # which it does whenever main's Rust code moved). A PR builds `ci-image`
  # (rust/Cargo.toml: no LTO, 16 codegen units, opt-level 1) when its backend
  # would miss the cache anyway: its image only has to deploy and pass the
  # smoke test, and a break that only the release settings show turns main
  # red, not the PR. See "Pick the Cargo profile".
  rust-image:
    name: Rust · image and chart
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      # Main's newest green CI run, for "Pick the Cargo profile".
      actions: read
    steps:
      # A build that misses the layer cache (a changed Cargo.lock or
      # pnpm-lock.yaml) compiles every crate and installs the SPA's
      # node_modules from scratch, for four images; that outgrows the
      # runner's free disk. Toolchains this job never uses make room.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      # The backend layer's cache key includes CARGO_PROFILE, and only pushes
      # to main save layers, built `release`. A PR whose backend inputs match
      # main's newest green CI run builds `release` too and takes that layer
      # from the cache in minutes (a chart-only change, say). Any other PR
      # would compile the backend anyway, and builds the cheaper `ci-image`.
      - name: Pick the Cargo profile
        id: profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          profile=release
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            profile=ci-image
            # What rust/Dockerfile's `build` stage copies, and the file itself.
            inputs=(rust/Dockerfile rust/Dockerfile.dockerignore rust/rust-toolchain.toml rust/Cargo.toml
              rust/Cargo.lock rust/clippy.toml rust/.cargo rust/catalogs rust/crates rust/modules rust/bins
              packages/core/db/drizzle)
            sha="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)"
            if [ -n "$sha" ] && git fetch --quiet --depth=1 origin "$sha" && git diff --quiet "$sha" HEAD -- "${inputs[@]}"; then
              profile=release
              echo "The backend's inputs match main's ${sha::12}, whose release layer is cached."
            fi
          fi
          echo "Cargo profile: $profile"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      # Its post step, which removes the builder and its gigabytes of layers,
      # took two to three minutes; the runner is thrown away anyway.
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          load: true
          tags: weldsuite:dev
          build-args: CARGO_PROFILE=${{ steps.profile.outputs.profile }}
          cache-from: type=gha,scope=rust-image
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=rust-image' || '' }}
      - name: Build the sign portal's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: sign-portal
          load: true
          tags: weldsuite-sign-portal:dev
          cache-from: type=gha,scope=rust-image
      # The WeldForms respondent portal's Node container (ADR FORMS-002).
      - name: Build the forms portal's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: forms-portal
          load: true
          tags: weldsuite-forms-portal:dev
          cache-from: type=gha,scope=rust-image
      # The staff admin console's Node container (ADR FE-018).
      - name: Build the admin console's image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: admin
          load: true
          tags: weldsuite-admin:dev
          cache-from: type=gha,scope=rust-image
      # WeldDocs', WeldSheets' and WeldBoard's rooms (rust/docs/collab-rooms.md).
      - name: Build the collab-rooms image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: collab-rooms
          load: true
          tags: weldsuite-collab-rooms:dev
          cache-from: type=gha,scope=rust-image
      # Haraka, WeldMail's MX on Kubernetes (MAIL-010).
      - name: Build the MX image
        uses: docker/build-push-action@v6
        with:
          context: rust/deploy/haraka
          load: true
          tags: weldsuite-haraka:dev
          cache-from: type=gha,scope=rust-haraka
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=rust-haraka' || '' }}
      # WeldAgent's sandbox pods (ADR AI-012 phase 5): the agent's own tests,
      # then the image, which must have what the agent drives.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The sandbox agent's tests
        working-directory: rust/deploy/sandbox/agent
        run: node --test test/*.test.mjs
      - name: Build the sandbox image
        uses: docker/build-push-action@v6
        with:
          context: rust/deploy/sandbox
          load: true
          tags: weldsuite-sandbox:dev
          cache-from: type=gha,scope=rust-sandbox
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=rust-sandbox' || '' }}
      - name: The sandbox image has its tools
        run: |
          set -euo pipefail
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/sandbox --user 1000:1000 weldsuite-sandbox:dev \
            sh -c 'for tool in node python3 chromium Xvfb openbox xdotool import pdftotext git curl; do command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }; done; python3 -c "import numpy, pandas, matplotlib"'
      - name: The image runs, without the conformance feature
        run: |
          set -euo pipefail
          version="$(docker run --rm weldsuite:dev version)"
          echo "$version"
          case "$version" in
            *conformance*) echo "the image was built with the test-only conformance feature" >&2; exit 1 ;;
          esac
      - uses: azure/setup-helm@v4
      - name: Lint the chart
        run: |
          helm lint rust/deploy/helm/weldsuite -f rust/deploy/helm/weldsuite/ci/test-values.yaml
          helm template smoke rust/deploy/helm/weldsuite -f rust/deploy/helm/weldsuite/ci/test-values.yaml > /dev/null
      - uses: ./.github/actions/setup-monorepo
      - uses: helm/kind-action@v1
        with:
          cluster_name: weldsuite-smoke
      - name: Deploy into kind and run the pipeline
        env:
          KIND_CLUSTER: weldsuite-smoke
          KEEP_CLUSTER: "1"
        run: rust/deploy/kind/smoke-test.sh

  # The backend cross-compiled for linux/arm64 (the image's `build` stage: the
  # C dependencies through the cross toolchain, the target's linker). The rest
  # of the image is JavaScript built on the build machine's platform, the same
  # for both architectures, so rust-image covers it. It ran after the amd64
  # build in rust-image, and the two release builds made that job an hour.
  # On a PR it runs only when the Dockerfile, the toolchain or the Cargo
  # manifest or lockfile changes (the "crossbuild" area), with the PR profile;
  # every push to main builds `release`.
  rust-image-arm64:
    name: Rust · image arm64
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.crossbuild != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false
      - name: Cross-build the backend for arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          target: build
          platforms: linux/arm64
          outputs: type=cacheonly
          build-args: CARGO_PROFILE=${{ github.event_name == 'pull_request' && 'ci-image' || 'release' }}
          cache-from: type=gha,scope=rust-image-arm64
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=rust-image-arm64' || '' }}

  # The EU deploy configuration (rust/deploy): OpenTofu for Hetzner validated,
  # every Flux layer built and schema-checked, every pinned chart rendered with
  # its values. No cloud account involved. On a PR it runs when rust/deploy/
  # changes (the "deploy" area); nothing else it reads lives outside it.
  rust-deploy:
    name: Rust · deploy config
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.deploy != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      - name: Validate
        run: rust/deploy/validate.sh

  # Phase P2: the worker tests of every ported route run against a conformance
  # build of the Rust server and are compared with the Hono app (bodies,
  # schemas, side effects). On a PR only the suites its changes touch (a change
  # inside one rust/modules crate runs that module's suites, see selectSuites
  # in scripts/rust-conformance.ts); on main all of them. The route coverage
  # of the changed workers runs on its own runner (rust-conformance-coverage).
  # Every suite in one job outgrew 45 minutes once wave 3 added its modules;
  # the suites are dealt over eight runners by their number of test files
  # (about 8 seconds each), so the shards finish within a minute of each
  # other: 159 suites are about 86 minutes, 11 per shard plus the build.
  # "Rust · conformance" stays
  # the check that fails unless every shard succeeded. Keep --shard's n equal
  # to the matrix length.
  rust-conformance-shards:
    name: Rust · conformance (${{ matrix.shard }}/8)
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.conformance != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Install the pinned toolchain
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: conformance
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Conformance suites
        run: |
          set -euo pipefail
          shard="${{ matrix.shard }}/8"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm rust:conformance --changed "origin/${{ github.base_ref }}" --shard "$shard"
          else
            pnpm rust:conformance --shard "$shard"
          fi
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-${{ matrix.shard }}
          path: rust/target/conformance/**/*.md
          if-no-files-found: ignore

  # Which routes the changed workers' own tests reach (record-only, no Rust):
  # a ported module fails when a route goes unreached. It ran after the first
  # shard's suites until wave 3's five workers took it past 45 minutes.
  rust-conformance-coverage:
    name: Rust · conformance coverage
    needs: [changes]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.workers != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-monorepo
      - name: Route coverage of the changed workers
        run: pnpm rust:conformance --coverage-changed "origin/${{ github.base_ref }}"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-coverage-report
          path: rust/target/conformance/**/*.md
          if-no-files-found: ignore

  rust-conformance:
    name: Rust · conformance
    needs: [rust-conformance-shards, rust-conformance-coverage]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # "skipped": the change touches nothing they check (ci-changes.mjs).
      - name: Require every conformance shard, and coverage on a PR
        run: |
          set -euo pipefail
          shards="${{ needs.rust-conformance-shards.result }}"
          coverage="${{ needs.rust-conformance-coverage.result }}"
          echo "shards: $shards, coverage: $coverage"
          test "$shards" = "success" || test "$shards" = "skipped"
          test "$coverage" = "success" || test "$coverage" = "skipped"

  rust-all:
    name: Rust
    needs: [rust-checks, rust-image, rust-image-arm64, rust-deploy, rust-conformance]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # "skipped": the change touches nothing they check (ci-changes.mjs).
      - name: Require every Rust job
        run: |
          set -euo pipefail
          ok() { echo "$1: $2"; test "$2" = "success" || test "$2" = "skipped"; }
          ok "checks" "${{ needs.rust-checks.result }}"
          ok "image and chart" "${{ needs.rust-image.result }}"
          ok "image arm64" "${{ needs.rust-image-arm64.result }}"
          ok "deploy config" "${{ needs.rust-deploy.result }}"
          ok "conformance" "${{ needs.rust-conformance.result }}"

  # app-api plus every module worker and domain is ~17 minutes of tsc.
  # Four-wide on one runner is already at that machine's CPU limit (~5 min).
  # Shards are separate runners, still four-wide each. "Type Check · app-api"
  # stays the required check and fails unless every shard succeeded.
  # Keep --shards equal to the matrix length.
  type-check-api-shards:
    name: Type Check · app-api (${{ matrix.shard }}/4)
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # app-api's drizzle generics blow past Node's default heap. The same
      # ceiling applies to whichever shard draws that package.
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Restore TypeScript incremental cache
        id: tsc-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            apps/workers/*/tsconfig.tsbuildinfo
            packages/domains/*/tsconfig.tsbuildinfo
            packages/core/api-modules/tsconfig.tsbuildinfo
            packages/core/worker-*/tsconfig.tsbuildinfo
          # The Drizzle schema is in the key: an incremental re-check of
          # `typeof schema` consumers against a .tsbuildinfo built for an older
          # schema reports TS2589 ("excessively deep") in packages/core/db/src/lib
          # that a clean check does not (see 56f93e0af). A schema change starts
          # from a clean build instead.
          key: tsc-api-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/core/db/src/schema/**') }}-${{ github.sha }}
          restore-keys: |
            tsc-api-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/core/db/src/schema/**') }}-
      - name: Type-check app-api packages
        run: |
          set -euo pipefail
          args=(--workspace-concurrency=4)
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            args+=(--filter "./$dir")
          done < <(node .github/scripts/typecheck-targets.mjs --shard ${{ matrix.shard }} --shards 4)
          if [ "${#args[@]}" -eq 1 ]; then
            echo "shard is empty"
            exit 0
          fi
          # --incremental writes tsconfig.tsbuildinfo (gitignored). The cache
          # above restores it, so a later run rechecks changed files.
          pnpm "${args[@]}" exec tsc --noEmit --incremental --pretty false
      # Pushes to main only, like every cache in this file.
      - name: Save TypeScript incremental cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            apps/workers/*/tsconfig.tsbuildinfo
            packages/domains/*/tsconfig.tsbuildinfo
            packages/core/api-modules/tsconfig.tsbuildinfo
            packages/core/worker-*/tsconfig.tsbuildinfo
          key: ${{ steps.tsc-cache.outputs.cache-primary-key }}

  type-check-api:
    name: Type Check · app-api
    needs: [type-check-api-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require app-api package type-checks
        run: |
          set -euo pipefail
          result="${{ needs.type-check-api-shards.result }}"
          echo "shards: $result"
          test "$result" = "success" || test "$result" = "skipped"

  type-check-platform:
    name: Type Check · platform
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # A cold platform check (no tsbuildinfo cache, e.g. after a lockfile
      # change) compiles the Drizzle schema too and needed close to 9 GB by
      # November 2026; 8 GB ran out of memory. ubuntu-latest runners have
      # 16 GB for this public repo.
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      # Platform tsconfig already sets incremental. Persist the build info
      # so a later run rechecks changed files instead of the whole app.
      - name: Restore platform TypeScript cache
        id: platform-tsc-cache
        uses: actions/cache/restore@v4
        with:
          path: apps/web/platform/tsconfig.tsbuildinfo
          key: platform-tsc-${{ runner.os }}-${{ hashFiles('apps/web/platform/tsconfig.json', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            platform-tsc-${{ runner.os }}-${{ hashFiles('apps/web/platform/tsconfig.json', 'pnpm-lock.yaml') }}-
      - name: Type-check platform
        working-directory: apps/web/platform
        run: pnpm type-check
      # Pushes to main only, like every cache in this file.
      - name: Save platform TypeScript cache
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: apps/web/platform/tsconfig.tsbuildinfo
          key: ${{ steps.platform-tsc-cache.outputs.cache-primary-key }}

  # ────────────────────────────────────────────
  # Desktop shell. Type-check + bundle only — NOT packaging: electron-builder
  # needs signing certs and platform-native runners, and desktop releases ship
  # from release-desktop.yml, not from a merge.
  # ────────────────────────────────────────────
  desktop:
    name: Type Check + Build · desktop
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check desktop
        working-directory: apps/desktop
        run: pnpm type-check
      # electron-vite build: proves main/preload/renderer all bundle. Runs on
      # Linux even though we ship mac/win — the bundle step is platform-neutral
      # (esbuild + rollup); only electron-builder's packaging is not.
      - name: Build desktop bundles
        working-directory: apps/desktop
        run: pnpm build

  # ────────────────────────────────────────────
  # Unit + service tests — these DO block PRs.
  # ────────────────────────────────────────────
  # Module-worker Vitest stays one package per process: several start
  # pglite (WASM Postgres), which crashes (ERRORDATA_STACK_SIZE) when many
  # instances boot on the same machine. Shards are separate runners, so
  # they can run at once. --shard balances by measured test time
  # (TEST_SECONDS in module-workers.mjs), so the slow workers spread out.
  # "Unit · app-api" is the required status check. It does not run tests
  # itself; it fails unless the core job and every shard succeeded.
  # Keep --shards equal to the matrix length.
  unit-api-modules:
    name: Unit · module APIs (${{ matrix.shard }}/6)
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest · module API workers
        run: |
          set -euo pipefail
          for w in $(node .github/scripts/module-workers.mjs --list --shard ${{ matrix.shard }} --shards 6); do
            echo "=== $w ==="
            pnpm --filter "$w" test
          done

  # app-api's own tests and the worker packages' ran one after the other on
  # one runner (about 14.5 minutes on main by November 2026); on two they
  # take about 7 each.
  unit-api-core:
    name: Unit · app-api core
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/workers/app-api
        run: pnpm test

  # Includes the module ownership test: every app-api mount must belong to
  # exactly one module in @weldsuite/api-modules, and API workers may not
  # import from each other. Also the WeldBoard engine (board-api runs it).
  unit-api-packages:
    name: Unit · worker packages
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest · worker packages
        run: |
          set -euo pipefail
          pnpm --filter "./packages/core/api-modules" --filter "./packages/core/worker-*" --filter "./packages/core/board-engine" --filter "./packages/domains/*" --workspace-concurrency=1 test

  unit-api:
    name: Unit · app-api
    needs: [unit-api-core, unit-api-packages, unit-api-modules]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require app-api, worker-package and module-worker tests
        run: |
          set -euo pipefail
          core="${{ needs.unit-api-core.result }}"
          packages="${{ needs.unit-api-packages.result }}"
          modules="${{ needs.unit-api-modules.result }}"
          echo "app-api: $core"
          echo "worker packages: $packages"
          echo "module API workers: $modules"
          test "$core" = "success" || test "$core" = "skipped"
          test "$packages" = "success" || test "$packages" = "skipped"
          test "$modules" = "success" || test "$modules" = "skipped"

  unit-personal-api:
    name: Unit · personal-api
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/workers/personal-api
        run: pnpm test

  # Public API (wsk_ keys) and the MCP server. Both boot pglite in-process, so
  # each package runs on its own (pglite crashes when many instances start
  # at once); the two run one after the other on this runner.
  unit-public-api:
    name: Unit · external-api + mcp-server
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest · external-api
        working-directory: apps/workers/external-api
        run: pnpm test
      - name: Run Vitest · mcp-server
        working-directory: apps/workers/mcp-server
        run: pnpm test

  # Tenant database lifecycle: provisioning and moves (workspace-worker,
  # neon-provisioning) and the audit consumer that has to survive a move's lock
  # (audit-log-worker). workspace-worker and neon-provisioning boot pglite
  # (WASM Postgres, which crashes when many instances start at once;
  # workspace-worker's vitest config also runs its test files one by one), so
  # the three packages run one after the other on this runner.
  unit-workspace-lifecycle:
    name: Unit · workspace-worker + neon-provisioning + audit-log-worker
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.api != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest · neon-provisioning
        working-directory: packages/core/neon-provisioning
        run: pnpm test
      - name: Run Vitest · workspace-worker
        working-directory: apps/workers/workspace-worker
        run: pnpm test
      - name: Run Vitest · audit-log-worker
        working-directory: apps/workers/audit-log-worker
        run: pnpm test

  # The platform's Vitest run took 9 to 11 minutes on one runner; Vitest's
  # own --shard splits the test files over two. "Unit · platform" is the
  # required check and fails unless both shards succeeded. Keep --shard's n
  # equal to the matrix length.
  unit-platform-shards:
    name: Unit · platform (${{ matrix.shard }}/2)
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/web/platform
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  unit-platform:
    name: Unit · platform
    needs: [unit-platform-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every platform test shard
        run: |
          set -euo pipefail
          result="${{ needs.unit-platform-shards.result }}"
          echo "shards: $result"
          test "$result" = "success" || test "$result" = "skipped"

  # Full-graph build. Blocking as of #66. The name "Build" is the
  # required check. Platform's Vite bundle (~3 min) and the rest of the
  # graph (Storybook ~2 min, plus every other package) run on separate
  # runners so they stop competing for the same four cores. Turbo cache
  # is per job id, so a later run skips packages whose inputs did not change.
  build-platform:
    name: Build · platform
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.platform != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Build platform
        run: pnpm exec turbo run build --filter=platform

  build-rest:
    name: Build · packages
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.packages != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=5120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Build everything except platform
        run: pnpm exec turbo run build --filter=!platform --concurrency=4
      # The admin console's pure-logic tests (apps/web/admin/lib/*.test.ts).
      - name: Admin console unit tests
        run: pnpm --filter admin test
      # The console's Node build for Kubernetes (ADR FE-018), and its check that
      # no Clerk, Neon driver or Cloudflare runtime module got into it.
      - name: Admin console Node build
        run: pnpm --filter admin build:node

  build:
    name: Build
    needs: [build-platform, build-rest]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require platform and package builds
        run: |
          set -euo pipefail
          platform="${{ needs.build-platform.result }}"
          rest="${{ needs.build-rest.result }}"
          echo "platform: $platform"
          echo "packages: $rest"
          test "$platform" = "success" || test "$platform" = "skipped"
          test "$rest" = "success" || test "$rest" = "skipped"
