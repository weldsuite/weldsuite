name: CI

# Public-repo CI. Deliberately SECRET-FREE: it references no `secrets.*`, uses
# `pull_request` (never `pull_request_target`), and never checks out or runs
# fork code with elevated privileges. Fork PRs therefore run this in full with a
# read-only token and no access to repository secrets — safe to expose publicly.
#
# The secret-bearing jobs (Playwright E2E against the live test API, worker
# deploys, DB migrations, Doppler→Cloudflare secret sync) live in workflows that
# are EXCLUDED from the public export (see .claude/export/public-export-exclude.txt)
# and run only in the private repo / deployment overlay.
#
# Job names here match the ones pr-checks.yml used ("Unit · app-api",
# "Unit · platform", "Type Check · app-api") so they can be reused verbatim as
# required status checks in the public repo's branch protection.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────
  # Lint and platform type-check were informational while pre-existing failures
  # were worked down (ESLint v9 migration in @weldsuite/db; the platform type
  # errors from the schema/refactor work). Both are clean now, so both block.
  #
  # Note on lint: only the three design packages run `--max-warnings 0`, so this
  # job blocks on ERRORS. Warnings elsewhere still pass — notably the remaining
  # react-hooks/exhaustive-deps ones in the mobile apps.
  #
  # The job NAMES are reused verbatim as required status checks in branch
  # protection, so don't rename them without updating that in the same change:
  # a renamed required check sits pending forever and blocks every PR.
  # ────────────────────────────────────────────
  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Lint
        run: pnpm lint

  type-check-api:
    name: Type Check · app-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # app-api's schema is clean — this one blocks.
    env:
      # ~565 source files against drizzle-orm's deep generics blow past Node's
      # default ~2 GB heap and tsc OOMs (exit 134) before it can report.
      # ubuntu-latest has 16 GB, so give tsc room to finish.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check app-api
        working-directory: apps/workers/app-api
        run: pnpm type-check

  type-check-platform:
    name: Type Check · platform (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Was informational while ~1300 pre-existing errors were worked down.
    # `tsc --noEmit` is clean as of this change, so it blocks.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check platform
        working-directory: apps/web/platform
        run: pnpm type-check

  # ────────────────────────────────────────────
  # Desktop shell. Type-check + bundle only — NOT packaging: electron-builder
  # needs signing certs and platform-native runners, and desktop releases ship
  # from the overlay's release-desktop.yml, not from a merge.
  #
  # Blocking, unlike the platform's type-check: apps/desktop is small and
  # clean, and its main/preload code is the one place where a type error means
  # a shell that boots and then misbehaves at runtime rather than a build that
  # fails loudly.
  # ────────────────────────────────────────────
  desktop:
    name: Type Check + Build · desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Type-check desktop
        working-directory: apps/desktop
        run: pnpm type-check
      # electron-vite build: proves main/preload/renderer all bundle. Runs on
      # Linux even though we ship mac/win — the bundle step is platform-neutral
      # (esbuild + rollup); only electron-builder's packaging is not.
      - name: Build desktop bundles
        working-directory: apps/desktop
        run: pnpm build

  # ────────────────────────────────────────────
  # Unit + service tests — these DO block PRs.
  # ────────────────────────────────────────────
  unit-api:
    name: Unit · app-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/workers/app-api
        run: pnpm test

  unit-platform:
    name: Unit · platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run Vitest
        working-directory: apps/web/platform
        run: pnpm test

  # ────────────────────────────────────────────
  # Cold build — the "does it even build from a clean checkout" signal (plan
  # Phase 4). Informational until it's verified green on a from-scratch clone;
  # turbo build is env-independent for types (esbuild strips them) but some app
  # builds may want VITE_*/EXPO_* values that aren't present in a secret-free
  # run. Promote to blocking once a cold clone builds clean.
  # ────────────────────────────────────────────
  build:
    name: Build (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Build
        run: pnpm build
