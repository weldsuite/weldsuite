# Store builds of the native apps (apps/ios, apps/android), started by hand.
# They replace the Expo apps one at a time (plan
# weldsuite-documentation/plans/native-mobile-apps.md); "Mobile native build"
# (mobile-build.yml) still builds the Expo apps through EAS.
#
# Signing happens here, not on EAS, with the secrets of the `mobile-release`
# environment (limited to main):
#   - iOS: an App Store Connect API key with the Admin role
#     (APP_STORE_CONNECT_API_KEY, the .p8 file's contents;
#     APP_STORE_CONNECT_API_KEY_ID; APP_STORE_CONNECT_API_ISSUER_ID) and
#     APPLE_TEAM_ID. xcodebuild signs automatically with it: it registers the
#     bundle ids, the App Group and the Keychain group, and makes the
#     certificates and profiles it needs.
#   - Android: the app's upload key (ANDROID_UPLOAD_KEYSTORE, the keystore
#     base64-encoded; ANDROID_UPLOAD_KEYSTORE_PASSWORD; ANDROID_UPLOAD_KEY_ALIAS;
#     ANDROID_UPLOAD_KEY_PASSWORD) and, to upload, a Google Play service
#     account with release rights on the app (GOOGLE_PLAY_SERVICE_ACCOUNT_JSON).
#     An app already in Play keeps the upload key EAS made for it, in one
#     secret named for the app (ANDROID_UPLOAD_WELDCHAT, …): a JSON object
#     {"keystore": <base64>, "keystorePassword", "keyAlias", "keyPassword"}.
#     It wins over the shared four.
#   - Push on Android: the Firebase project the apps share, as variables of
#     the environment (FCM_PROJECT_ID, FCM_API_KEY, FCM_SENDER_ID) and the
#     app's own Firebase app id (FCM_APP_ID_WELDCHAT, …). Without them the
#     app is built without push. iOS needs nothing here: automatic signing
#     adds the push entitlement.
#
# `upload` sends the build to TestFlight (iOS) and the Play internal testing
# track (Android). Releasing to the public stays a manual step in App Store
# Connect and Play Console. Once per app, before the first upload: create the
# app in App Store Connect, and in Play Console upload one release by hand,
# since the Play API refuses an app's very first upload (use the `.aab` this
# workflow attaches when `upload` is off).
#
# The build number is 200 plus this workflow's run number, on both platforms,
# so every run is higher than the last and above the Expo apps' 1.x builds.
name: Mobile native release

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App'
        type: choice
        required: true
        default: weldpass
        options: [weldpass, weldbooks, weldmail, weldcalendar, weldchat, welddesk, weldhr]
      platform:
        description: 'Platforms'
        type: choice
        required: true
        default: all
        options: [all, android, ios]
      upload:
        description: 'Upload to TestFlight (iOS) and the Play internal testing track (Android). Off: build, sign and attach the binaries to the run.'
        type: boolean
        default: true

concurrency:
  group: mobile-native-release-${{ inputs.app }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android ${{ inputs.app }}
    if: inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    environment:
      name: mobile-release
      deployment: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        run: echo "BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Check the secrets
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "$UPLOAD" = "true" ] && [ -z "$PLAY_JSON" ]; then
            echo "::error title=Secrets missing::Add GOOGLE_PLAY_SERVICE_ACCOUNT_JSON under Settings -> Environments -> mobile-release -> Secrets."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # The app's own upload key when it has one (ANDROID_UPLOAD_<APP>, see the
      # top), else the shared one. Every secret is named here: a computed name
      # (`secrets[...]`) would hand the runner all of them.
      - name: Build and sign
        working-directory: apps/android
        env:
          APP: ${{ inputs.app }}
          WELD_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          SHARED_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          SHARED_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          SHARED_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          SHARED_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          OWN_KEY: >-
            ${{ inputs.app == 'weldpass' && secrets.ANDROID_UPLOAD_WELDPASS
             || inputs.app == 'weldbooks' && secrets.ANDROID_UPLOAD_WELDBOOKS
             || inputs.app == 'weldmail' && secrets.ANDROID_UPLOAD_WELDMAIL
             || inputs.app == 'weldcalendar' && secrets.ANDROID_UPLOAD_WELDCALENDAR
             || inputs.app == 'weldchat' && secrets.ANDROID_UPLOAD_WELDCHAT
             || inputs.app == 'welddesk' && secrets.ANDROID_UPLOAD_WELDDESK
             || inputs.app == 'weldhr' && secrets.ANDROID_UPLOAD_WELDHR
             || '' }}
          WELD_FCM_PROJECT_ID: ${{ vars.FCM_PROJECT_ID }}
          WELD_FCM_API_KEY: ${{ vars.FCM_API_KEY }}
          WELD_FCM_SENDER_ID: ${{ vars.FCM_SENDER_ID }}
          FCM_APP_ID: ${{ vars[format('FCM_APP_ID_{0}', inputs.app)] }}
        run: |
          set -euo pipefail
          if [ -n "$OWN_KEY" ]; then
            KEYSTORE="$(jq -r '.keystore // empty' <<<"$OWN_KEY")"
            WELD_UPLOAD_KEYSTORE_PASSWORD="$(jq -r '.keystorePassword // empty' <<<"$OWN_KEY")"
            WELD_UPLOAD_KEY_ALIAS="$(jq -r '.keyAlias // empty' <<<"$OWN_KEY")"
            WELD_UPLOAD_KEY_PASSWORD="$(jq -r '.keyPassword // empty' <<<"$OWN_KEY")"
            # Values taken out of a secret aren't masked on their own.
            for value in "$KEYSTORE" "$WELD_UPLOAD_KEYSTORE_PASSWORD" "$WELD_UPLOAD_KEY_ALIAS" "$WELD_UPLOAD_KEY_PASSWORD"; do
              if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            done
            source="ANDROID_UPLOAD_${APP^^} (keystore, keystorePassword, keyAlias, keyPassword)"
          else
            KEYSTORE="$SHARED_KEYSTORE"
            WELD_UPLOAD_KEYSTORE_PASSWORD="$SHARED_KEYSTORE_PASSWORD"
            WELD_UPLOAD_KEY_ALIAS="$SHARED_KEY_ALIAS"
            WELD_UPLOAD_KEY_PASSWORD="$SHARED_KEY_PASSWORD"
            source="ANDROID_UPLOAD_KEYSTORE, ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD"
          fi
          if [ -z "$KEYSTORE" ] || [ -z "$WELD_UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$WELD_UPLOAD_KEY_ALIAS" ] || [ -z "$WELD_UPLOAD_KEY_PASSWORD" ]; then
            echo "::error title=Upload key missing::Set $source under Settings -> Environments -> mobile-release -> Secrets."
            exit 1
          fi
          export WELD_UPLOAD_KEYSTORE_PASSWORD WELD_UPLOAD_KEY_ALIAS WELD_UPLOAD_KEY_PASSWORD
          # The build reads the app's Firebase id as WELD_FCM_APP_ID_<APP>.
          export "WELD_FCM_APP_ID_${APP^^}=$FCM_APP_ID"
          printf '%s' "$KEYSTORE" | base64 --decode > "$WELD_UPLOAD_KEYSTORE"
          ./gradlew --no-daemon ":apps:$APP:bundleRelease" "-PweldVersionCode=$BUILD_NUMBER"
          rm -f "$WELD_UPLOAD_KEYSTORE"
          bundle="apps/$APP/build/outputs/bundle/release/$APP-release.aab"
          # jarsigner exits 0 on an unsigned bundle too; its message tells them apart.
          jarsigner -verify "$bundle" | grep -q "jar verified"
          echo "BUNDLE=apps/android/$bundle" >> "$GITHUB_ENV"
          echo "MAPPING=apps/android/apps/$APP/build/outputs/mapping/release/mapping.txt" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.BUNDLE }}
            ${{ env.MAPPING }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload to the Play internal testing track
        if: inputs.upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.weldsuite.${{ inputs.app }}
          releaseFiles: ${{ env.BUNDLE }}
          mappingFile: ${{ env.MAPPING }}
          track: internal
          status: completed

      - name: Summary
        env:
          APP: ${{ inputs.app }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          {
            echo "### $APP Android, version code $BUILD_NUMBER"
            echo ""
            echo "- The signed \`.aab\` and its R8 mapping are attached to this run."
            if [ "$UPLOAD" = "true" ]; then
              echo "- Uploaded to the Play **internal testing** track. Promoting it is a manual step in Play Console."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS ${{ inputs.app }}
    if: inputs.platform != 'android'
    runs-on: macos-26
    environment:
      name: mobile-release
      deployment: false
    timeout-minutes: 60
    # pipefail: xcodebuild's output goes through xcbeautify, which would
    # otherwise hide xcodebuild's exit code.
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Build number
        run: echo "BUILD_NUMBER=$((200 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Check the secrets
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "$KEY" ] || missing+=(APP_STORE_CONNECT_API_KEY)
          [ -n "$KEY_ID" ] || missing+=(APP_STORE_CONNECT_API_KEY_ID)
          [ -n "$ISSUER_ID" ] || missing+=(APP_STORE_CONNECT_API_ISSUER_ID)
          [ -n "$TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Secrets missing::Add ${missing[*]} under Settings -> Environments -> mobile-release -> Secrets."
            exit 1
          fi

      - uses: jdx/mise-action@v2
        with:
          working_directory: apps/ios

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: tuist generate --no-open

      - name: Archive
        working-directory: apps/ios
        env:
          APP: ${{ inputs.app }}
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" > "$key_path"
          echo "KEY_PATH=$key_path" >> "$GITHUB_ENV"
          # The scheme, as Project.swift names it.
          case "$APP" in
            weldpass) scheme=WeldPass ;;
            weldbooks) scheme=WeldBooks ;;
            weldmail) scheme=WeldMail ;;
            weldcalendar) scheme=WeldCalendar ;;
            weldchat) scheme=WeldChat ;;
            welddesk) scheme=WeldDesk ;;
            weldhr) scheme=WeldHR ;;
            *) echo "::error::No iOS scheme for $APP"; exit 1 ;;
          esac
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          xcodebuild archive \
            -workspace WeldSuite.xcworkspace \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$scheme.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | xcbeautify --renderer github-actions

      - name: Export${{ inputs.upload && ' and upload to TestFlight' || '' }}
        working-directory: apps/ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          destination=export
          if [ "$UPLOAD" = "true" ]; then destination=upload; fi
          plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string $destination" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $TEAM_ID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | xcbeautify --renderer github-actions
          rm -f "$KEY_PATH"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: ${{ inputs.app }}-ios-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        env:
          APP: ${{ inputs.app }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          {
            echo "### $APP iOS, build $BUILD_NUMBER"
            echo ""
            if [ "$UPLOAD" = "true" ]; then
              echo "- Uploaded to App Store Connect. It appears in TestFlight once Apple has processed it, usually within 15 minutes."
              echo "- Submitting it for review is a manual step in App Store Connect."
            else
              echo "- The signed \`.ipa\` is attached to this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
