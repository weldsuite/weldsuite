          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ needs.prepare.outputs.cf_env == 'test' && 'pk_test_ZGVmaW5pdGUtZWFnbGUtMy5jbGVyay5hY2NvdW50cy5kZXYk' || 'pk_live_Y2xlcmsud2VsZHN1aXRlLm9yZyQ' }}
          EXPO_PUBLIC_EAS_PROJECT_ID: cc1b21b9-17f3-490b-8088-3c62761d1d00
          EAS_PROJECT_ID: cc1b21b9-17f3-490b-8088-3c62761d1d00
        with:
