name: Deploy

# Deploy lives in this repo on GitHub-hosted runners.
#   push to `develop` → test  (app-test.weldsuite.org, *-test workers)
#   push to `main`    → production (app.weldsuite.org)
#   workflow_dispatch → full deploy (all workers, migrations, mobile, frontends)
#
# Frontends: the platform, WeldMail, WeldCalendar and the developer portal go
# to Cloudflare Pages; the help center, the WeldSign signer portal, the project
# portal and the admin console (TanStack Start) are Cloudflare Workers;
# the Next.js apps, the helpdesk widget and the partner
# portal go to Vercel (`vercel` job). Vercel's Git integration does not build develop/main.
#
# This file is only the job graph. The deploy logic lives in composite actions
# (.github/actions/deploy-*) and scripts (.github/scripts/deploy-*.mjs,
# module-workers.mjs, vercel-apps.mjs), and every deploy target is named in
# .github/scripts/deploy-plan.mjs, so the jobs below only consume JSON lists.
# The private deploy repo of docs/plans/main-only-private-deploys.md runs the
# same actions from a checkout of this repo, so a new worker or app changes
# only this repo.
#
# Secrets live on the GitHub Environments `test` and `production`.
# See .github/SECRETS.md.

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/platform/**'
      - 'apps/web/weldmail/**'
      - 'apps/web/weldcalendar/**'
      - 'apps/web/developer/**'
      - 'apps/web/helpcenter/**'
      - 'apps/web/sign-portal/**'
      - 'apps/web/project-portal/**'
      - 'apps/web/admin/**'
      # Vercel-hosted apps (vercel job, .github/scripts/vercel-apps.mjs)
      - 'apps/web/api-docs/**'
      - 'apps/web/booking-portal/**'
      - 'apps/web/docs/**'
      - 'apps/web/helpdesk-widget/**'
      - 'apps/web/meeting-portal/**'
      - 'apps/web/partner/**'
      - 'apps/workers/**'
      - 'apps/mobile/**'
      - 'apps/tools/migrate-databases/**'
      # Every workspace package: each job below narrows down to what it depends on.
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.npmrc'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target. Push to develop always uses test; push to main always uses production.'
        required: true
        type: choice
        options:
          - test
          - production
        default: 'test'

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'test') }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # gh run list: the last successful deploy (diff base)
    outputs:
      sha: ${{ steps.ctx.outputs.sha }}
      ref: ${{ steps.ctx.outputs.ref }}
      cf_env: ${{ steps.ctx.outputs.cf_env }}
      run_migrations: ${{ steps.plan.outputs.run_migrations }}
      run_d1_migrations: ${{ steps.plan.outputs.run_d1_migrations }}
      d1_connector: ${{ steps.plan.outputs.d1_connector }}
      d1_schedule: ${{ steps.plan.outputs.d1_schedule }}
      workers: ${{ steps.plan.outputs.workers }}
      module_workers: ${{ steps.plan.outputs.module_workers }}
      vercel_apps: ${{ steps.plan.outputs.vercel_apps }}
      mobile_apps: ${{ steps.plan.outputs.mobile_apps }}
      pages_apps: ${{ steps.plan.outputs.pages_apps }}
      start_apps: ${{ steps.plan.outputs.start_apps }}
    steps:
      - name: Resolve deploy context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENV="${INPUT_ENV:-test}"
          elif [ "$REF_NAME" = "main" ]; then
            ENV="production"
          else
            ENV="test"
          fi

          if [ "$ENV" = "production" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::production deploys only from the main branch (got $REF_NAME)"
            exit 1
          fi
          if [ "$ENV" = "test" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "develop" ]; then
            echo "::error::test deploys from push only on develop (got $REF_NAME)"
            exit 1
          fi

          {
            echo "sha=$SHA"
            echo "ref=$REF_NAME"
            echo "cf_env=$ENV"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $REF_NAME @ $SHA to $ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Diff against the last SUCCESSFUL deploy of this branch, not the push's
      # `before` (see the script). Falls back to `before` when there is no
      # earlier success or it is not an ancestor (force push).
      - name: Resolve diff base
        id: base
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          SOURCES: >-
            [{"repo": "${{ github.repository }}", "workflow": "deploy.yml",
              "branch": "${{ github.ref_name }}", "event": "push"}]
        run: node .github/scripts/deploy-diff-base.mjs

      - name: Plan the deploy
        id: plan
        uses: ./.github/actions/deploy-prepare
        with:
          environment: ${{ steps.ctx.outputs.cf_env }}
          sha: ${{ github.sha }}
          base: ${{ steps.base.outputs.base }}
          full: ${{ github.event_name == 'workflow_dispatch' }}
          admin-worker-envs: ${{ vars.ADMIN_WORKER_ENVS }}

  migrations:
    name: Database Migrations
    needs: prepare
    if: needs.prepare.outputs.run_migrations == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-db-migrations
        with:
          master-database-url: ${{ secrets.MASTER_DATABASE_URL }}
          personal-database-url: ${{ secrets.PERSONAL_DATABASE_URL }}
          database-encryption-key: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          neon-api-key: ${{ secrets.NEON_API_KEY }}

  # Cloudflare D1 schema (connector catch-up / CRM due-index / schedule index).
  d1-migrations:
    name: D1 Migrations
    needs: prepare
    if: always() && !failure() && !cancelled() && needs.prepare.outputs.run_d1_migrations == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-d1-migrations
        with:
          environment: ${{ needs.prepare.outputs.cf_env }}
          connector: ${{ needs.prepare.outputs.d1_connector }}
          schedule: ${{ needs.prepare.outputs.d1_schedule }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Per-module API workers deploy first: app-api forwards their paths to them
  # over service bindings (API_FORWARD_MODULES), so a PR that adds a module
  # worker and switches app-api to forward to it must land the worker first.
  # A failed module deploy stops the workers job below (needs + !failure()).
  module-workers:
    name: Deploy ${{ matrix.worker }}
    needs: [prepare, migrations, d1-migrations]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.prepare.outputs.module_workers != '[]' &&
      needs.prepare.outputs.module_workers != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.module_workers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-worker
        with:
          worker: ${{ matrix.worker }}
          kind: module
          environment: ${{ needs.prepare.outputs.cf_env }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  workers:
    name: Deploy ${{ matrix.worker }}
    needs: [prepare, migrations, d1-migrations, module-workers]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.prepare.outputs.workers != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-worker
        with:
          worker: ${{ matrix.worker }}
          kind: core
          environment: ${{ needs.prepare.outputs.cf_env }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          management-secret: ${{ secrets.MANAGEMENT_SECRET }}

  # Every OTA release needs an Expo access token. The `secrets` context is not
  # available in a job-level `if:`, so this job reads it once and exposes a plain
  # output the mobile job gates on. Without that gate a missing EXPO_TOKEN let each
  # release run all the way to `eas update`, fail with "An Expo user account
  # is required", and turn one absent credential into a red check per app.
  mobile-preflight:
    name: Check mobile release credentials
    needs: prepare
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    outputs:
      expo_token: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check EXPO_TOKEN
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CF_ENV: ${{ needs.prepare.outputs.cf_env }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Mobile OTA skipped::EXPO_TOKEN is not set on the '$CF_ENV' environment, so no mobile OTA update was published. Add it under Settings -> Environments -> $CF_ENV -> Secrets to re-enable mobile releases."
          fi

  mobile:
    name: Release ${{ matrix.name }} (mobile)
    needs: [prepare, workers, mobile-preflight]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.workers.result == 'success' || needs.workers.result == 'skipped') &&
      needs.prepare.outputs.mobile_apps != '[]' &&
      needs.mobile-preflight.outputs.expo_token == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.mobile_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-mobile
        with:
          app: ${{ matrix.app }}
          environment: ${{ needs.prepare.outputs.cf_env }}
          sha: ${{ needs.prepare.outputs.sha }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  # Vite SPAs on Cloudflare Pages. The platform deploys on every run; the
  # others when they changed (deploy-plan.mjs).
  pages:
    name: Deploy ${{ matrix.name }} (${{ needs.prepare.outputs.cf_env }} Pages)
    needs: [prepare, workers, module-workers]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.workers.result == 'success' || needs.workers.result == 'skipped') &&
      (needs['module-workers'].result == 'success' || needs['module-workers'].result == 'skipped') &&
      needs.prepare.outputs.pages_apps != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.pages_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-pages
        with:
          app: ${{ matrix.app }}
          environment: ${{ needs.prepare.outputs.cf_env }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          booking-portal-url: ${{ secrets.VITE_BOOKING_PORTAL_URL }}
          meeting-portal-url: ${{ secrets.VITE_MEETING_PORTAL_URL }}
          mapbox-access-token: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
          mixpanel-token: ${{ secrets.VITE_MIXPANEL_TOKEN }}
          betterstack-source-token: ${{ secrets.VITE_BETTERSTACK_SOURCE_TOKEN }}

  # TanStack Start apps on Workers: the help center (FE-015), the WeldSign
  # signer portal (FE-016, binds sign-api's FinalizeEnvelopeWorkflow by
  # script_name), the WeldFlow project portal (FLOW-020, FLOW_API binding) and
  # the staff admin console (FE-018, only in the environments the repository
  # variable ADMIN_WORKER_ENVS names; before adding one see apps/web/admin/README.md).
  # They bind or call the workers, so they deploy after them.
  start-workers:
    name: Deploy ${{ matrix.name }} (${{ needs.prepare.outputs.cf_env }} Worker)
    needs: [prepare, workers, module-workers]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.workers.result == 'success' || needs.workers.result == 'skipped') &&
      (needs['module-workers'].result == 'success' || needs['module-workers'].result == 'skipped') &&
      needs.prepare.outputs.start_apps != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.start_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-start-worker
        with:
          app: ${{ matrix.app }}
          environment: ${{ needs.prepare.outputs.cf_env }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Next.js apps, the helpdesk widget and the partner portal on Vercel (one
  # Vercel project per app, team weldsuite). Only the apps a push touched
  # deploy, after the workers they call.
  vercel:
    name: Deploy ${{ matrix.app }} (${{ needs.prepare.outputs.cf_env }} Vercel)
    needs: [prepare, workers, module-workers]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.workers.result == 'success' || needs.workers.result == 'skipped') &&
      (needs['module-workers'].result == 'success' || needs['module-workers'].result == 'skipped') &&
      needs.prepare.outputs.vercel_apps != '[]' &&
      needs.prepare.outputs.vercel_apps != ''
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.vercel_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vercel
        with:
          app: ${{ matrix.app }}
          project: ${{ matrix.project }}
          environment: ${{ needs.prepare.outputs.cf_env }}
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
