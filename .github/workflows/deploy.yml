name: Deploy

# Deploy lives in this repo on GitHub-hosted runners.
#   push to `develop` → test  (app-test.weldsuite.org, *-test workers)
#   push to `main`    → production (app.weldsuite.org)
#   workflow_dispatch → full deploy (all workers, migrations, mobile, frontends)
#
# Secrets live on the GitHub Environments `test` and `production`.
# See .github/SECRETS.md.

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/web/platform/**'
      - 'apps/web/weldmail/**'
      - 'apps/web/weldcalendar/**'
      - 'apps/workers/**'
      - 'apps/mobile/**'
      - 'apps/tools/migrate-databases/**'
      - 'packages/clients/**'
      - 'packages/core/ai/**'
      - 'packages/core/cloudflare-realtime/**'
      - 'packages/core/cloudflare-registrar/**'
      - 'packages/core/cloudflare-zones/**'
      - 'packages/core/credits/**'
      - 'packages/core/db/**'
      - 'packages/core/email/**'
      - 'packages/core/entity-events/**'
      - 'packages/core/feature-flags/**'
      - 'packages/core/connectors/**'
      - 'packages/core/neon-provisioning/**'
      - 'packages/core/notifications/**'
      - 'packages/core/permissions/**'
      - 'packages/core/realtime/**'
      - 'packages/core/social-publishing/**'
      - 'packages/core/transactional-email/**'
      - 'packages/core/workflow-integrations/**'
      - 'packages/design/mobile-ui/**'
      - 'packages/config/typescript-config/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.npmrc'
      - '.github/actions/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target. Push to develop always uses test; push to main always uses production.'
        required: true
        type: choice
        options:
          - test
          - production
        default: 'test'

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'test') }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ctx.outputs.sha }}
      ref: ${{ steps.ctx.outputs.ref }}
      cf_env: ${{ steps.ctx.outputs.cf_env }}
      run_migrations: ${{ steps.changes.outputs.migrations }}
      run_d1_connector_migrations: ${{ steps.changes.outputs.d1_connector_migrations }}
      run_d1_schedule_migrations: ${{ steps.changes.outputs.d1_schedule_migrations }}
      release_weldmail: ${{ steps.changes.outputs.weldmail }}
      release_weldmail_web: ${{ steps.changes.outputs.weldmail-web }}
      release_weldcalendar_web: ${{ steps.changes.outputs.weldcalendar-web }}
      release_weldchat: ${{ steps.changes.outputs.weldchat }}
      release_weldbooks: ${{ steps.changes.outputs.weldbooks }}
      release_weldflow: ${{ steps.changes.outputs.weldflow }}
      release_weldagent: ${{ steps.changes.outputs.weldagent }}
      workers: ${{ steps.matrix.outputs.workers }}
    steps:
      - name: Resolve deploy context
        id: ctx
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ENV="${INPUT_ENV:-test}"
          elif [ "$REF_NAME" = "main" ]; then
            ENV="production"
          else
            ENV="test"
          fi

          if [ "$ENV" = "production" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::production deploys only from the main branch (got $REF_NAME)"
            exit 1
          fi
          if [ "$ENV" = "test" ] && [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "develop" ]; then
            echo "::error::test deploys from push only on develop (got $REF_NAME)"
            exit 1
          fi

          {
            echo "sha=$SHA"
            echo "ref=$REF_NAME"
            echo "cf_env=$ENV"
          } >> "$GITHUB_OUTPUT"
          echo "Deploying $REF_NAME @ $SHA to $ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Path filters only apply to push. Manual workflow_dispatch always full-deploys:
      # paths-filter has no push `before` SHA and would otherwise only see the tip commit
      # (often platform-only), skipping workers/migrations/mobile.
      - name: Detect DB / mobile / worker changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            migrations:
              - 'packages/core/db/drizzle/**'
              - 'packages/core/db/src/schema/**'
              - 'apps/tools/migrate-databases/**'
            d1_connector_migrations:
              - 'apps/workers/integration-sync-worker/migrations/d1/**'
              - 'apps/workers/integration-sync-worker/wrangler.toml'
            d1_schedule_migrations:
              - 'apps/workers/workflow-worker/migrations/d1/**'
              - 'apps/workers/workflow-worker/wrangler.toml'
            weldmail:
              - 'apps/mobile/weldmail-app/**'
              - 'packages/clients/app-api-client/**'
              - 'packages/clients/personal-api-client/**'
              - 'packages/clients/api-client/**'
              - 'packages/design/mobile-ui/**'
            weldmail-web:
              - 'apps/web/weldmail/**'
              - 'packages/clients/personal-api-client/**'
              - 'packages/core/realtime/**'
            weldcalendar-web:
              - 'apps/web/weldcalendar/**'
              - 'packages/clients/personal-api-client/**'
            weldchat:
              - 'apps/mobile/weldchat-app/**'
              - 'packages/clients/app-api-client/**'
              - 'packages/clients/api-client/**'
              - 'packages/design/mobile-ui/**'
              - 'packages/core/realtime/**'
            weldbooks:
              - 'apps/mobile/weldbooks-app/**'
              - 'packages/clients/app-api-client/**'
              - 'packages/clients/api-client/**'
              - 'packages/design/mobile-ui/**'
            weldflow:
              - 'apps/mobile/weldflow-app/**'
              - 'packages/clients/app-api-client/**'
              - 'packages/clients/api-client/**'
              - 'packages/design/mobile-ui/**'
              - 'packages/core/notifications/**'
            weldagent:
              - 'apps/mobile/weldagent-app/**'
              - 'packages/clients/app-api-client/**'
              - 'packages/clients/api-client/**'
              - 'packages/design/mobile-ui/**'
              - 'packages/core/notifications/**'
            all_workers:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'turbo.json'
              - '.npmrc'
              - 'packages/core/db/**'
              - 'packages/core/permissions/**'
              - 'packages/clients/app-api-client/**'
              - 'packages/clients/personal-api-client/**'
              - 'packages/clients/api-client/**'
            app-api:
              - 'apps/workers/app-api/**'
              - 'packages/core/ai/**'
              - 'packages/core/cloudflare-realtime/**'
              - 'packages/core/cloudflare-registrar/**'
              - 'packages/core/cloudflare-zones/**'
              - 'packages/clients/core-api-client/**'
              - 'packages/core/credits/**'
              - 'packages/core/social-publishing/**'
              - 'packages/core/email/**'
              - 'packages/core/entity-events/**'
              - 'packages/core/feature-flags/**'
              - 'packages/core/connectors/**'
              - 'packages/core/notifications/**'
              - 'packages/core/realtime/**'
              - 'packages/core/workflow-integrations/**'
              - 'packages/core/transactional-email/**'
            billing-worker:
              - 'apps/workers/billing-worker/**'
              - 'packages/core/cloudflare-registrar/**'
              - 'packages/core/credits/**'
            audit-log-worker:
              - 'apps/workers/audit-log-worker/**'
              - 'packages/core/entity-events/**'
              - 'packages/core/realtime/**'
            external-api:
              - 'apps/workers/external-api/**'
              - 'packages/clients/core-api-client/**'
              - 'packages/core/entity-events/**'
              - 'packages/core/social-publishing/**'
              - 'packages/core/credits/**'
              - 'packages/core/realtime/**'
            integration-webhook-worker:
              - 'apps/workers/integration-webhook-worker/**'
              - 'packages/core/entity-events/**'
              - 'packages/core/workflow-integrations/**'
              - 'packages/core/realtime/**'
              - 'packages/core/connectors/**'
            integration-sync-worker:
              - 'apps/workers/integration-sync-worker/**'
              - 'packages/core/connectors/**'
            mail-inbound-worker:
              - 'apps/workers/mail-inbound-worker/**'
              - 'packages/core/email/**'
              - 'packages/core/realtime/**'
              - 'packages/core/db/src/schema/personal/**'
              - 'packages/core/db/src/schema/personal.ts'
            personal-api:
              - 'apps/workers/personal-api/**'
              - 'packages/clients/personal-api-client/**'
              - 'packages/core/email/**'
              - 'packages/core/db/src/schema/personal/**'
              - 'packages/core/db/src/schema/personal.ts'
              - 'packages/core/db/src/schema/master.ts'
            realtime-worker:
              - 'apps/workers/realtime-worker/**'
              - 'packages/core/realtime/**'
            workspace-worker:
              - 'apps/workers/workspace-worker/**'
              - 'packages/core/cloudflare-zones/**'
              - 'packages/core/email/**'
              - 'packages/core/neon-provisioning/**'
              - 'packages/core/transactional-email/**'
            workflow-worker:
              - 'apps/workers/workflow-worker/**'
              - 'packages/core/ai/**'
              - 'packages/core/credits/**'
              - 'packages/core/entity-events/**'
              - 'packages/core/workflow-integrations/**'
              - 'packages/core/realtime/**'
            mcp-server:
              - 'apps/workers/mcp-server/**'
              - 'packages/clients/core-api-client/**'
              - 'packages/core/entity-events/**'
              - 'packages/core/social-publishing/**'
              - 'packages/core/credits/**'
              - 'packages/core/realtime/**'
            agent-runtime:
              - 'apps/workers/agent-runtime/**'
            discord-bot-worker:
              - 'apps/workers/discord-bot-worker/**'
            helpdesk-widget-api:
              - 'apps/workers/helpdesk-widget-api/**'
              - 'packages/core/db/**'
              - 'packages/core/realtime/**'
            helpdesk-workflow-worker:
              - 'apps/workers/helpdesk-workflow-worker/**'
              - 'packages/core/db/**'
              - 'packages/core/realtime/**'
              - 'packages/core/entity-events/**'

      - name: Resolve change flags
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          MIGRATIONS: ${{ steps.filter.outputs.migrations }}
          D1_CONNECTOR: ${{ steps.filter.outputs.d1_connector_migrations }}
          D1_SCHEDULE: ${{ steps.filter.outputs.d1_schedule_migrations }}
          WELDMAIL: ${{ steps.filter.outputs.weldmail }}
          WELDMAIL_WEB: ${{ steps.filter.outputs.weldmail-web }}
          WELDCALENDAR_WEB: ${{ steps.filter.outputs.weldcalendar-web }}
          WELDCHAT: ${{ steps.filter.outputs.weldchat }}
          WELDBOOKS: ${{ steps.filter.outputs.weldbooks }}
          WELDFLOW: ${{ steps.filter.outputs.weldflow }}
          WELDAGENT: ${{ steps.filter.outputs.weldagent }}
          ALL_WORKERS: ${{ steps.filter.outputs.all_workers }}
          W_APP_API: ${{ steps.filter.outputs.app-api }}
          W_BILLING: ${{ steps.filter.outputs.billing-worker }}
          W_AUDIT: ${{ steps.filter.outputs.audit-log-worker }}
          W_EXTERNAL: ${{ steps.filter.outputs.external-api }}
          W_WEBHOOK: ${{ steps.filter.outputs.integration-webhook-worker }}
          W_SYNC: ${{ steps.filter.outputs.integration-sync-worker }}
          W_MAIL: ${{ steps.filter.outputs.mail-inbound-worker }}
          W_PERSONAL: ${{ steps.filter.outputs.personal-api }}
          W_REALTIME: ${{ steps.filter.outputs.realtime-worker }}
          W_WORKSPACE: ${{ steps.filter.outputs.workspace-worker }}
          W_WORKFLOW: ${{ steps.filter.outputs.workflow-worker }}
          W_MCP: ${{ steps.filter.outputs.mcp-server }}
          W_AGENT_RUNTIME: ${{ steps.filter.outputs.agent-runtime }}
          W_DISCORD_BOT: ${{ steps.filter.outputs.discord-bot-worker }}
          W_HELPDESK_WIDGET: ${{ steps.filter.outputs.helpdesk-widget-api }}
          W_HELPDESK_WORKFLOW: ${{ steps.filter.outputs.helpdesk-workflow-worker }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch: forcing full deploy (all selectors true)"
            {
              echo "migrations=true"
              echo "d1_connector_migrations=true"
              echo "d1_schedule_migrations=true"
              echo "weldmail=true"
              echo "weldmail-web=true"
              echo "weldcalendar-web=true"
              echo "weldchat=true"
              echo "weldbooks=true"
              echo "weldflow=true"
              echo "weldagent=true"
              echo "all_workers=true"
              echo "app-api=true"
              echo "billing-worker=true"
              echo "audit-log-worker=true"
              echo "external-api=true"
              echo "integration-webhook-worker=true"
              echo "integration-sync-worker=true"
              echo "mail-inbound-worker=true"
              echo "personal-api=true"
              echo "realtime-worker=true"
              echo "workspace-worker=true"
              echo "workflow-worker=true"
              echo "mcp-server=true"
              echo "agent-runtime=true"
              echo "discord-bot-worker=true"
              echo "helpdesk-widget-api=true"
              echo "helpdesk-workflow-worker=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "migrations=$MIGRATIONS"
            echo "d1_connector_migrations=$D1_CONNECTOR"
            echo "d1_schedule_migrations=$D1_SCHEDULE"
            echo "weldmail=$WELDMAIL"
            echo "weldmail-web=$WELDMAIL_WEB"
            echo "weldcalendar-web=$WELDCALENDAR_WEB"
            echo "weldchat=$WELDCHAT"
            echo "weldbooks=$WELDBOOKS"
            echo "weldflow=$WELDFLOW"
            echo "weldagent=$WELDAGENT"
            echo "all_workers=$ALL_WORKERS"
            echo "app-api=$W_APP_API"
            echo "billing-worker=$W_BILLING"
            echo "audit-log-worker=$W_AUDIT"
            echo "external-api=$W_EXTERNAL"
            echo "integration-webhook-worker=$W_WEBHOOK"
            echo "integration-sync-worker=$W_SYNC"
            echo "mail-inbound-worker=$W_MAIL"
            echo "personal-api=$W_PERSONAL"
            echo "realtime-worker=$W_REALTIME"
            echo "workspace-worker=$W_WORKSPACE"
            echo "workflow-worker=$W_WORKFLOW"
            echo "mcp-server=$W_MCP"
            echo "agent-runtime=$W_AGENT_RUNTIME"
            echo "discord-bot-worker=$W_DISCORD_BOT"
            echo "helpdesk-widget-api=$W_HELPDESK_WIDGET"
            echo "helpdesk-workflow-worker=$W_HELPDESK_WORKFLOW"
          } >> "$GITHUB_OUTPUT"

      - name: Build worker matrix
        id: matrix
        env:
          ALL_WORKERS: ${{ steps.changes.outputs.all_workers }}
          W_APP_API: ${{ steps.changes.outputs.app-api }}
          W_BILLING: ${{ steps.changes.outputs.billing-worker }}
          W_AUDIT: ${{ steps.changes.outputs.audit-log-worker }}
          W_EXTERNAL: ${{ steps.changes.outputs.external-api }}
          W_WEBHOOK: ${{ steps.changes.outputs.integration-webhook-worker }}
          W_SYNC: ${{ steps.changes.outputs.integration-sync-worker }}
          W_MAIL: ${{ steps.changes.outputs.mail-inbound-worker }}
          W_PERSONAL: ${{ steps.changes.outputs.personal-api }}
          W_REALTIME: ${{ steps.changes.outputs.realtime-worker }}
          W_WORKSPACE: ${{ steps.changes.outputs.workspace-worker }}
          W_WORKFLOW: ${{ steps.changes.outputs.workflow-worker }}
          W_MCP: ${{ steps.changes.outputs.mcp-server }}
          W_AGENT_RUNTIME: ${{ steps.changes.outputs.agent-runtime }}
          W_DISCORD_BOT: ${{ steps.changes.outputs.discord-bot-worker }}
          W_HELPDESK_WIDGET: ${{ steps.changes.outputs.helpdesk-widget-api }}
          W_HELPDESK_WORKFLOW: ${{ steps.changes.outputs.helpdesk-workflow-worker }}
        run: |
          set -euo pipefail
          ALL='["app-api","billing-worker","audit-log-worker","external-api","integration-webhook-worker","integration-sync-worker","mail-inbound-worker","personal-api","realtime-worker","workspace-worker","workflow-worker","mcp-server","agent-runtime","discord-bot-worker","helpdesk-widget-api","helpdesk-workflow-worker"]'
          if [ "$ALL_WORKERS" = "true" ]; then
            echo "workers=$ALL" >> "$GITHUB_OUTPUT"
            echo "Deploying all 16 workers (lockfile, workspace graph, @weldsuite/db graph changed, or manual dispatch)"
            exit 0
          fi

          selected=()
          add() { if [ "$2" = "true" ]; then selected+=("$1"); fi; }
          add app-api "$W_APP_API"
          add billing-worker "$W_BILLING"
          add audit-log-worker "$W_AUDIT"
          add external-api "$W_EXTERNAL"
          add integration-webhook-worker "$W_WEBHOOK"
          add integration-sync-worker "$W_SYNC"
          add mail-inbound-worker "$W_MAIL"
          add personal-api "$W_PERSONAL"
          add realtime-worker "$W_REALTIME"
          add workspace-worker "$W_WORKSPACE"
          add workflow-worker "$W_WORKFLOW"
          add mcp-server "$W_MCP"
          add agent-runtime "$W_AGENT_RUNTIME"
          add discord-bot-worker "$W_DISCORD_BOT"
          add helpdesk-widget-api "$W_HELPDESK_WIDGET"
          add helpdesk-workflow-worker "$W_HELPDESK_WORKFLOW"

          if [ ${#selected[@]} -eq 0 ]; then
            echo 'workers=[]' >> "$GITHUB_OUTPUT"
            echo "No workers changed; skipping worker deploy"
            exit 0
          fi

          json='['
          first=1
          for w in "${selected[@]}"; do
            if [ "$first" -eq 1 ]; then first=0; else json+=','; fi
            json+="\"$w\""
          done
          json+=']'
          echo "workers=$json" >> "$GITHUB_OUTPUT"
          echo "Deploying workers: $json"

  migrations:
    name: Database Migrations
    needs: prepare
    if: needs.prepare.outputs.run_migrations == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Run master migration
        working-directory: packages/core/db
        env:
          MASTER_DATABASE_URL: ${{ secrets.MASTER_DATABASE_URL }}
        run: pnpm db:migrate:master
      - name: Run personal DB migration
        working-directory: packages/core/db
        env:
          PERSONAL_DATABASE_URL: ${{ secrets.PERSONAL_DATABASE_URL }}
        run: pnpm db:migrate:personal
      - name: Run tenant migrations
        working-directory: apps/tools/migrate-databases
        env:
          MASTER_DATABASE_URL: ${{ secrets.MASTER_DATABASE_URL }}
          DATABASE_ENCRYPTION_KEY: ${{ secrets.DATABASE_ENCRYPTION_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: pnpm migrate

  # Cloudflare D1 schema (connector catch-up / CRM due-index / schedule index).
  # Idempotent via wrangler's d1_migrations table. D1 occasionally returns
  # transient 7429 / 504 on apply — we retry with backoff.
  d1-migrations:
    name: D1 Migrations
    needs: prepare
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.prepare.outputs.run_d1_connector_migrations == 'true' ||
       needs.prepare.outputs.run_d1_schedule_migrations == 'true' ||
       needs.prepare.outputs.workers != '[]')
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Apply connector sync index migrations
        if: >-
          needs.prepare.outputs.run_d1_connector_migrations == 'true' ||
          contains(needs.prepare.outputs.workers, 'integration-sync-worker') ||
          contains(needs.prepare.outputs.workers, 'integration-webhook-worker') ||
          contains(needs.prepare.outputs.workers, 'app-api')
        working-directory: apps/workers/integration-sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ENV: ${{ needs.prepare.outputs.cf_env }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ../../../.github/scripts/d1-migrate-retry.sh
          d1_migrate_with_retry "CONNECTOR_SYNC_INDEX ($CF_ENV)" pnpm "d1:migrate:${CF_ENV}"
      - name: Apply schedule index migrations
        if: >-
          needs.prepare.outputs.run_d1_schedule_migrations == 'true' ||
          contains(needs.prepare.outputs.workers, 'workflow-worker')
        working-directory: apps/workers/workflow-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ENV: ${{ needs.prepare.outputs.cf_env }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ../../../.github/scripts/d1-migrate-retry.sh
          d1_migrate_with_retry "SCHEDULE_INDEX ($CF_ENV)" pnpm "d1:migrate:${CF_ENV}"

  workers:
    name: Deploy ${{ matrix.worker }}
    needs: [prepare, migrations, d1-migrations]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.prepare.outputs.workers != '[]'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJson(needs.prepare.outputs.workers) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - name: Set up Docker (agent-runtime containers)
        if: matrix.worker == 'agent-runtime'
        uses: docker/setup-buildx-action@v3
      - name: Deploy ${{ matrix.worker }}
        working-directory: apps/workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          TARGET="${{ needs.prepare.outputs.cf_env }}"
          echo "=== Deploying ${{ matrix.worker }} to $TARGET ==="
          pnpm "deploy:${TARGET}"

      # Discord Gateway DO must be connected after each deploy (session is not
      # auto-started). Also re-register slash commands so /setup-support exists.
      - name: Connect Discord Gateway
        if: matrix.worker == 'discord-bot-worker'
        env:
          MANAGEMENT_SECRET: ${{ secrets.MANAGEMENT_SECRET }}
          CF_ENV: ${{ needs.prepare.outputs.cf_env }}
        run: |
          set -euo pipefail
          if [ -z "${MANAGEMENT_SECRET:-}" ]; then
            echo "::warning title=Discord Gateway not connected::MANAGEMENT_SECRET is unset; call POST /manage/connect manually after secrets are configured."
            exit 0
          fi
          if [ "$CF_ENV" = "test" ]; then
            BASE="https://discord-bot-worker-test.weldsuite.org"
          else
            BASE="https://discord-bot-worker.weldsuite.org"
          fi
          echo "Connecting Gateway at $BASE ..."
          curl -fsS -X POST -H "Authorization: Bearer $MANAGEMENT_SECRET" "$BASE/manage/connect"
          echo
          curl -fsS -X POST -H "Authorization: Bearer $MANAGEMENT_SECRET" "$BASE/manage/register-commands"
          echo
          curl -fsS -H "Authorization: Bearer $MANAGEMENT_SECRET" "$BASE/manage/status"
          echo

  # Every OTA job below needs an Expo access token. The `secrets` context is not
  # available in a job-level `if:`, so this job reads it once and exposes a plain
  # output the OTA jobs gate on. Without that gate a missing EXPO_TOKEN let each
  # release job run all the way to `eas update`, fail with "An Expo user account
  # is required", and turn one absent credential into five red checks per deploy.
  mobile-preflight:
    name: Check mobile release credentials
    needs: prepare
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    outputs:
      expo_token: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check EXPO_TOKEN
        id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CF_ENV: ${{ needs.prepare.outputs.cf_env }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Mobile OTA skipped::EXPO_TOKEN is not set on the '$CF_ENV' environment, so no mobile OTA update was published. Add it under Settings -> Environments -> $CF_ENV -> Secrets to re-enable mobile releases."
          fi

  mobile-weldmail:
    name: Release WeldMail (mobile)
    needs: [prepare, workers, mobile-preflight]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.workers.result == 'success' || needs.workers.result == 'skipped') &&
      needs.prepare.outputs.release_weldmail == 'true' &&
      needs.mobile-preflight.outputs.expo_token == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.cf_env }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Release
        uses: ./.github/actions/mobile-release
        env:
          EXPO_PUBLIC_APP_API_URL: ${{ needs.prepare.outputs.cf_env == 'test' && 'https://app-api-test.weldsuite.org' || 'https://app-api.weldsuite.org' }}
          EXPO_PUBLIC_PERSONAL_API_URL: ${{ needs.prepare.outputs.cf_env == 'test' && 'https://personal-api-test.weldsuite.org' || 'https://personal-api.weldsuite.org' }}
        with:
          app-dir: apps/mobile/weldmail-app
          channel: ${{ needs.prepare.outputs.cf_env == 'test' && 'preview' || 'production' }}
          message: deploy ${{ needs.prepare.outputs.sha }} (${{ needs.prepare.outputs.cf_env == 'test' && 'preview' || 'production' }})

