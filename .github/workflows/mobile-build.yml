# Native builds are never started by a deploy. `deploy.yml` publishes the OTA
# update; which apps are worth a build and a store review is a judgement call,
# so it is made here, by hand, per app.
#
# Builds run on GitHub-hosted runners via `eas build --local`, not on EAS
# builders, so they cost no EAS build quota. `--local` still talks to EAS for
# the things that are genuinely hard to self-host: signing credentials, the
# remote `appVersionSource` counter, and the `expo-channel-name` that gets baked
# into the binary and decides which OTA channel it subscribes to. Set
# `builder: eas` to fall back to a cloud build.
#
# Apps pin `runtimeVersion` to the same string as `expo.version` (not
# fingerprint, and not a policy — bare-workflow apps like WeldChat reject
# `{ policy: "appVersion" }` at `eas update` time). Bump `expo.version` when
# native code changes, then ship a new binary.
#
# The job runs in the `test` / `production` GitHub Environment, which is where
# EXPO_TOKEN lives. Adding required reviewers to that environment turns this
# into a second approval gate on top of the manual dispatch.
#
# `auto-submit` uploads the finished binary to TestFlight (iOS) and to the Play
# track named in eas.json (Android, `internal`). It only works on the
# `production` channel: `preview` is `distribution: internal`, which yields an
# ad hoc IPA and an APK, and neither store takes those. The upload itself runs
# on EAS (`eas submit`, no build quota) with credentials stored there, so there
# are no store secrets in GitHub. Once per app, before the first run:
#   - iOS: `ascAppId` under `submit.production.ios` in the app's eas.json, and
#     an App Store Connect API key on EAS (`eas credentials --platform ios`).
#   - Android: a Google service account key on EAS
#     (`eas credentials --platform android`), and one release uploaded by hand
#     in Play Console, since the Play API refuses an app's very first upload.
# What can be checked from the repo is checked in `select`, so a missing
# `ascAppId` fails in seconds rather than after a 40 minute build.
name: Mobile native build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'EAS channel + eas.json build profile'
        type: choice
        required: true
        default: preview
        options: [preview, production]
      platform:
        description: 'Platforms to build'
        type: choice
        required: true
        default: all
        options: [all, android, ios]
      builder:
        description: 'local = build on a GitHub runner (no EAS build quota). eas = queue on EAS builders.'
        type: choice
        required: true
        default: local
        options: [local, eas]
      weldmail:
        description: 'WeldMail'
        type: boolean
        default: false
      weldchat:
        description: 'WeldChat'
        type: boolean
        default: false
      weldbooks:
        description: 'WeldBooks'
        type: boolean
        default: false
      weldflow:
        description: 'WeldFlow'
        type: boolean
        default: false
      weldagent:
        description: 'WeldAgent'
        type: boolean
        default: false
      weldcalendar:
        description: 'WeldCalendar'
        type: boolean
        default: false
      welddesk:
        description: 'WeldDesk'
        type: boolean
        default: false
      auto-submit:
        description: 'Production channel only: upload to TestFlight (iOS) and the Play internal testing track (Android) when the build finishes. Needs `ascAppId` in eas.json + store credentials on EAS. Releasing to the public stays manual.'
        type: boolean
        default: false

concurrency:
  group: mobile-build-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  # Turns the ticked boxes into a matrix. Fails closed when nothing is ticked,
  # rather than starting a run that silently builds nothing.
  #
  # The matrix is per app *and* per platform: `--local` cannot build `all` in
  # one go, and iOS needs a macOS runner while Android is happy on Linux, so the
  # two platforms have to be separate jobs regardless.
  select:
    name: Select builds
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.pick.outputs.builds }}
    steps:
      - name: Collect selected apps
        id: pick
        env:
          WELDMAIL: ${{ inputs.weldmail }}
          WELDCHAT: ${{ inputs.weldchat }}
          WELDBOOKS: ${{ inputs.weldbooks }}
          WELDFLOW: ${{ inputs.weldflow }}
          WELDAGENT: ${{ inputs.weldagent }}
          WELDCALENDAR: ${{ inputs.weldcalendar }}
          WELDDESK: ${{ inputs.welddesk }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ inputs.platform }}
          BUILDER: ${{ inputs.builder }}
        run: |
          set -euo pipefail

          # `if` rather than `[ … ] && apps+=(…)`: under `set -e` an unticked box
          # on the final line would make the whole step exit non-zero.
          apps=()
          add() { if [ "$1" = "true" ]; then apps+=("$2"); fi; }
          add "$WELDMAIL"  weldmail
          add "$WELDCHAT"  weldchat
          add "$WELDBOOKS" weldbooks
          add "$WELDFLOW"  weldflow
          add "$WELDAGENT" weldagent
          add "$WELDCALENDAR" weldcalendar
          add "$WELDDESK" welddesk

          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error title=No apps selected::Tick at least one app to build."
            exit 1
          fi

          if [ "$PLATFORM" = "all" ]; then
            platforms=(android ios)
          else
            platforms=("$PLATFORM")
          fi

          json="$(
            for app in "${apps[@]}"; do
              for platform in "${platforms[@]}"; do
                jq -nc --arg app "$app" --arg platform "$platform" \
                  '{app: $app, platform: $platform}'
              done
            done | jq -sc .
          )"
          echo "builds=$json" >> "$GITHUB_OUTPUT"

          {
            echo "### Queuing native builds (\`$CHANNEL\`, $PLATFORM, \`$BUILDER\`)"
            echo ""
            for app in "${apps[@]}"; do
              printf -- '- %s: %s\n' "$app" "${platforms[*]}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: inputs.auto-submit
        with:
          sparse-checkout: |
            apps/mobile/*/eas.json
          sparse-checkout-cone-mode: false

      # Everything `eas submit --non-interactive` needs from eas.json, checked
      # for every selected build before a runner starts compiling. Credentials
      # live on EAS and cannot be checked from here; a missing one still fails
      # in the submit step, after the binary is safely uploaded as an artifact.
      - name: Check store submission config
        if: inputs.auto-submit
        env:
          BUILDS: ${{ steps.pick.outputs.builds }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          failed=0
          fail() {
            echo "::error file=$1,title=$2::$3"
            failed=1
          }

          # Read into a variable first: a failing jq inside `< <(…)` would not
          # trip `set -e`, and the loop would pass having checked nothing.
          rows="$(jq -r '.[] | [.app, .platform] | @tsv' <<< "$BUILDS")"

          while IFS=$'\t' read -r app platform; do
            file="apps/mobile/$app-app/eas.json"

            if jq -e --arg p "$CHANNEL" '.build[$p].distribution == "internal"' "$file" > /dev/null; then
              fail "$file" "Not a store build" \
                "$app: the '$CHANNEL' build profile is distribution: internal (APK / ad hoc IPA), which TestFlight and Google Play reject. Run auto-submit on the production channel."
              continue
            fi

            if ! jq -e --arg p "$CHANNEL" '.submit[$p] != null' "$file" > /dev/null; then
              fail "$file" "No submit profile" \
                "$app: eas.json has no submit.$CHANNEL profile."
              continue
            fi

            if [ "$platform" = "ios" ] && \
               ! jq -e --arg p "$CHANNEL" '(.submit[$p].ios.ascAppId // "") != ""' "$file" > /dev/null; then
              fail "$file" "ascAppId missing" \
                "$app: set submit.$CHANNEL.ios.ascAppId in eas.json to the app's Apple ID (App Store Connect -> App Information). eas submit cannot look it up non-interactively."
            fi
          done <<< "$rows"

          exit "$failed"

  build:
    name: Build ${{ matrix.app }} ${{ matrix.platform }} (${{ inputs.channel }})
    needs: select
    # iOS needs Xcode; Android is cheaper on Linux. Both are free for public
    # repositories on GitHub-hosted runners. macos-26 rather than macos-15,
    # whose Xcode 16 cannot resolve the project's Swift package graph, see
    # "Select Xcode".
    runs-on: ${{ matrix.platform == 'ios' && 'macos-26' || 'ubuntu-latest' }}
    # Holds EXPO_TOKEN. Add required reviewers here for an approval step.
    environment: ${{ inputs.channel == 'production' && 'production' || 'test' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.builds) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-monorepo

      # `clerk-ios`, pulled in as a Swift package by `@clerk/expo`, declares
      # swift-tools-version 6.2, which only Xcode 26 and later understand: under
      # Xcode 16 `xcodebuild -resolvePackageDependencies` fails with
      # "'clerk-ios' >= 1.2.0 contains incompatible tools version (6.2.0)"
      # before a single file is compiled. Select the newest installed Xcode 26
      # explicitly rather than trusting the image default, for the same reason
      # the JDK below is pinned.
      - name: Select Xcode
        if: matrix.platform == 'ios'
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error title=Xcode 26 missing::The runner image ships no Xcode 26, which clerk-ios needs for swift-tools 6.2."
            exit 1
          fi
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version

      # Pinned rather than left to the runner image default, so an image bump
      # cannot silently move the Gradle toolchain under us.
      - name: Setup JDK 17
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Fail early without EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ENV_NAME: ${{ inputs.channel == 'production' && 'production' || 'test' }}
        run: |
          set -euo pipefail
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::Add it under Settings -> Environments -> $ENV_NAME -> Secrets."
            exit 1
          fi

      # EAS's own build caching is disabled for local builds, so cache the
      # shared caches the underlying tools read from the home directory instead.
      - name: Cache Gradle
        if: matrix.platform == 'android' && inputs.builder == 'local'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ matrix.app }}-

      - name: Cache CocoaPods
        if: matrix.platform == 'ios' && inputs.builder == 'local'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pods-${{ matrix.app }}-

      - name: Build
        id: build
        working-directory: apps/mobile/${{ matrix.app }}-app
        env:
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          BUILDER: ${{ inputs.builder }}
          AUTO_SUBMIT: ${{ inputs.auto-submit }}
          APP: ${{ matrix.app }}
          ARTIFACT_DIR: ${{ runner.temp }}/build
          MESSAGE: manual build of ${{ github.sha }} (${{ inputs.channel }}) by ${{ github.actor }}
        run: |
          set -euo pipefail

          args=(build
            --platform "$PLATFORM"
            --profile "$CHANNEL"
            --message "$MESSAGE"
            --non-interactive)

          if [ "$BUILDER" != "local" ]; then
            # --no-wait: cloud builds take tens of minutes and nothing
            # downstream depends on the binary, so the run should not hold a
            # runner open for it.
            args+=(--no-wait)
            if [ "$AUTO_SUBMIT" = "true" ]; then
              args+=(--auto-submit)
            fi
            eas "${args[@]}"
            exit 0
          fi

          # `distribution: internal` yields an APK on Android; the default
          # (production) yields an app bundle.
          if [ "$PLATFORM" = "ios" ]; then
            ext=ipa
          elif [ "$CHANNEL" = "production" ]; then
            ext=aab
          else
            ext=apk
          fi

          mkdir -p "$ARTIFACT_DIR"
          output="$ARTIFACT_DIR/$APP-$CHANNEL-$PLATFORM.$ext"

          # --auto-submit is a cloud-build feature; local builds submit from the
          # artifact on disk in the next step instead.
          eas "${args[@]}" --local --output "$output"

          echo "artifact=$output" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: inputs.builder == 'local'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ inputs.channel }}-${{ matrix.platform }}
          path: ${{ steps.build.outputs.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Submit to store
        if: inputs.builder == 'local' && inputs.auto-submit
        working-directory: apps/mobile/${{ matrix.app }}-app
        env:
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          set -euo pipefail
          eas submit \
            --platform "$PLATFORM" \
            --profile "$CHANNEL" \
            --path "$ARTIFACT" \
            --non-interactive

      - name: Summary
        if: steps.build.outcome == 'success'
        env:
          APP: ${{ matrix.app }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORM: ${{ matrix.platform }}
          BUILDER: ${{ inputs.builder }}
          AUTO_SUBMIT: ${{ inputs.auto-submit }}
        run: |
          set -euo pipefail
          {
            echo "### $APP $PLATFORM (\`$CHANNEL\`, \`$BUILDER\`)"
            echo ""
            if [ "$BUILDER" = "local" ]; then
              echo "- Built on this runner — no EAS build quota used. The binary is attached to this run as an artifact."
            else
              echo "- Queued on EAS builders."
            fi
            if [ "$AUTO_SUBMIT" = "true" ]; then
              if [ "$BUILDER" = "local" ]; then
                verb="Submitted"
              else
                verb="EAS submits it when the build finishes,"
              fi
              if [ "$PLATFORM" = "ios" ]; then
                echo "- $verb to App Store Connect. It appears in TestFlight once Apple has processed it, usually within 15 minutes."
              else
                track="$(jq -r --arg p "$CHANNEL" '.submit[$p].android.track // "internal"' "apps/mobile/$APP-app/eas.json")"
                echo "- $verb to the Play \`$track\` track."
              fi
              echo "- Releasing it to the public is still a manual step."
            else
              echo "- Submitting it to the stores is a manual step."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
