name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@v3.97.1
        with:
          # Fail only on secrets TruffleHog can verify as live. Unverified
          # results are dominated by the placeholder credentials in committed
          # *.env*.example templates, and because the scan is commit-range
          # based those cannot be fixed forward -- the addition stays in the
          # range. --exclude-paths was tried first and is not honoured for
          # this scan mode.
          extra_args: --results=verified
          version: '3.97.1'