# SonarQube Cloud (sonarcloud.io) configuration for the WeldSuite monorepo.
#
# One Sonar project covers the whole monorepo. The scan runs from
# .github/workflows/sonarqube.yml; there is nothing to run locally.
#
# projectKey / organization must match what SonarQube Cloud shows under
# Administration → Update Key and your organization's key. When the project is
# imported from GitHub the key is normally "<org>_<repo>".
sonar.projectKey=weldsuite_weldsuite
sonar.organization=weldsuite
sonar.projectName=WeldSuite

# Analyse the whole working tree. Sonar walks these roots and applies the
# exclusions below; it does not need a per-workspace source list.
sonar.sources=apps,packages,scripts
sonar.tests=apps,packages
sonar.sourceEncoding=UTF-8

# Test file patterns. Vitest specs sit next to source (app-api, platform),
# Jest specs live in the mobile apps, Playwright specs under e2e/.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/e2e/**

# ── Exclusions ────────────────────────────────────────────────────────────
# Generated, vendored and build output. Analysing these produces issues nobody
# can action and inflates the LOC count.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/.wrangler/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/*.min.js,\
  **/*.gen.ts,\
  apps/web/platform/src/routeTree.gen.ts,\
  apps/web/platform/generated-translation-keys.json,\
  **/public/**,\
  **/.tanstack/**,\
  packages/core/db/drizzle/**,\
  graphify-out/**,\
  **/ios/**,\
  **/android/**

# Locale files are data, not logic — thousands of string literals that trip
# duplication detection for no benefit. The i18n-check workflow already guards
# these.
sonar.cpd.exclusions=\
  packages/core/i18n/src/locales/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/schema/**

# ── Ignored rules ─────────────────────────────────────────────────────────
# S2068 (hard-coded password) keys on property names containing "password".
# In locale files those are UI labels — passwordLabel: 'Wachtwoord' — never
# credentials, so the rule is off there and stays on everywhere else.
sonar.issue.ignore.multicriteria=localePasswordLabels
sonar.issue.ignore.multicriteria.localePasswordLabels.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.localePasswordLabels.resourceKey=**/locales/**

# ── Coverage ──────────────────────────────────────────────────────────────
# lcov from the three workspaces that run Vitest in CI. Paths are
# comma-separated; Sonar resolves the file paths inside each report relative to
# the report's own directory.
sonar.javascript.lcov.reportPaths=\
  apps/workers/app-api/coverage/lcov.info,\
  apps/workers/personal-api/coverage/lcov.info,\
  apps/web/platform/coverage/lcov.info,\
  apps/workers/chat-api/coverage/lcov.info,\
  apps/workers/meet-api/coverage/lcov.info,\
  packages/domains/chat/coverage/lcov.info

# Files that will never carry meaningful unit coverage. Excluding them keeps
# the coverage percentage honest instead of permanently anchored near zero.
# app-api's src/test/** is the shared test harness (pglite, fixtures); its
# vitest coverage config excludes it, so Sonar must too or every harness edit
# reads as 0% covered new code.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.stories.tsx,\
  **/e2e/**,\
  **/scripts/**,\
  apps/workers/app-api/src/test/**,\
  apps/web/platform/src/routes/**,\
  apps/web/platform/providers/**,\
  apps/mobile/**,\
  apps/desktop/**,\
  packages/core/db/src/schema/**

# ── TypeScript program scope ──────────────────────────────────────────────
# What fills the bridge's heap, and why it is shaped like this. Two rounds:
#
# 1. The root tsconfig.json has no "include", and TypeScript defaults that to
#    **/*, so when Sonar picked it up it built ONE program holding every file
#    plus its node_modules types. Hence one program per workspace instead,
#    never the root config (and never the CLI's scaffold template under
#    packages/sdk/cli/templates/).
#
# 2. One program per workspace does NOT bound memory to the largest program.
#    The bridge (SonarJS 13.9 and 14) keeps every parsed file of every program
#    in a process-wide AST cache that it never evicts during a scan, keyed by
#    (file, target, jsx, importHelpers). Memory therefore grows with every
#    distinct file in the whole repo, once per option combination it was
#    parsed under. Our 130 workspace tsconfigs use nine combinations, so the
#    node_modules types they share were held up to nine times over: 42k cache
#    entries for 22k files, ~8.3 GB, before any type checking. That, not the
#    platform alone, is what outgrew the 11 GB bridge once the repo went from
#    85 tsconfigs / 6.2k files (last full scan, 2026-09-22) to 130 / 8.2k.
#
# So Sonar reads generated tsconfig.sonar.json files instead of the real ones.
# scripts/sonar-tsconfigs.mjs writes one next to each workspace tsconfig.json
# (the workflow runs it right before the scan): it extends the real config and
# pins target to ESNext and jsx to react-jsx, so every program shares one cache
# entry per file. Same files per program (the script checks), same "lib"
# (every workspace sets it explicitly), and no Sonar rule reads "target"
# itself. Measured by replaying the bridge's program loop locally with its
# TypeScript (6.0.3): the cache drops from 8.3 GB to 4.8 GB and the peak with
# every analysed file type-checked from 8.8 GB to 6.2 GB.
#
# Run the scan without generating them and Sonar finds none of these, falls
# back to every tsconfig.json in the tree, the unbounded root one included,
# and round 1 is back. The generated files are gitignored.
sonar.typescript.tsconfigPaths=apps/*/*/tsconfig.sonar.json,apps/desktop/tsconfig.sonar.json,packages/*/*/tsconfig.sonar.json

# Files no tsconfig above covers (scripts/, root-level config files) would
# otherwise make Sonar synthesise a fresh whole-tree program — reintroducing
# exactly the problem the line above solves. They still get analysed, just
# without type information.
sonar.javascript.createTSProgramForOrphanFiles=false

# ── Analysis memory ───────────────────────────────────────────────────────
# Heap for the bridge (the separate Node process that analyses JS/TS). The
# runner has ~16 GB and the scanner JVM needs its share of it (see
# .github/workflows/sonarqube.yml), so this does not go up. When the bridge
# runs out again, shrink what it holds (see the AST cache above) or split the
# scan; a bigger number here only moves the failure to the OS.
#
# The bridge's own log is not a usable gauge. Its per-program lines ("Creating
# TypeScript program ...") reach the scanner log only when the JS/TS sensor
# finishes, so a crash prints nothing but the out-of-memory error, and
# sonar.javascript.node.debugMemory writes to DEBUG output only. The workflow
# samples the RSS of the bridge and the JVM from outside instead and prints it
# after the scan, crash or not.
sonar.javascript.node.maxspace=11264
