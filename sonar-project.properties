# ── Coverage ──────────────────────────────────────────────────────────────
# A PR's coverage comes from the tests related to the files it changes
# (scripts/sonar-coverage.mjs adds sonar.javascript.lcov.reportPaths to the
# narrowed settings), not from whole test suites, which would undo the point
# of scanning only what changed.
#
# Files that will never carry meaningful unit coverage. React Native UI is
# among them: apps/mobile/** and the shared packages/design/mobile-ui/** have
# no component test runner (their logic lives in tested packages such as
# @weldsuite/mobile-platform). So is a package's test support code
# (packages/*/*/src/test/ and src/test-support/: the panel SDKs' harnesses,
# the room fakes of the docs, sheets and board domains), which only its tests
# import. So are the i18n locale files: translation tables with no logic,
# which the i18n package has no coverage run for (copy-paste detection skips
# them too, above).
sonar.coverage.exclusions=  **/*.test.ts,  **/*.test.tsx,  **/*.spec.ts,  **/*.config.ts,  **/*.config.js,  **/*.config.mjs,  **/*.stories.tsx,  **/e2e/**,  **/scripts/**,  packages/*/*/src/test/**,  packages/*/*/src/test-support/**,  apps/web/platform/src/routes/**,  apps/web/platform/providers/**,  apps/mobile/**,  packages/design/mobile-ui/**,  apps/desktop/**,  packages/core/db/src/schema/**,  packages/core/i18n/src/locales/**,  packages/design/storefront-theme/src/locales/**

# ── TypeScript programs ───────────────────────────────────────────────────
# Type information comes from one generated tsconfig.sonar.json per workspace
# the PR touches, listing only its changed files (scripts/sonar-changed.mjs
# sets sonar.typescript.tsconfigPaths to them). Never the real tsconfig.json
# files: the root one has no "include" and would be one program over the whole
# repo, and all 130 workspace ones together were what ran the analyser out of
# memory.
#
# Changed files no workspace config covers (scripts/, plain .js) go into one
# standalone .sonar-changed/tsconfig.json, which always exists: when none of
# the listed configs exists, Sonar falls back to every tsconfig.json in the
# tree and runs out of memory. Never a synthesised whole-tree program either.
sonar.javascript.createTSProgramForOrphanFiles=false

# ── Analysis memory ───────────────────────────────────────────────────────
# Heap for the bridge, the Node process that analyses JS/TS. The scanner JVM
# (SONAR_SCANNER_JAVA_OPTS in the workflow) shares the runner's ~16 GB.
# A PR's programs are a fraction of the old full-tree scan's 8.8 GB peak.
sonar.javascript.node.maxspace=8192
