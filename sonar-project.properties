# SonarQube Cloud (sonarcloud.io) configuration for the WeldSuite monorepo.
#
# One Sonar project covers the whole monorepo, but a scan never analyses the
# whole of it. .github/workflows/sonarqube.yml runs on pull requests only, and
# scripts/sonar-changed.mjs narrows each scan to the files the PR changes: it
# copies this file and appends sonar.inclusions, sonar.test.inclusions and
# sonar.typescript.tsconfigPaths for those files. Everything below is the
# project-wide part and applies to whatever a scan includes.
#
#   pnpm sonar:changed [base-ref]   write the narrowed settings for your branch
#
# Why not the whole tree: analysing all 8k+ files with type information took
# 20+ minutes and ran the JS/TS analyser out of memory on a 16 GB runner
# (ADR OPS-010). A PR's issues only ever land on the lines it changes anyway.
#
# Rules, quality profile and quality gate are set in SonarQube Cloud
# (Quality Profiles / Quality Gates), not here.
#
# projectKey / organization must match what SonarQube Cloud shows under
# Administration → Update Key and your organization's key.
sonar.projectKey=weldsuite_weldsuite
sonar.organization=weldsuite
sonar.projectName=WeldSuite

# The roots Sonar may analyse. scripts/sonar-changed.mjs narrows them to the
# changed files with sonar.inclusions / sonar.test.inclusions.
sonar.sources=apps,packages,scripts
sonar.tests=apps,packages
sonar.sourceEncoding=UTF-8

# Test file patterns. Vitest specs sit next to source (app-api, platform),
# Jest specs live in the mobile apps, Playwright specs under e2e/.
# scripts/sonar-changed.mjs sorts changed files into tests with these.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/e2e/**

# ── Exclusions ────────────────────────────────────────────────────────────
# Generated, vendored and build output. Analysing these produces issues nobody
# can action and inflates the LOC count.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/.wrangler/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/*.min.js,\
  **/*.gen.ts,\
  apps/web/platform/src/routeTree.gen.ts,\
  apps/web/platform/generated-translation-keys.json,\
  **/public/**,\
  **/.tanstack/**,\
  packages/core/db/drizzle/**,\
  rust/migrations/**,\
  graphify-out/**,\
  **/ios/**,\
  **/android/**

# Locale files are data, not logic — thousands of string literals that trip
# duplication detection for no benefit. The i18n-check workflow already guards
# these. The admin console keeps its en/nl copy per page in `lib/*-copy.ts`
# (one object per language, the same keys): the same data. So do the mobile
# apps, each in its own `lib/i18n/locales/` (en and nl with the same keys,
# which nl's `Translations` type and most apps' i18n tests enforce). So does
# the storefront theme: its shopper-facing strings in four languages, each
# typed against en's keys. Tests are left out too, with their support code
# (`test-support/`: the fakes the docs, sheets and board room tests share).
sonar.cpd.exclusions=\
  packages/core/i18n/src/locales/**,\
  packages/design/storefront-theme/src/locales/**,\
  apps/web/admin/lib/*-copy.ts,\
  apps/mobile/*/lib/i18n/locales/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/test-support/**,\
  **/schema/**

# ── Ignored rules ─────────────────────────────────────────────────────────
