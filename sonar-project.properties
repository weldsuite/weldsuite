# SonarQube Cloud (sonarcloud.io) configuration for the WeldSuite monorepo.
#
# One Sonar project covers the whole monorepo. The scan runs from
# .github/workflows/sonarqube.yml; there is nothing to run locally.
#
# projectKey / organization must match what SonarQube Cloud shows under
# Administration → Update Key and your organization's key. When the project is
# imported from GitHub the key is normally "<org>_<repo>".
sonar.projectKey=weldsuite_weldsuite
sonar.organization=weldsuite
sonar.projectName=WeldSuite

# Analyse the whole working tree. Sonar walks these roots and applies the
# exclusions below; it does not need a per-workspace source list.
sonar.sources=apps,packages,scripts
sonar.tests=apps,packages
sonar.sourceEncoding=UTF-8

# Test file patterns. Vitest specs sit next to source (app-api, platform),
# Jest specs live in the mobile apps, Playwright specs under e2e/.
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/__tests__/**,\
  **/e2e/**

# ── Exclusions ────────────────────────────────────────────────────────────
# Generated, vendored and build output. Analysing these produces issues nobody
# can action and inflates the LOC count.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/.wrangler/**,\
  **/coverage/**,\
  **/test-results/**,\
  **/playwright-report/**,\
  **/*.min.js,\
  **/*.gen.ts,\
  apps/web/platform/src/routeTree.gen.ts,\
  apps/web/platform/generated-translation-keys.json,\
  **/public/**,\
  **/.tanstack/**,\
  packages/core/db/drizzle/**,\
  graphify-out/**,\
  **/ios/**,\
  **/android/**

# Locale files are data, not logic — thousands of string literals that trip
# duplication detection for no benefit. The i18n-check workflow already guards
# these.
sonar.cpd.exclusions=\
  packages/core/i18n/src/locales/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/schema/**

# ── Coverage ──────────────────────────────────────────────────────────────
# lcov from the three workspaces that run Vitest in CI. Paths are
# comma-separated; Sonar resolves the file paths inside each report relative to
# the report's own directory.
sonar.javascript.lcov.reportPaths=\
  apps/workers/app-api/coverage/lcov.info,\
  apps/workers/personal-api/coverage/lcov.info,\
  apps/web/platform/coverage/lcov.info

# Files that will never carry meaningful unit coverage. Excluding them keeps
# the coverage percentage honest instead of permanently anchored near zero.
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.stories.tsx,\
  **/e2e/**,\
  **/scripts/**,\
  apps/web/platform/src/routes/**,\
  apps/web/platform/providers/**,\
  apps/mobile/**,\
  apps/desktop/**,\
  packages/core/db/src/schema/**

# ── TypeScript program scope ──────────────────────────────────────────────
# THE memory fix. The root tsconfig.json has no "include", and TypeScript
# defaults that to **/*, so when Sonar picked it up it built ONE program
# holding all ~6200 files plus their node_modules types. That is what
# exhausted the bridge's heap — first at 5 GB, then again at 8 GB.
#
# Point Sonar at the per-workspace configs instead (85 of them, each already
# scoped by its own "include"). Sonar then builds many small programs and
# releases each one, rather than a single monorepo-sized one.
#
# Deliberately NOT matched here:
#   tsconfig.json                                 root, unbounded (the bug)
#   packages/sdk/cli/templates/app/tsconfig.json  scaffold template, not our code
sonar.typescript.tsconfigPaths=apps/*/*/tsconfig.json,apps/desktop/tsconfig.json,packages/*/*/tsconfig.json

# Files no tsconfig above covers (scripts/, root-level config files) would
# otherwise make Sonar synthesise a fresh whole-tree program — reintroducing
# exactly the problem the line above solves. They still get analysed, just
# without type information.
sonar.javascript.createTSProgramForOrphanFiles=false

# ── Analysis memory ───────────────────────────────────────────────────────
# Headroom for the bridge (the separate Node process that analyses JS/TS).
# The program split above is what actually fixed the bridge; raising this
# alone never did, at any value. So it is a safety margin, not the fix.
#
# It is a cap rather than a reservation, but the bridge grows into whatever it
# is given and does not hand it back, and it stays resident while the scanner
# JVM runs taint analysis on 8 GB of its own (see
# .github/workflows/sonarqube.yml). Keep this modest so the pair fits the
# runner's ~16 GB: 4 + 8 GB plus JVM overhead still leaves room for the OS.
sonar.javascript.node.maxspace=4096
